(function(){ const s=document.createElement('style'); s.textContent=WASH_CSS+'.ws-sec{margin:14px 2px 6px;font-size:13px;font-weight:700;color:#555;border-left:4px solid #6a9fd4;padding-left:8px}'; document.head.appendChild(s); })();

const WS = { plan:[], records:{}, staff:[], filter:'now', loadedAt:0 };
const wsPad=n=>String(n).padStart(2,'0');
const wsToday=()=>{const d=new Date();return `${d.getFullYear()}-${wsPad(d.getMonth()+1)}-${wsPad(d.getDate())}`};
const wsNow=()=>{const d=new Date();return `${wsPad(d.getHours())}:${wsPad(d.getMinutes())}`};
const wsMD=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'—';
const wsJD=s=>s?`${+s.slice(5,7)}月${+s.slice(8,10)}日`:'';
const wsDays=s=>Math.round((new Date(s+'T00:00:00')-new Date(wsToday()+'T00:00:00'))/86400000);
function wsRec(id){ return WS.records[id]||{}; }
function wsStage(r){ return ((r.wash&&r.wash.done)?1:0)+((r.finish&&r.finish.done)?1:0)+((r.check&&r.check.done)?1:0); }
function wsUrg(p,r){ if(wsStage(r)===3)return 'done'; const d=wsDays(p.deadline); if(d<=3)return 'bad'; if(d<=14)return 'warn'; return ''; }
async function washApi(body, ms){
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||30000) : null;
  try{
    const r=await fetch(WASH_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function wsApply(d){ WS.plan=d.plan||[]; WS.records=d.records||{}; if(d.staff&&d.staff.length) WS.staff=d.staff; WS.loadedAt=Date.now(); lsSet('tool.wash',{plan:WS.plan,records:WS.records,staff:WS.staff,at:WS.loadedAt}); }
/* 端末に保存してある前回の内容（あればすぐ表示に使う） */
function wsFromCache(){
  if(WS.plan.length) return;
  const c=lsGet('tool.wash',null);
  if(c&&c.plan){ WS.plan=c.plan; WS.records=c.records||{}; WS.staff=c.staff||[]; WS.loadedAt=c.at||0; }
}
/* サーバーから最新を取る（同時に何回呼ばれても1回だけ通信する） */
let WS_BG=null;
function wsFetch(){
  if(WS_BG) return WS_BG;
  WS_BG=(async()=>{ let ok=false; try{ const j=await washApi({action:'wash_get'},25000); if(j&&j.ok){ wsApply(j.data); ok=true; } }catch(e){} WS_BG=null; return ok; })();
  return WS_BG;
}
/* ホームを開いたときに裏で取っておく（タンク洗浄を開いた瞬間に出せるように） */
function wsPrefetch(){ try{ wsFromCache(); if(Date.now()-WS.loadedAt>5*60000) wsFetch(); }catch(e){} }
function wsStatus(t,warn){ const s=$('#wsStatus'); if(!s)return; s.textContent=t; s.className='ws-status'+(warn?' warn':''); if(!warn) setTimeout(()=>{ if(s.textContent===t) s.textContent=''; },4000); }

async function washScreen(){
  head('タンク洗浄管理','R8BY 醪タンク（期限＝酛下日）');
  wsFromCache();
  let ok=true, bg=null;
  if(!WS.plan.length){
    app.innerHTML='<p class="muted" style="margin-top:14px">洗浄の予定と記録を読み込んでいます…</p>';
    ok=await wsFetch();
  }else if(Date.now()-WS.loadedAt>60000){
    bg=wsFetch();          // 前回の内容をすぐ表示し、最新は裏で取る
  }
  if(!WS.plan.length){ app.innerHTML=`<div class="tl-warn" style="margin-top:14px">洗浄の予定を読み込めませんでした。電波の届く所でもう一度開いてください。</div>`; return; }
  const draw=()=>{
    const f=WS.filter;
    let over=0,soon=0,todo=0,done=0;
    /* 2026-10-13 泰広さん指示：使用日（添仕込日）になったタンクは非表示。「履歴」と「全部」には残る */
    const used=p=>wsDays(p.soe)<=0, nUsed=WS.plan.filter(used).length;
    WS.plan.forEach(p=>{ if(used(p))return; const s=wsStage(wsRec(p.id)); if(s===3){done++;return;} todo++; const d=wsDays(p.deadline); if(d<0)over++; else if(d<=14)soon++; });
    const vis=p=>{ const s=wsStage(wsRec(p.id)), d=wsDays(p.deadline);
      if(f==='all')return true; if(f==='hist')return used(p); if(used(p))return false; if(f==='now')return d<=0; if(f==='done')return s===3; if(f==='todo')return s<3; if(f==='soon')return s<3&&d<=14; if(f==='over')return s<3&&d<0; return true; };
    const rows=WS.plan.filter(vis).sort((a,b)=>f==='hist'?(b.soe.localeCompare(a.soe)||b.n-a.n):(a.deadline.localeCompare(b.deadline)||a.n-b.n));
    let h=`<div class="ws-sum">
      <button data-f="over"><span class="k">期限超過</span><span class="v ${over?'bad':''}">${over}</span></button>
      <button data-f="soon"><span class="k">14日以内</span><span class="v ${soon?'warn':''}">${soon}</span></button>
      <button data-f="todo"><span class="k">未完了</span><span class="v">${todo}</span></button>
      <button data-f="done"><span class="k">完了</span><span class="v ok">${done}</span></button></div>
    <div class="ws-bar">
      <button class="ws-chip ${f==='now'?'on':''}" data-f="now">現在まで</button>
      <button class="ws-chip ${f==='todo'?'on':''}" data-f="todo">未完了</button>
      <button class="ws-chip ${f==='soon'?'on':''}" data-f="soon">14日以内</button>
      <button class="ws-chip ${f==='done'?'on':''}" data-f="done">完了</button>
      <button class="ws-chip ${f==='hist'?'on':''}" data-f="hist">履歴${nUsed?` ${nUsed}`:''}</button>
      <button class="ws-chip ${f==='all'?'on':''}" data-f="all">全部</button>
      <span style="flex:1"></span>
      <button class="ws-ghost" id="wsStaff">担当者名</button>
      <button class="ws-ghost" id="wsReload">更新</button></div>
    <div id="wsStaffBox" class="card" style="display:none">
      <div style="font-size:13px;margin-bottom:6px">担当者を1行に1人ずつ。全員の画面の選択肢に反映されます。</div>
      <textarea class="ws-ta" id="wsStaffTa">${esc(WS.staff.join('\n'))}</textarea>
      <div class="ws-actions"><button class="ws-ghost" id="wsStaffNo">閉じる</button><button class="ws-btn" id="wsStaffOk">保存</button></div></div>
    <div class="ws-status${ok?'':' warn'}" id="wsStatus">${bg?'最新の内容を確認しています…':ok?'':'（電波が無いため、端末に保存した内容を表示しています）'}</div>`;
    /* 2026-10-11 泰広さん指示：「現在まで」＝期限（酛下日）が今日までの使用予定タンクを、完了していても全部出す。下に「これから（14日以内）」も完了含めて出す */
    const rowH=p=>{ const r=wsRec(p.id), s=wsStage(r), u=wsUrg(p,r), d=wsDays(p.deadline);
      const left=used(p)?(s===3?'使用済':'使用済・未完了'):s===3?'完了':d<0?`${-d}日超過`:d===0?'今日まで':`あと${d}日`;
      return `<button class="ws-row ${u}" data-id="${p.id}"><span class="st"></span>
        <span class="tk">${p.tank}<small>No.${p.n} ${esc(p.kigo)}</small></span>
        <span class="mid"><span class="b">${esc(p.brand)}</span><br><span class="d">添 ${wsMD(p.soe)}・留 ${wsMD(p.tome)}・上槽 ${p.josouActual?`<b>${wsMD(p.josouActual)}</b>(実)`:wsMD(p.josou)}${p.prev?`　前回上槽 ${wsMD(p.prev)}${p.prevActual?'(実)':''}`:''}</span></span>
        <span class="dl"><span class="date">${wsMD(p.deadline)}まで</span><span class="left ${u==='done'?'':u}">${left}</span>
          <span class="ws-steps"><span class="${r.wash&&r.wash.done?'on':''}">洗</span><span class="${r.finish&&r.finish.done?'on':''}">仕</span><span class="${r.check&&r.check.done?'on':''}">確</span></span></span></button>`; };
    if(f==='now'){
      const nd=rows.filter(p=>wsStage(wsRec(p.id))===3).length;
      h+=`<div class="ws-sec">現在まで（期限が今日まで・まだ使っていないもの）　${rows.length}本・うち完了 ${nd}本</div>`;
      h+=rows.length?rows.map(rowH).join(''):`<p class="muted" style="text-align:center;padding:16px 0">期限が今日までで、まだ使っていないタンクはありません</p>`;
      const nx=WS.plan.filter(p=>{ const d=wsDays(p.deadline); return !used(p)&&d>0&&d<=14; }).sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.n-b.n);
      if(nx.length){ h+=`<div class="ws-sec">これから（14日以内）　${nx.length}本</div>`+nx.map(rowH).join(''); }
    }else{
      if(f==='hist') h+=`<div class="ws-sec">履歴（使用日＝添仕込日を過ぎたタンク・新しい順）　${rows.length}本</div>`;
      if(!rows.length) h+=`<p class="muted" style="text-align:center;padding:24px 0">該当するタンクはありません</p>`;
      h+=rows.map(rowH).join('');
    }
    h+=`<p class="tl-note">記録はスプレッドシート「タンク洗浄記録_R8BY」に保存されます。「仕込み」で上槽日を入れると前回上槽が実績（実）に変わります。印刷用の表は
      <a href="${WASH_URL}" target="_blank" rel="noopener">こちら（印刷ボタン付き）</a>。仕込計画が変わったら予定表を作り直します。</p>`;
    app.innerHTML=h;
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ WS.filter=b.dataset.f; draw(); });
    app.querySelectorAll('.ws-row').forEach(b=>b.onclick=()=>go(()=>washEdit(b.dataset.id)));
    $('#wsReload').onclick=async()=>{ wsStatus('更新中…'); ok=await wsFetch(); bg=null; draw(); };
    $('#wsStaff').onclick=()=>{ const x=$('#wsStaffBox'); x.style.display=x.style.display==='none'?'block':'none'; };
    $('#wsStaffNo').onclick=()=>{ $('#wsStaffBox').style.display='none'; };
    $('#wsStaffOk').onclick=async()=>{ const names=$('#wsStaffTa').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!names.length)return;
      WS.staff=names; $('#wsStaffBox').style.display='none'; wsStatus('担当者名を保存中…');
      try{ const j=await washApi({action:'wash_staff',names}); wsStatus(j&&j.ok?'担当者名を保存しました':'担当者名を保存できませんでした',!(j&&j.ok)); }catch(e){ wsStatus('担当者名を保存できませんでした',true); } };
  };
  draw();
  if(bg){
    ok=await bg; bg=null;
    // まだこの画面を見ていて、担当者名の編集中でなければ描き直す
    const box=$('#wsStaffBox');
    if(document.getElementById('wsStatus') && !(box && box.style.display!=='none')) draw();
    else if(!ok) wsStatus('最新の内容を取れませんでした（前回の内容を表示しています）',true);
  }
}

function washEdit(id){
  const p=WS.plan.find(x=>x.id===id); if(!p){ go(washScreen,false); return; }
  const r=JSON.parse(JSON.stringify(wsRec(id))); r.wash=r.wash||{}; r.finish=r.finish||{}; r.check=r.check||{};
  head(`タンク ${p.tank}`, `${p.brand}　仕込No.${p.n}（記号 ${p.kigo}）`);
  const d=wsDays(p.deadline);
  const opt=(cur)=>`<option value="">—</option>`+WS.staff.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  app.innerHTML=`
    <div class="ws-tl">
      <div>${p.prev?(p.prevActual?'前回上槽（実績）':'前回上槽（予定）'):'今期初使用'}<b>${p.prev?wsJD(p.prev):'—'}</b></div>
      <div class="${d<=3&&wsStage(r)<3?'hot':''}">洗浄期限（酛下日）<b>${wsJD(p.deadline)}</b></div>

    <fieldset class="ws-fs ${r.wash.done?'on':''}" id="fsWash"><legend><label><input type="checkbox" id="wDone" ${r.wash.done?'checked':''}>洗浄</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="wDate" value="${esc(r.wash.date||'')}"></label>
        <label class="ws-f"><span>時刻</span><input type="time" id="wTime" value="${esc(r.wash.time||'')}"></label>

        <label class="ws-f"><span>酸素濃度（%）</span><input type="hidden" id="wO2" value="${r.wash.o2??''}"><button type="button" class="ws-ghost" id="wO2b" style="font-size:18px;font-weight:700;padding:8px 14px;text-align:left" onclick="o2WashPick()">${(r.wash.o2!==null&&r.wash.o2!==undefined&&r.wash.o2!=='')?Number(r.wash.o2).toFixed(1)+' %':'選ぶ（基本 20.1）'}</button><span class="ws-hint" id="o2hint"></span></label>
        <label class="ws-f"><span>担当</span><select id="wBy">${opt(r.wash.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.finish.done?'on':''}" id="fsFin"><legend><label><input type="checkbox" id="fDone" ${r.finish.done?'checked':''}>仕上げ</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="fDate" value="${esc(r.finish.date||'')}"></label>
        <label class="ws-f"><span>担当</span><select id="fBy">${opt(r.finish.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.check.done?'on':''}" id="fsChk"><legend><label><input type="checkbox" id="cDone" ${r.check.done?'checked':''}>チェック</label></legend>
      <div class="ws-grid">
        <div class="ws-f"><span>臭い</span><div class="ws-seg" id="segSmell"><button type="button" data-v="OK" class="${r.check.smell==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.smell==='NG'?'ng':''}">あり</button></div></div>
        <div class="ws-f"><span>汚れ</span><div class="ws-seg" id="segDirt"><button type="button" data-v="OK" class="${r.check.dirt==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.dirt==='NG'?'ng':''}">あり</button></div></div>
        <label class="ws-f"><span>確認者</span><select id="cBy">${opt(r.check.by)}</select></label></div></fieldset>

    <div class="ws-actions"><button class="ws-ghost" id="wsCancel">やめる</button><button class="ws-btn" id="wsSave">保存</button></div>`;
  const cur={smell:r.check.smell||'',dirt:r.check.dirt||''};
  const seg=(id,key)=>{ const s=$('#'+id); s.querySelectorAll('button').forEach(b=>b.onclick=()=>{ cur[key]=b.dataset.v; s.querySelectorAll('button').forEach(x=>x.className=''); b.className=b.dataset.v==='OK'?'ok':'ng'; }); };
  seg('segSmell','smell'); seg('segDirt','dirt');
  const o2=()=>{ const v=parseFloat($('#wO2').value), h=$('#o2hint'); if(isNaN(v)){h.textContent='';h.className='ws-hint';return;} if(v<18){h.textContent='18%未満 — 立入不可、再換気';h.className='ws-hint bad';} else {h.textContent='18%以上 OK';h.className='ws-hint';} };
  $('#wO2').oninput=o2; o2();
  $('#wDone').onchange=e=>{ $('#fsWash').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#wDate').value)$('#wDate').value=wsToday(); if(!$('#wTime').value)$('#wTime').value=wsNow(); if(!$('#wBy').value){ const n=(typeof o2WashBy==='function')?o2WashBy(WS.staff):''; if(n) $('#wBy').value=n; else if(ST.name&&WS.staff.includes(ST.name)) $('#wBy').value=ST.name; } if($('#wO2').value===''&&typeof O2_DEF!=='undefined'){ $('#wO2').value=O2_DEF.toFixed(1); $('#wO2b').textContent=O2_DEF.toFixed(1)+' %'; o2(); } } };
  $('#fDone').onchange=e=>{ $('#fsFin').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#fDate').value)$('#fDate').value=wsToday(); if(!$('#fBy').value&&ST.name&&WS.staff.includes(ST.name))$('#fBy').value=ST.name; } };
  $('#cDone').onchange=e=>{ $('#fsChk').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!cur.smell){cur.smell='OK';$('#segSmell button[data-v=OK]').className='ok';} if(!cur.dirt){cur.dirt='OK';$('#segDirt button[data-v=OK]').className='ok';} if(!$('#cBy').value&&ST.name&&WS.staff.includes(ST.name))$('#cBy').value=ST.name; } };
  $('#wsCancel').onclick=()=>hBack.click();
  $('#wsSave').onclick=async()=>{

      finish:{done:$('#fDone').checked,date:$('#fDate').value,by:$('#fBy').value},

    if(miss.length){ wsStatus('未入力: '+miss.join('・'),true); return; }
    $('#wsSave').disabled=true; wsStatus('保存中…');
    try{
      const j=await washApi({action:'wash_save',id,data},30000);
      if(j&&j.ok){ wsApply(j.data); if(typeof o2FromWash==='function'){ if(data.wash.by) lsSet('o2.last.wash',data.wash.by); o2FromWash(p,data.wash).catch(()=>{}); } wsStatus(`タンク${p.tank} を保存しました${data.wash.done&&data.wash.o2!==null?'（酸素濃度測定記録にも記録）':''}`); setTimeout(()=>hBack.click(),400); }
      else { wsStatus('保存できませんでした: '+(j&&j.error||''),true); $('#wsSave').disabled=false; }

/* ================= マニュアル（2026-09-24） =================
   会社PCの Desktop\製造部\マニュアル を同期スクリプトがサーバー（Googleドライブ）へ送り、
   ログインした人だけが一覧（mfg_man_list）と中身（mfg_man_get）を受け取る。
   Word(docx) は mammoth、Excel(xlsx) は SheetJS でスマホの中で読みやすく表示する。
   同じ内容の別の版（〜f、資料/試料 など）は1つにまとめ、新しい版を先に出す。
   ============================================================ */
const MAN_GENRES = ['作業マニュアル（全工程）','原料処理','麹','酒母','仕込み','上槽・アル添','設備・水','研究室','技能検定','安全・消防','メモ（写真）'];
const MAN_LIBS = {

};
const MAN_CSS = `

`;
let MAN_LIST = lsGet('man.list', null), MAN_ERR = '', MAN_OPEN = {}, MAN_Q = '';
const MAN_BODY = new Map();          // id → { ext, bytes }（開いている間だけ持つ）
const MAN_SCRIPT = {};
function manLoadLib(k){
  if(MAN_SCRIPT[k]) return MAN_SCRIPT[k];
  MAN_SCRIPT[k] = new Promise((ok, ng)=>{
    const s=document.createElement('script'); s.src=MAN_LIBS[k]; s.onload=()=>ok(); s.onerror=()=>{ MAN_SCRIPT[k]=null; ng(new Error('表示用の部品を読み込めませんでした')); };
    document.head.appendChild(s);
  });
  return MAN_SCRIPT[k];
}
function manKey(t){
  return String(t||'').replace(/[\s　]/g,'').replace(/[fｆFＦ]$/,'')
    .replace(/技能士検定/g,'技能検定').replace(/資料/g,'試料').replace(/作成方法/g,'作り方').toLowerCase();
}
function manKind(ext){
  ext=String(ext||'').toLowerCase();
  if(ext==='docx') return ['w','Word'];
  if(ext==='xlsx') return ['x','Excel'];
  if(['jpg','jpeg','png','gif','heic','webp'].includes(ext)) return ['p','写真'];
  if(ext==='pdf') return ['o','PDF'];
  return ['o',ext.toUpperCase()||'ファイル'];
}
function manDate(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?'':d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
/* 一覧 → ジャンルごとのグループ（同じ内容の版は1つにまとめる） */
function manGroups(files){
  const by={};
  (files||[]).forEach(f=>{ const k=manKey(f.title); (by[k]=by[k]||[]).push(f); });
  const groups=Object.values(by).map(vs=>{
    vs.sort((a,b)=>String(b.mtime).localeCompare(String(a.mtime)));
    return { key:manKey(vs[0].title), title:vs[0].title.replace(/[fｆ]$/,''), genre:vs[0].genre, vers:vs };
  });
  const order=g=>{ const i=MAN_GENRES.indexOf(g); return i<0 ? (g==='その他'?999:500) : i; };
  const gm={};
  groups.forEach(g=>{ (gm[g.genre]=gm[g.genre]||[]).push(g); });
  return Object.keys(gm).sort((a,b)=>order(a)-order(b)||a.localeCompare(b,'ja'))
    .map(n=>({ name:n, items:gm[n].sort((a,b)=>a.title.localeCompare(b.title,'ja',{numeric:true})) }));
}
async function manFetchList(){
  try{
    const j=await apiT({action:'mfg_man_list', token:ST.token}, 30000);
    if(j && j.ok && Array.isArray(j.files)){ MAN_LIST={files:j.files, at:j.at, got:Date.now()}; lsSet('man.list', MAN_LIST); MAN_ERR=''; }
    else if(j && j.err==='bad_token') MAN_ERR='ログイン情報を確認できませんでした。いったんログアウトしてログインし直してください。';
    else if(j && (j.err==='unknown_action' || (j.ok && !j.files))) MAN_ERR='サーバー側のマニュアル機能がまだ動いていません（Apps Script の新バージョンのデプロイが必要）。';
    else MAN_ERR='マニュアルの一覧を読み込めませんでした'+(j&&j.err?'（'+j.err+'）':'')+'。';
  }catch(e){ MAN_ERR='通信できませんでした。'+(MAN_LIST?'前回読み込んだ一覧を表示しています。':''); }
}
async function manualScreen(){
  head('マニュアル','ジャンルごとの作業手順');
  if(!document.getElementById('mnCss')){ const st=document.createElement('style'); st.id='mnCss'; st.textContent=MAN_CSS; document.head.appendChild(st); }
  const draw=()=>{
    let h=`<input class="mn-search" id="mnQ" type="search" placeholder="題名で探す（例：上槽、洗米）" value="${esc(MAN_Q)}">`;
    if(MAN_ERR) h+=`<div class="mf-warn" style="margin-top:8px">${esc(MAN_ERR)}</div>`;
    if(!MAN_LIST){ h+=`<div class="card" style="margin-top:12px;text-align:center;color:var(--sub)">読み込んでいます…</div>`; app.innerHTML=h; return; }
    const q=MAN_Q.replace(/[\s　]/g,'').toLowerCase();
    const gs=manGroups(MAN_LIST.files);
    let shown=0;
    gs.forEach((g,gi)=>{
      const items=q ? g.items.filter(it=>it.vers.some(v=>(v.title+v.rel+g.name).replace(/[\s　]/g,'').toLowerCase().includes(q))) : g.items;
      if(!items.length) return;
      shown+=items.length;
      const open = q || MAN_OPEN[g.name]!==false;
      h+=`<div class="mn-g" data-g="${esc(g.name)}"><span>${open?'▾':'▸'} ${esc(g.name)}</span><span class="n">${items.length}件</span></div>`;
      if(!open) return;
      items.forEach(it=>{
        const v=it.vers[0], [c,lab]=manKind(v.ext);
        h+=`<button class="mn-item" data-k="${esc(it.key)}"><span class="mn-bdg ${c}">${lab}</span>
          <div class="t">${esc(it.title)}<div class="s">更新 ${manDate(v.mtime)}${it.vers.length>1?'　／　ほかの版 '+(it.vers.length-1)+'つ':''}</div></div><div class="go">›</div></button>`;
      });
    });
    if(!shown) h+=`<div class="card" style="margin-top:12px;text-align:center;color:var(--sub)">${q?'見つかりませんでした。':'まだマニュアルが届いていません。会社PCの同期（5分ごと）を待ってください。'}</div>`;
    h+=`<p class="tl-note">会社PCの「製造部\\マニュアル」フォルダの中身です。フォルダにファイルを足す・直す・消すと、5分ほどで自動でここに反映されます（ジャンルはフォルダ名で分かれます）。${MAN_LIST.at?'<br>最終反映：'+esc(tjp(MAN_LIST.at)):''}</p>`;
    app.innerHTML=h;
    const inp=$('#mnQ');
    inp.oninput=()=>{ MAN_Q=inp.value; const pos=inp.selectionStart; draw(); const n=$('#mnQ'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} };
    app.querySelectorAll('.mn-g').forEach(el=>el.onclick=()=>{ const n=el.dataset.g; MAN_OPEN[n]=(MAN_OPEN[n]===false); draw(); });
    app.querySelectorAll('.mn-item').forEach(el=>el.onclick=()=>{
      const g=manGroups(MAN_LIST.files).flatMap(x=>x.items).find(x=>x.key===el.dataset.k);
      if(g) go(()=>manualView(g));
    });
  };
  draw();
  await manFetchList();
  if(nav.length && nav[nav.length-1] && document.getElementById('mnQ')) draw();
  // 一覧を開いた時点で、新しい写真から裏で先に取っておく（はじめての端末でも待たせない）
  if(typeof manWarm==='function' && MAN_LIST && MAN_LIST.files){
    try{
      const ids=MAN_LIST.files.slice().sort((a,b)=>String(b.mtime).localeCompare(String(a.mtime))).map(f=>f.id);
      setTimeout(()=>manWarm(ids), 400);
    }catch(e){}
  }
}
function manB64ToBytes(b64){ const s=atob(b64), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
const MAN_FETCHING = new Map();     // id → 取得中の約束（同じものを二重に取らない）
/* マニュアル1件の中身を出す。①この画面で持っている ②端末の控え（IndexedDB）
   ③どちらも無ければサーバー。取れたら端末に控えるので、次からは待たせない。 */
async function manGetBody(v){
  const inMem = MAN_BODY.get(v.id);
  if(inMem) return inMem;
  if(typeof PC!=='undefined'){
    try{
      const c=await PC.get('man:'+v.id);
      if(c && c.mtime===v.mtime && c.bytes) return { ext:c.ext, bytes:c.bytes };
    }catch(e){}
  }
  if(MAN_FETCHING.has(v.id)) return MAN_FETCHING.get(v.id);
  const pr=(async()=>{
    const j=await apiT({action:'mfg_man_get', token:ST.token, id:v.id}, 90000);
    if(!j || !j.ok) throw new Error(j&&j.err==='bad_token'?'ログインし直してください。':j&&j.err==='not_found'?'このマニュアルは会社PCから消されたようです。一覧に戻って開き直してください。':'読み込めませんでした（'+(j&&j.err||'原因不明')+'）');
    const b={ ext:String(j.ext||v.ext).toLowerCase(), bytes:manB64ToBytes(j.b64) };
    if(typeof PC!=='undefined'){ try{ PC.set('man:'+v.id, { mtime:v.mtime, ext:b.ext, bytes:b.bytes }); }catch(e){} }
    return b;
  })();
  MAN_FETCHING.set(v.id, pr);
  try{ return await pr; } finally { MAN_FETCHING.delete(v.id); }
}
function manMime(ext){ return ({docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',heic:'image/heic',webp:'image/webp',doc:'application/msword',xls:'application/vnd.ms-excel'})[ext]||'application/octet-stream'; }
async function manualView(g, vi){
  vi = vi||0;
  const v=g.vers[vi];
  head(g.title, g.genre);
  let top='';
  if(g.vers.length>1){
    top+=`<div class="mn-vers">`+g.vers.map((x,i)=>`<button data-i="${i}" class="${i===vi?'on':''}">${i===0?'最新':'前の版'} ${manDate(x.mtime)}</button>`).join('')+`</div>`;
  }
  app.innerHTML=top+`<div class="mn-doc" id="mnDoc" style="text-align:center;color:var(--sub)">読み込んでいます…</div><div class="mn-foot" id="mnFoot"></div>`;
  app.querySelectorAll('.mn-vers button').forEach(b=>b.onclick=()=>manualView(g, Number(b.dataset.i)));
  const doc=$('#mnDoc');
  if(typeof useAdd==='function'){ try{ useAdd('man', v.id); }catch(e){} }
  let body;
  try{
    body = await manGetBody(v);
    MAN_BODY.set(v.id, body);
    if(MAN_BODY.size>6){ MAN_BODY.delete(MAN_BODY.keys().next().value); }
  }catch(e){
    doc.innerHTML=`<div class="mf-warn">${esc(e&&e.name==='AbortError'?'時間がかかりすぎました。電波の良い場所でもう一度お試しください。':(e.message||'読み込めませんでした。'))}</div>`;
    return;
  }
  if(!document.getElementById('mnDoc')) return;   // 読み込み中に別の画面へ移った
  // 同じジャンルの写真を裏で先に取っておく（次をめくったとき待たせない）
  if(typeof manWarm==='function'){
    try{
      const gs=manGroups(MAN_LIST&&MAN_LIST.files||[]).find(x=>x.name===g.genre);
      if(gs){ const ids=gs.items.map(it=>it.vers[0]&&it.vers[0].id).filter(x=>x&&x!==v.id); setTimeout(()=>manWarm(ids), 400); }
    }catch(e){}
  }
  const blob=new Blob([body.bytes],{type:manMime(body.ext)}), url=URL.createObjectURL(blob);
  const fname=v.title+'.'+body.ext;
  $('#mnFoot').innerHTML=`<a class="btn o" href="${url}" download="${esc(fname)}">ファイルを保存</a><a class="btn o" href="${url}" target="_blank" rel="noopener">別の画面で開く</a>`;
  doc.style.textAlign='left'; doc.style.color='';
  try{
    if(body.ext==='docx'){
      await manLoadLib('docx');
      const r=await mammoth.convertToHtml({arrayBuffer:body.bytes.buffer});
      doc.innerHTML=(r.value||'<p>（中身がありません）</p>').replace(/<table/g,'<div class="mn-tw"><table').replace(/<\/table>/g,'</table></div>');
      // Wordでは続き番号の手順が、画像をはさむと 1 から振り直しになるので、見出しまでは番号を続ける
      let cnt=0;
      [...doc.children].forEach(el=>{
        if(/^H[1-6]$/.test(el.tagName)) cnt=0;
        else if(el.tagName==='OL'){ if(cnt && !el.hasAttribute('start')) el.start=cnt+1; cnt=(el.start||1)-1+el.children.length; }
      });
      // 目次（ページ番号つきのリンク）は押しても意味がないので文字だけにする
      doc.querySelectorAll('a[href^="#"]').forEach(a=>{ const sp=document.createElement('span'); sp.textContent=a.textContent.replace(/\t\d+\s*$/,''); a.replaceWith(sp); });
    }else if(body.ext==='xlsx'){
      await manLoadLib('xlsx');
      const wb=XLSX.read(body.bytes,{type:'array'});
      const names=wb.SheetNames.filter(n=>{ const ws=wb.Sheets[n]; return ws && ws['!ref']; });
      const show=i=>{
        const ws=wb.Sheets[names[i]];
        let t=XLSX.utils.sheet_to_html(ws,{editable:false});
        const m=t.match(/<table[\s\S]*<\/table>/); t=m?m[0]:t;
        doc.innerHTML=(names.length>1?`<div class="mn-sheets">`+names.map((n,k)=>`<button data-s="${k}" class="${k===i?'on':''}">${esc(n)}</button>`).join('')+`</div>`:'')+`<div class="mn-tw">${t}</div>`;
        doc.querySelectorAll('.mn-sheets button').forEach(b=>b.onclick=()=>show(Number(b.dataset.s)));
      };
      if(names.length) show(0); else doc.innerHTML='<p>（表が空です）</p>';
    }else if(['jpg','jpeg','png','gif','webp','heic'].includes(body.ext)){
      doc.innerHTML=`<img src="${url}" alt="${esc(v.title)}" style="margin:0 auto">`+(body.ext==='heic'?'<p class="muted">HEIC形式の写真です。表示されないときは「別の画面で開く」を押してください。</p>':'');
    }else if(body.ext==='pdf'){
      doc.innerHTML=`<iframe src="${url}" style="width:100%;height:70vh;border:0"></iframe>`;
    }else{
      doc.innerHTML=`<p>この形式（${esc(body.ext)}）はアプリの中では表示できません。「ファイルを保存」から開いてください。</p>`;
    }
  }catch(e){
    doc.innerHTML=`<div class="mf-warn">表示できませんでした（${esc(e.message||e)}）。「ファイルを保存」から開いてください。</div>`;
  }
}
</script>
<script>
/* ================= 醸造記録：麹／分析／仕込み（2026-09-24） =================
   データ本体：製造アカウントのGoogleスプレッドシート「醪管理R8BY」「麹管理R8BY」
   （造りexの帳票 → build_moromi.py / build_koji.py で生成した型を取り込んだもの）。
   裏側：Apps Script「醸造記録 R8BY」（REC_URL）。入力は誰でもできるが、
   ログイン名が「醪管理R8BY › 入力ログ」に残る（誰が・いつ・どのセルを・何から何へ）。

/* 2026-10-14 おんどとり（品温計）を作業で引き抜いた間の急な温度変化を除く。
   品温計ごとに時刻順に並べ、30分以内に3℃以上動いた所で区切る。区切られた一続きのうち
   ・前後どちらか（または両方）が急変で区切られていて、・長さが20分以内で、・前後の品温より室温に近い（室温が無ければ低い）
   ものを「引き抜いていた間」とみなして除く。なくなるまで繰り返す。20分を超えて続いた変化は本当の変化として残す
   2026-10-14 泰広さん指示：輝（kagayaki）以外は就業時間内（日本時間 8:00～18:00）に変化したものだけ除く。夜中は除湿機で変わるので残す（kaga=true なら時間を問わない） */
const KPB={jump:3,win:30,max:20,h0:8,h1:18};
function kPbJstMin(ms){ return Math.floor(((Number(ms)+9*3600000)%86400000)/60000); }
function kPbClean0(pts,kaga){
  const all=(pts||[]).filter(p=>p), out=[], nos=[...new Set(all.map(p=>Number(p.no)))]; let cut=0;
  const num=x=>x!=null&&x!==''&&isFinite(Number(x));
  nos.forEach(n=>{
    let q=all.filter(p=>Number(p.no)===n), bad=q.filter(p=>!(num(p.ms)&&num(p.v)));
    q=q.filter(p=>num(p.ms)&&num(p.v)).sort((a,b)=>a.ms-b.ms);
    for(let loop=0;loop<6;loop++){
      const seg=[]; let cur=[], jb=false;
      q.forEach((p,k)=>{ if(k){ const a=q[k-1], dt=(p.ms-a.ms)/60000, dv=Number(p.v)-Number(a.v);
          if(Math.abs(dv)>=KPB.jump&&dt<=KPB.win){ seg.push({p:cur,jb,ja:true}); cur=[]; jb=true; }
          else if(dt>60){ seg.push({p:cur,jb,ja:false}); cur=[]; jb=false; } }
        cur.push(p); });
      if(cur.length) seg.push({p:cur,jb,ja:false});
      if(seg.length<2) break;
      const drop=new Set();
      seg.forEach((g,i)=>{ if(!(g.jb||g.ja)) return;
        if((g.p[g.p.length-1].ms-g.p[0].ms)/60000>KPB.max) return;
        if(!kaga){ const tm=kPbJstMin(g.jb?g.p[0].ms:g.p[g.p.length-1].ms); if(tm<KPB.h0*60||tm>KPB.h1*60) return; }
        const nb=[]; if(g.jb&&i>0) nb.push(Number(seg[i-1].p[seg[i-1].p.length-1].v)); if(g.ja&&i<seg.length-1) nb.push(Number(seg[i+1].p[0].v));
        if(!nb.length) return;
        const m=g.p.reduce((a,p)=>a+Number(p.v),0)/g.p.length;
        const rr=g.p.concat(i>0?seg[i-1].p.slice(-3):[],i<seg.length-1?seg[i+1].p.slice(0,3):[]).map(p=>p.room).filter(num).map(Number);
        const r=rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null;
        const ok=nb.every(v=>r!=null?Math.abs(m-r)<Math.abs(v-r):m<v);
        if(ok) g.p.forEach(p=>drop.add(p)); });
      if(!drop.size) break;
      cut+=drop.size; q=q.filter(p=>!drop.has(p));
    }
    out.push(...q,...bad);
  });
  out.sort((a,b)=>(Number(a.ms)||0)-(Number(b.ms)||0));
  return {pts:out,cut};
}
/* 2026-10-14 除外した温度帯の復元（麹ごと・端末に控える） */
function kPbRaw(id){ return !!(id&&(lsGet('kpb.raw',{})||{})[id]); }
function kPbSetRaw(id,on){ const o=lsGet('kpb.raw',{})||{}; if(on) o[id]=1; else delete o[id]; lsSet('kpb.raw',o); }
function kPbClean(pts,kaga,id){ const c=kPbClean0(pts,kaga); c.cutN=c.cut;
  if(!kPbRaw(id)) return c;
  const keep=new Set(c.pts), all=(pts||[]).filter(p=>p).slice().sort((a,b)=>(Number(a.ms)||0)-(Number(b.ms)||0));

function rcProbeChart(pts){
  const PCOL=['#b23b3b','#1d5fa8','#2e8b57','#b8860b']; const nos=[...new Set(pts.map(p=>p.no))];
  const W=320,H=150,L=30,R=6,T=8,B=20; const xs=pts.map(p=>p.ms), vs=pts.map(p=>p.v).concat(pts.filter(p=>p.room!=null).map(p=>p.room));

  const ticks=[]; for(let v=lo; v<=hi; v+=Math.max(1,Math.round((hi-lo)/4))) ticks.push(v);

    ${(hi>KZONE.lo&&lo<KZONE.hi)?`<rect x="${L}" y="${Y(Math.min(hi,KZONE.hi))}" width="${W-L-R}" height="${Y(Math.max(lo,KZONE.lo))-Y(Math.min(hi,KZONE.hi))}" fill="${KZONE.c}" fill-opacity=".18"/>`:''}
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e1d6"/><text x="${L-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#8a8272">${v}</text>`).join('')}
    ${line(pts,'room','#b9b2a3',1.2)}${PCOL.map((col,i)=>line(pts.filter(p=>p.no===i+1),'v',col,2)).join('')}
    <text x="${L}" y="${H-5}" font-size="9" fill="#8a8272">${f(x0)}</text><text x="${W-R}" y="${H-5}" font-size="9" text-anchor="end" fill="#8a8272">${f(x1)}</text></svg>
    <div class="tl-note" style="display:flex;gap:12px">${nos.map(n=>`<span><span style="display:inline-block;width:14px;height:2px;background:${PCOL[n-1]};vertical-align:middle"></span> No${n}</span>`).join('')}<span><span style="display:inline-block;width:14px;height:2px;background:#b9b2a3;vertical-align:middle"></span> 1号室 室温</span></div>`;
}
/* 待たせない保存（2026-09-30）：送る内容を端末に控え、裏で送る。送れなかった分は次に麹の画面を開いたとき自動で送り直す */
function recQ(){ return lsGet('rec.q',[])||[]; }
function rcToast(t,warn,ms){ let el=document.getElementById('rcToast'); if(!el){ el=document.createElement('div'); el.id='rcToast';

  el.textContent=t; el.style.whiteSpace='pre-line'; el.style.background=warn?'#b23b3b':'#1b2a41'; el.style.color='#fff'; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity='0'; }, ms||(warn?6000:2500)); }
function recSaveBg(body,label,quiet){ const q=recQ(); q.push({body,label,at:Date.now()}); lsSet('rec.q',q); if(!quiet) rcToast(`${label} を保存しています…（裏で送ります）`); recFlush(); }
/* 2026-10-06 泰広さん指示：酒母・仕込みも「保存」を押したら画面を閉じ、送信は裏で行う。
   ・送信待ちは端末に預かり（rec.q）、順番に送る。電波が無ければ30秒ごと・電波が戻ったときに自動で送り直す
   ・送信待ちの値は、読み込み直した酒母・醪のデータにも重ねて見せる（recOverlay）ので、保存前の値に戻って見えない
   ・醪の保存で計算の注意（推奨追水・警告）が出たら、下の知らせに出す */
function recOverlay(action,no,r){
  if(!r||!r.ok) return r;
  const want=action==='shubo_get'?'shubo_save':action==='bunseki_get'?'bunseki_save':''; if(!want) return r;
  recQ().forEach(it=>{ const b=it.body||{}; if(b.action!==want||String(b.no)!==String(no)) return;
    if(b.day && b.values && r.days && r.days[b.day-1]) Object.assign(r.days[b.day-1], b.values);
    if(b.setup){ r.setup=r.setup||{};
      if(want==='shubo_save') Object.assign(r.setup,b.setup);
      else if(b.setup.stage) r.setup[b.setup.stage]=Object.assign({},r.setup[b.setup.stage]||{},b.setup.values||{}); }
    if('motooroshi' in b) r.motooroshi=b.motooroshi; if('biko' in b) r.biko=b.biko; });
  return r;
}
function recAfterSave(it,res){
  const b=it.body||{}, no=b.no;
  if(b.action==='bunseki_save'){ if(res.all) RC.bun[no]=recOverlay('bunseki_get',no,res.all); RC.at=0;
    const c=res.calc||{}, w=c.warn||c.miss||'';
    if(w||c.rec) return `${it.label} を保存しました${c.rec?`　推奨追水 ${rcN(c.rec)}L`:''}${w?`　⚠ ${w}`:''}`; }
  if(b.action==='shubo_save' && no!=null){ RC.shDirty=RC.shDirty||{}; RC.shDirty[no]=1; }
  return '';
}
async function recFlush(){ if(RC.qBusy) return; RC.qBusy=true; let netFail=false; const warns=[], fails=[];
  try{ let q=recQ();
    while(q.length){ const it=q[0]; let res=null;
      try{ res=await recApi(it.body,60000); }catch(e){ netFail=true; rcToast(`電波が弱いため未送信が${q.length}件あります。電波が戻ったら自動で送ります`,true); break; }
      q=recQ(); if(q.length&&q[0].at===it.at&&JSON.stringify(q[0].body)===JSON.stringify(it.body)) q.shift(); lsSet('rec.q',q);   // 送っている間に足された分は消さない
      if(res&&res.ok){ const w=recAfterSave(it,res); if(w) warns.push(w); rcToast(`${it.label} を保存しました${q.length?`（残り${q.length}件）`:''}`); }
      else { fails.push(`${it.label}：${(res&&res.err)||''}`); rcToast(`${it.label} を保存できませんでした：${(res&&res.err)||''}　もう一度入れてください`,true); }
    }
  } finally { RC.qBusy=false; }
  /* 注意（推奨追水・警告）と保存できなかった分は、最後にまとめて出す（何本もまとめて保存しても見落とさない） */
  if(warns.length||fails.length) rcToast([...fails.map(x=>'✕ 保存できませんでした　'+x), ...warns].join('\n'), true, 12000);
  /* 酒母：全部送れたら最新を取り直し、表を開いていれば描き直す（未保存の入力があるときは描き直さない） */
  if(!recQ().length && RC.shDirty && Object.keys(RC.shDirty).length){ const nos=Object.keys(RC.shDirty); RC.shDirty={};
    try{ await shFetchMany(nos,'shubo_get',RC.shubo,()=>{}); }catch(e){}
    try{ if(typeof KGE!=='undefined' && KGE.draw && document.querySelector('.kg-sbar') && !Object.keys(KGE.dirty||{}).length) KGE.draw(); }catch(e){} }
  if(netFail){ clearTimeout(RC.qRetry); RC.qRetry=setTimeout(recFlush,30000); }

/* 2026-10-15 泰広さん指示：各麹の行のグラフを、麹を開かなくても品温計の最新で出す。
   品温計を付けている麹は3分ごと（画面を出すたび）に取り直す。付けていない麹は1回だけ取る */
const KROW_LIVE_MS=3*60000;
function kRowLive(date){
  const j=RC.koji&&RC.koji[date]; if(!j) return; RC.pserAt=RC.pserAt||{}; RC.pser=RC.pser||{};
  const live=new Set(Object.values(j.probes||{}).filter(q=>q&&q.id).map(q=>q.id));
  const seen=new Set();
  app.querySelectorAll('.rc-row.kbg[data-id]').forEach(b=>{ const id=b.dataset.id; if(seen.has(id)) return; seen.add(id);
    const r=(j.koji||[]).find(x=>x['麹ID']===id); if(!r) return;
    const have=!!RC.pser[id], age=Date.now()-(RC.pserAt[id]||0);
    if(have&&!(live.has(id)&&age>KROW_LIVE_MS)) return;
    if(RC.pserAt[id]&&age<KROW_LIVE_MS) return;
    RC.pserAt[id]=Date.now();
    recApi({action:'probe_series',id},30000).then(s=>{ if(!(s&&s.ok&&s.points)) return; RC.pser[id]=s.points;
      if(RC.kday!==date||!$('#kDate')) return;
      app.querySelectorAll('.rc-row.kbg[data-id]').forEach(el=>{ if(el.dataset.id!==id) return;
        const nw=kRowBg(r); if(!nw) return; const old=el.querySelector('.kbg-svg');
        if(old) old.outerHTML=nw; else el.insertAdjacentHTML('afterbegin',nw); }); }).catch(()=>{ RC.pserAt[id]=0; });
  });
}

/* 2026-10-06 泰広さん指示：種麹はリストから選ぶ（酵母によって使い分け。担当者が入力）。
   選択肢＝麹管理R8BY「種麹集計」の種麹名（＝シート「リスト」の種麹）。読み込めないときは既定の一覧。 */
const RC_TANE_DEF=['酛立用','醪用','丸吟','吟香','吟味','白夜','ハイG','Roots36'];
function rcTaneNames(cur){ const L=(RC.tane&&RC.tane.list||[]).map(x=>x.name).filter(Boolean); const a=(L.length?L:RC_TANE_DEF).slice(); if(cur&&!a.includes(String(cur))) a.push(String(cur)); return a; }
function rcTanePrefetch(){ if(RC.tane||RC.tanePf) return; RC.tanePf=1;
  recApi({action:'tane_get'},40000).then(t=>{ RC.tanePf=0; if(!(t&&t.ok)) return; RC.tane=t;
    document.querySelectorAll('select[data-tane]').forEach(sel=>{ const have=[...sel.options].map(o=>o.value); rcTaneNames(sel.value).forEach(n=>{ if(!have.includes(n)){ const op=document.createElement('option'); op.textContent=n; sel.appendChild(op); } }); });
  }).catch(()=>{ RC.tanePf=0; }); }
/* 2026-10-15 泰広さん指示：種麹の力価で引込みのときに注意。同じ量なら力価が強いほど品温が上がりやすい。
   量は「割合%」＝麹米100kgあたりの g（例 24kg×50% → 12g）。
   力価＝αアミラーゼ＋グルコアミラーゼ（U/g、メーカー公表値）。出典は Obsidian
   醸造ナレッジベース「種麹_菱六カタログ」「製麹_秋田今野・日本醸造工業・ビオックの種麹力価」「製麹_稲麹由来の新種麹Roots36とOriza1061」・酵母麹ライブラリ。
   一覧は Obsidian「製麹/種麹_力価と引込みの注意」。メーカーをまたぐ比較は目安（測り方が各社で違う）。 */
const TANE_POT={
  '酛立用':{p:1985,mk:'秋田今野',a:1700,g:285,memo:'前急型・破精込みが強い'},
  'Roots36':{p:1764,mk:'秋田今野',a:1190,g:574,memo:'高グルコ（公表値の幅の中央）'},
  '醪用':{p:1634,mk:'秋田今野',a:1412,g:222,memo:'汎用・バランス型'},
  '吟香':{p:1453,mk:'秋田今野',a:1247,g:206,memo:'バランス型'},
  '丸吟':{p:1218,mk:'菱六',a:980,g:238,memo:'中吟用'},
  '白夜':{p:1120,mk:'菱六',a:700,g:420,memo:'高グルコ・低α（基準）'},
  '吟味':{p:704,mk:'秋田今野',a:567,g:137,memo:'酵素力価が全体に低い'},
  'ハイG':{p:null,mk:'樋口',memo:'力価の数値は非公開。増殖やや緩やか＝冷え込みに注意'} };
const TANE_BASE='白夜', TANE_WARN=[1.2,1.5];   // 白夜の 1.2倍以上＝やや強い（橙）／1.5倍以上＝強い（赤）
function taneK(n){ const t=TANE_POT[String(n||'').trim()]; return t&&t.p?t.p/TANE_POT[TANE_BASE].p:null; }
function taneLv(k){ return k==null?0:(k>=TANE_WARN[1]?2:(k>=TANE_WARN[0]?1:0)); }
/* 種麹①②の力価をまとめる。量（割合%）が入っていれば量で重みづけ */
function taneMix(n1,p1,n2,p2){
  const L=[[n1,p1],[n2,p2]].filter(([n])=>String(n||'').trim()).map(([n,p])=>({n:String(n).trim(),p:(p===''||p==null||isNaN(+p))?null:+p,k:taneK(n),t:TANE_POT[String(n).trim()]}));
  const kk=L.filter(x=>x.k!=null); let k=null;
  if(kk.length){ const w=kk.every(x=>x.p!=null&&x.p>0); k=w?kk.reduce((s,x)=>s+x.k*x.p,0)/kk.reduce((s,x)=>s+x.p,0):Math.max(...kk.map(x=>x.k)); }
  return {L,k,lv:taneLv(k)}; }
function taneBadge(r){ const m=taneMix(r['種麹'],r['割合%'],r['種麹2'],r['割合2%']); if(!m.lv) return '';
  return ` <span class="rc-warn" style="${m.lv===1?'background:#fff1de;color:#b35c00':''}">${m.lv===2?'⚠ 力価強':'△ 力価やや強'} ×${m.k.toFixed(1)}</span>`; }
function taneWarnHTML(n1,p1,n2,p2,kg){
  const m=taneMix(n1,p1,n2,p2); if(!m.L.length) return '';
  const lines=m.L.map(x=>{ const t=x.t;
    const pot=t&&t.p?`力価 ${t.p}（α${t.a}＋G${t.g}）＝${TANE_BASE}の <b>${x.k.toFixed(2)}倍</b>`:(t?'力価の数値なし':'力価の登録なし（Obsidian の一覧に足すと出ます）');
    const amt=x.p!=null?`・100kgあたり ${x.p}g${x.k!=null?` → ${TANE_BASE}換算 <b>${Math.round(x.p*x.k)}g</b> 相当`:''}${kg?`（この麹 ${kg}kg で ${Math.round(kg*x.p/100*10)/10}g）`:''}`:'';
    return `<div style="margin-top:3px">${esc(x.n)}${t?`<small style="color:#777">（${esc(t.mk)}・${esc(t.memo)}）</small>`:''}<br>${pot}${amt}</div>`; }).join('');
  const st=m.lv===2?'background:#fdecec;border:1px solid #e8a3a3;color:#7a1f1f':(m.lv===1?'background:#fff4e5;border:1px solid #f0c48a;color:#7a4300':'background:#f5f5f2;border:1px solid #ddd;color:#555');

/* ================= 待たせない仕組み（2026-09-24） =================
   ① アプリを開いたら（ホームが出たら）裏で各項目のデータを先読みする。
      よく使う項目から順に。使ったことのある重い項目（ライブラリ・マニュアル本文・
      よく見る仕込の詳細）はその人だけ先読み（人によって先読みの中身が変わる）。
   ② 画面を開くときは、端末に保存してある前回の内容をすぐ出し、最新は裏で取って描き直す
      （入力中は描き直さない）。対象：仕込の一覧・麹・分析・酒母・カルテ・マニュアル本文。
   ③ アプリに戻ってきたとき（5分以上たっていれば）も先読みする。
   ④ サービスワーカー（sw.js）で画面のファイルと表示用の部品（Word/Excel）を端末に持つ。
   使い方の記録（どの項目・どのタンク・どのマニュアルをよく見るか）はこの端末の中だけに保存。
   ================================================================ */
const FAST = { dirty:false, last:0, running:false };

/* ---------- 端末の保存庫（IndexedDB。使えなければ何もしない） ---------- */
const PC = (()=>{
  let dbp=null;
  function db(){
    if(dbp) return dbp;
    dbp=new Promise((ok,ng)=>{ try{
      const r=indexedDB.open('mfgcache',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);
    }catch(e){ ng(e); } });
    dbp.catch(()=>{ dbp=null; });
    return dbp;
  }
  async function get(k){ try{ const d=await db(); return await new Promise(ok=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
  async function set(k,v){ try{ const d=await db(); await new Promise(ok=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); tx.onabort=()=>ok(); }); }catch(e){} }
  async function delPrefix(p){ try{ const d=await db(); await new Promise(ok=>{ const tx=d.transaction('kv','readwrite'); const q=tx.objectStore('kv').openCursor();
    q.onsuccess=()=>{ const c=q.result; if(c){ if(String(c.key).indexOf(p)===0) c.delete(); c.continue(); } }; tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); }); }catch(e){} }
  return { get, set, delPrefix };
})();

/* ---------- 使い方の記録（この端末だけ） ---------- */
function useGet(){ return lsGet('fast.use',{ f:{}, tank:{}, man:{} }); }
function useAdd(kind, key){
  if(!key) return;
  const u=useGet(); u[kind]=u[kind]||{};
  const e=u[kind][key]||{n:0,t:0}; e.n++; e.t=Date.now(); u[kind][key]=e;
  // 古いものは消す（90日）
  Object.keys(u[kind]).forEach(k=>{ if(Date.now()-u[kind][k].t>90*86400000) delete u[kind][k]; });
  lsSet('fast.use',u);
}
/* よく使う順（回数に、最近使ったほど重みを付ける） */
function useRank(kind){
  const u=(useGet()[kind])||{};
  return Object.keys(u).map(k=>{ const e=u[k], days=(Date.now()-e.t)/86400000; return [k, e.n*Math.pow(0.5, days/14)]; })
    .sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

/* ---------- 入力中は描き直さない ---------- */
document.addEventListener('input', ()=>{ FAST.dirty=true; }, true);
(function(){
  const _go=go;
  go=function(fn,push){ FAST.dirty=false; return _go(fn, push===undefined?true:push); };
  hBack.addEventListener('click', ()=>{ FAST.dirty=false; }, true);
})();
/* 裏で取った内容が変わっていたら、同じ画面を見ているときだけ描き直す */
function fastRerender(myTop){
  if(FAST.dirty) return;
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const f=nav[nav.length-1];
  if(!f || f!==myTop) return;

const recApiNet = recApi;
function recKey(b){ return 'rec:'+b.action+':'+(b.no!=null?b.no:'')+':'+(b.date||''); }
async function recFetchStore(body, ms){
  const r=await recApiNet(body, ms);
  if(r && r.ok) PC.set(recKey(body), { at:Date.now(), s:JSON.stringify(r) });
  return r;
}
recApi = async function(body, ms){
  const a=body&&body.action;
  if(!REC_READ[a]){
    const r=await recApiNet(body, ms);
    if(r && r.ok && /save/.test(a)){ PC.delPrefix('rec:'); }   // 保存したら保存分は捨てる（古い値を出さない）
    return r;
  }
  if(!body._pf && (a==='bunseki_get'||a==='shubo_get'||a==='karte')) useAdd('tank', String(body.no));
  const k=recKey(body), c=await PC.get(k);
  if(c && c.s){
    const age=Date.now()-c.at;
    if(age>30000 && !REC_BG[k]){
      const myTop=nav[nav.length-1];
      REC_BG[k]=recFetchStore(body, ms).then(r=>{
        if(r && r.ok && JSON.stringify(r)!==c.s){
          // 画面側の手元の控え（RC）も新しくして描き直す
          if(a==='koji_today') RC.koji[body.date]=r;
          if(a==='bunseki_get') RC.bun[body.no]=r;
          if(a==='shubo_get') RC.shubo[body.no]=r;
          if(a==='karte') RC.karte[body.no]=r;
          if(!body._pf) fastRerender(myTop, a);
        }
      }).catch(()=>{}).finally(()=>{ delete REC_BG[k]; });
    }
    try{ return JSON.parse(c.s); }catch(e){}
  }
  return recFetchStore(body, ms);
};
/* 仕込の一覧（state）：保存分をすぐ返し、1分より古ければ裏で最新 */
let REC_STATE_BG=null;
recState = async function(force){
  if(!RC.state){ const c=lsGet('rec.state',null); if(c&&c.master){ RC.state=c; RC.at=c._at||0; } }
  const net=()=>recApiNet({action:'state'},40000).then(j=>{
    if(j&&j.ok){ const changed=!RC.state || JSON.stringify(j)!==JSON.stringify(Object.assign({},RC.state,{_at:undefined})); j._at=Date.now(); RC.state=j; RC.at=j._at; lsSet('rec.state',j); return changed; }
    return false;
  }).catch(()=>false);
  if(!force && RC.state){
    if(Date.now()-RC.at>60000 && !REC_STATE_BG){
      const myTop=nav[nav.length-1];
      REC_STATE_BG=net().then(ch=>{ REC_STATE_BG=null; if(ch) fastRerender(myTop); });
    }
    return RC.state;
  }

  return RC.state;
};

const MAN_PHOTO_EXT = ['jpg','jpeg','png','gif','webp','heic'];
async function pfManuals(){
  // ① よく開くマニュアル上位6つ ② 写真のマニュアル（新しい順）を、合計12件・8MBまで先に取っておく。
  //    内容が変わっていなければ取り直さない。データ節約モードの端末は①だけ。
  if(!MAN_LIST || !MAN_LIST.files) await manFetchList();
  if(!MAN_LIST || !MAN_LIST.files) return;
  const saveData = navigator.connection && navigator.connection.saveData;
  const ids = useRank('man').slice(0, 6);
  if(!saveData){
    MAN_LIST.files.slice()
      .filter(f=>MAN_PHOTO_EXT.indexOf(String(f.ext||'').toLowerCase())>=0)
      .sort((a,b)=>String(b.mtime).localeCompare(String(a.mtime)))
      .forEach(f=>{ if(ids.indexOf(f.id)<0) ids.push(f.id); });
  }
  await manWarm(ids, 12, 8*1024*1024, true);
  lsSet('fast.manAt',Date.now());
}
/* マニュアルの写真を裏で取っておく（一覧を開いたとき・見ている間）。
   すでに端末にあるもの・写真以外は飛ばす。多くても6件・6MBまで。 */
let MAN_WARMING = false;
async function manWarm(ids, maxN, maxB, anyType){
  if(MAN_WARMING || !ids || !ids.length) return;
  if(!ST.token || !MAN_LIST || !MAN_LIST.files) return;
  if(navigator.connection && navigator.connection.saveData) return;   // データ節約モードでは取らない
  MAN_WARMING = true;
  try{
    let bytes=0, n=0;
    for(const id of ids){
      if(n>=(maxN||6) || bytes>(maxB||6*1024*1024)) break;
      const f=MAN_LIST.files.find(x=>x.id===id); if(!f) continue;
      if(!anyType && MAN_PHOTO_EXT.indexOf(String(f.ext||'').toLowerCase())<0) continue;
      try{
        const c=await PC.get('man:'+id); if(c && c.mtime===f.mtime) continue;
        if(MAN_FETCHING.has(id)) continue;                 // 今まさに開かれている分は任せる
        const b=await manGetBody(f);
        if(b && b.bytes){ bytes+=b.bytes.length; n++; }
      }catch(e){}
    }
  } finally { MAN_WARMING=false; }
}
async function pfLibs(){
  // Word・Excelを表示する部品（サービスワーカーが端末に持つ）
  for(const u of Object.values(MAN_LIBS)){ try{ await fetch(u,{mode:'no-cors'}); }catch(e){} }
  lsSet('fast.libsAt',Date.now());
}
async function fastPrefetch(){
  if(!ST.token || FAST.running) return;
  FAST.running=true; FAST.last=Date.now();
  try{
    const saveData = navigator.connection && navigator.connection.saveData;
    // よく使う項目の順に、必要な先読みを並べる（重複は1回）
    const order=[], seen={};
    const push=t=>{ if(!seen[t]){ seen[t]=1; order.push(t); } };
    const used=useRank('f');
    used.forEach(f=>(F_NEEDS[f]||[]).forEach(push));
    // 使ったことがなくても、軽いものはだれでも
    Object.keys(PF_TASKS).forEach(t=>{ if(PF_TASKS[t].light) push(t); });
    const todo=order.filter(t=>{
      const p=PF_TASKS[t]; if(!p) return false;
      if(saveData && !p.light) return false;
      if(!p.light && !used.some(f=>(F_NEEDS[f]||[]).indexOf(t)>=0)) return false;
      return Date.now()-(p.at()||0) > p.ttl;
    });
    // 3本ずつ並べて取る（サーバーが別なので並べても混まない）
    let i=0;
    const worker=async()=>{ while(i<todo.length){ const t=todo[i++]; try{ await PF_TASKS[t].run(); }catch(e){} } };
    await Promise.all([worker(),worker(),worker()]);
  } finally { FAST.running=false; }
}

/* ---------- 出勤表から「今日の出勤者」 ---------- */
function o2Off(v){
  const t=String(v||'').trim(); if(!t) return false;
  if(/0\.5/.test(t)) return false;                               // 半休は出勤している
  if(/^[＼\\／\/]/.test(t)) return true;                         // 休み（＼・／・＼当）
  if(t==='×'||t==='アグリ') return true;                         // 希望休・アグリ勤務
  return false;                                                  // 空欄・泊・当・３F・文字の予定＝出勤
}
function o2Staff(){
  const td=dtoday(), K=MFG&&MFG.shukkin;
  let all=[], work=[], fromKn=false;
  if(K&&K.months){
    const M=K.months[td.slice(0,7)];
    if(M&&M.staff){
      const day=(M.days||[]).find(x=>x.d===td);
      M.staff.forEach((s,k)=>{ const n=nrm(s); if(!n) return; all.push(n); if(day && !o2Off(day.c&&day.c[k])) work.push(n); });
      fromKn=!!day;
    }
  }
  // 出勤表がまだ届いていない端末：タンク洗浄の担当者名と自分
  if(!all.length){ (WS.staff||[]).forEach(n=>{ n=nrm(n); if(n&&!all.includes(n)) all.push(n); }); }
  const me=nrm((MFG&&MFG.me&&MFG.me.name)||ST.name);
  if(me && !all.some(n=>o2Same(n,me))) all.push(me);
  return { all, work, fromKn, me };
}
function o2Same(a,b){ a=nrm(a); b=nrm(b); return !!a && !!b && (a===b || a.startsWith(b) || b.startsWith(a)); }
function o2Find(list,name){ return list.find(n=>o2Same(n,name)); }
function o2DefaultBy(area, S){
  const last=lsGet('o2.last.'+area,'');
  // 自分が今日出勤 → 前回この場所を測った人が今日出勤 → 今日の出勤者の先頭 → 自分
  return o2Find(S.work,S.me) || (last && o2Find(S.work,last)) || S.work[0] || o2Find(S.all,S.me) || last || S.all[0] || '';
}

/* ---------- 測定箇所 ---------- */
function o2Places(area){
  if(area!=='wash') return (O2_AREAS[area].places||[]).map(p=>({v:p,label:p}));
  wsFromCache();
  const seen=new Set(), out=[];
  const plan=(WS.plan||[]).slice().sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.n-b.n);
  const todo=plan.filter(p=>!(wsRec(p.id).wash&&wsRec(p.id).wash.done));
  todo.concat(plan).forEach(p=>{ if(seen.has(String(p.tank))) return; seen.add(String(p.tank));
    out.push({v:p.tank+'号タンク', label:p.tank+'号タンク', sub:`No.${p.n} ${p.brand||''}・期限 ${wsMD(p.deadline)}`, g:todo.includes(p)?'これから洗浄するタンク（期限の近い順）':'ほかのタンク'}); });
  return out;
}

/* ---------- 選択リスト（下から出る一覧） ---------- */
function o2Pick(title, items, cur, num){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='o2-mask';
    let g='', h='';
    items.forEach((x,i)=>{ if(x.g && x.g!==g){ g=x.g; h+=`<div class="g">${esc(g)}</div>`; }
      h+=`<button class="i ${String(x.v)===String(cur)?'on':''}" data-i="${i}">${esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</button>`; });
    m.innerHTML=`<div class="o2-sheet ${num?'num':''}"><div class="t">${esc(title)}<button type="button">閉じる</button></div><div class="l">${h}</div></div>`;
    document.body.appendChild(m);
    const done=v=>{ m.remove(); res(v); };
    m.onclick=e=>{ if(e.target===m) done(null); };
    m.querySelector('.t button').onclick=()=>done(null);
    m.querySelectorAll('.i').forEach(b=>b.onclick=()=>done(items[+b.dataset.i].v));
    const on=m.querySelector('.i.on'), l=m.querySelector('.l');
    if(on) l.scrollTop=Math.max(0,on.offsetTop-l.clientHeight/2+on.offsetHeight/2);
  });
}

/* ---------- 測定日時を選ぶ（2026-10-12） ----------
   返り値：{d,t}／'now'（今の時刻に戻す）／null（閉じた）。未来の日時は入れさせない */
function o2PickDT(d, t, canNow){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='o2-mask';
    m.innerHTML=`<div class="o2-sheet"><div class="t">測定日時<button type="button" class="x">閉じる</button></div>
      <div class="o2-dt"><label>日付<input type="date" id="o2dD" value="${esc(d)}" max="${dtoday()}"></label>
      <label>時刻<input type="time" id="o2dT" value="${esc(t)}"></label><div class="w" id="o2dW"></div>
      <div class="b">${canNow?'<button type="button" class="now">今にする</button>':''}<button type="button" class="ok">決定</button></div></div></div>`;
    document.body.appendChild(m);
    const done=v=>{ m.remove(); res(v); };
    m.onclick=e=>{ if(e.target===m) done(null); };
    m.querySelector('.x').onclick=()=>done(null);
    const nw=m.querySelector('.now'); if(nw) nw.onclick=()=>done('now');
    m.querySelector('.ok').onclick=()=>{
      const dd=m.querySelector('#o2dD').value, tt=m.querySelector('#o2dT').value, w=m.querySelector('#o2dW');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dd)){ w.textContent='日付を入れてください'; return; }
      if(!/^\d{1,2}:\d{2}$/.test(tt)){ w.textContent='時刻を入れてください'; return; }
      const n=new Date(), nt=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
      if((dd+' '+tt.padStart(5,'0'))>(dtoday()+' '+nt)){ w.textContent='これから先の日時は入れられません'; return; }
      done({d:dd,t:tt.padStart(5,'0')});
    };
  });
}

/* ---------- 通信・端末の控え ---------- */
const O2 = { rows:{}, at:{}, sheet:'', ym:{}, fresh:{}, busy:false };
async function o2Api(body, ms){
  if(!O2_URL) throw new Error('no_url');
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||25000) : null;
  try{
    const r=await fetch(O2_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function o2Cached(area){ if(!O2.rows[area]){ const c=lsGet('o2.rows.'+area,null); if(c){ O2.rows[area]=c.rows||[]; O2.at[area]=c.at||0; if(c.sheet) O2.sheet=c.sheet; } } return O2.rows[area]||[]; }
function o2Store(area, j){ O2.rows[area]=j.rows||[]; O2.at[area]=Date.now(); if(j.sheetUrl) O2.sheet=j.sheetUrl; lsSet('o2.rows.'+area,{rows:O2.rows[area],at:O2.at[area],sheet:O2.sheet}); }
const o2Queue=()=>lsGet('o2.q',[]);
/* 電波が無くて預かった分を送る（同じ記録は id で見分けるので、二重には残らない） */
let O2_FLUSH=null;
function o2Flush(){
  if(O2_FLUSH) return O2_FLUSH;
  O2_FLUSH=(async()=>{ let sent=0;
    try{ let q=o2Queue();
      for(const it of q.slice()){
        try{ const j=await o2Api(it,25000); if(j&&j.ok){ o2Store(it.area,j); q=o2Queue().filter(x=>x.cid!==it.cid); lsSet('o2.q',q); sent++; } else break; }
        catch(e){ break; }
      } }catch(e){}
    O2_FLUSH=null; return sent; })();
  return O2_FLUSH;
}
window.addEventListener('online', ()=>{ if(o2Queue().length) o2Flush().then(n=>{ if(n && typeof O2_REDRAW==='function') O2_REDRAW(); }); });
let O2_REDRAW=null;

    if(edit) h+=`<div class="o2-edit">✎ ${+edit.date.slice(5,7)}/${+edit.date.slice(8,10)} ${esc(edit.time)} の記録を直しています<button type="button" id="o2EdX">やめる</button></div>`;
    h+=`<div class="o2-card">`;
    if(DT){ const sd=edit?edit.date:(dtD||dtoday()), stt=edit?edit.time:(dtT||hhmm);
      h+=`<button class="o2-row" id="o2Dt" type="button"><span class="k">測定日時</span><span class="v">${djp(sd)} ${esc(stt)}<small>${edit?'記録の日時を直せます':(dtD?'入れた日時で記録します（「今にする」で戻せます）':'「確定」を押した時刻で記録します')}・測定方法：酸素濃度計</small></span><span class="ch">変更</span></button>`; }

      h+=`<button class="o2-row" id="o2Pl" type="button"><span class="k">測定箇所</span><span class="v">${esc(place||'（タンクを選ぶ）')}${room!==''?`<small>室温 ${room}℃（おんどとり）</small>`:''}</span><span class="ch">変更</span></button>`;
    else
      h+=`<div class="o2-row"><span class="k">測定箇所</span><span class="v">${esc(place)}</span></div>`;

        <td>${r.pend?'送信待ち':((DT&&r.id?`<button class="fix" data-fix="${esc(r.id)}">修正</button>`:'')+(r.date===td&&r.id?`<button class="del ${delId===r.id?'sure':''}" data-del="${esc(r.id)}">${delId===r.id?'取り消す':'取消'}</button>`:''))}</td></tr>`).join('')
      :`<tr><td colspan="6" style="color:var(--sub);padding:18px">この月の記録はまだありません</td></tr>`;

    if(q.length) h+=`<p class="tl-note">送信待ち ${q.length}件（電波が入ると自動で送ります）　<a href="#" id="o2Re">いま送る</a></p>`;
    if(O2_URL) h+=`<div class="o2-links"><a href="${O2_URL}?area=${area}&ym=${ym}" target="_blank" rel="noopener">🖨 印刷用の表</a>${O2.sheet?`<a href="${esc(O2.sheet)}" target="_blank" rel="noopener">スプレッドシート</a>`:''}</div>`;
    h+=DT?`<p class="tl-note">「修正」で日時・担当者・酸素濃度を直せます（前の日の分も）。取り消せるのは今日の記録だけです（取り消した内容もスプレッドシートの「取消の記録」に残ります）。換気口・防止措置の概要はスプレッドシートで直せます。</p>`
      :`<p class="tl-note">取り消せるのは今日の記録だけです（取り消した内容もスプレッドシートの「取消の記録」に残ります）。前の日の分・換気口・防止措置の概要はスプレッドシートで直せます。</p>`;

      const items=[]; for(let x=Math.round(O2_MAX*10); x>=Math.round(O2_MIN*10); x--){ const v=x/10; items.push({v, label:v.toFixed(1)+' %', sub:v===O2_DEF?'基本':''}); }

  }

  async function o2Commit(){
    if(O2.busy) return;
    if(!by){ msg='担当者を選んでください'; warn=true; draw(); return; }
    if(!place){ msg='測定箇所を選んでください'; warn=true; draw(); return; }
    if(!O2_URL){ msg='記録先の設定がまだ済んでいないため送れません'; warn=true; draw(); return; }
    const now=new Date(), nowT=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const ed=edit;
    const date=ed?ed.date:(dtD||dtoday()), time=ed?ed.time:(dtT||nowT);
    if((date+' '+time)>(dtoday()+' '+nowT)){ msg='これから先の日時は入れられません'; warn=true; draw(); return; }
    const body={ action:'o2_add', area, cid:ed?ed.id:('o2-'+now.getTime().toString(36)+'-'+Math.random().toString(36).slice(2,7)),
      date, time, method:ed?ed.method:'酸素濃度計', place, room:ed?ed.room:'', o2:val, by,
      user:rcUser(), device:(navigator.userAgent.match(/iPhone|iPad|Android|Windows|Mac/)||[''])[0] };
    if(ed) body.upsert=true;   // 同じ id の行を書き換える（Code.gs の upsert。温度・換気口・防止措置の概要はそのまま残る）
    if(!ed){ lsSet('o2.last.'+area, by); if(area!=='wash') lsSet('o2.place.'+area, place); }
    O2.busy=true; msg='送信しています…'; warn=false; O2.ym[area]=date.slice(0,7); draw();
    // 先に端末へ預ける（途中で電波が切れても消えない）
    lsSet('o2.q', o2Queue().filter(x=>x.cid!==body.cid).concat([body]));
    let ok=false;
    try{ const j=await o2Api(body,25000);
      if(j&&j.ok){ o2Store(area,j); lsSet('o2.q', o2Queue().filter(x=>x.cid!==body.cid)); ok=true; }
      else { lsSet('o2.q', o2Queue().filter(x=>x.cid!==body.cid)); msg='記録できませんでした：'+((j&&j.error)||''); warn=true; }
    }catch(e){ msg=`電波が無いため端末に預かりました（${body.time} ${by} ${val.toFixed(1)}%）。電波が入ると自動で送ります`; warn=true; }
    O2.busy=false;
    if(ok){ newId=body.cid; msg=`${ed?'直しました':'記録しました'}（${+date.slice(5,7)}/${+date.slice(8,10)} ${body.time}　${by}　${val.toFixed(1)}%）`; warn=false;
      if(ed){ const k=ed.keep; edit=null; place=k.place; by=k.by; } val=O2_DEF; dtD=''; dtT=''; }
    else if(ed && warn && /電波/.test(msg)){ const k=ed.keep; edit=null; place=k.place; by=k.by; val=O2_DEF; }
    else if(!ed && warn && /電波/.test(msg)){ dtD=''; dtT=''; }
    if(O2_REDRAW===draw && app.querySelector('#o2Ok')) draw();
  }

  draw();
  // 開いたら：預かり分を送り、最新の記録表を取る（前回の内容はすぐ表示済み）
  (async()=>{
    if(!O2_URL) return;

    if(O2_REDRAW===draw && app.querySelector('#o2Ok') && !document.querySelector('.o2-mask')) draw();
  })();
}


/* ---------- タンク洗浄管理の「洗浄」の記録を、そのまま酸素濃度測定記録（タンク洗浄シート）へ ----------
   洗浄の酸素濃度・担当・日時を入れて保存すると、同じ内容が酸素濃度測定記録にも1行残る（2026-09-30 泰広さん指示「入力は一つで」）。
   id は 'wash-<計画id>' 固定なので、あとで直して保存し直すと同じ行が書き換わる（二重に増えない）。 */
function o2FromWash(p, w){
  if(!w || !w.done || w.o2===null || w.o2===undefined || w.o2==='' || !w.by) return Promise.resolve(false);
  const now=new Date();
  const body={ action:'o2_add', upsert:true, area:'wash', cid:'wash-'+p.id,
    date:w.date||dtoday(), time:w.time||(String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')),
    method:w.method||'酸素濃度計', place:p.tank+'号タンク', room:'', o2:Number(w.o2), by:w.by,
    user:rcUser(), device:(navigator.userAgent.match(/iPhone|iPad|Android|Windows|Mac/)||[''])[0] };
  lsSet('o2.q', o2Queue().filter(x=>x.cid!==body.cid).concat([body]));   // 先に預ける
  if(!O2_URL) return Promise.resolve(false);
  return o2Flush().then(n=>n>0);
}
/* 洗浄の担当：今日の出勤表から（担当者名の一覧にいる人だけ） */
function o2WashBy(names){
  const S=o2Staff(), pick=n=>names.find(x=>o2Same(x,n));
  return (S.me && S.work.some(n=>o2Same(n,S.me)) && pick(S.me)) || (lsGet('o2.last.wash','') && S.work.some(n=>o2Same(n,lsGet('o2.last.wash',''))) && pick(lsGet('o2.last.wash',''))) || S.work.map(pick).find(Boolean) || pick(S.me) || '';
}
/* 洗浄の酸素濃度：数字を打たずに一覧（19.0〜22.0・既定20.1）から選ぶ */
function o2WashPick(){
  const inp=$('#wO2'); if(!inp) return;
  const items=[]; for(let x=Math.round(O2_MAX*10); x>=Math.round(O2_MIN*10); x--){ const v=x/10; items.push({v, label:v.toFixed(1)+' %', sub:v===O2_DEF?'基本':''}); }
  o2Pick('酸素濃度（%）を選ぶ', items, inp.value===''?O2_DEF:Number(inp.value), true).then(v=>{ if(v==null) return; inp.value=v.toFixed(1); inp.dispatchEvent(new Event('input')); const b=$('#wO2b'); if(b) b.textContent=v.toFixed(1)+' %'; });
}


/* ---------- 麹の作業日に測定していなければ知らせる（2026-09-30） ----------
   作業日＝麹管理R8BYの今日の予定に 引込・盛・出麹 のどれかがある日（koji_today）。
   測定済み＝酸素濃度測定記録の「麹室」シートに今日の行がある（端末に預かり中の分も含む）。
   ホームの「麹」の六角形には O2_ALERT_H 時をすぎたら赤い帯「O₂未測定」、麹の画面のボタンは時刻に関係なく赤。 */
const O2_ALERT_H = 9;
function o2KojiWork(date){
  const j=RC&&RC.koji&&RC.koji[date]; if(!j||!j.koji) return null;          // まだ分からない
  return j.koji.some(r=>r['引込日']===date||r['盛日']===date||r['出麹日']===date);
}
function o2Measured(area,date){
  return o2Cached(area).some(r=>String(r.date)===date) || o2Queue().some(x=>x.area===area&&x.date===date);
}
function o2KojiMissing(){ const d=dtoday(); return o2KojiWork(d)===true && !o2Measured('koji',d); }
function o2KojiAlert(){ return new Date().getHours()>=O2_ALERT_H && o2KojiMissing(); }
/* 裏で「今日の麹の予定」と「麹室の記録」を取り直し、変わったら表示を直す */
let O2_KCHK=null;
function o2KojiRefresh(){
  if(O2_KCHK) return O2_KCHK;
  O2_KCHK=(async()=>{
    const before=o2KojiMissing(), d=dtoday();
    try{
      if(!(RC.koji&&RC.koji[d])){
        let r=null;
        try{ const c=await PC.get(recKey({action:'koji_today',date:d})); if(c&&c.s) r=JSON.parse(c.s); }catch(e){}
        if(!r){ try{ r=await recApi({action:'koji_today',date:d},40000); }catch(e){} }
        if(r&&r.ok) RC.koji[d]=r;
      }
      if(O2_URL && o2KojiWork(d) && Date.now()-(O2.at.koji||0)>3*60000){
        if(o2Queue().length) await o2Flush();
        try{ const j=await o2Api({action:'o2_get',area:'koji'},25000); if(j&&j.ok) o2Store('koji',j); }catch(e){}
      }
    }catch(e){}
    O2_KCHK=null;
    if(o2KojiMissing()!==before){
      const b=document.querySelector('.o2-open[data-o2="koji"]');
      if(b){ const t=document.createElement('div'); t.innerHTML=o2Btn('koji',b.classList.contains('o2-ic')?{icon:1}:null); b.replaceWith(t.firstElementChild); }
      if(app.querySelector('.hx') && nav[nav.length-1]===home) go(home,false);
    }
  })();
  return O2_KCHK;
}
/* ホームを描いたら裏で確かめる（ホームの描き直しは、状態が変わったときだけ） */
(function(){
  const _h=home;
  home=function(){ const r=_h.apply(this, arguments); setTimeout(()=>{ try{ o2KojiRefresh(); }catch(e){} }, 1500); return r; };
  for(let i=0;i<nav.length;i++){ if(nav[i]===_h) nav[i]=home; }

})();

/* ---- 折れ線（左軸・右軸の2本まで。今日の縦線つき） ---- */
function shChart(n, labels, series, todayIdx){
  const W=360,H=160,L=34,R=34,T=12,B=26, pw=W-L-R, ph=H-T-B;
  const x=i=>L+(n<=1?pw/2:pw*i/(n-1));
  const rng=vals=>{ const a=vals.filter(v=>v!==null); if(!a.length) return null; let lo=Math.min(...a), hi=Math.max(...a); if(hi-lo<1){ lo-=0.5; hi+=0.5; } const p=(hi-lo)*0.08; return [lo-p,hi+p]; };
  let g=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#faf8f2"/><!--B-->`;
  if(todayIdx>=0&&todayIdx<n) g+=`<line x1="${x(todayIdx)}" y1="${T}" x2="${x(todayIdx)}" y2="${T+ph}" stroke="#d8a100" stroke-width="1.5"/><text x="${x(todayIdx)+3}" y="${T+10}" font-size="10" fill="#9a7400">今日</text>`;
  const step=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i+=step) g+=`<text x="${x(i)}" y="${H-12}" font-size="9" fill="#6b7280" text-anchor="middle">${labels[i]}</text>`;
  let leg='', lx=L;
  const grp={}; series.forEach(s=>{ const k=s.axis; (grp[k]=grp[k]||[]).push(...s.vals,...(s.pm||[])); });
  const xc=v=>Math.max(L,Math.min(L+pw,v)), off=n<=1?pw/6:pw/(n-1)/4;  /* 2026-10-05 品温AM→PMを1本の線に */
  series.forEach(s=>{
    if(!s.vals.some(v=>v!==null)&&!(s.pm&&s.pm.some(v=>v!==null))) return;
    const r=rng(grp[s.axis]); if(!r) return;
    const y=v=>T+ph-(v-r[0])/(r[1]-r[0])*ph;
    const ax=s.axis==='R'?W-R+3:L-3, anc=s.axis==='R'?'start':'end';
    if(s.std){ let d=''; s.vals.forEach((v,i)=>{ if(v===null) return; d+=(d?' L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); });

  });
  return `<div class="sh-chart"><svg viewBox="0 0 ${W} ${H+4}" width="100%" role="img" aria-label="経過グラフ">${g}${leg}</svg></div>`;

/* 2026-10-10 泰広さん指示：酒母の仕込尺を入れたら、仕込量（L）を自動で入れる。
   酒母タンク（仕込マスタの shuboT）の容量早見表（tanks.json・空積寸）で引く。R7BY の分析酒母シートの 仕込尺→仕込量 と全数一致を確認済み。
   照合できていない容器（blocked／checked なし）・早見表に無い容器・範囲外は入れない（税務に関わるので概算禁止）。量を手で直すのは自由（尺を変えるとまた入る） */
async function shAutoRyo(m){
  const sk=$('#sh_shaku'), ry=$('#sh_ryo'); if(!sk||!ry) return;
  const lab=ry.closest('.rc-f'); let note=lab&&lab.querySelector('.sh-auto');
  if(lab&&!note){ note=document.createElement('small'); note.className='sh-auto'; note.style.cssText='display:block;font-size:11px;color:var(--sub);margin-top:2px'; lab.appendChild(note); }
  const say=(t,ok)=>{ if(note){ note.textContent=t; note.style.color=ok?'#1d6b45':'#a0610b'; } };
  const tno=m&&m.shuboT;
  if(!tno){ say('酒母タンク未設定のため、量は自動で入りません'); return; }
  try{ await loadTanks(); }catch(e){}
  const t=tankByNo(tno);
  if(!t){ say(`T${tno} は容量早見表に無いため、量は手で入れてください`); return; }
  if(t.verify||t.blocked||!t.checked){ say(`T${tno} は早見表が照合できていない容器のため計算しません（造りexで確認）`); return; }
  const calc=()=>{ const mm=pnum(sk.value); if(mm===null){ say(`尺を入れると T${tno} の早見表から量が入ります`,true); return; }
    const v=volAt(t,mm);
    if(v===null){ say(`尺 ${mm}mm は T${tno} の早見表の範囲外です`); return; }
    ry.value=Math.round(v); FAST.dirty=true; say(`T${tno} 早見表：尺 ${mm}mm → ${Math.round(v)} L（自動）`,true); };
  sk.addEventListener('input',calc);
  if(pnum(sk.value)!==null && String(ry.value).trim()==='') calc(); else say(`尺を入れると T${tno} の早見表から量が入ります`,true);
}
/* 酒母の入力（今までの画面を差し替え：品温 午前・午後、仕込時の値） */
shuboInput = async function(no, day, focus){
  const m=rcMaster(no)||{};
  head(`酒母 順号 ${no}　${m.shuboSym||m.sym||''}`, `${m.liquid||''}　${m.shuboT?'T'+m.shuboT:'酒母タンク未設定'}　酵母 ${m.yeast||'—'}`);
  let s=RC.shubo[no];
  if(!s){ rcLoading('酒母経過を読み込んでいます…'); try{ const r=await recApi({action:'shubo_get',no},40000); if(r&&r.ok){ s=r; RC.shubo[no]=r; } }catch(e){} }
  if(!s){ rcFail(); return; }
  const dToday=rcShuboDay(m,dtoday());
  const has=d=>{ const x=s.days[d-1]; return x&&(x.temp!==''||x.tPM!==''&&x.tPM!==undefined||x.be!==''||x.ta!==''||x.alc!==''||x.biko); };
  if(!day) day=Math.min(13,Math.max(1,dToday||1));
  const D=s.days[day-1], u=s.setup||{}, miss=shSetupMissing(s);
  const defs=[['temp','品温 午前 ℃'],['tPM','品温 午後 ℃'],['be','Be（ボーメ）'],['ta','酸度'],['alc','alc %'],['biko','備考',{type:'text'}]];
  const setupCard=`<div class="card" id="shSetCard" style="${miss.length?'border:2px solid var(--ng)':''}"><b style="font-size:15px">仕込時の値</b> <span class="muted" style="font-size:12px">${miss.length?'<b style="color:var(--ng)">必須・未入力あり</b>':'入力済み'}</span>
      <div class="rc-grid" style="margin-top:8px">${SH_SETUP.map(([f,l,un,st])=>rcField('sh_'+f,`${l} ${un}`,u[f],{step:st})).join('')}</div>
      <div class="rc-actions"><button class="rc-btn" id="shSetSave">仕込時の値を保存</button></div></div>`;
  const dayCard=`<div class="card"><b style="font-size:16px">${day}日目　${djp(D.date)}</b>
      <div class="rc-grid" style="margin-top:8px">${defs.map(([f,l,o])=>rcField('rc_'+f,l,D[f],o)).join('')}</div>
      <div class="rc-status" id="rcStatus"></div>
      <div class="rc-actions"><button class="rc-btn" id="rcSave">保存</button></div></div>`;
  app.innerHTML=`<div class="rc-days" id="rcDays">${s.days.map(x=>`<button data-d="${x.day}" class="${x.day===day?'on':(has(x.day)?'has':'')}">${x.day}日<small>${rcMD(x.date)}</small></button>`).join('')}</div>
    ${(miss.length||focus==='setup')?setupCard+dayCard:dayCard+setupCard}
    <div class="card"><div class="rc-grid">${rcField('rc_moto','酛卸日',s.motooroshi,{type:'date',hint:s.motooroshiPlan?'予定 '+rcMD(s.motooroshiPlan):''})}${rcField('rc_biko2','酒母の備考',s.biko,{type:'text'})}</div>
      <div class="rc-actions"><button class="rc-btn" id="rcSave2">酛卸日・備考を保存</button></div></div>
    <p class="tl-note">経過の表・グラフは前の画面（酒母 → 順号）で見られます。乳酸 ${esc(m.nyusan||(s.head&&s.head.nyusan)||'—')}ml。</p>`;
  const dv=$('#rcDays'); const on=dv.querySelector('.on'); if(on) dv.scrollLeft=Math.max(0,on.offsetLeft-dv.clientWidth/2+30);
  dv.querySelectorAll('button').forEach(x=>x.onclick=()=>shuboInput(no,Number(x.dataset.d)));
  if(focus==='setup'){ const c=$('#shSetCard'); if(c) c.scrollIntoView({block:'start'}); }
  shAutoRyo(m);   // 2026-10-10 仕込尺 → 仕込量（酒母タンクの容量早見表）
  const again=()=>{ RC.shubo[no]=null; setTimeout(()=>shuboInput(no,day),400); };
  $('#shSetSave').onclick=async()=>{
    const setup={}; SH_SETUP.forEach(([f])=>{ const v=$('#sh_'+f).value; if(!rcSame(v,u[f])) setup[f]=v; });
    const after=SH_SETUP.filter(([f])=>(f in setup?setup[f]:u[f])===''||(f in setup?setup[f]:u[f])==null).map(x=>x[1]);
    if(!Object.keys(setup).length){ rcStatus(after.length?'未入力：'+after.join('・'):'変わったところがありません',!!after.length); return; }
    /* 2026-10-06：画面を閉じて裏で送る */
    s.setup=Object.assign(s.setup||{},setup); recSaveBg({action:'shubo_save',no,setup},`酒母 順号${no} 仕込時の値`); hBack.click(); return;
    $('#shSetSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'shubo_save',no,setup},40000);
      if(res&&res.ok){ rcStatus(after.length?'保存しました（まだ未入力：'+after.join('・')+'）':'仕込時の値を保存しました',!!after.length); again(); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#shSetSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#shSetSave').disabled=false; }
  };
  $('#rcSave').onclick=async()=>{
    if(miss.length){ rcStatus('先に「仕込時の値」（'+miss.join('・')+'）を入れて保存してください',true); const c=$('#shSetCard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const values={}; defs.forEach(([f])=>{ const v=$('#rc_'+f).value; if(!rcSame(v,D[f])) values[f]=v; });
    if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    Object.assign(D,values); recSaveBg({action:'shubo_save',no,day,values},`酒母 順号${no} ${day}日目`); hBack.click(); return;   // 2026-10-06：画面を閉じて裏で送る
    $('#rcSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'shubo_save',no,day,values},40000);
      if(res&&res.ok){ rcStatus(`${day}日目 を保存しました`); again(); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#rcSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#rcSave').disabled=false; }
  };
  $('#rcSave2').onclick=async()=>{
    const body={action:'shubo_save',no}; const mo=$('#rc_moto').value, bk=$('#rc_biko2').value;
    if(mo!==(s.motooroshi||'')) body.motooroshi=mo; if(bk!==(s.biko||'')) body.biko=bk;
    if(!('motooroshi' in body)&&!('biko' in body)){ rcStatus('変わったところがありません'); return; }
    s.motooroshi=mo; s.biko=bk; recSaveBg(body,`酒母 順号${no} 酛卸日・備考`); hBack.click(); return;   // 2026-10-06：画面を閉じて裏で送る
    rcStatus('保存中…');
    try{ const res=await recApi(body,40000); if(res&&res.ok){ s.motooroshi=mo; s.biko=bk; rcStatus('保存しました'); RC.shubo[no]=null; } else rcStatus('保存できませんでした: '+(res&&res.err||''),true); }
    catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); }
  };
};

function moromiSetupTable(b){
  const S=b.setup||{}, today=dtoday();
  const cell=(st,f)=>{ const v=shN((S[st]||{})[f]); return v===null?'':shF(v,/shaku|ryo|kumi|kori/.test(f)?0:1); };

  const rows=[['尺','shaku'],['量','ryo'],['汲水','kumi'],['氷','kori'],['水麹','mizukoji'],['蒸米','mushi'],['品温','hin'],['Be','be'],['酸度','ta'],['ｱﾐﾉ','aa']];
  rows.forEach(([l,f])=>{
    h+=`<tr><td class="k">${l}</td>${MR_STAGES.map(([st])=>{ const ok=st==='odori'?MR_ODORI.some(x=>x[0]===f):MR_SETUP.some(x=>x[0]===f);

  return h+`</table></div></div>`;
}
async function moromiSetup(no, st){
  const m=rcMaster(no)||{}, L=(MR_STAGES.find(x=>x[0]===st)||[])[1]||st;
  head(`順号 ${no}　${L}の仕込み時`, `${m.liquid||''}　T${m.tank||''}　（分析醪シートの ${L} 列）`);
  let b=RC.bun[no];
  if(!b){ rcLoading('読み込んでいます…'); try{ const r=await recApi({action:'bunseki_get',no},40000); if(r&&r.ok){ b=r; RC.bun[no]=r; } }catch(e){} }
  if(!b){ rcFail(); return; }
  const S=(b.setup||{})[st]||{}, defs=st==='odori'?MR_ODORI:MR_SETUP;
  app.innerHTML=`<div class="rc-tabs">${MR_STAGES.map(([k,l])=>`<button class="${k===st?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="card"><b style="font-size:16px">${L}　${S.date?djp(S.date):''}</b>
      <div class="rc-grid" style="margin-top:8px">${defs.map(([f,l,un,step])=>rcField('mr_'+f,`${l}${un?' '+un:''}`,S[f],{step})).join('')}</div>
      <div class="rc-status" id="rcStatus"></div>
      <div class="rc-actions"><button class="rc-btn" id="mrSave">保存</button></div></div>
    <p class="tl-note">${st==='odori'?'踊は添の翌日の分析（Be・酸度・アミノ酸度・品温）。':'尺＝仕込み後の尺(mm)、量＝容量(L)。汲水は計画値が最初から入っています（実際と違えば直す）。'}${st==='tome'?'留の品温は、醪の「留（1日目）」の品温と同じ欄です。':''}</p>`;
  app.querySelectorAll('.rc-tabs button').forEach(x=>x.onclick=()=>moromiSetup(no,x.dataset.t));
  $('#mrSave').onclick=async()=>{
    const values={}; defs.forEach(([f])=>{ const v=$('#mr_'+f).value; if(!rcSame(v,S[f])) values[f]=v; });
    if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    b.setup=b.setup||{}; b.setup[st]=Object.assign({},S,values); recSaveBg({action:'bunseki_save',no,setup:{stage:st,values}},`仕込み 順号${no} ${L}の仕込み時`); hBack.click(); return;   // 2026-10-06：画面を閉じて裏で送る
    $('#mrSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'bunseki_save',no,setup:{stage:st,values}},50000);
      if(res&&res.ok){ if(res.all) RC.bun[no]=res.all; else RC.bun[no]=null; rcStatus(`${L} を保存しました`); setTimeout(()=>moromiSetup(no,st),400); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#mrSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#mrSave').disabled=false; }
  };
}

  else if(kd&&kd.n) li=String(kd.n).split(/[\/／]/).map(s=>s.trim()).filter(Boolean).map(s=>`<li>${esc(s)} <small>（出勤表の備考）</small></li>`).join('');
  if(!li) return `<div class="dp-cal"><div style="color:var(--sub);font-size:12px">${ev||!O2_URL?(DP_OFF===0?'今日':DP_OFF===1?'明日':'この日')+'の予定はありません':'読み込んでいます…'}</div></div>`;
  return `<div class="dp-cal"><ul>${li}</ul>${more}</div>`;   // 2026-10-06 泰広さん指示：「カレンダーの予定」の見出しは出さない
}

/* ---- ホーム全体（home() から呼ばれる。六角形の代わりに角丸アイコン） ---- */
function dpHome(hexes){
  const ic=x=>{ const lb=String(x.lb).replace(/<br>/g,'').replace('<span class="sm">','<small>').replace('</span>','</small>');
    const bg=`background:linear-gradient(160deg,${x.c[0]},${x.c[1]})`;
    const inner=`<span class="ico" style="${bg}">${x.e}</span><span class="lb">${lb}</span>${x.n?`<span class="n">${x.n}</span>`:''}${x.tag?`<span class="tg">${x.tag}</span>`:''}`;
    return x.href?`<a class="dp-ic" href="${x.href}">${inner}</a>`:`<button type="button" class="dp-ic" id="${x.id}">${inner}</button>`; };

/* 角丸アイコンを押した回数（先読みの順番づけ。六角形のときと同じ記録） */
document.addEventListener('click', e=>{

  try{ const href=el.getAttribute('href')||''; const k=HOME_KEYS[el.id]||(href.indexOf('seishu-jiten')>=0?'jiten':href.indexOf('voice')>=0?'voice':''); if(k) useAdd('f',k); }catch(x){}
}, true);

/* ---- 裏で最新を取り、予定の枠だけ描き直す ---- */
let DP_TICK=null;
function dpRedraw(){ const p=document.getElementById('dpPlan'), c=document.getElementById('dpCal'), k=document.getElementById('dpKn'), me=document.getElementById('dpMe'); if(p) p.innerHTML=dpPlanHTML(); if(me&&typeof dpMeHTML==='function') me.innerHTML=dpMeHTML(); if(k) k.innerHTML=dpKinmuHTML(); if(c) c.innerHTML=dpCalHTML(); }
function dpAfterHome(){
  if(!document.getElementById('dpBox')) return;
  clearInterval(DP_TICK); DP_TICK=setInterval(()=>{ if(document.getElementById('dpBox')) dpRedraw(); else clearInterval(DP_TICK); }, 60000);
  dpLoad(dpDate());
}
const DP_LOADING={};
function dpLoad(d){
  if(DP_LOADING[d]) return DP_LOADING[d];
  return DP_LOADING[d]=(async()=>{
    const tasks=[];
    if(!(RC.koji&&RC.koji[d])) tasks.push((async()=>{ let r=null;
      try{ const c=await PC.get(recKey({action:'koji_today',date:d})); if(c&&c.s) r=JSON.parse(c.s); }catch(e){}
      if(!r){ try{ r=await recApi({action:'koji_today',date:d},40000); }catch(e){} }
      if(r&&r.ok) RC.koji[d]=r; })());
    if(!RC.state || Date.now()-(RC.at||0)>5*60000) tasks.push(recState(false).catch(()=>{}));
    const cm=lsGet('dp.cal2',{})||{}, c=cm[d];
    if(O2_URL && !(c&&Date.now()-(c.at||0)<10*60000)) tasks.push((async()=>{ try{ const j=await o2Api({action:'cal_day',date:d},20000);
      if(j&&j.ok&&j.events){ const m=lsGet('dp.cal2',{})||{}; Object.keys(m).forEach(k=>{ if(k<dtoday()) delete m[k]; }); m[d]={events:j.events,at:Date.now()}; lsSet('dp.cal2',m); } }catch(e){} })());
    await Promise.all(tasks);
    if(!(MFG&&MFG.shukkin) && typeof mfgRefresh==='function' && ST.token) { try{ await mfgRefresh(); }catch(e){} }
    delete DP_LOADING[d];
    if(dpDate()===d) dpRedraw();
  })();
}
document.addEventListener('click', e=>{

  if(e.target.closest && e.target.closest('[data-dpcalall]')){ DP_CALALL=!DP_CALALL; dpRedraw(); return; }
  const b=e.target.closest && e.target.closest('[data-dpd]'); if(!b) return;
  DP_OFF=+b.dataset.dpd; DP_DLOPEN=false; DP_CALALL=false; dpRedraw(); dpLoad(dpDate());
});
/* ツールの読み込み前に描かれたホーム（六角形）を、角丸の形で描き直す */
try{ if(ST && ST.token && typeof app!=='undefined' && app.querySelector('.hx') && !document.getElementById('dpBox') && nav[nav.length-1]===home) go(home,false); }catch(e){}

<script>
/* ================= 🍶 仕込み：仕込中・醪中・予定（上槽済は別ページ）＋ 汲水・酵素剤（2026-10-02） =================
   泰広さん指示：ホーム→仕込み の中の酒母は削除。仕込んでいるものから表示、上槽済は別ページ。
   仕込んでいなくても予定はすべて表示。汲水・酵素剤などは間違えないように表示。
   ・一覧：①きょうの仕込み（添・仲・留の汲水・麹・掛、きょう入れる資材）を大きく ②仕込中（添〜留の前）③醪中 ④予定（全部）⑤上槽済 › 別ページ
   ・1本の画面（moromiSheet）の上に「仕込み配合（計画）」：添・仲・留・四段の 麹kg・掛kg・汲水L、追水・アル添、資材（名前・量・入れる日）
   ・データ：醸造記録 R8BY の state（仕込み一覧_追加.gs で master に kg・kumi、shizai＝資材予定 を足す）
   ・酵素剤：液種マスタ（醪管理R8BY）。普通酒系＝スミチームSG（留）、純米系＝グルク吟・チアミン・フェルメイドK（留）、四段＝マグナックス1
   控え：seishu-workbook_github\_src_shikomi.js（index.html の <!-- /tools --> の直前に入っている）
   ======================================================================== */
const SHK_CSS=`
.shk-sec{display:flex;align-items:baseline;gap:8px;margin:16px 2px 6px;font-weight:800;color:var(--navy);font-size:15px}
.shk-sec small{font-weight:400;color:var(--sub);font-size:12px}
.shk-today{background:#fffaf0;border:2px solid #d8b43c;border-radius:14px;padding:8px 10px 10px;margin:10px 0 4px}
.shk-today>.t{display:flex;align-items:baseline;gap:8px;font-weight:800;color:var(--navy);font-size:15px;margin-bottom:6px}
.shk-today>.t small{font-weight:400;color:var(--sub);font-size:12px}
.shk-tabs{display:flex;gap:6px;margin:0 0 8px}
.shk-tabs button{flex:1;border:1px solid var(--line);background:#faf7ef;border-radius:999px;padding:6px 0;font-family:inherit;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.shk-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.shk-ev{display:block;width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-left:6px solid #5a8fd0;border-radius:10px;padding:8px 10px;margin:0 0 8px;font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.shk-ev.s-添{border-left-color:#6aa84f}.shk-ev.s-仲{border-left-color:#d8b43c}.shk-ev.s-留{border-left-color:#c0392b}.shk-ev.s-四段{border-left-color:#8a6cc8}.shk-ev.s-アル添{border-left-color:#9a8a70}
.shk-ev .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.shk-ev .stg{font-size:20px;font-weight:900;color:var(--navy);min-width:2.2em}
.shk-ev .nm{font-size:14px;font-weight:700}
.shk-ev .nm small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.shk-ev .kumi{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;padding:4px 8px;background:#e7f0fb;border-radius:8px}

.shk-ev .kumi b{font-size:26px;font-weight:900;color:#103e74;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.shk-ev .kumi span{font-size:14px;font-weight:700;color:#103e74}
.shk-ev .kg{font-size:13px;color:var(--ink);margin:2px 0}
.shk-zai{margin:6px 0 0;padding:0;list-style:none}
.shk-zai li{display:flex;align-items:baseline;gap:6px;padding:4px 8px;margin:3px 0;background:#fdf1e6;border:1px solid #e9b07a;border-radius:8px;font-size:14px}
.shk-zai li b{margin-left:auto;font-size:19px;font-weight:900;color:#8a3c00;font-variant-numeric:tabular-nums}
.shk-zai li span{font-size:12px;color:#8a3c00;font-weight:700}
.shk-zai li small{font-size:11px;color:var(--sub)}
.shk-none{color:var(--sub);font-size:13px;text-align:center;padding:8px 0}
.shk-row{width:100%;display:grid;grid-template-columns:6px 54px 1fr auto;gap:0 8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 0;margin-bottom:7px;font-family:inherit;color:inherit;text-align:left;cursor:pointer;overflow:hidden}
.shk-row .st{align-self:stretch;background:#d8d2c2;border-radius:0 3px 3px 0}
.shk-row.on .st{background:#d8b43c}
.shk-row .id{font-weight:800;color:var(--navy);font-size:17px;line-height:1.1}
.shk-row .id small{display:block;font-size:10px;color:var(--sub);font-weight:400}
.shk-row .mid{font-size:13px;line-height:1.35;min-width:0}
.shk-row .mid small{display:block;font-size:11px;color:var(--sub)}
.shk-row .r{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.shk-row .r b{display:block;font-size:14px;color:var(--navy)}
.shk-row .r b.hot{color:#c0392b}
.shk-mix{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px;margin:0 0 10px}
