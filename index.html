<script>
/* ================= 🍶 仕込み：表（経過の表）にそのまま入力（2026-10-12） =================
   泰広さん指示：仕込みの表を表示したときに、そのまま入力できるようにして。
   ・🍶仕込み の「📋 表」（仕込中・醪中の経過の表）で、留〜きょうの列の Be/度・alc・酸・ｱﾐﾉ・追水・品温AM・品温PM のマスが入力欄になる
     （留の日は 品温AM だけ。今までの入力画面 moromiInput と同じ決まり。BMD は計算なので入力しない）
   ・しくみは 🧫酒母の表（2026-10-05）と同じ：入れたマス＝黄色の枠（未保存）→ 下の「保存」でまとめて裏で送る（bunseki_save を 醪×日 ごと）
     Enter で同じ日の下のマスへ。数字でない＝赤枠（保存させない）、ありえない値＝橙枠（保存のとき確認）
   ・推奨追水・警告は今までどおり、送れたあと画面の下に赤い知らせで出る（recAfterSave）
   ・担当者外の確認（🛡）と分析者（共用端末）も 仕込みの表に効かせる
   ・酒母の表（zennen の KGE）の関数をそのまま使い、未保存の値は酒母とは別に持つ（同じ順号どうしで混ざらないように）
   ・zennen 側は変更なし。kgBox・kgMoromiRows・kgeSave を外側から包む
   控え：seishu-workbook_github\_src_shkedit.js（index.html の shkedit の目印の間） */
const MKE={ dirty:{}, draw:null, sDraw:null, sDirty:null, mode:'' };
const MKE_KEYS={be:1,alc:1,ta:1,aa:1,oimizu:1,tAM:1,tPM:1};
const kgFieldsMoromiNow=[['日付',d=>d.date?rcMD(d.date):'','dt'],['Be/度',d=>kgN(d.sm,1),'','be'],['alc',d=>kgN(d.alc,1),'','alc'],['酸',d=>kgN(d.ta,1),'','ta'],['ｱﾐﾉ',d=>kgN(d.aa,1),'','aa'],['追水',d=>kgN(d.oimizu,0),'','oimizu'],['品温AM',d=>kgN(d.tAM,1),'','tAM'],['品温PM',d=>kgN(d.tPM,1),'','tPM'],['BMD',d=>kgN(d.bmd,1)]];
try{ Object.assign(KGE_RANGE,{tAM:[0,40,'品温AM'],oimizu:[0,3000,'追水']}); }catch(e){}
/* 醪の行：日々の生の値（_r）と、入力できる日（留〜きょう）を足す */
(function(){
  const o=window.kgMoromiRows; if(typeof o!=='function') return;
  window.kgMoromiRows=function(list, today, T){
    const rows=o.apply(this, arguments);
    rows.forEach(r=>{ const b=RC.bun[r.no];
      (r.days||[]).forEach(d=>{ const D=b&&b.days&&b.days[d.day-1]; if(D) d._r=D; });
      r.edit=!!(b&&b.days); r.edMax=Math.min(r.today||0, (b&&b.days)?b.days.length:0); r.noAna=1; });
    MKE.args=[list, today, T];
    return rows; };
})();
/* 表を描くとき：仕込みの経過の表（.kg-home かつ 🍶仕込み）なら入力できる形で描く */
(function(){
  const o=window.kgBox; if(typeof o!=='function') return;
  window.kgBox=function(box, fields, rows, opt, open){
    const isM = fields===kgFieldsMoromi && box && box.classList && box.classList.contains('kg-home') && !!document.getElementById('kgHd');
    if(isM){
      if(MKE.mode!=='m'){ MKE.sDirty=KGE.dirty; KGE.dirty=MKE.dirty; if(KGE.draw!==MKE.draw) MKE.sDraw=KGE.draw; MKE.mode='m'; }
      box.dataset.mk='1';
      MKE.draw=()=>{ if(!document.body.contains(box)||!MKE.args) return; window.kgBox(box, kgFieldsMoromi, kgMoromiRows(...MKE.args), opt, open); };
      KGE.draw=MKE.draw;
      const r=o.call(this, box, kgFieldsMoromiNow, rows, {...opt, edit:true, note:'マスに直接入力 → 下の「保存」。左の順号を押すと1本の画面'}, open);
      mkeAfter(box);
      return r;
    }
    if(opt&&opt.edit&&MKE.mode==='m'){ MKE.dirty=KGE.dirty; KGE.dirty=MKE.sDirty||{}; if(KGE.draw===MKE.draw&&MKE.sDraw) KGE.draw=MKE.sDraw; MKE.mode='s'; }
    return o.apply(this, arguments);
  };
})();
/* 留の日は品温AMだけ（追水・品温PM の入力欄を外す）。見た目は今までの仕込みの表のまま（酒母の表の大きな順号にしない） */
function mkeAfter(box){
  const t=box.querySelector('.kg-t'); if(t) t.classList.add('mk');
  box.querySelectorAll('.kg-i[data-day="1"]').forEach(el=>{ if(el.dataset.k==='tAM') return;
    const td=el.closest('td'), v=kgN(el.defaultValue, el.dataset.k==='oimizu'?0:1); el.remove();
    if(td){ td.classList.remove('in'); if(v) td.insertAdjacentHTML('beforeend', `<span>${esc(v)}</span>`); } });
  if(typeof kgeBar==='function') kgeBar(box);
}
/* 保存（仕込みの表）：醪×日 ごとに bunseki_save を裏で送る */
(function(){
  const o=window.kgeSave; if(typeof o!=='function') return;
  window.kgeSave=function(box){ if(box&&box.dataset&&box.dataset.mk) return mkeSave(box); return o.apply(this, arguments); };
})();
function mkeSave(box){
  const ins=[...box.querySelectorAll('.kg-i')].filter(el=>!el.disabled&&kgeChanged(el)&&MKE_KEYS[el.dataset.k]);
  if(!ins.length){ kgeSay(box,'変わったところがありません'); return; }
  const lab=el=>el.getAttribute('aria-label')||'';
  const bad=ins.filter(el=>kgeCheck(el)==='bad');
  if(bad.length){ kgeSay(box,'数字になっていないマス：'+bad.map(lab).slice(0,4).join('、'),true); bad[0].focus(); return; }
  const warn=ins.filter(el=>kgeCheck(el)==='warn');
  if(warn.length && !window.confirm(`ありえない値かもしれません。\n${warn.map(el=>`・${lab(el)}：${el.value}`).slice(0,10).join('\n')}\n\nこのまま保存しますか？`)) return;
  const G={};
  ins.forEach(el=>{ const no=el.dataset.no, day=Number(el.dataset.day), k=el.dataset.k;
    const v=el.value.trim(), val=v===''?'':String(pnum(v));
    const g=(G[no+'|'+day]=G[no+'|'+day]||{no,day,values:{},els:[]}); g.values[k]=val; g.els.push(el); });
  const list=Object.values(G);
  const nm=g=>`仕込み 順号${g.no} ${g.day===1?'留':g.day+'日目'}`;
  list.forEach(g=>{ const b=RC.bun[g.no], D=b&&b.days&&b.days[g.day-1]; if(D) Object.assign(D,g.values);
    g.els.forEach(el=>{ delete KGE.dirty[kgeKey(el)]; });
    recSaveBg({action:'bunseki_save',no:g.no,day:g.day,values:g.values}, nm(g), true); });
  rcToast(`${list.length}か所 を裏で保存しています。ほかの作業に移ってOKです`);
  kgeSay(box,`保存を受け付けました（${list.map(nm).join('、')}）。裏で送っています`);
  if(MKE.draw) MKE.draw();
}
/* 担当者外の確認（🛡）と分析者（共用端末）を 仕込みの表にも（guard と同じやり方） */
(function(){
  const o=window.moromiHome; if(typeof o!=='function') return;
  window.moromiHome=function(...a){
    try{ IG.kind='moromi'; IG.top=nav[nav.length-1]; if(!RC.state) try{ recState(false); }catch(e){} IA_ON=true; }catch(e){}
    const top=nav[nav.length-1]; const r=o.apply(this,a);
    const after=()=>{ try{ if(nav[nav.length-1]===top){ igBanner(); IA_ON=true; iaBar(); } }catch(e){} };
    if(r&&typeof r.then==='function') r.then(after); else after();
    return r; };
})();
(function(){ const s=document.createElement('style'); s.textContent=`
.kg-t.ed.mk .n b{display:inline;font-size:13px;line-height:inherit;font-weight:700}
.kg-t.ed.mk .f{font-size:11px;letter-spacing:0}`; document.head.appendChild(s); })();
/* ================= 🍶 仕込み：仕込み時の尺を入れたら量（L）を自動で（2026-10-12） =================
   泰広さん指示：仕込みの尺を入れたら量も自動で出るように。酒母と同じ仕組み（shAutoRyo：容量早見表 tanks.json・空積寸、1L単位で四捨五入）。
   ・仲・留：醪タンク（仕込マスタの tank）の早見表で引く。R7BY 分析醪の 仲・留 の 尺→量 は全部一致（167件。T252 は照合できていない容器なので除く）
   ・添（2026-10-12 泰広さん指示）：伝辛・超辛・純米辛口 は添もそのまま大きいタンク（醪タンク）で仕込む → 醪タンクで自動。
     それ以外は 284・285 または酒母のタンクで添を仕込む（翌日に踊り返しで醪タンクへ）→「添のタンク」を T284／T285／酒母タンク から選ぶ（手でも入れられる）。
     選んだ番号は端末に覚える（mr.soeT）
   ・照合できていない容器・早見表に無い容器・範囲外は入れない（税務に関わるので概算しない）。量を手で直すのは自由（尺を変えるとまた入る）
   ・踊は尺・量が無いので対象外。moromiSetup を外側から包む */
function mrAutoRyo(m, no, st){
  const sk=$('#mr_shaku'), ry=$('#mr_ryo'); if(!sk||!ry) return;
  const lab=ry.closest('.rc-f'); let note=lab&&lab.querySelector('.sh-auto');

      if(A&&A.alone){ const mo=out.find(x=>x.lane==='shubo'&&String(x.label).indexOf('酛卸')===0);

        const mo=out.find(x=>x.lane==='shubo'&&String(x.label).indexOf('酛卸')===0); if(mo&&mo.d&&mo.d.lines) mo.d.lines.unshift('⚠ 注意：踊り返しと合わせて1人で行う日です（13:00〜 約2時間）'); }

<script>

   泰広さん指示：酒母と仕込みの上部に「配合表」アイコンを追加。仕込み配合が参照できるように。
   配合表を変えるときがあるので、何月何日改定と小さな字でいいので確認できるように。
   ・もと：会社PCの Desktop\AI参照データ\造りex\仕込み配合 にある、更新日時がいちばん新しいファイル（造りex「醪仕込製造方法」の書き出し）

     → アプリは mfg_lib（ログインした人だけ）で受け取る。GitHub（公開）には配合を置かない
   ・改定日＝そのファイルの更新日（自動）。中身が前の版と同じなら改定に数えない。前の版から変わった数字は黄色（押すと前の値）
   ・記号ごとに 酒母・初添・仲添・留添・追水・四段 × 総米・掛米（蒸米）・麹米・汲水・酵素剤・アルコール。仕込中・予定の記号に印
   ・ライブラリ（酵母・麹情報）の一覧には出さない（libItems から外す）
   控え：seishu-workbook_github\_src_haigo.js（index.html の haigo の目印の間） */
const HG={ kind:'moromi', sym:'', all:false };
const hgN=s=>String(s==null?'':s).replace(/[\s　]/g,'');
const HG_COLS=['酒母','初添','仲添','留添','水','四段','酒母四段','ｱﾙｺｰﾙ','計'];
const HG_COLNAME={'水':'追水','ｱﾙｺｰﾙ':'アル添'};
const HG_ROWS=[['総米','総米','kg'],['蒸米','掛米','kg'],['麹米','麹米','kg'],['水','汲水','L'],['酵素剤','酵素剤','g'],['アル','アルコール','L']];
/* 造りex「清酒の１仕込製造方法」（記号ごとに1ブロック）を読む。cells＝[[行,列,値]…]（0はじまり） */
function hgParse(cells){
  const g={}; (cells||[]).forEach(([r,c,v])=>{ (g[r]=g[r]||{})[c]=v; });
  const R=Object.keys(g).map(Number).sort((a,b)=>a-b);
  const starts=R.filter(r=>hgN(g[r][0])==='記号' && hgN(Object.values(g[r]).join('')).indexOf('仕込区分')>=0);
  const out=[];
  starts.forEach((s,i)=>{
    const e=i+1<starts.length?starts[i+1]:Infinity, rows=R.filter(r=>r>=s&&r<e), cols={};
    rows.forEach(r=>{ if(hgN(g[r][0])==='個数') Object.keys(g[r]).forEach(c=>{ if(c>=15) cols[c]=hgN(g[r][c]); }); });
    rows.forEach(r=>Object.keys(g[r]).forEach(c=>{ if(hgN(g[r][c])==='酒母四段') cols[c]='酒母四段'; }));
    const b={sym:'', liq:'', n:'', shubo:'', moromiL:'', seiseiL:'', alcDo:'', v:{}};
    rows.forEach(r=>{ const L=hgN(g[r][1]); let k='';
      if(/^総米/.test(L)) k='総米'; else if(/^蒸米/.test(L)) k='蒸米'; else if(/^こうじ米/.test(L)) k='麹米';
      else if(/^酵素剤/.test(L)) k='酵素剤'; else if(/^水/.test(L)) k='水'; else if(/^\(l\)\(/.test(L)){ k='アル'; b.alcDo=g[r][5]; }
      if(k){ const o={}; Object.keys(g[r]).forEach(c=>{ if(c>=15&&cols[c]&&typeof g[r][c]==='number') o[cols[c]]=g[r][c]; }); b.v[k]=o; }
      if(k==='蒸米') b.sym=hgN(g[r][0]);
      if(k==='酵素剤'&&typeof g[r][0]==='number') b.n=g[r][0];
      if(hgN(g[r][0]).indexOf('製造見込数量の算出')===0) b.liq=hgN(g[r][11]);
      if(hgN(g[r][0])==='見込数量'){ b.moromiL=g[r][2]; b.seiseiL=g[r][17]; }
      if(hgN(g[r][6])==='号' && g[r][3]!==undefined) b.shubo=hgN(g[r][3]);
    });
    if(b.sym) out.push(b);
  });
  return out;
}
/* 版（ライブラリの kind「配合表」）→ 改定の一覧（古い順）。中身が同じ版は1つにまとめ、最初の日を改定日にする */
function hgRevs(){

  const revs=[]; let last='';

  let h=`<div class="hg-rev">${hgMD(cur.date)}改定<span>（${esc(cur.file||'')}${prev?`・前回 ${hgMD(prev.date)}`:''}）</span></div>`;
  h+=`<div class="ks-sw hg-tab"><button data-k="shubo" class="${HG.kind==='shubo'?'on':''}">🧫 酒母</button><button data-k="moromi" class="${HG.kind!=='shubo'?'on':''}">🍶 仕込み</button></div>`;
  h+=`<div class="hg-bar"><label><input type="checkbox" id="hgAll" ${HG.all?'checked':''}> 今季の仕込みが無い記号も出す</label>${prev?'<span class="hg-lg"><i></i>前回から変わった数字（押すと前の値）</span>':''}</div>`;
  const chg=(sym,row,col,v)=>{ if(!prev) return ''; const p=P[sym]; if(!p) return ' chg'; const o=(p.v[row]||{})[col]; return (o===undefined?'':String(o))===(v===undefined?'':String(v))?'':' chg'; };
  const pv=(sym,row,col)=>{ const p=P[sym]; const o=p&&(p.v[row]||{})[col]; return o===undefined?'空欄':String(o); };
  const mark=s=>{ const a=A[s]; if(!a) return ''; return `${a.now?`<em class="hg-m n">仕込中 ${a.now}</em>`:''}${a.plan?`<em class="hg-m p" title="予定">${a.plan}</em>`:''}`; };   // 2026-10-12 泰広さん指示：「酒母中」は出さない・予定は数字だけ
  if(HG.kind==='shubo'){
    h+=`<div class="kg-tw hg-tw"><table class="hg-t sb"><thead><tr><th class="s">記号</th><th class="l">液種</th><th>総米<small>kg</small></th><th>掛米<small>kg</small></th><th>麹米<small>kg</small></th><th>汲水<small>L</small></th><th>使用酒母</th></tr></thead><tbody>`;
    blocks.forEach(b=>{ const td=(row)=>{ const v=(b.v[row]||{})['酒母']; const c=chg(b.sym,row,'酒母',v); return `<td class="${c}"${c?` title="前 ${esc(pv(b.sym,row,'酒母'))}"`:''}>${hgNum(v)}</td>`; };
      h+=`<tr class="${A[b.sym]?'act':''}"><td class="s">${esc(b.sym)}</td><td class="l lq">${esc(b.liq)}${mark(b.sym)}</td>${td('総米')}${td('蒸米')}${td('麹米')}${td('水')}<td>${esc(b.shubo||'')}${b.shubo?'号':''}</td></tr>`; });
    h+=`</tbody></table></div>`;
  } else {
    h+=`<div class="hg-jump">${blocks.map(b=>`<button data-j="${esc(b.sym)}" class="${A[b.sym]&&A[b.sym].now?'n':A[b.sym]?'p':''}">${esc(b.sym)}<small>${esc(b.liq)}</small></button>`).join('')}</div>`;
    blocks.forEach(b=>{
      const cols=HG_COLS.filter(c=>c!=='計' && HG_ROWS.some(([k])=>(b.v[k]||{})[c]!==undefined));
      cols.push('計');
      h+=`<div class="hg-card${A[b.sym]?' act':''}" id="hg_${esc(b.sym)}"><div class="hg-h"><b class="sym">${esc(b.sym)}</b><b class="lq">${esc(b.liq)}</b>${mark(b.sym)}<span class="hg-s">${b.n!==''?`${hgNum(b.n)}本`:''}${b.shubo?`・酒母 ${esc(b.shubo)}号`:''}${b.moromiL?`・もろみ見込 ${hgNum(b.moromiL)}L`:''}</span></div>
        <div class="kg-tw hg-tw"><table class="hg-t"><thead><tr><th class="l"></th>${cols.map(c=>`<th class="${c==='計'?'sum':''}">${HG_COLNAME[c]||c}</th>`).join('')}</tr></thead><tbody>`;
      HG_ROWS.forEach(([k,lab,u])=>{ const o=b.v[k]||{}; if(!Object.keys(o).length) return;
        h+=`<tr class="${k==='水'?'kumi':''}"><td class="l${k==='アル'?' al':''}">${lab}<small>${u}</small></td>${cols.map(c=>{ const v=o[c], cl=chg(b.sym,k,c,v); return `<td class="${c==='計'?'sum':''}${cl}"${cl?` title="前 ${esc(pv(b.sym,k,c))}"`:''}>${hgNum(v)}</td>`; }).join('')}</tr>`; });
      h+=`</tbody></table></div></div>`; });
  }
  if(!blocks.length) h+=`<p class="muted" style="text-align:center;padding:16px 0">今季の仕込みがある記号はありません（上のチェックで全部出せます）</p>`;
  if(R.length>1) h+=`<div class="hg-hist">これまでの改定：${R.slice().reverse().map(r=>`${hgMD(r.date)}<small>（${esc(r.file||'')}）</small>`).join('／')}</div>`;
  h+=`<p class="tl-note">もと：造りex「醪仕込製造方法」の書き出し（会社PC「造りex\\仕込み配合」の更新日時がいちばん新しいファイル）。配合を変えたら、そのフォルダに新しいファイルを置けば、ここに改定日つきで出ます。</p>`;
  app.innerHTML=h;
  app.querySelectorAll('.hg-tab button').forEach(b=>b.onclick=()=>{ HG.kind=b.dataset.k; hgScreen(); });
  const ck=$('#hgAll'); if(ck) ck.onchange=()=>{ HG.all=ck.checked; hgScreen(); };
  app.querySelectorAll('.hg-jump button').forEach(b=>b.onclick=()=>{ const t=document.getElementById('hg_'+b.dataset.j); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); });
  app.querySelectorAll('.hg-t td.chg').forEach(td=>td.onclick=()=>rcToast(`前の値：${td.title.replace(/^前 /,'')}（${prev?hgMD(prev.date):''}版）`));
}

<script>
/* ================= 🍶 仕込み：表の「仕込み時」にそのまま入力・尺→量の自動・今日の仕込みをアイコンに（2026-10-13） =================
   泰広さん指示：仕込みの表に直接入力できるように。尺を入力すると数量が自動で反映されるはずが、1号が反映されていない。今日の仕込みはアイコン化して上部に納める。
   ・🍶仕込み「📋 表」で「仕込み時 ▾ 表示中」のとき、添・踊・仲・留 の仕込み時のマス（尺・量・汲水・氷・水麹・品温・蒸米、踊は Be・酸・ｱﾐﾉ・品温）が入力欄になる
     （その段の日が来ているものだけ。留の品温は 1日目の品温AM の欄で入れる＝今までどおり同じ値）
     保存は今までの「保存」ボタンと同じ。仕込み時は bunseki_save {setup:{stage,values}}（moromiSetup と同じ）を 順号×段 ごとに裏で送る
   ・尺を入れると、量に容量早見表（tanks.json）の値が入る（仲・留＝醪タンク、添＝伝辛・超辛・純米辛口は醪タンク／それ以外は「添のタンク」mr.soeT。踊は対象外）
   ・1号が反映されなかった原因：1号の添の尺（4250mm）は自動計算を入れる前（10/12）に保存されていて、量は「入力画面を開いたとき」にしか入らなかった
     → 表を開いたとき、尺があって量が空の段は、早見表（照合済みの容器だけ）で量を計算して裏で保存する（1回だけ。知らせを出す）
   ・📋 今日の仕込み：「きょう／あすの仕込み・資材」の枠を上のアイコン（🍶 今日の仕込み・件数）にしまう。押すとアイコンのすぐ下に開く（もう一度押すと閉じる）
   ・kgSetVals・kgMoromiRows・kgBox・mkeSave・shkTopHTML・moromiHome を外側から包む（zennen・shkedit・shktop のコードは変更なし）
   控え：seishu-workbook_github\_src_shk1013.js（index.html の shk1013 の目印の間） */
const SKS={map:new WeakMap(), on:false, auto:{}, tdy:false};
try{ Object.assign(KGE_RANGE,{shaku:[0,6000,'尺'],ryo:[0,30000,'量'],kumi:[0,15000,'汲水'],kori:[0,5000,'氷'],mizukoji:[0,40,'水麹'],mushi:[0,70,'蒸米'],hin:[0,40,'品温']}); }catch(e){}
/* 段のタンク（尺→量に使う容器） */
function sksTank(m, st){
  if(!m) return '';
  if(st==='naka'||st==='tome') return String(m.tank||'').trim();
  if(st!=='soe') return '';
  const big=typeof odoriNeed==='function'?!odoriNeed(m):['伝辛','超辛','純米辛口'].includes(String(m.liquid||'').replace(/[\s　]/g,''));
  const S=lsGet('mr.soeT',{})||{};
  if(S[m.no]!==undefined&&String(S[m.no]).trim()!=='') return String(S[m.no]).trim();
  return big&&m.tank?String(m.tank):'';
}
/* 尺(mm) → 量(L)。照合できていない容器・範囲外は null（税務に関わるので概算しない） */
async function sksVol(m, st, mm){
  const T=sksTank(m,st); if(!T||mm===null||mm===undefined) return null;
  try{ await loadTanks(); }catch(e){}
  const t=tankByNo(T); if(!t||t.verify||t.blocked||!t.checked) return null;
  const v=volAt(t,mm); return v===null?null:{T, L:Math.round(v)};
}
/* 行の set → 行（kgSetVals で順号を知るため） */
(function(){
  const o=window.kgMoromiRows; if(typeof o!=='function') return;
  window.kgMoromiRows=function(){ const rows=o.apply(this, arguments); rows.forEach(r=>{ if(r&&r.set) SKS.map.set(r.set, r); }); return rows; };
})();
/* 仕込み時のマスを入力欄にする（仕込みの表を入力の形で描くときだけ） */
(function(){
  const o=window.kgSetVals; if(typeof o!=='function') return;
  window.kgSetVals=function(kind, set, fi){
    const a=o.apply(this, arguments);
    if(!SKS.on||kind!=='moromi') return a;
    const r=SKS.map.get(set); if(!r||!r.edit) return a;
    const b=RC.bun[r.no]; if(!b) return a;
    const today=dtoday(), d=KG_SET_M[fi]||[];
    if(!d.length||d[0]==='date') return a;
    return a.map((x,ci)=>{
      const st=(KG_STG[ci]||[])[0], od=st==='odori', key=od?d[3]:d[0], lab=od?d[4]:d[1];
      if(!st||!key) return x;
      if(st==='tome'&&key==='hin') return x;   // 留の品温＝1日目の品温AM（その欄で入れる）
      const dt=(set[st]||{}).date; if(!dt||dt>today) return x;
      const v0=((b.setup||{})[st]||{})[key], val=(v0===undefined||v0===null)?'':String(v0);
      const inp=`<input class="kg-i ks" data-no="${esc(String(r.no))}" data-day="s_${st}" data-k="${key}" value="${esc(val)}" type="text" inputmode="decimal" autocomplete="off" aria-label="順号${esc(String(r.no))} ${KG_STG[ci][1]} ${lab}">`;
      return {html:`<small class="ksl">${lab}</small>${inp}`, raw:x.raw, key, ks:true};
    });
  };
})();
/* 表を描くとき：仕込みの表なら入力欄つきで描き、尺→量をつなぐ。量が空の段は自動で入れる */
(function(){
  const o=window.kgBox; if(typeof o!=='function') return;
  window.kgBox=function(box, fields, rows, opt, open){
    const isM = fields===kgFieldsMoromi && box && box.classList && box.classList.contains('kg-home') && !!document.getElementById('kgHd');
    if(!isM) return o.apply(this, arguments);
    SKS.on=true;
    let r; try{ r=o.apply(this, arguments); } finally { SKS.on=false; }
    try{ sksWire(box); }catch(e){ console.log('sksWire',e); }
    try{ sksAutoFill(rows); }catch(e){ console.log('sksAutoFill',e); }
    return r;
  };
})();
function sksWire(box){
  box.querySelectorAll('.kg-i.ks[data-k="shaku"]').forEach(el=>{
    const no=el.dataset.no, st=el.dataset.day.slice(2);
    el.addEventListener('input', async()=>{
      const ry=box.querySelector(`.kg-i.ks[data-no="${no}"][data-day="s_${st}"][data-k="ryo"]`); if(!ry) return;
      const mm=pnum(el.value); if(mm===null) return;
      const v=await sksVol(rcMaster(no), st, mm);
      if(!v){ ry.title=sksTank(rcMaster(no),st)?'早見表で計算できない容器・範囲のため、量は手で入れてください':'添のタンクが決まっていないため、量は手で入れてください（1本の画面の添で選べます）'; return; }
      if(String(pnum(el.value))!==String(mm)) return;   // 打っている途中で変わった
      ry.value=String(v.L); ry.title=`T${v.T} 早見表：尺 ${mm}mm → ${v.L} L（自動）`;
      ry.dispatchEvent(new Event('input'));
    });
  });
}
/* 尺が入っていて量が空の段（自動計算を入れる前に保存した分など）→ 早見表で量を入れて裏で保存（1回だけ） */
async function sksAutoFill(rows){
  const jobs=[];
  (rows||[]).forEach(r=>{ const b=RC.bun[r.no]; if(!b||!b.setup) return; const m=rcMaster(r.no); if(!m) return;
    ['soe','naka','tome'].forEach(st=>{ const S=b.setup[st]||{}, key=r.no+'|'+st;
      if(SKS.auto[key]) return;
      const mm=shN(S.shaku); if(mm===null||mm<=0) return;
      if(String(S.ryo??'').trim()!=='') return;
      SKS.auto[key]=1; jobs.push({no:r.no, st, mm, m, key}); }); });
  if(!jobs.length) return;
  const done=[];
  for(const j of jobs){
    const v=await sksVol(j.m, j.st, j.mm); if(!v) continue;
    const b=RC.bun[j.no]; if(!b) continue;
    b.setup=b.setup||{}; b.setup[j.st]=Object.assign({}, b.setup[j.st]||{}, {ryo:v.L});
    const L=(KG_STG.find(x=>x[0]===j.st)||[])[1]||j.st;
    recSaveBg({action:'bunseki_save', no:j.no, setup:{stage:j.st, values:{ryo:String(v.L)}}}, `仕込み 順号${j.no} ${L}の量（尺から自動）`, true);
    done.push(`${j.no}号 ${L}：T${v.T} 尺${j.mm}mm → ${v.L.toLocaleString('ja-JP')}L`);
  }
  if(done.length){ rcToast(`尺から量を自動で入れました（${done.join('、')}）`); if(MKE.draw) setTimeout(()=>MKE.draw(), 50); }
}
/* 保存：仕込み時のマスは 順号×段 ごとに setup で送る。日々のマスは今までの mkeSave */
(function(){
  const o=window.mkeSave; if(typeof o!=='function') return;
  window.mkeSave=function(box){
    const S=[...box.querySelectorAll('.kg-i.ks')].filter(el=>!el.disabled&&kgeChanged(el));
    if(!S.length) return o.apply(this, arguments);
    const D=[...box.querySelectorAll('.kg-i:not(.ks)')].filter(el=>!el.disabled&&kgeChanged(el)&&MKE_KEYS[el.dataset.k]);
    const lab=el=>el.getAttribute('aria-label')||'';
    const bad=S.concat(D).filter(el=>kgeCheck(el)==='bad');
    if(bad.length){ kgeSay(box,'数字になっていないマス：'+bad.map(lab).slice(0,4).join('、'),true); bad[0].focus(); return; }
    const warn=S.filter(el=>kgeCheck(el)==='warn');
    if(warn.length && !window.confirm(`ありえない値かもしれません。\n${warn.map(el=>`・${lab(el)}：${el.value}`).slice(0,10).join('\n')}\n\nこのまま保存しますか？`)) return;
    const G={};
    S.forEach(el=>{ const no=el.dataset.no, st=el.dataset.day.slice(2), k=el.dataset.k, v=el.value.trim();
      const g=(G[no+'|'+st]=G[no+'|'+st]||{no,st,values:{},els:[]}); g.values[k]=v===''?'':String(pnum(v)); g.els.push(el); });
    const list=Object.values(G);
    const nm=g=>`仕込み 順号${g.no} ${((KG_STG.find(x=>x[0]===g.st)||[])[1]||g.st)}の仕込み時`;
    list.forEach(g=>{ const b=RC.bun[g.no]; if(b){ b.setup=b.setup||{}; b.setup[g.st]=Object.assign({}, b.setup[g.st]||{}, g.values); }
      g.els.forEach(el=>{ delete KGE.dirty[kgeKey(el)]; el.defaultValue=el.value; });
      recSaveBg({action:'bunseki_save', no:Number(g.no)||g.no, setup:{stage:g.st, values:g.values}}, nm(g), true); });
    rcToast(`仕込み時 ${list.length}か所 を裏で保存しています。ほかの作業に移ってOKです`);
    if(D.length) return o.apply(this, arguments);
    kgeSay(box,`保存を受け付けました（${list.map(nm).join('、')}）。裏で送っています`);
    if(MKE.draw) MKE.draw();
  };
})();
/* ---- 📋 今日の仕込み：上のアイコンにしまう ---- */
function sksTodayN(){ try{ const st=RC.state; if(!st||!st.master||!st.shkVer) return null; return shkEvents(st, dtoday()).length; }catch(e){ return null; } }
(function(){ if(typeof shkTopHTML!=='function') return; const _h=shkTopHTML;
  shkTopHTML=function(){ const s=_h.apply(this, arguments); const n=sksTodayN();
    const ic=`<button class="st-ic sks-td${SKS.tdy?' on':''}" data-tdy="1" type="button" aria-label="今日の仕込み"><span class="e">🍶</span><b>${n===null?'':n?n+'件':'なし'}</b><small>今日の仕込み</small></button>`;
    return s.replace(/<button class="st-ic[^"]*" data-shi="zai"/, m=>ic+m); }; })();
function sksTodayApply(){
  const row=app.querySelector('.shk-icons'), box=app.querySelector('.shk-today'); if(!row) return;
  row.classList.toggle('tdy-on', SKS.tdy);
  const b=row.querySelector('[data-tdy]'); if(b) b.classList.toggle('on', SKS.tdy);
  if(SKS.tdy&&box&&row.nextElementSibling!==box) row.after(box);
}
document.addEventListener('click', e=>{
  const b=e.target.closest&&e.target.closest('#app .shk-icons [data-tdy]'); if(!b) return;
  e.preventDefault(); e.stopPropagation(); SKS.tdy=!SKS.tdy; sksTodayApply();
}, true);
(function(){
  const o=window.moromiHome; if(typeof o!=='function') return;
  window.moromiHome=async function(...a){
    const top=nav[nav.length-1]; const r=await o.apply(this, a);
    try{ if(nav[nav.length-1]===top) sksTodayApply(); }catch(e){ console.log('sksToday',e); }
    return r; };

function rcSame(v,o){ const s1=String(v??'').trim(), s2=String(o??'').trim(), a=shN(s1), b=shN(s2);
  if(s1!==''&&s2!==''&&a!==null&&b!==null) return a===b; return String(v??'')===String(o??''); }

    const mu=vs.reduce((a,b)=>a+b,0)/vs.length; return { m:mu, s:Math.sqrt(vs.reduce((a,b)=>a+(b-mu)**2,0)/vs.length), n:vs.length }; };
  const dT=d=>{ const a=[mzT(d.tAM),mzT(d.tPM)].filter(v=>v!==null); return a.length?a.reduce((s,v)=>s+v,0)/a.length:null; };
  const N=Math.max(0,...P.map(x=>(x.v||[]).length)), days={};
  for(let i=0;i<N;i++) days[i+1]=bd(P.map(x=>{ const d=(x._days||(x._days=znDays('moromi',x)))[i]; return d?dT(d):null; }));
  const st={}; [['soe',7],['odori',4],['naka',7]].forEach(([k,ix])=>{ st[k]=bd(P.map(x=>x.st&&x.st[k]?x.st[k][ix]:null)); });
  return MZ.band[key]={ sm, n:P.length, days, st };
}

function mzDev(days, m, upTo){

    ['tAM','tPM'].forEach(k=>{ const v=mzT(d[k]); if(v===null) return;

      if(far||over) out.push({ day:d.day, k, v, m:b?b.m:null, lim, far, over }); }); });
  return out;
}

        if(seq.length>1){ const up=seq.map(([x,bb])=>P(x,YT(bb.m+bb.s))), dn=seq.slice().reverse().map(([x,bb])=>P(x,YT(bb.m-bb.s)));

      g+=be.map(([x,v])=>`<circle cx="${x.toFixed(1)}" cy="${YB(v).toFixed(1)}" r="3.2" fill="#1f5fa8" opacity=".28"/>`).join(''); }

  });

}

<script>
/* ================= 🏷 麹の札（2026-10-16 泰広さん指示） =================
   昨年（麹管理R7.xlsx「札」シート）と同じ札を製造ツールから印刷する。
   ・洗米表（麹DBの洗米日）を見て、1日ごと（洗米日ごと）にまとめて印刷。仕込（順号）ごとではない
   ・A4縦1枚に4枚（2×2）。余白が出たら次の洗米日の麹で埋める（チェックで外せる）
   ・札の中身：洗米日・引込日（小）／麹ID／液種／品種・精米歩合／麹米kg／「　／　台」（手書き）
   ・データ：koji_today（引込日＝洗米日＋1 の日を読んで、洗米日で絞る）。サーバーの変更なし
   控え：seishu-workbook_github\_src_fuda.js（index.html の fuda の目印の間） */
const FUDA={ start:'', sel:null, rows:[] };
const FUDA_KU={'酛':0,'添':1,'仲':2,'留':3};
const FUDA_DAYS=7;   // 開始日から何日分の洗米を読むか
function fudaSort(a,b){ return String(a['洗米日']).localeCompare(String(b['洗米日'])) || (FUDA_KU[a['区分']]??9)-(FUDA_KU[b['区分']]??9) || (+a['順号']||0)-(+b['順号']||0); }
async function fudaLoad(start){
  const ds=Array.from({length:FUDA_DAYS},(_,i)=>dadd(start,i+1));   // 引込日
  const got=await Promise.all(ds.map(d=>(RC.koji&&RC.koji[d])?Promise.resolve(RC.koji[d]):recApi({action:'koji_today',date:d},40000).then(r=>{ if(r&&r.ok){ RC.koji[d]=r; } return r; }).catch(()=>null)));
  const m={}, last=dadd(start,FUDA_DAYS-1);
  got.forEach(j=>((j&&j.koji)||[]).forEach(r=>{ const w=r['洗米日']; if(w&&w>=start&&w<=last) m[r['麹ID']]=r; }));
  return Object.values(m).sort(fudaSort);
}
/* 既定の選択：開始日の分すべて＋A4の余白（4の倍数まで）を次の洗米日の分で埋める */
function fudaDefault(rows,start){
  const sel=new Set(); const first=rows.filter(r=>r['洗米日']===start);
  let base=first; if(!base.length){ const w=rows[0]&&rows[0]['洗米日']; base=rows.filter(r=>r['洗米日']===w); }
  base.forEach(r=>sel.add(r['麹ID']));
  const rest=rows.filter(r=>!sel.has(r['麹ID']) && r['洗米日']>(base[0]?base[0]['洗米日']:''));
  let i=0; while(sel.size%4!==0 && i<rest.length){ sel.add(rest[i]['麹ID']); i++; }
  return sel;
}
async function fudaScreen(start){
  FUDA.start=start||FUDA.start||dtoday();
  head('麹の札','洗米日ごとに A4縦1枚＝4枚');
  const me=nav[nav.length-1];
  rcLoading('洗米の予定を読み込んでいます…');
  let rows; try{ rows=await fudaLoad(FUDA.start); }catch(e){ rows=null; }
  if(nav[nav.length-1]!==me) return;
  if(!rows){ rcFail(); return; }
  FUDA.rows=rows; FUDA.sel=fudaDefault(rows,FUDA.start);
  fudaDraw();
}
function fudaDraw(){
  const rows=FUDA.rows, sel=FUDA.sel, n=rows.filter(r=>sel.has(r['麹ID'])).length, pages=Math.ceil(n/4);
  const days=[...new Set(rows.map(r=>r['洗米日']))];
  let h=`<div class="card fd-top"><label>洗米日<input type="date" id="fdStart" value="${FUDA.start}"></label>
    <span class="fd-cnt">${n}枚 → <b>A4 ${pages}枚</b>${n%4?`<small>（あと${4-n%4}枚分あいています）</small>`:''}</span>
    <button type="button" class="szi-btn" id="fdPrint" ${n?'':'disabled'}>🖨 印刷</button></div>`;
  if(!rows.length) h+=`<div class="szi-none">${djp(FUDA.start)}から${FUDA_DAYS}日間、洗米の予定がありません（麹管理R8BY 麹DB）</div>`;
  days.forEach(d=>{ const L=rows.filter(r=>r['洗米日']===d), on=L.filter(r=>sel.has(r['麹ID'])).length;
    h+=`<div class="rc-h fd-day">洗米 ${djp(d)}<small>引込 ${rcMD(dadd(d,1))}・${L.length}麹</small>
      <button type="button" class="fd-all" data-day="${d}">${on===L.length?'全部外す':'全部入れる'}</button></div>
      <div class="fd-list">${L.map(r=>`<label class="fd-row ${sel.has(r['麹ID'])?'on':''}"><input type="checkbox" data-id="${esc(r['麹ID'])}" ${sel.has(r['麹ID'])?'checked':''}>
        <b>${esc(r['麹ID'])}</b><span>${esc(r['液種']||'')}</span><span>${esc(r['品種']||'')} ${esc(String(r['精米歩合']??''))}%</span><span>${rcN(r['麹米kg'])}kg</span></label>`).join('')}</div>`; });
  h+=`<p class="tl-note">昨年（麹管理R7「札」）と同じ中身です。洗米日の順に詰めて、1枚に4つ並べます。切り取り線つき。台の数は手書きです。</p>`;
  app.innerHTML=h;
  $('#fdStart').onchange=e=>{ const v=e.target.value; if(v) fudaScreen(v); };
  app.querySelectorAll('.fd-row input').forEach(c=>c.onchange=()=>{ if(c.checked) sel.add(c.dataset.id); else sel.delete(c.dataset.id); fudaDraw(); });
  app.querySelectorAll('.fd-all').forEach(b=>b.onclick=()=>{ const L=rows.filter(r=>r['洗米日']===b.dataset.day), all=L.every(r=>sel.has(r['麹ID'])); L.forEach(r=>all?sel.delete(r['麹ID']):sel.add(r['麹ID'])); fudaDraw(); });
  $('#fdPrint').onclick=()=>fudaPrint(rows.filter(r=>sel.has(r['麹ID'])));
}
/* 文字数に合わせて札の幅（約88mm）に収める */
function fudaFit(s,max,w){ const len=[...String(s||'')].reduce((a,c)=>a+(/[ -~]/.test(c)?0.55:1),0)||1; return Math.min(max,(w||86)/len).toFixed(1)+'mm'; }
function fudaCard(r){
  if(!r) return `<div class="fd-c"></div>`;
  const raw=String(r['麹ID']||''), lq=r['液種']||'', kd=r['品種']||'';
  /* 2026-10-20：区分（酛・添・仲・留）を色分け、仕込Noは区分の文字より大きく、区分・番号・号をまとめて下線。洗米・引込の日付は出さない */
  const mm=raw.match(/^(\D+?)\s*(\d+)\s*号$/);
  const idH=mm?`<span class="ku ku-${FUDA_KU[mm[1]]??'x'}">${esc(mm[1])}</span><span class="no">${esc(mm[2])}</span><span class="go">号</span>`:esc(raw);
  return `<div class="fd-c">
    <div class="fd-id">${idH}</div>
    <div class="fd-lq" style="font-size:${fudaFit(lq,13)}"><span>${esc(lq)}</span></div>
    <div class="fd-kd"><span style="font-size:${fudaFit(kd,9,54)}">${esc(kd)}</span><span>${esc(String(r['精米歩合']??''))}<small>％</small></span></div>
    <div class="fd-kg">${rcN(r['麹米kg'])}<small> K</small></div>
    <div class="fd-dai"><span>／</span><small>台</small></div></div>`;
}
function fudaPrint(list){
  if(!list.length) return;
  let el=document.getElementById('fudaPrint'); if(!el){ el=document.createElement('div'); el.id='fudaPrint'; document.body.appendChild(el); }
  let h=''; for(let i=0;i<list.length;i+=4){ const p=list.slice(i,i+4); while(p.length<4) p.push(null); h+=`<div class="fd-pg">${p.map(fudaCard).join('')}</div>`; }
  el.innerHTML=h;
  const pg=document.createElement('style'); pg.id='fudaPage'; pg.textContent='@page{size:A4 portrait;margin:0}'; document.head.appendChild(pg);
  document.body.classList.add('fuda-printing');
  const done=()=>{ document.body.classList.remove('fuda-printing'); const s=document.getElementById('fudaPage'); if(s) s.remove(); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done,1500); },80);
}

<script>
/* ================= 🏢 麹の札を会社のプリンターで印刷（2026-10-20 泰広さん指示） =================
   スマホから会社のプリンター（事務所 NEC 9160。AirPrint 非対応）で札を刷る。
   ・札の画面の「🖨 印刷」を押すと（2026-10-21：ボタンは1つにまとめた。スマホの印刷画面は出さない）札の中身を Apps Script「製造ツール 共有データ」の表「資材在庫」に
     資材名「麹の札印刷」・区分「印刷待ち」・メモ＝札の中身（JSON）で1行入れる（サーバーの変更なし。資材の一覧には出さない）
   ・会社PCの「麹の札印刷.ps1」（1分ごと）が受け取り、プリンターで印刷 → 区分を「印刷済」（メモは空に）。だめなら「印刷できず」
   ・会社PCの電源が入っているときだけ。6時間たっても刷られなかったものは会社PCが「取りやめ」にする
   控え：seishu-workbook_github\_src_fudapc.js（index.html の fudapc の目印の間） */
const FDPC_N='麹の札印刷';
const FDPC={ t:0 };
function fdpcJobs(){ return (ZAI.items||[]).filter(x=>x.name===FDPC_N).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))); }
function fdpcCard(r){ return { id:String(r['麹ID']||''), lq:String(r['液種']||''), kd:String(r['品種']||''), pct:String(r['精米歩合']??''), kg:rcN(r['麹米kg']) }; }
function fdpcState(x){
  const k=x.kind||'';
  if(k==='印刷待ち') return ['wait','⏳ 会社PCに届くのを待っています'];
  if(k==='印刷中') return ['wait','🖨 印刷しています'];
  if(k==='印刷済') return ['ok','✅ 印刷しました'+(x.unit?'（'+x.unit+'）':'')];
  if(k==='取りやめ') return ['ng','✖ 取りやめ'+(x.unit?'（'+x.unit+'）':'')];
  return ['ng','⚠ 印刷できませんでした'+(x.unit?'（'+x.unit+'）':'')];
}
function fdpcBox(){
  const L=fdpcJobs().slice(0,3); if(!L.length) return '';
  return `<div class="fdpc-box">${L.map(x=>{ const [c,t]=fdpcState(x); return `<div class="fdpc-j ${c}"><span>${esc(String(x.at||'').slice(5).replace('-','/'))}　${esc(x.qty||'')}枚</span><b>${esc(t)}</b></div>`; }).join('')}
    ${L.some(x=>/^印刷(待ち|中)$/.test(x.kind||''))?'<small>会社PCの電源が入っていれば、1〜2分で事務所のプリンターから出ます。</small>':''}</div>`;
}
function fdpcPaint(){ const b=document.getElementById('fdpcBox'); if(b) b.innerHTML=fdpcBox(); }
async function fdpcPoll(n){
  clearTimeout(FDPC.t); FDPC.t=1; if(!document.getElementById('fdpcBox')){ FDPC.t=0; return; }
  try{ zaiKeep(await zaiApi({action:'list'})); fdpcPaint(); }catch(e){}
  FDPC.t=0; if(n>0 && fdpcJobs().some(x=>/^印刷(待ち|中)$/.test(x.kind||''))) FDPC.t=setTimeout(()=>fdpcPoll(n-1),15000);
}
async function fdpcSend(list,btn){
  if(!list.length) return;
  if(!confirm(`札 ${list.length}枚（A4 ${Math.ceil(list.length/4)}枚）を事務所のプリンターで印刷します。よろしいですか？`)) return;
  btn.disabled=true; btn.textContent='送っています…';
  try{
    zaiKeep(await zaiApi({action:'save', item:{ name:FDPC_N, kind:'印刷待ち', qty:String(list.length), unit:'', date:dtoday(), memo:JSON.stringify(list.map(fdpcCard)) }}));
    btn.textContent='✅ 送りました'; fdpcPaint(); FDPC.t=setTimeout(()=>fdpcPoll(20),15000);
  }catch(e){ alert('送れませんでした：'+(e&&e.message||e)); btn.disabled=false; btn.textContent='🖨 印刷'; }
}
(function(){
  const s=document.createElement('style'); s.textContent=`
.fdpc-btn{background:#1f6fa8!important;color:#fff!important;border-color:#1f6fa8!important}
.fdpc-box{margin:8px 0 4px;display:flex;flex-direction:column;gap:4px}.fdpc-box small{font-size:11px;color:var(--sub)}
.fdpc-j{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-left:4px solid #999;border-radius:8px;padding:6px 8px;font-size:13px}
.fdpc-j.wait{border-left-color:#e0a000}.fdpc-j.ok{border-left-color:#2a9d4a}.fdpc-j.ng{border-left-color:#d62728}`;
  document.head.appendChild(s);
  /* 資材の在庫の計算には入れない */
  const zc=window.zaiCalc; if(typeof zc==='function') window.zaiCalc=function(...a){ const keep=ZAI.items; ZAI.items=(keep||[]).filter(x=>x.name!==FDPC_N); try{ return zc.apply(this,a); } finally{ ZAI.items=keep; } };
  /* 札の画面の「🖨 印刷」を会社のプリンター行きにし、送った札の状況を出す */
  const fd=window.fudaDraw; if(typeof fd==='function') window.fudaDraw=function(...a){ const p=fd.apply(this,a); try{
    /* 2026-10-21 泰広さん指示：ボタンは「🖨 印刷」1つにまとめる。押すと会社のプリンターで刷る（スマホの印刷画面は出さない） */
    const pb=document.getElementById('fdPrint'); if(pb && !document.getElementById('fdpcBox')){
      pb.closest('.card').insertAdjacentHTML('afterend',`<div id="fdpcBox">${fdpcBox()}</div>`);
      pb.onclick=()=>fdpcSend(FUDA.rows.filter(r=>FUDA.sel.has(r['麹ID'])),pb);
      if(!FDPC.t) fdpcPoll(fdpcJobs().some(x=>/^印刷(待ち|中)$/.test(x.kind||''))?20:0);
    } }catch(e){} return p; };
})();
</script>

<script>
/* ================= 🕳 留後の作業（穴あけ・泡消し器）2026-10-17 =================
   泰広さん指示：留仕込の次の日（2日目）は「穴あけ」、3日目は「泡消し器の設置」をしなければならない。
   ・仕込みの画面の上にアイコンで通知 → 作業をしたらタップ → 済になって通知が消える（みんなのスマホで共有）
   ・本日の予定にも出す（時刻・人数は数えない「忘れないでやる作業」として、予定の枠の上に帯で出す。済んだものは ✓）
   ・日の数え方：留仕込の日＝1日目 → 穴あけ＝留の翌日、泡消し器＝留の翌々日。上槽済の仕込は出さない
   ・済の記録先：Apps Script「製造ツール 共有データ」（SHARED_URL）の表「醪作業」（name＝作業、no＝順号、date＝済んだ日）
     取り消しは delete（行は消さず「削除」欄に日時）
   ・通知は「その日が来た〜済になるまで」。遅れても消えない（MW_LATE 日まで。それより前のものは出さない）
   ・すぐ終わる作業なので、時刻・人数は数えない（棒にしない＝出勤表の人数の判定にも入れない）2026-10-17 泰広さん指示
   控え：seishu-workbook_github\_src_moromiwork.js */
const MW_JOBS=[ {name:'穴あけ', day:2, icon:'🕳', short:'穴あけ'}, {name:'泡消し器', day:3, icon:'🫧', short:'泡消', only:m=>mwK7(m)} ];   // 2026-10-18 泰広さん指示：泡消し器は酵母K7の仕込みだけ
/* 酵母がK7か（K7・k-7・協会7号。K701 などは別） */
function mwK7(m){ const y=String((m&&m.yeast)||'').normalize('NFKC'); return /(^|[^0-9A-Za-z])K-?7(?![0-9])/i.test(y) || /協会7号/.test(y); }
const mwNeed=(m,job)=>!job.only || job.only(m);
const MW_FROM='2026-10-16';   // この日より前の作業は通知しない（機能を入れる前の分）
const MW_LATE=7;              // 何日遅れまで通知を出し続けるか
const MW={ items: lsGet('mw.items', []), at:0, err:'' };
async function mwApi(body){
  if(typeof SHARED_URL==='undefined' || !SHARED_URL) throw new Error('記録先の設定がまだです');
  body.table='醪作業'; body.who={ id:String(ST.id||''), name:String(ST.name||'') };
  const r=await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  const j=await r.json();
  if(!j||!j.ok) throw new Error((j&&/その表はありません/.test(j.error||''))?'サーバー側の更新（Apps Script「製造ツール 共有データ」の新バージョン）がまだです':((j&&j.error)||'受け取れませんでした'));
  return j;
}
function mwKeep(j){ MW.items=(j.items||[]).filter(x=>!x.deleted); MW.at=Date.now(); lsSet('mw.items', MW.items); MW.err=''; }
async function mwLoad(force){
  if(!force && MW.at && Date.now()-MW.at<60000) return MW.items;
  try{ mwKeep(await mwApi({action:'list'})); }catch(e){ MW.err=String(e.message||e); }
  return MW.items;
}
function mwDone(no, name){ return (MW.items||[]).find(x=>!x.deleted && String(x.no)===String(no) && x.name===name)||null; }
/* その仕込のその作業の日（留＝1日目） */
function mwDue(m, job){ return m&&m.tome ? dadd(m.tome, job.day-1) : null; }
/* 通知する作業（その日が来ていて、まだ済んでいないもの） */
function mwPending(today){
  const st=dpState(); if(!st||!st.master) return [];
  const T=st.today||{}, out=[];
  st.master.forEach(m=>{
    if(!m.tome || (T[m.no]||{}).state==='上槽済') return;
    MW_JOBS.forEach(job=>{
      if(!mwNeed(m,job)) return;
      const due=mwDue(m,job); if(!due || due<MW_FROM || due>today) return;
      const late=Math.round((dparse(today)-dparse(due))/86400000); if(late>MW_LATE) return;
      if(mwDone(m.no, job.name)) return;
      out.push({m, job, due, late});
    });
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due)||a.m.no-b.m.no);
}
function mwAlertHTML(today){
  const L=mwPending(today);
  if(!L.length) return '';
  return `<div class="mw-box"><div class="mw-t">🔔 留後の作業<small>済んだらタップ</small></div>`+
    L.map(x=>`<button class="mw-btn" data-mwno="${esc(String(x.m.no))}" data-mwjob="${esc(x.job.name)}"><span class="ic">${x.job.icon}</span>
      <span class="tx"><b>${esc(x.job.name)}${x.job.name==='泡消し器'?'の設置':''}</b>　No.${esc(String(x.m.no))} ${esc(x.m.sym||'')}　T${esc(x.m.tank||'')}
      <small>${esc(x.m.liquid||'')}・留${x.job.day}日目（${+x.due.slice(5,7)}/${+x.due.slice(8,10)}）${x.late>0?`<em>${x.late}日遅れ</em>`:''}</small></span><span class="ok">済</span></button>`).join('')+
    (MW.err?`<div class="tl-warn" style="margin:6px 0 0">${esc(MW.err)}</div>`:'')+`</div>`;
}
async function mwTap(no, name, redraw){
  const m=(dpState()||{}).master&&(dpState().master.find(x=>String(x.no)===String(no)));
  if(!confirm(`No.${no}${m&&m.sym?' '+m.sym:''} の「${name}」を済にしますか？`)) return;
  try{
    const j=await mwApi({action:'save', item:{ name, kind:'済', no:String(no), liquid:(m&&m.liquid)||'', tank:(m&&m.tank)||'', plan:m?mwDue(m,MW_JOBS.find(x=>x.name===name)):'', date:dtoday() }});
    mwKeep(j);
  }catch(e){ alert('保存できませんでした：'+(e.message||e)); }
  if(redraw) redraw();
}
async function mwUndo(no, name, redraw){
  const it=mwDone(no,name); if(!it) return;
  if(!confirm(`No.${no} の「${name}」の済を取り消しますか？`)) return;
  try{ mwKeep(await mwApi({action:'delete', id:it.id})); }catch(e){ alert('取り消せませんでした：'+(e.message||e)); }
  if(redraw) redraw();
}
/* 仕込みの画面：上に通知を出す */
function mwInject(){
  const box=document.getElementById('mwSlot'); const html=mwAlertHTML(dtoday());
  if(box){ box.innerHTML=html; }
  else { const s=document.getElementById('rcStatus'); if(!s) return; s.insertAdjacentHTML('afterend', `<div id="mwSlot">${html}</div>`); }
  document.querySelectorAll('#mwSlot .mw-btn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); mwTap(b.dataset.mwno, b.dataset.mwjob, mwInject); });

<script>

FAST.re=false;

function oroOf(no){
  const L=ORO.loc[no]||{}, s=RC.shubo&&RC.shubo[no], b=RC.bun&&RC.bun[no];
  const o=Object.assign({}, (b&&b.oro)||{}, (s&&s.oro)||{}, L);
  return {shaku:o.shaku==null?'':String(o.shaku), ryo:o.ryo==null?'':String(o.ryo), to:String(o.to==null?'':o.to).replace(/^[Tt]/,'').trim()};
}
/* 添のタンク（卸先）：酛卸で選んだタンク → 伝辛など＝醪タンク／それ以外＝空 */
function oroTo(m){ if(!m) return ''; const o=oroOf(m.no); return o.to||(oroBig(m)&&m.tank?String(m.tank):''); }
function oroCand(m){ const a=oroBig(m)&&m.tank?[[String(m.tank),'醪']]:[]; a.push(['284',''],['285','']); if(m.shuboT) a.push([String(m.shuboT),'酒母']);
  const seen={}; return a.filter(([t])=>t&&!seen[t]&&(seen[t]=1)); }
function oroVol(m, mm){   // → {L} ／ {err}
  const T=String((m&&m.shuboT)||'').trim(); if(!T) return {err:'酒母タンク未設定'};
  if(mm===null||mm===undefined) return {err:''};
  if(typeof TANKS==='undefined'||!TANKS) return {err:'早見表を読み込み中'};
  const t=tankByNo(T); if(!t) return {err:`T${T} は早見表に無い`};
  if(t.verify||t.blocked||!t.checked) return {err:`T${T} は照合できていない容器`};
  const v=volAt(t,mm); return v===null?{err:'範囲外'}:{L:Math.round(v), T};
}
function oroBoxHTML(m){
  const o=oroOf(m.no), to=oroTo(m), cand=oroCand(m), known=!to||cand.some(([t])=>t===to);
  const nm=`順号${esc(String(m.no))} 酛卸`;
  return `<div class="oro-box" data-no="${esc(String(m.no))}">
    <span>尺</span><input class="oro-i" data-k="shaku" type="text" inputmode="numeric" autocomplete="off" placeholder="mm" value="${esc(o.shaku)}" aria-label="${nm} 尺">
    <span>量</span><input class="oro-i ry" data-k="ryo" type="text" inputmode="numeric" autocomplete="off" placeholder="L" value="${esc(o.ryo)}" aria-label="${nm} 量" readonly>
    <span>卸先</span><select class="oro-i sel" data-k="to" aria-label="${nm} 卸先"><option value="">選択</option>${cand.map(([t,l])=>`<option value="${esc(t)}"${t===to?' selected':''}>T${esc(t)}${l?' '+l:''}</option>`).join('')}<option value="__o"${known?'':' selected'}>その他</option></select>
    <span></span><input class="oro-i oth" data-k="oth" type="text" inputmode="numeric" autocomplete="off" placeholder="T番号" value="${known?'':esc(to)}" aria-label="${nm} 卸先（その他）" style="${known?'display:none':''}">
  </div>`;
}
function oroSave(no, part){
  const s=RC.shubo&&RC.shubo[no]; ORO.loc[no]=Object.assign(ORO.loc[no]||{}, part);
  if(s) s.oro=Object.assign({}, s.oro||{}, part);
  const b=RC.bun&&RC.bun[no]; if(b) b.oro=Object.assign({}, b.oro||{}, part);
  recSaveBg({action:'shubo_save', no, oro:part}, `酒母 順号${no} 酛卸`, true);
  rcToast(`順号${no} 酛卸の${part.to!==undefined?'卸先':'尺・量'}を保存しています（裏で送ります）`);
}
function oroBind(box){
  box.querySelectorAll('.oro-box[data-no]').forEach(ob=>{
    const no=ob.dataset.no, m=rcMaster(no)||{};
    const sk=ob.querySelector('[data-k=shaku]'), ry=ob.querySelector('[data-k=ryo]'), sel=ob.querySelector('[data-k=to]'), oth=ob.querySelector('[data-k=oth]');
    [sk,ry,oth].forEach(el=>{ el.dataset.igSkip='1'; el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } }); });
    const calc=()=>{
      const mm=pnum(sk.value);
      if(mm===null){ ry.readOnly=false; ry.classList.remove('auto'); ry.title=''; return null; }
      const r=oroVol(m, mm);
      if(r.L===undefined){ ry.readOnly=false; ry.classList.remove('auto'); ry.title=(r.err||'')+'（量は手で入れてください）'; return null; }
      ry.value=String(r.L); ry.readOnly=true; ry.classList.add('auto'); ry.title=`T${r.T} 早見表：尺 ${mm}mm → ${r.L} L（自動）`; return r.L;
    };
    if(pnum(sk.value)!==null){ const keep=ry.value; calc(); if(keep!==''&&!ry.classList.contains('auto')) ry.value=keep; } else ry.readOnly=false;
    if(!TANKS){ loadTanks().then(()=>{ if(document.body.contains(ob)&&pnum(sk.value)!==null) calc(); }).catch(()=>{}); }
    sk.addEventListener('input',()=>{ calc(); sk.classList.add('dirty'); });
    const saveSR=()=>{ const o=oroOf(no), a=sk.value.trim(), b=ry.value.trim();
      if(a===o.shaku && b===o.ryo) return; sk.classList.remove('dirty'); ry.classList.remove('dirty'); oroSave(no,{shaku:a, ryo:b}); };
    sk.addEventListener('change',saveSR);
    ry.addEventListener('input',()=>ry.classList.add('dirty')); ry.addEventListener('change',saveSR);
    const setTo=v=>{ v=String(v||'').replace(/^[Tt]/,'').trim(); if(v===oroOf(no).to) return; oroSave(no,{to:v}); oroLabel(box,no); };
    sel.addEventListener('change',()=>{ if(sel.value==='__o'){ oth.style.display=''; oth.focus(); return; } oth.style.display='none'; oth.value=''; setTo(sel.value); });
    oth.addEventListener('change',()=>setTo(oth.value));
  });
}
/* 左の順号の下「酛卸 10/20→T◯◯」を卸先に */
function oroLabel(box,no){
  const m=rcMaster(no); if(!m) return;
  (box||app).querySelectorAll(`.kg-t td.n[data-kgno="${CSS.escape(String(no))}"] small`).forEach(sm=>{
    if(!/^酛卸 /.test(sm.textContent)) return;
    const to=oroTo(m); sm.innerHTML=sm.innerHTML.replace(/→T[^<]*$|$/, to?'→T'+esc(to):'');
  });
}
/* 🧫酒母の表：酛卸の日の備考のマスを 尺・量・卸先 に */
function oroPaint(box, rows){
  if(!box) return;
  (rows||[]).forEach(r=>{ if(!r||!r.jo) return; const m=rcMaster(r.no); if(!m) return;
    const tr=[...box.querySelectorAll(`.kg-t tr[data-kg="${CSS.escape(String(r.no))}"]`)].find(t=>{ const f=t.querySelector('td.f'); return f&&f.textContent.trim()==='備考'; });
    const td=tr&&tr.querySelector(`td[data-i="${r.jo}"]`); if(!td) return;
    td.classList.add('oro-c'); td.innerHTML=oroBoxHTML(m);
    oroLabel(box, r.no); });
  oroBind(box);
}
/* 🍶仕込みの表：順号の下に「添 T◯◯」、添の尺のマスにタンク番号 */
function oroSoePaint(box){
  if(!box) return;
  box.querySelectorAll('.kg-t.mk td.n[data-kgno]').forEach(td=>{
    const m=rcMaster(td.dataset.kgno); if(!m||!m.soe) return;
    const T=sksTank(m,'soe'), big=oroBig(m)&&T===String(m.tank||'');
    let el=td.querySelector('.soe-tk'); if(!el){ el=document.createElement('span'); el.className='soe-tk'; const tk=td.querySelector('.tk'); tk?tk.after(el):td.appendChild(el); }
    el.classList.toggle('big', big); el.classList.toggle('none', !T);
    el.innerHTML=T?`添 T${esc(T)}`:'添 T未定<small>（酒母の酛卸で選択）</small>';
  });
  box.querySelectorAll('.kg-t.mk .soe-tt').forEach(x=>x.remove());   /* 2026-10-20 泰広さん指示：添の尺の欄のタンク表示は削除 */
  /* 2026-10-20 泰広さん指示：BMDの行が縦に大きくなるので「留まで…」「上槽…」「帯…」を削除。記号（イロハ…）は酵母の隣に空白をあけて同じ大きさ、仕込みNoも酵母と同じ大きさ */
  box.querySelectorAll('.kg-t.mk td.n[data-kgno]').forEach(td=>{
    const m=rcMaster(td.dataset.kgno)||{}, ky=td.querySelector('.ky'), sym=String(m.sym||'').trim();
    td.querySelectorAll(':scope > small').forEach(sm=>{ const t=sm.textContent.trim();
      if(/^(留まで|上槽|帯[：:])/.test(t)||sm.classList.contains('js-ch')||/^\d+日目$/.test(t)||(sym&&t===sym)) sm.remove(); });
    if(ky&&!ky.classList.contains('ky-no')){
      if(sym&&!ky.querySelector('.ksym')){ const is=[...ky.querySelectorAll('i')], i=is[is.length-1]||ky; i.insertAdjacentHTML('beforeend',`<span class="ksym">&nbsp;${esc(sym)}</span>`);
        const L=Math.max(...(is.length?is:[ky]).map(x=>x.textContent.replace(/\u00a0/g,' ').length)); ky.style.fontSize=(L<=6?19:L<=9?15:12)+'px'; }
      const b=td.querySelector(':scope > b'); if(b) b.style.setProperty('font-size', getComputedStyle(ky).fontSize, 'important');
    } else if(ky&&sym&&!td.querySelector('.ksym')) ky.insertAdjacentHTML('beforeend',`<span class="ksym">&nbsp;${esc(sym)}</span>`);
  });
}
/* 添のタンク：酛卸の卸先を最優先（→ 端末で選んだ添のタンク → 伝辛など＝醪タンク） */
(function(){

(function(){

/* 上部の切り替え：🍶仕込み［📈グラフ｜📋表｜🧫酒母］・🧫酒母［📋表｜🍶仕込み］。行き来しても「戻る」はホームへ */

<script>
/* ================= 🧫 酒母・🍶 仕込みの表：前回比の注意／🧫 酒母の表：酛卸の日の全項目チェック（2026-10-20） =================
   泰広さん指示：分析の画面にしかなかった「酛卸の日の全項目チェック」と「前回比」を酒母・仕込みにも入れる。
   ・前回比：分析の画面と同じ決まり（bnCheck）。その行の前の日で一番近い値と比べる（表の今の値＝未保存も含む）
       alc が0.3以上下がる／醪の alc が4以上急に上がる／酸度 ±0.6以上（酒母は±3以上）／ｱﾐﾉ ±0.5以上／酒母の Be が1以上上がる
       → マスをオレンジの太枠・文字を茶色（.pvw）。欄を離れたときに下に知らせ（保存は止めない）。表を開いたときも保存済みの値に印
   ・酛卸の日（酒母の表）：Be・alc・酸度・ｱﾐﾉ の空いている欄は赤い点線（.need）。「保存」でその日の欄を保存するときに空きがあれば
       「酛卸時は全て分析する事となっていますが、よろしいですか？」いいえ＝保存しない（空欄へ）／はい→「次は全項目分析してください！」→保存（分析の画面と同じ。2026-10-20 文言変更）
   控え：seishu-workbook_github\_src_chk1020.js（index.html の chk1020 の目印の間） */
const CK_F=['be','alc','ta','aa'];
const CK_LB={be:'Be',alc:'alc',ta:'酸度',aa:'ｱﾐﾉ'};
function ckKind(box){ return box&&box.classList&&box.classList.contains('kg-shubo')?'sb':(box&&box.querySelector&&box.querySelector('.kg-t.mk')?'mr':''); }
function ckIns(box, no, k){ return [...box.querySelectorAll(`.kg-i[data-no="${CSS.escape(String(no))}"][data-k="${k}"]`)].filter(el=>/^\d+$/.test(el.dataset.day||'')&&Number(el.dataset.day)>0); }
/* その欄より前の日で一番近い値（表の値 → 無ければ保存済みのデータ） */
function ckPrev(box, kind, el){
  const no=el.dataset.no, k=el.dataset.k, d=Number(el.dataset.day);
  let best=null;
  ckIns(box,no,k).forEach(x=>{ const dd=Number(x.dataset.day); if(dd>=d) return; const v=shN(x.value); if(v!==null&&(!best||dd>best.day)) best={v,day:dd}; });
  const S=kind==='sb'?(RC.shubo&&RC.shubo[no]):(RC.bun&&RC.bun[no]), days=(S&&S.days)||[];
  for(let i=d-2;i>=0;i--){ const x=days[i]; if(!x) continue; if(best&&x.day<=best.day) break; if(ckIns(box,no,k).some(e=>Number(e.dataset.day)===x.day)) continue; const v=shN(x[k]); if(v!==null){ best={v,day:x.day}; break; } }
  return best;
}
function ckMark(box, kind, el){
  const v=shN(el.value); let msg='';
  if(v!==null && typeof bnCheck==='function'){ const r=bnCheck(kind, el.dataset.k, v, ckPrev(box,kind,el)); if(r&&r[0]==='warn') msg=r[1]; }
  el.classList.toggle('pvw', !!msg);
  if(msg) el.title=msg; else if(el.dataset.pvt) el.removeAttribute('title');
  if(msg) el.dataset.pvt='1'; else delete el.dataset.pvt;
  return msg;
}
function ckNeed(box){
  if(ckKind(box)!=='sb') return;
  Object.keys(CK.jo).forEach(no=>{ const jo=CK.jo[no];
    CK_F.forEach(k=>{ ckIns(box,no,k).forEach(el=>{ el.classList.toggle('need', Number(el.dataset.day)===jo && !el.disabled && String(el.value).trim()===''); }); }); });
}
const CK={ jo:{} };
function ckBind(box, rows){
  const kind=ckKind(box); if(!kind) return;
  if(kind==='sb'){ CK.jo={}; (rows||[]).forEach(r=>{ if(r&&r.jo) CK.jo[String(r.no)]=r.jo; }); }
  const ins=[...box.querySelectorAll('.kg-i[data-k]')].filter(el=>CK_F.includes(el.dataset.k)&&/^\d+$/.test(el.dataset.day||'')&&Number(el.dataset.day)>0);
  ins.forEach(el=>ckMark(box,kind,el));
  ckNeed(box);
  ins.forEach(el=>{
    if(el.dataset.ckb) return; el.dataset.ckb='1';
    el.addEventListener('input',()=>{ ckIns(box,el.dataset.no,el.dataset.k).forEach(x=>{ if(Number(x.dataset.day)>=Number(el.dataset.day)) ckMark(box,kind,x); }); ckNeed(box); });
    el.addEventListener('change',()=>{ const m=ckMark(box,kind,el); if(m) rcToast(`順号${el.dataset.no} ${el.dataset.day}日目 ${CK_LB[el.dataset.k]||''}：${m}`, true, 4000); });
  });
}
(function(){
  const o=window.kgBox; if(typeof o!=='function') return;
  window.kgBox=function(box, fields, rows, opt, open){
    const r=o.apply(this, arguments);
    try{ if(box&&box.querySelector&&box.querySelector('.kg-t .kg-i')) ckBind(box, rows); }catch(e){ console.log('ck',e); }
    return r;
  };
})();
/* 酒母の表の「保存」：酛卸の日の欄を保存するときに空きがあれば確認（分析の画面と同じ） */
(function(){
  const o=window.kgeSave; if(typeof o!=='function') return;
  window.kgeSave=async function(box){
    try{
      if(box&&box.classList&&box.classList.contains('kg-shubo')&&typeof bnAsk==='function'){
        const ch=[...box.querySelectorAll('.kg-i')].filter(el=>!el.disabled&&kgeChanged(el));
        const miss=[], first=[];
        Object.keys(CK.jo).forEach(no=>{ const jo=CK.jo[no];
          if(!ch.some(el=>el.dataset.no===no&&Number(el.dataset.day)===jo)) return;   // 酛卸の日の欄を保存するときだけ
          const em=CK_F.map(k=>ckIns(box,no,k).find(el=>Number(el.dataset.day)===jo)).filter(el=>el&&!el.disabled&&String(el.value).trim()==='');
          if(em.length){ miss.push(`順号${no}：${em.map(el=>CK_LB[el.dataset.k]).join('・')}`); first.push(em[0]); } });
        if(miss.length){
          const a=await bnAsk('酛卸時は全て分析する事となっていますが、よろしいですか？', '未入力　'+miss.map(esc).join('<br>'), [['いいえ',''],['はい','yes']]);
          if(a!==1){ const f=first[0]; if(f){ f.focus(); try{ f.scrollIntoView({block:'center',inline:'center'}); }catch(e){} } return; }
          await bnAsk('次は全項目分析してください！','',[['はい','yes']]);   /* 2026-10-20 泰広さん指示で文言変更 */
        }
      }
    }catch(e){ console.log('ck-oro',e); }
    return o.apply(this, arguments);
  };
})();
(function(){ const s=document.createElement('style'); s.textContent=`
.kg-i.pvw{box-shadow:inset 0 0 0 2px #f08a00;color:#a04a00}
.kg-i.need{border:1.5px dashed #c0392b;background:#fff5f4}
.kg-i.need.dirty{border:2px solid #e0a800}`; document.head.appendChild(s); })();
</script>

<script>
/* ================= 🧫 酒母の表：仕込時の値（尺・量・水麹・蒸米）を表にそのまま入力／仕込み時は常に表示（2026-10-20） =================
   泰広さん指示：酒母の仕込み時の表に直接入力できるように。順号の欄の「酛卸 ◯/◯」と「仕込み時」のボタンを削除。
   ・🧫酒母の表（今年・入力つき）は仕込時を常に表示（kgBox 本体の fixM を直接修正。昨年度の表はボタンのまま）
   ・1日目の列の Be／alc／酸度／アミノ酸 の行（1・2日目は分析しないので空いている）に 尺／量／水麹／蒸米 の入力欄（KG_SET_S と同じ並び）
   ・尺を入れると酒母タンクの容量早見表でその場で量（oroVol。照合できていない容器・範囲外・酒母T未設定は量を手で）
   ・保存は欄を離れたとき（Enter）にすぐ裏で shubo_save {setup:{…}}。仕込時の値がそろうと日々の欄の鍵が外れる（表を描き直す）
   控え：seishu-workbook_github\_src_sbset1020.js（index.html の sbset1020 の目印の間） */
const SBS_ROW={ 'Be':['shaku','尺',0], 'alc':['ryo','量',0], '酸度':['mizukoji','水麹',1], 'アミノ酸':['mushi','蒸米',1] };
function sbsPaint(box){
  box.querySelectorAll('.kg-t.ed:not(.mk) tr[data-kg]').forEach(tr=>{
    const f=tr.querySelector('td.f'), d=f&&SBS_ROW[f.textContent.trim()]; if(!d) return;
    const td=tr.querySelector('td[data-i="1"]'); if(!td||td.querySelector('.kg-i')) return;
    const no=tr.dataset.kg, s=RC.shubo&&RC.shubo[no]; if(!s) return;
    const u=s.setup||{}, v=u[d[0]]==null?'':String(u[d[0]]);
    const val=v!==''&&d[2]&&shN(v)!==null?shF(v,1):v;
    td.classList.add('ssc');
    td.innerHTML=`<span class="ssl">${d[1]}</span><input class="kg-ss${v===''?' sneed':''}" data-no="${esc(String(no))}" data-sk="${d[0]}" type="text" inputmode="decimal" autocomplete="off" value="${esc(val)}" aria-label="順号${esc(String(no))} 仕込時 ${d[1]}">`;
  });
  box.querySelectorAll('.kg-ss').forEach(el=>{
    if(el.dataset.sb) return; el.dataset.sb='1'; el.dataset.igSkip='1';
    const no=el.dataset.no, k=el.dataset.sk, m=rcMaster(no)||{};
    const other=kk=>box.querySelector(`.kg-ss[data-no="${CSS.escape(no)}"][data-sk="${kk}"]`);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('input',()=>{ el.classList.add('dirty'); el.classList.remove('sneed');
      if(k==='shaku'){ const ry=other('ryo'), mm=pnum(el.value); if(ry&&mm!==null){ const r=oroVol(m,mm); if(r.L!==undefined){ ry.value=String(r.L); ry.classList.add('dirty','auto'); ry.title=`T${r.T} 早見表：尺 ${mm}mm → ${r.L} L（自動）`; } else ry.title=(r.err||'')+'（量は手で入れてください）'; } } });
    el.addEventListener('change',()=>sbsSave(box,no));
  });
  if(!TANKS) loadTanks().catch(()=>{});
}
function sbsSave(box, no){
  const s=RC.shubo&&RC.shubo[no]; if(!s) return;
  const u=s.setup||(s.setup={}), setup={};
  box.querySelectorAll(`.kg-ss[data-no="${CSS.escape(String(no))}"]`).forEach(el=>{
    const k=el.dataset.sk, v=el.value.trim();
    if(v!==''&&pnum(v)===null){ el.classList.add('bad'); return; } el.classList.remove('bad');
    if(!rcSame(v, u[k]==null?'':u[k])) setup[k]=v; el.classList.remove('dirty'); });
  if(!Object.keys(setup).length) return;
  const was=shSetupMissing(s).length;
  Object.assign(u, setup);
  recSaveBg({action:'shubo_save', no, setup}, `酒母 順号${no} 仕込時の値`, true);
  rcToast(`順号${no} 仕込時の値を保存しています（裏で送ります）`);
  if(was && !shSetupMissing(s).length && KGE.draw) setTimeout(()=>{ if(document.body.contains(box)) KGE.draw(); },50);   // 仕込時の値がそろったら日々の欄を使えるように
}
(function(){
  const o=window.kgBox; if(typeof o!=='function') return;
  window.kgBox=function(box, fields, rows, opt, open){
    const r=o.apply(this, arguments);
    try{ if(box&&opt&&opt.shubo&&opt.edit) sbsPaint(box); }catch(e){ console.log('sbs',e); }
    return r;
  };
})();

.kg-ss{width:44px;height:20px;box-sizing:border-box;border:1px solid rgba(150,140,115,.35);border-radius:4px;padding:0 3px;font:inherit;font-weight:700;font-size:12px;line-height:18px;text-align:right;background:#fff;color:var(--navy);margin:0;vertical-align:middle}

</script>

<script>
/* ================= 🧫 酒母の表：「酛卸済も表示」（2026-10-20） =================
   泰広さん指示：酛卸をした後の酒母を直したい → 案A「酒母の表の上に『酛卸済も表示』の切り替え」に決定。
   ・ふだんの酒母の表は今までどおり（酛立〜留の翌日まで。shuboList）
   ・切り替えを入れると、その後ろに「酛卸済」（留の翌日を過ぎたもの）のうち留が SBD_DAYS 日以内のものを新しい順に足す
     同じ表でそのまま直せる（日々の値・仕込時の値・酛卸の尺・量・卸先。保存のしかたも同じ）。列は13日目まで
   ・切り替えは端末に覚える（lsGet 'sb.done'）。順号の下に「酛卸済」の札
   ・kgHome（酒母）の list=shuboList(...) を sbdList(st) に直接置きかえ
   ・2026-10-21 泰広さん指示：ボタンの名前を「履歴を表示」に。履歴（酛卸済）は今の酒母の【上】に古い順で並べ、
     開いたときは今の酒母の先頭が表の一番上に来るように表をスクロール → 上へスクロールすると履歴が順番どおり見られる
   控え：seishu-workbook_github\_src_sbdone1020.js（index.html の sbdone1020 の目印の間） */
const SBD_DAYS=30;
function sbdOn(){ return true; }   /* 2026-10-21 泰広さん指示：「履歴を表示」を押さなくても、いつも今の酒母の上に履歴（上へスクロールで見られる）。ボタンは削除 */
function sbdList(st){
  const cur=shuboList(st).map(x=>x.m);
  if(!sbdOn()) return cur;
  const today=dtoday(), from=dadd(today,-SBD_DAYS), have=new Set(cur.map(m=>String(m.no)));
  const done=((st&&st.master)||[]).filter(m=>m.motodate&&m.tome&&!have.has(String(m.no))&&rcShuboDay(m,today)>rcDays(m.motodate,m.tome)+1&&m.tome>=from)
    .sort((a,b)=>a.motodate.localeCompare(b.motodate)||a.no-b.no);   /* 2026-10-21 古い順（今の酒母と同じ並び） */
  done.forEach(m=>SBD.done.add(String(m.no)));
  SBD.cur=cur.length?String(cur[0].no):'';
  return done.concat(cur);   /* 2026-10-21 履歴を今の酒母の上に */
}
const SBD={ done:new Set(), cur:'' };
/* 酛卸済の行：列は13日目まで・「酛卸済」の札 */
(function(){
  const o=window.kgShuboRows; if(typeof o!=='function') return;
  window.kgShuboRows=function(){ const rows=o.apply(this, arguments);
    rows.forEach(r=>{ if(!SBD.done.has(String(r.no))) return;
      r.n=Math.min(r.n||13, 13); r.today=null; r.cls=(r.cls||'')+' sbd';
      if(r.head) r.head=r.head.replace('</b>','</b><span class="sbd-tag">酛卸済</span>'); });
    return rows; };
})();
(function(){
  const o=window.kgBox; if(typeof o!=='function') return;
  window.kgBox=function(box, fields, rows, opt, open){
    const first=!!(box&&!box.querySelector('.kg-tw'));
    const r=o.apply(this, arguments);
    /* 2026-10-21 履歴を表示しているときは、最初に描いたときだけ 今の酒母の先頭を表の一番上に（上へスクロールで履歴） */
    try{ if(first&&box&&opt&&opt.shubo&&opt.edit&&sbdOn()){ const tw=box.querySelector('.kg-tw');
      if(tw){ const go1=()=>{ const td=SBD.cur?tw.querySelector(`td.n[data-kgno="${SBD.cur}"]`):null;
          if(!td){ tw.scrollTop=tw.scrollHeight; return; }
          const th=tw.querySelector('thead'), hh=th?th.getBoundingClientRect().height:0;
          tw.scrollTop+=td.getBoundingClientRect().top-tw.getBoundingClientRect().top-hh; };
        go1(); requestAnimationFrame(go1); } } }catch(e){ console.log('sbd scroll',e); }
    try{ if(false&&box&&opt&&opt.shubo&&opt.edit){ const bar=box.querySelector('.rc-bar'); if(bar&&!bar.querySelector('.sbd-btn')){   /* 2026-10-21 ボタンは出さない */
      const on=sbdOn(), b=document.createElement('button'); b.type='button'; b.className='rc-chip sbd-btn'+(on?' on':'');
      b.textContent=on?'履歴を表示 ✓':'履歴を表示';   /* 2026-10-21 名前を「履歴を表示」に */
      b.onclick=()=>{ lsSet('sb.done', !on); shuboHome(); };
      bar.prepend(b); } } }catch(e){ console.log('sbd',e); }
    return r;
  };
})();
(function(){ const s=document.createElement('style'); s.textContent=`
.rc-chip.sbd-btn{border:1px solid #9fb3cf;background:#fff;color:var(--navy);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.rc-chip.sbd-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kg-t td.n .sbd-tag{display:inline-block;margin:2px 0 0;font-size:10px;font-weight:800;color:#fff;background:#8a6cc8;border-radius:5px;padding:0 5px;vertical-align:middle}`; document.head.appendChild(s); })();
</script>

<script>
/* ================= ⚡ 酒母・仕込みの読み込みを速く：まとめて取る（2026-10-21） =================
   泰広さん指示：情報量が多くなってきて反映される時間が長くなってきている。短縮できないか。
   測定（2026-10-21）：bunseki_get／shubo_get は1本ごとに1回の通信で 3〜6秒（とっておきがあっても約1.1秒）。3本ずつ順に取るので 醪9本で約15秒、酒母11本で約17秒。
   ・同じ瞬間（30ms 以内）に出た bunseki_get／shubo_get をまとめ、サーバーの rec_many（一括読み込み.gs）で数本ずつ1回の通信にする。
     まとめた束は同時に送る（最大 RM_PAR 本）。1束の本数は全体を RM_PAR 等分（RM_MIN〜RM_MAX 本）
   ・受け取った答えは1本ずつ今までどおり返す（端末の控え・裏で最新・送信待ちの重ね合わせはそのまま）
   ・サーバーが古い（rec_many を知らない）ときは、今までどおり1本ずつ（RM.off）
   ・shFetchMany は3本ずつ → まとめて出す（RM が使えるとき）
   ・仕組み：一番もとの recApi（recApiNet）の頭で rmEnqueue に回す。本体の直しは1行（_読み込みをまとめる_20261021.py）
   控え：seishu-workbook_github\_src_rmany1021.js（index.html の rmany1021 の目印の間） */
const RM={ q:[], tm:null, off:false };
const RM_PAR=4, RM_MIN=3, RM_MAX=8, RM_WAIT=30;
function rmEnqueue(body, ms){
  return new Promise((res,rej)=>{ RM.q.push({body, ms, res, rej}); if(!RM.tm) RM.tm=setTimeout(rmFlush, RM_WAIT); });
}
function rmFlush(){
  const all=RM.q; RM.q=[]; RM.tm=null; if(!all.length) return;
  /* 同じもの（action と no が同じ）は1つにまとめる */
  const groups=new Map();
  all.forEach(x=>{ const k=x.body.action+'|'+x.body.no; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(x); });
  const keys=[...groups.keys()];
  const size=Math.max(RM_MIN, Math.min(RM_MAX, Math.ceil(keys.length/RM_PAR)));
  for(let i=0;i<keys.length;i+=size) rmSend(keys.slice(i,i+size).map(k=>groups.get(k)));
}
async function rmSend(gs){
  const one=gs.map(g=>g[0]);
  const items=one.map(x=>({action:x.body.action, no:x.body.no}));
  const ms=Math.max(...one.map(x=>x.ms||40000)) + 15000;
  const done=(g,r)=>g.forEach(x=>x.res(r)), fail=(g,e)=>g.forEach(x=>x.rej(e));
  try{
    if(RM.off) throw new Error('off');
    const j=await recApiNet({action:'rec_many', items}, ms);
    if(!j || !j.ok || !Array.isArray(j.res)){ if(j && /unknown_action/.test(j.err||'')) RM.off=true; throw new Error((j&&j.err)||'rec_many'); }
    gs.forEach((g,i)=>{ const r=j.res[i]; if(r && r.ok) done(g,r); else rmOne(g); });
  }catch(e){
    gs.forEach(g=>rmOne(g));
  }
}
/* 1本ずつ（今までと同じ取り方） */
async function rmOne(g){
  const x=g[0];
  try{ const r=await rmDirect(x.body, x.ms); g.forEach(y=>y.res(r)); }catch(e){ g.forEach(y=>y.rej(e)); }
}
function rmDirect(body, ms){ const o=RM.off; RM.off=true; try{ return recApiNet(body, ms); } finally{ RM.off=o; } }

</script>
