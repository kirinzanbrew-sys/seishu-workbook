const shN=v=>(v===''||v===null||v===undefined||isNaN(Number(v)))?null:Number(v);
const shF=(v,d=1)=>{ const n=shN(v); return n===null?'':(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); };
function shLast(days,f){ for(let i=days.length-1;i>=0;i--){ const v=shN(days[i][f]); if(v!==null) return {v,day:days[i].day}; } return null; }

/* ---- 折れ線（左軸・右軸の2本まで。今日の縦線つき） ---- */
function shChart(n, labels, series, todayIdx){
  const W=360,H=160,L=34,R=34,T=12,B=26, pw=W-L-R, ph=H-T-B;
  const x=i=>L+(n<=1?pw/2:pw*i/(n-1));
  const rng=vals=>{ const a=vals.filter(v=>v!==null); if(!a.length) return null; let lo=Math.min(...a), hi=Math.max(...a); if(hi-lo<1){ lo-=0.5; hi+=0.5; } const p=(hi-lo)*0.08; return [lo-p,hi+p]; };
  let g=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#faf8f2"/><!--B-->`;
  if(todayIdx>=0&&todayIdx<n) g+=`<line x1="${x(todayIdx)}" y1="${T}" x2="${x(todayIdx)}" y2="${T+ph}" stroke="#d8a100" stroke-width="1.5"/><text x="${x(todayIdx)+3}" y="${T+10}" font-size="10" fill="#9a7400">今日</text>`;
  const step=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i+=step) g+=`<text x="${x(i)}" y="${H-12}" font-size="9" fill="#6b7280" text-anchor="middle">${labels[i]}</text>`;
  let leg='', lx=L;
  const grp={}; series.forEach(s=>{ const k=s.axis; (grp[k]=grp[k]||[]).push(...s.vals,...(s.pm||[])); });
  const xc=v=>Math.max(L,Math.min(L+pw,v)), off=n<=1?pw/6:pw/(n-1)/4;  /* 2026-10-05 品温AM→PMを1本の線に */
  series.forEach(s=>{
    if(!s.vals.some(v=>v!==null)&&!(s.pm&&s.pm.some(v=>v!==null))) return;
    const r=rng(grp[s.axis]); if(!r) return;
    const y=v=>T+ph-(v-r[0])/(r[1]-r[0])*ph;
    const ax=s.axis==='R'?W-R+3:L-3, anc=s.axis==='R'?'start':'end';
    if(s.std){ let d=''; s.vals.forEach((v,i)=>{ if(v===null) return; d+=(d?' L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); });
      g=g.replace('<!--B-->',`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="8" stroke-opacity=".2" stroke-linecap="round" stroke-linejoin="round"/><!--B-->`);
      leg+=`<rect x="${lx}" y="${H-7}" width="10" height="5" fill="${s.color}" fill-opacity=".3"/><text x="${lx+13}" y="${H-2}" font-size="10" fill="#6b7280">${esc(s.name)}</text>`; lx+=16+s.name.length*11; return; }
    g+=`<text x="${ax}" y="${T+8}" font-size="9" fill="${s.color}" text-anchor="${anc}">${shF(r[1],1)}</text><text x="${ax}" y="${T+ph}" font-size="9" fill="${s.color}" text-anchor="${anc}">${shF(r[0],1)}</text>`;
    let d='', pts='';
    if(s.pm){ const q=[]; s.vals.forEach((v,i)=>{ if(v!==null&&v!==undefined) q.push([xc(x(i)-off),v,0]); const p=s.pm[i]; if(p!==null&&p!==undefined) q.push([xc(x(i)+off),p,1]); });
      q.forEach(([px,v,pm])=>{ d+=(d?' L':'M')+px.toFixed(1)+','+y(v).toFixed(1); pts+=pm?`<circle cx="${px.toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="#fff" stroke="${s.color}" stroke-width="1.4"/>`:`<circle cx="${px.toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="${s.color}"/>`; }); }
    else s.vals.forEach((v,i)=>{ if(v===null) return; d+=(d?' L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); pts+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${s.dash?2:2.6}" fill="${s.color}"/>`; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.8:2.4}" ${s.dash?'stroke-dasharray="4 3"':''}/>${pts}`;
    leg+=`<rect x="${lx}" y="${H-6}" width="10" height="3" fill="${s.color}"/><text x="${lx+13}" y="${H-2}" font-size="10" fill="${s.color}">${esc(s.name)}</text>`; lx+=16+s.name.length*11;
  });
  return `<div class="sh-chart"><svg viewBox="0 0 ${W} ${H+4}" width="100%" role="img" aria-label="経過グラフ">${g}${leg}</svg></div>`;
}
/* ---- 表（横＝日、縦＝項目）。rows=[[見出し, 日ごとの値の関数, {req:true なら今日の空欄を点線}]] ---- */
function shTable(days, head1, rows, todayDay){
  let h=`<div class="sh-tw" id="shTw"><table class="sh-t"><tr><th class="k">日</th>${days.map(x=>`<th data-d="${x.day}" class="${x.day===todayDay?'td':''}">${head1(x)}</th>`).join('')}</tr>
    <tr><th class="k">日付</th>${days.map(x=>`<th data-d="${x.day}" class="${x.day===todayDay?'td':''}">${rcMD(x.date)}</th>`).join('')}</tr>`;
  rows.forEach(([k,fn,o])=>{ o=o||{};
    h+=`<tr><td class="k">${k}</td>${days.map(x=>{ const v=fn(x); const e=(v===''||v===null||v===undefined);
      return `<td data-d="${x.day}" class="${e?(o.req?'miss':''):'v'} ${x.day===todayDay?'td':''}">${e?'':v}</td>`; }).join('')}</tr>`; });
  return h+`</table></div>`;
}
function shBindTable(open){
  app.querySelectorAll('.sh-t [data-d]').forEach(c=>c.onclick=()=>open(Number(c.dataset.d)));
  const tw=$('#shTw'), on=tw&&tw.querySelector('th.td');
  if(on) tw.scrollLeft=Math.max(0,on.offsetLeft-tw.clientWidth/2+on.offsetWidth/2);
}
/* 何本もの経過を裏で取る（3本ずつ）。取れたら onEach を呼ぶ */
async function shFetchMany(nos, action, store, onEach){
  let i=0;
  const worker=async()=>{ while(i<nos.length){ const no=nos[i++];
    try{ const r=await recApi({action,no},40000); if(r&&r.ok){ store[no]=r; onEach(no); } }catch(e){} } };
  await Promise.all([worker(),worker(),worker()]);
}

/* ================= 🧫 酒母 ================= */
function shuboList(st){
  const today=dtoday();
  return st.master.filter(m=>m.motodate).map(m=>({m,d:rcShuboDay(m,today)}))
    .filter(x=>x.d>=-3 && x.d<=rcDays(x.m.motodate,x.m.tome)+1).sort((a,b)=>a.m.motodate.localeCompare(b.m.motodate)||a.m.no-b.m.no);
}
function shuboRowHTML(m,d){
  const s=RC.shubo[m.no], dd=s&&s.days||[];
  const be=shLast(dd,'be'), ta=shLast(dd,'ta'), td=d>=1&&dd[d-1];
  const temp=td?shN(td.temp):null;
  return `<button class="sh-row ${d>=1?'now':''}" data-no="${m.no}"><span class="st"></span>
    <span class="id">${m.no}<small>${esc(m.shuboSym||m.sym||'')}${m.shuboT?' T'+esc(m.shuboT):''}</small></span>
    <span class="mid">${esc(m.liquid||'')}<small>${d>=1?d+'日目':'酛立まで'+(1-d)+'日'}・酵母 ${esc(m.yeast||'—')}</small>${s&&d>=1&&shSetupMissing(s).length?'<span class="wn">仕込時の値 未入力</span>':''}</span>
    <span class="c"><small>Be</small>${s?(be?shF(be.v):'—'):'…'}</span>
    <span class="c"><small>酸度</small>${s?(ta?shF(ta.v):'—'):'…'}</span>
    <span class="c ${d>=1&&s&&temp===null?'miss':''}"><small>今日の品温</small>${d<1?'—':!s?'…':temp===null?'未':shF(temp)}</span></button>`;
}
async function shuboHome(){
  head('酒母','分析酒母（今日の一覧 → 1本ずつの経過表）');
  rcLoading('酒母の一覧を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const list=shuboList(st);
  let h=(typeof o2Btn==='function'?o2Btn('shubo'):'')+`<div class="rc-status" id="rcStatus"></div>`;
  h+=list.length?list.map(({m,d})=>shuboRowHTML(m,d)).join(''):`<p class="muted" style="text-align:center;padding:20px 0">育成中の酒母はありません</p>`;
  h+=`<div class="rc-bar" style="margin-top:8px"><button class="rc-ghost" id="rcReload">更新</button><span class="tl-note" style="margin:0">「未」＝今日の品温がまだ。押すとその酒母の経過表（分析酒母シートと同じ並び）が開きます。</span></div>`;
  app.innerHTML=h;
  const bind=()=>app.querySelectorAll('.sh-row[data-no]').forEach(b=>b.onclick=()=>go(()=>shuboSheet(b.dataset.no)));
  bind();
  $('#rcReload').onclick=async()=>{ rcStatus('更新中…'); await recState(true); list.forEach(({m})=>RC.shubo[m.no]=null); shuboHome(); };
  const myTop=nav[nav.length-1];
  shFetchMany(list.filter(({m})=>!RC.shubo[m.no]).map(({m})=>m.no),'shubo_get',RC.shubo,no=>{
    if(nav[nav.length-1]!==myTop) return;
    const b=app.querySelector(`.sh-row[data-no="${no}"]`), x=list.find(y=>String(y.m.no)===String(no));
    if(b&&x){ const t=document.createElement('div'); t.innerHTML=shuboRowHTML(x.m,x.d); b.replaceWith(t.firstElementChild); bind(); }
  });
}
/* 酒母の仕込時の値（必須） */
const SH_SETUP = [['shaku','仕込尺','mm','1'],['ryo','仕込量','L','1'],['mizukoji','水麹','℃','0.1'],['mushi','蒸米','℃','0.1']];
function shSetupMissing(s){ const u=s&&s.setup; if(!u) return [];   /* サーバー（醸造記録 R8BY）が古いときは止めない */ return SH_SETUP.filter(([f])=>shN(u[f])===null).map(x=>x[1]); }
async function shuboSheet(no){
  const m=rcMaster(no)||{};
  head(`酒母 順号 ${no}　${m.shuboSym||m.sym||''}`, `${m.liquid||''}　${m.shuboT?'T'+m.shuboT:'酒母タンク未設定'}　酵母 ${m.yeast||'—'}`);
  let s=RC.shubo[no];
  if(!s){ rcLoading('酒母経過を読み込んでいます…'); try{ const r=await recApi({action:'shubo_get',no},40000); if(r&&r.ok){ s=r; RC.shubo[no]=r; } }catch(e){} }
  if(!s){ rcFail(); return; }
  const days=s.days||[], dT=rcShuboDay(m,dtoday());
  const be=shLast(days,'be'), ta=shLast(days,'ta');
  const oro=s.motooroshi||s.motooroshiPlan||'';
  const left=oro?rcDays(dtoday(),oro):null;
  const miss=shSetupMissing(s), u=s.setup||{};
  let h=`<div class="sh-tiles"><div><small>${dT>=1?'今日':'酛立まで'}</small><b>${dT>=1?dT+'日目':(1-dT)+'日'}</b></div>
    <div><small>Be${be?'（'+be.day+'日）':''}</small><b>${be?shF(be.v):'—'}</b></div>
    <div><small>酸度${ta?'（'+ta.day+'日）':''}</small><b>${ta?shF(ta.v):'—'}</b></div>
    <div><small>${s.motooroshi?'酛卸':'酛卸予定'}</small><b>${oro?rcMD(oro):'—'}</b></div></div>`;
  h+=`<button class="sh-setup ${miss.length&&dT>=1?'ng':''}" id="shSet"><span class="t">仕込時</span>
    ${SH_SETUP.map(([f,l,un])=>`<span><small>${l}</small><b>${shN(u[f])!==null?shF(u[f],un==='℃'?1:0)+'<i>'+un+'</i>':'未'}</b></span>`).join('')}<span class="go">›</span></button>`;
  if(miss.length&&dT>=1) h+=`<div class="tl-warn" style="margin:0 0 8px">仕込時の値（${miss.join('・')}）が未入力です。押して入れてください（入れるまで日々の分析は保存できません）。</div>`;
  h+=shChart(days.length, days.map(x=>x.day), [
    {name:'ボーメ', color:'#1f5fa8', axis:'L', vals:days.map(x=>shN(x.be))},
    {name:'品温(●AM○PM)', color:'#c0392b', axis:'R', vals:days.map(x=>shN(x.temp)), pm:days.map(x=>shN(x.tPM))}], dT-1);
  h+=shTable(days, x=>x.day, [
    ['Be', x=>shF(x.be)], ['alc', x=>shF(x.alc)], ['酸度', x=>shF(x.ta)],
    ['品温', x=>{ const a=shF(x.temp), p=shF(x.tPM); return a||p?`${a||'—'}<span class="pm">${p||'—'}</span>`:''; }, {req:true}],
    ['備考', x=>x.biko?`<span style="font-weight:400;font-size:11px">${esc(String(x.biko).slice(0,8))}</span>`:'']], dT);
  h+=`<p class="sh-note">品温は上段＝午前・下段(小)＝午後。表の日（列）を押すと、その日の入力画面が開きます。乳酸 ${esc(m.nyusan||(s.head&&s.head.nyusan)||'—')}ml${left!==null&&left>=0?`・酛卸まであと${left}日`:''}${s.biko?'・備考：'+esc(s.biko):''}。</p>`;
  app.innerHTML=h;
  shBindTable(d=>go(()=>shuboInput(no,d)));
  $('#shSet').onclick=()=>go(()=>shuboInput(no, Math.min(13,Math.max(1,dT||1)), 'setup'));
}
/* 酒母の入力（今までの画面を差し替え：品温 午前・午後、仕込時の値） */
shuboInput = async function(no, day, focus){
  const m=rcMaster(no)||{};
  head(`酒母 順号 ${no}　${m.shuboSym||m.sym||''}`, `${m.liquid||''}　${m.shuboT?'T'+m.shuboT:'酒母タンク未設定'}　酵母 ${m.yeast||'—'}`);
  let s=RC.shubo[no];
  if(!s){ rcLoading('酒母経過を読み込んでいます…'); try{ const r=await recApi({action:'shubo_get',no},40000); if(r&&r.ok){ s=r; RC.shubo[no]=r; } }catch(e){} }
  if(!s){ rcFail(); return; }
  const dToday=rcShuboDay(m,dtoday());
  const has=d=>{ const x=s.days[d-1]; return x&&(x.temp!==''||x.tPM!==''&&x.tPM!==undefined||x.be!==''||x.ta!==''||x.alc!==''||x.biko); };
  if(!day) day=Math.min(13,Math.max(1,dToday||1));
  const D=s.days[day-1], u=s.setup||{}, miss=shSetupMissing(s);
  const defs=[['temp','品温 午前 ℃'],['tPM','品温 午後 ℃'],['be','Be（ボーメ）'],['ta','酸度'],['alc','alc %'],['biko','備考',{type:'text'}]];
  const setupCard=`<div class="card" id="shSetCard" style="${miss.length?'border:2px solid var(--ng)':''}"><b style="font-size:15px">仕込時の値</b> <span class="muted" style="font-size:12px">${miss.length?'<b style="color:var(--ng)">必須・未入力あり</b>':'入力済み'}</span>
      <div class="rc-grid" style="margin-top:8px">${SH_SETUP.map(([f,l,un,st])=>rcField('sh_'+f,`${l} ${un}`,u[f],{step:st})).join('')}</div>
      <div class="rc-actions"><button class="rc-btn" id="shSetSave">仕込時の値を保存</button></div></div>`;
  const dayCard=`<div class="card"><b style="font-size:16px">${day}日目　${djp(D.date)}</b>
      <div class="rc-grid" style="margin-top:8px">${defs.map(([f,l,o])=>rcField('rc_'+f,l,D[f],o)).join('')}</div>
      <div class="rc-status" id="rcStatus"></div>
      <div class="rc-actions"><button class="rc-btn" id="rcSave">保存</button></div></div>`;
  app.innerHTML=`<div class="rc-days" id="rcDays">${s.days.map(x=>`<button data-d="${x.day}" class="${x.day===day?'on':(has(x.day)?'has':'')}">${x.day}日<small>${rcMD(x.date)}</small></button>`).join('')}</div>
    ${(miss.length||focus==='setup')?setupCard+dayCard:dayCard+setupCard}
    <div class="card"><div class="rc-grid">${rcField('rc_moto','酛卸日',s.motooroshi,{type:'date',hint:s.motooroshiPlan?'予定 '+rcMD(s.motooroshiPlan):''})}${rcField('rc_biko2','酒母の備考',s.biko,{type:'text'})}</div>
      <div class="rc-actions"><button class="rc-btn" id="rcSave2">酛卸日・備考を保存</button></div></div>
    <p class="tl-note">経過の表・グラフは前の画面（酒母 → 順号）で見られます。乳酸 ${esc(m.nyusan||(s.head&&s.head.nyusan)||'—')}ml。</p>`;
  const dv=$('#rcDays'); const on=dv.querySelector('.on'); if(on) dv.scrollLeft=Math.max(0,on.offsetLeft-dv.clientWidth/2+30);
  dv.querySelectorAll('button').forEach(x=>x.onclick=()=>shuboInput(no,Number(x.dataset.d)));
  if(focus==='setup'){ const c=$('#shSetCard'); if(c) c.scrollIntoView({block:'start'}); }
  const again=()=>{ RC.shubo[no]=null; setTimeout(()=>shuboInput(no,day),400); };
  $('#shSetSave').onclick=async()=>{
    const setup={}; SH_SETUP.forEach(([f])=>{ const v=$('#sh_'+f).value; if(String(v)!==String(u[f]??'')) setup[f]=v; });
    const after=SH_SETUP.filter(([f])=>(f in setup?setup[f]:u[f])===''||(f in setup?setup[f]:u[f])==null).map(x=>x[1]);
    if(!Object.keys(setup).length){ rcStatus(after.length?'未入力：'+after.join('・'):'変わったところがありません',!!after.length); return; }
    /* 2026-10-06：画面を閉じて裏で送る */
    s.setup=Object.assign(s.setup||{},setup); recSaveBg({action:'shubo_save',no,setup},`酒母 順号${no} 仕込時の値`); hBack.click(); return;
    $('#shSetSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'shubo_save',no,setup},40000);
      if(res&&res.ok){ rcStatus(after.length?'保存しました（まだ未入力：'+after.join('・')+'）':'仕込時の値を保存しました',!!after.length); again(); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#shSetSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#shSetSave').disabled=false; }
  };
  $('#rcSave').onclick=async()=>{
    if(miss.length){ rcStatus('先に「仕込時の値」（'+miss.join('・')+'）を入れて保存してください',true); const c=$('#shSetCard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const values={}; defs.forEach(([f])=>{ const v=$('#rc_'+f).value; if(String(v)!==String(D[f]??'')) values[f]=v; });
    if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    Object.assign(D,values); recSaveBg({action:'shubo_save',no,day,values},`酒母 順号${no} ${day}日目`); hBack.click(); return;   // 2026-10-06：画面を閉じて裏で送る
    $('#rcSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'shubo_save',no,day,values},40000);
      if(res&&res.ok){ rcStatus(`${day}日目 を保存しました`); again(); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#rcSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#rcSave').disabled=false; }
  };
  $('#rcSave2').onclick=async()=>{
    const body={action:'shubo_save',no}; const mo=$('#rc_moto').value, bk=$('#rc_biko2').value;
    if(mo!==(s.motooroshi||'')) body.motooroshi=mo; if(bk!==(s.biko||'')) body.biko=bk;
    if(!('motooroshi' in body)&&!('biko' in body)){ rcStatus('変わったところがありません'); return; }

async function moromiSheet(no){
  const m=rcMaster(no)||{};

  let b=RC.bun[no];
  if(!b){ rcLoading('分析値を読み込んでいます…'); try{ const r=await recApi({action:'bunseki_get',no},40000); if(r&&r.ok){ b=r; RC.bun[no]=r; } }catch(e){} }
  if(!b){ rcFail(); return; }
  const days=b.days||[], calc=b.calc||{}, dT=rcMoromiDay(m,dtoday());
  const be=shLast(days,'be'), alc=shLast(days,'alc');
  const bm=(()=>{ for(let i=days.length;i>=1;i--){ const v=shN((calc[i]||{}).bmd); if(v!==null) return {v,day:i}; } return null; })();
  const t=(RC.state&&RC.state.today&&RC.state.today[no])||{};
  const dl=d=>d===1?'留':d;
  let h=`<div class="sh-tiles"><div><small>${dT>=1?'今日':'留まで'}</small><b>${dT>=1?dT+'日目':(1-dT)+'日'}</b></div>
    <div><small>Be/日本酒度${be?'（'+dl(be.day)+'）':''}</small><b>${be?shF(be.v):'—'}</b></div>
    <div><small>alc${alc?'（'+dl(alc.day)+'）':''}</small><b>${alc?shF(alc.v):'—'}</b></div>
    <div class="${t.warn?'w':''}"><small>BMD${bm?'（'+dl(bm.day)+'）':''}</small><b>${bm?shF(bm.v):'—'}</b></div></div>`;
  if(t.warn) h+=`<div class="tl-warn" style="margin:0 0 8px">${esc(t.warn)}</div>`;
  const last=Math.max(dT||1, ...days.filter(x=>shN(x.be)!==null||shN(x.tAM)!==null).map(x=>x.day), 1);
  const upto=Math.min(days.length, Math.max(last+3, 12));
  const dd=days.slice(0,upto);
  h+=shChart(dd.length, dd.map(x=>dl(x.day)), [
    {name:'標準BMD', color:'#1f5fa8', axis:'L', std:true, vals:dd.map(x=>shN((calc[x.day]||{}).bmdStd))},
    {name:'標準品温', color:'#c0392b', axis:'R', std:true, vals:dd.map(x=>shN((calc[x.day]||{}).tStd))},
    {name:'BMD', color:'#1f5fa8', axis:'L', vals:dd.map(x=>shN((calc[x.day]||{}).bmd))},
    {name:'品温', color:'#c0392b', axis:'R', dash:true, vals:dd.map(x=>shN(x.tAM))}], dT-1);
  h+=moromiSetupTable(b);
  h+=shTable(dd, x=>dl(x.day), [
    ['Be/度', x=>shF(x.be)], ['alc', x=>shF(x.alc)], ['酸', x=>shF(x.ta)], ['ｱﾐﾉ', x=>shF(x.aa)], ['追水', x=>shF(x.oimizu,0)],
    ['品温', x=>{ const a=shF(x.tAM), p=shF(x.tPM); return a||p?`${a||'—'}${p?`<span class="pm">${p}</span>`:''}`:''; }, {req:true}],
    ['BMD', x=>shF((calc[x.day]||{}).bmd)],
    ['注意', x=>{ const k=calc[x.day]||{}; return k.warn?`<span class="wn">!</span>`:(k.rec?`<span style="font-size:10px">追${rcN(k.rec)}</span>`:''); }]], dT);
  h+=`<p class="sh-note">グラフの薄い帯＝醪DBの標準BMD・標準品温。横＝留・2日目…（${upto}日目まで表示。入力が進むと伸びます）、品温は上段＝AM・下段(小)＝PM。表の日（列）を押すと、その日の入力画面（保存すると BMD・追水の推奨を計算）が開きます。Be は3.0未満になったら日本酒度で入力（R7BYと同じ）。追水計画 ${esc(m.oimizu||'—')}L／四段 ${esc(m.yodan||'—')}L／アル添 ${esc(m.alc||'—')}L。</p>
    <button class="sh-link" id="shKarte">📋 この仕込のカルテ（麹・酒母・上槽・原酒評価）<span>›</span></button>`;
  app.innerHTML=h;
  shBindTable(d=>go(()=>moromiInput(no,d)));
  app.querySelectorAll('[data-st]').forEach(c=>c.onclick=()=>go(()=>moromiSetup(no,c.dataset.st)));
  $('#shKarte').onclick=()=>go(()=>karteScreen(no));
}

/* ---- 醪：添・踊・仲・留 の仕込み時の値（分析醪の 添H・踊K・仲M・留P 列） ---- */
const MR_STAGES=[['soe','添'],['odori','踊'],['naka','仲'],['tome','留']];
const MR_SETUP=[['shaku','尺','mm','1'],['ryo','量','L','1'],['kumi','汲水','L','1'],['kori','氷','L','1'],['mizukoji','水麹','℃','0.1'],['mushi','蒸米','℃','0.1'],['hin','品温','℃','0.1']];
const MR_ODORI=[['be','Be','','0.1'],['ta','酸度','','0.1'],['aa','ｱﾐﾉ','','0.1'],['hin','品温','℃','0.1']];
function moromiSetupTable(b){
  const S=b.setup||{}, today=dtoday();
  const cell=(st,f)=>{ const v=shN((S[st]||{})[f]); return v===null?'':shF(v,/shaku|ryo|kumi|kori/.test(f)?0:1); };
  let h=`<div class="rc-h" style="margin-top:4px">仕込み時<small>押すと入力（分析醪シートの 添・踊・仲・留）</small></div><div class="sh-st"><div class="sh-tw"><table class="sh-t"><tr><th class="k"></th>${MR_STAGES.map(([st,l])=>`<th data-st="${st}">${l}<br><span style="font-weight:400">${rcMD((S[st]||{}).date)}</span></th>`).join('')}</tr>`;
  const rows=[['尺','shaku'],['量','ryo'],['汲水','kumi'],['氷','kori'],['水麹','mizukoji'],['蒸米','mushi'],['品温','hin'],['Be','be'],['酸度','ta'],['ｱﾐﾉ','aa']];
  rows.forEach(([l,f])=>{
    h+=`<tr><td class="k">${l}</td>${MR_STAGES.map(([st])=>{ const ok=st==='odori'?MR_ODORI.some(x=>x[0]===f):MR_SETUP.some(x=>x[0]===f);
      if(!ok) return `<td data-st="${st}" style="background:#f6f3ea"></td>`;
      const v=cell(st,f), due=(S[st]||{}).date && (S[st]||{}).date<=today;
      return `<td data-st="${st}" class="${v?'v':(due&&f!=='kori'?'miss':'')}" ${!v&&due&&f!=='kori'?'style="background:#fff7e0"':''}>${v}</td>`; }).join('')}</tr>`; });
  return h+`</table></div></div>`;
}
async function moromiSetup(no, st){
  const m=rcMaster(no)||{}, L=(MR_STAGES.find(x=>x[0]===st)||[])[1]||st;
  head(`順号 ${no}　${L}の仕込み時`, `${m.liquid||''}　T${m.tank||''}　（分析醪シートの ${L} 列）`);
  let b=RC.bun[no];
  if(!b){ rcLoading('読み込んでいます…'); try{ const r=await recApi({action:'bunseki_get',no},40000); if(r&&r.ok){ b=r; RC.bun[no]=r; } }catch(e){} }
  if(!b){ rcFail(); return; }
  const S=(b.setup||{})[st]||{}, defs=st==='odori'?MR_ODORI:MR_SETUP;
  app.innerHTML=`<div class="rc-tabs">${MR_STAGES.map(([k,l])=>`<button class="${k===st?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="card"><b style="font-size:16px">${L}　${S.date?djp(S.date):''}</b>
      <div class="rc-grid" style="margin-top:8px">${defs.map(([f,l,un,step])=>rcField('mr_'+f,`${l}${un?' '+un:''}`,S[f],{step})).join('')}</div>
      <div class="rc-status" id="rcStatus"></div>
      <div class="rc-actions"><button class="rc-btn" id="mrSave">保存</button></div></div>
    <p class="tl-note">${st==='odori'?'踊は添の翌日の分析（Be・酸度・アミノ酸度・品温）。':'尺＝仕込み後の尺(mm)、量＝容量(L)。汲水は計画値が最初から入っています（実際と違えば直す）。'}${st==='tome'?'留の品温は、醪の「留（1日目）」の品温と同じ欄です。':''}</p>`;
  app.querySelectorAll('.rc-tabs button').forEach(x=>x.onclick=()=>moromiSetup(no,x.dataset.t));
  $('#mrSave').onclick=async()=>{
    const values={}; defs.forEach(([f])=>{ const v=$('#mr_'+f).value; if(String(v)!==String(S[f]??'')) values[f]=v; });
    if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    b.setup=b.setup||{}; b.setup[st]=Object.assign({},S,values); recSaveBg({action:'bunseki_save',no,setup:{stage:st,values}},`仕込み 順号${no} ${L}の仕込み時`); hBack.click(); return;   // 2026-10-06：画面を閉じて裏で送る
    $('#mrSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'bunseki_save',no,setup:{stage:st,values}},50000);
      if(res&&res.ok){ if(res.all) RC.bun[no]=res.all; else RC.bun[no]=null; rcStatus(`${L} を保存しました`); setTimeout(()=>moromiSetup(no,st),400); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#mrSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#mrSave').disabled=false; }
  };
}

const dpMin=t=>{ const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
const dpHM=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function dpState(){ if(RC.state&&RC.state.master) return RC.state; const c=lsGet('rec.state',null); return c&&c.master?c:null; }
function dpShukkinDay(date){ const K=MFG&&MFG.shukkin; const M=K&&K.months&&K.months[date.slice(0,7)]; return M?(M.days||[]).find(x=>x.d===date)||null:null; }

/* ---- その日の作業を集める ---- */
function dpItems(date){
  const out=[]; const add=(lane,s,e,label,cls,d,small)=>{ const a=dpMin(s), b=typeof e==='number'?a+e:dpMin(e); if(a===null) return; out.push({lane,s:a,e:Math.max(b||a+30,a+10),label,cls,d,small}); };
  // 麹
  const j=RC.koji&&RC.koji[date];
  if(j&&j.koji){
    const tg=j.targets||{}, rows=j.koji;
    const pl=r=>String(r['盛 場所']||r['引込 場所']||'').replace(/麹棚/g,'棚').replace(/天幕/g,'');
    const line=r=>`${r['麹ID']}　${r['液種']||''} ${r['品種']||''}${r['精米歩合']?r['精米歩合']+'%':''}　${r['麹米kg']||''}kg${pl(r)?'　'+pl(r):''}`;
    const kst=(k,list)=>{ if(!list.length) return; const T=DP_T.koji[k]; const t=(tg[k==='盛'?'盛後':k]||{}).time||T[0]; if(!t) return;
      add('koji',t,T[1],(T[1]<20?k.slice(0,1):`${k}${list.length}`),'dp-k',{title:`麹　${k}（${list.length}本）`,time:t,lines:list.map(line),open:()=>kojiScreen(date),openL:'麹の画面を開く'},T[1]<20); };
    const mori=rows.filter(r=>r['盛日']===date), hik=rows.filter(r=>r['引込日']===date), dek=rows.filter(r=>r['出麹日']===date);
    kst('盛',mori); kst('仲仕事',mori); kst('留仕事',mori); kst('引込',hik); kst('種切',hik); kst('切返し',hik); kst('出麹',dek);
  }
  // 酒母・仕込み・上槽（仕込マスタ）
  const st=dpState();
  if(st){
    const M=st.master||[];
    const nm=m=>`No.${m.no} ${m.sym||''}　${m.liquid||''}`;
    const sh=M.filter(m=>m.motodate===date);
    if(sh.length) add('shubo',DP_T.shuboShikomi[0],DP_T.shuboShikomi[1],`仕込${sh.map(m=>m.no).join('・')}`,'dp-s',{title:'酒母仕込',time:DP_T.shuboShikomi.join('〜')+'（目安）',lines:sh.map(m=>`${nm(m)}${m.shuboT?'　T'+m.shuboT:''}${m.yeast?'　酵母 '+m.yeast:''}`),open:()=>shuboHome(),openL:'酒母の画面を開く'});
    const mo=M.filter(m=>m.soe&&dadd(m.soe,-1)===date);
    if(mo.length) add('shubo',DP_T.motooroshi[0],DP_T.motooroshi[1],`酛卸${mo.map(m=>m.no).join('・')}`,'dp-s',{title:'酛卸',time:DP_T.motooroshi.join('〜')+'（目安・添の前日）',lines:mo.map(m=>`${nm(m)}${m.shuboT?'　T'+m.shuboT:''} → T${m.tank||''}`),open:()=>shuboHome(),openL:'酒母の画面を開く'});
    const soe=M.filter(m=>m.soe===date), naka=M.filter(m=>m.soe&&dadd(m.soe,2)===date), tome=M.filter(m=>m.tome===date);
    if(soe.length||naka.length||tome.length){
      const lb=[soe.length?'添'+soe.map(m=>m.no).join('・'):'',naka.length?'仲'+naka.map(m=>m.no).join('・'):'',tome.length?'留'+tome.map(m=>m.no).join('・'):''].filter(Boolean).join(' ');
      add('shk',DP_T.shikomi[0],DP_T.shikomi[1],lb,'dp-m',{title:'仕込み',time:DP_T.shikomi.join('〜')+'（目安）',
        lines:[...soe.map(m=>`添　${nm(m)}　T${m.tank||''}`),...naka.map(m=>`仲　${nm(m)}　T${m.tank||''}`),...tome.map(m=>`留　${nm(m)}　T${m.tank||''}`)],open:()=>moromiHome(),openL:'仕込みの画面を開く'});
    }
    const jo=M.filter(m=>m.joso===date);
    if(jo.length) add('joso',DP_T.joso[0],DP_T.joso[1],`上槽${jo.map(m=>m.no).join('・')}`,'dp-j',{title:'上槽',time:DP_T.joso.join('〜')+'（目安）',lines:jo.map(m=>`${nm(m)}　T${m.tank||''}`),open:()=>moromiHome(),openL:'仕込みの画面を開く'});
  }
  // ヤブタ準備＝上槽予定日の前日（2026-09-30 泰広さん指示）
  if(st){
    const yb=(st.master||[]).filter(m=>m.joso&&dadd(m.joso,-1)===date);
    if(yb.length) add('joso',DP_T.yabuta[0],DP_T.yabuta[1],'ヤブタ準備','dp-u',{title:'ヤブタ準備',lines:yb.map(m=>`明日 上槽　No.${m.no} ${m.sym||''}　${m.liquid||''}　T${m.tank||''}`),open:()=>moromiHome(),openL:'仕込みの画面を開く'});
  }
  // 月末清掃＝その月の最後の出勤日の15:30以降（会社休日は飛ばす）
  const hol=new Set(((MFG&&MFG.shukkin&&MFG.shukkin.holidays)||[]));
  let last=dadd(date.slice(0,7)+'-01',0); { const d0=dparse(date); last=dstr(new Date(d0.getFullYear(),d0.getMonth()+1,0)); }
  while(hol.has(last)) last=dadd(last,-1);
  if(date===last) add('etc',DP_T.seisou[0],DP_T.seisou[1],'月末清掃','dp-u',{title:'月末清掃',lines:['15:30以降']});
  // 出勤表（上槽・粕）と洗米予定表
  const kd=dpShukkinDay(date);
  if(kd){
    if(kd.j && !out.some(x=>x.lane==='joso'&&x.label.indexOf('上槽')===0)) add('joso',DP_T.joso[0],DP_T.joso[1],`上槽 ${kd.j}`,'dp-j',{title:'上槽',time:DP_T.joso.join('〜')+'（目安）',lines:[`出勤表：${kd.j}`],open:()=>moromiHome(),openL:'仕込みの画面を開く'});
    if(kd.k) add('joso',DP_T.kasu[0],DP_T.kasu[1],`粕 ${kd.k}`,'dp-u',{title:'粕',time:DP_T.kasu.join('〜')+'（目安）',lines:[`出勤表：${kd.k}`]});
  }
  const S=MFG&&MFG.senmai, sd=S&&S.days&&S.days[date];
  if(sd&&sd.e&&sd.e.length){
    const cols=S.cols||[]; const ents=sd.e.map(e=>({kb:(cols[e[0]]||[])[0]||'',g:(cols[e[0]]||[])[1]||'',rice:e[1],ratio:e[2],prod:e[4],no:e[5],kg:Number(e[6]||0)}));
    const kg=ents.reduce((a,x)=>a+x.kg,0);
    add('sen',DP_T.senmai[0],DP_T.senmai[1],`洗米${ents.length}件`,'dp-w',{title:`洗米（${ents.length}件・${Math.round(kg).toLocaleString('ja-JP')}kg）`,time:DP_T.senmai.join('〜')+'（目安）',
      lines:ents.map(x=>`${x.g}${x.kb}　${x.rice} ${x.ratio}%　${x.prod||''} No.${x.no}　${kgfmt(x.kg)}kg`),open:()=>senmaiScreen(date),openL:'洗米チェックを開く'});
  }
  return out;
}

/* ---- 分析本数（2026-10-01 泰広さん指示） ----
   酒母：酛立（motodate）の翌日から 酛卸＝添の前日 まで／醪：留（tome）を1日目として3日目から 上槽予定（joso）まで
   前日の16:30から、明日の本数が DP_BUN_MAX を超えるときに赤い帯（本数を減らす調整をするため） */
const DP_BUN_MAX=18, DP_BUN_AT=16*60+30;
function dpBunseki(date){
  const st=dpState(); if(!st) return null; const M=st.master||[];
  const sb=M.filter(m=>m.motodate && dadd(m.motodate,2)<=date && (!m.soe || date<=dadd(m.soe,-1)));   // 2026-10-06 泰広さん指示：酒母は仕込み（酛立）を1日目として3日目から
  const mr=M.filter(m=>m.tome && dadd(m.tome,2)<=date && (!m.joso || date<=m.joso));
  return {sb,mr,n:sb.length+mr.length};
}
function dpBunAlert(){
  const now=new Date(); if(now.getHours()*60+now.getMinutes()<DP_BUN_AT) return null;
  const date=dadd(dtoday(),1), b=dpBunseki(date); return b&&b.n>DP_BUN_MAX?Object.assign({date},b):null;
}
let DP_BUN=null;
function dpBunHTML(){
  let h='';
  const al=dpBunAlert(); DP_BUN=al;
  if(al){ const d=dparse(al.date);
    h+=`<button type="button" class="dp-al" data-dpal="1">⚠ 明日 ${d.getMonth()+1}/${d.getDate()} の分析 ${al.n}本<small>酒母${al.sb.length}・醪${al.mr.length}　${DP_BUN_MAX}本を超えています。本数を減らす調整を（押すと内訳）</small></button>`; }
  const b=dpBunseki(dpDate());
  if(b&&b.n) h+=`<div class="dp-bn">分析 <b class="${b.n>DP_BUN_MAX?'ov':''}">${b.n}本</b>（酒母${b.sb.length}・醪${b.mr.length}）</div>`;
  return h;
}
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('[data-dpal]'); if(!b||!DP_BUN) return;
  const x=DP_BUN, nm=m=>`No.${m.no} ${m.sym||''}　${m.liquid||''}${m.tank?'　T'+m.tank:''}`;
  dpSheet({d:{title:`明日の分析 ${x.n}本（酒母${x.sb.length}・醪${x.mr.length}）`,
    lines:[`${DP_BUN_MAX}本を超えています。20本で3時間半〜4時間かかるので、本数を減らす調整をしてください`,
      ...x.sb.map(m=>`酒母　${nm(m)}（酛卸 ${m.soe?rcMD(dadd(m.soe,-1)):'—'}）`),
      ...x.mr.map(m=>`醪　${nm(m)}（留 ${rcMD(m.tome)}・上槽予定 ${m.joso?rcMD(m.joso):'—'}）`)],
    open:()=>moromiHome(), openL:'仕込みの画面を開く'}});
});

/* ---- 横の時刻軸の表 ---- */
/* 本日／明日（2026-09-30 泰広さん指示：明日の予定のボタン） */
let DP_OFF=0;
const dpDate=()=>dadd(dtoday(),DP_OFF);
function dpPlanHTML(){
  const date=dpDate(), items=dpItems(date);
  const d=dparse(date), nx=dparse(dadd(dtoday(),1)), td=dparse(dtoday());
  const md=x=>`${x.getMonth()+1}/${x.getDate()}（${WD[x.getDay()]}）`;
  let h=`<div class="dp-tabs"><button type="button" data-dpd="0" class="${DP_OFF===0?'on':''}">本日の予定 ${md(td)}</button><button type="button" data-dpd="1" class="${DP_OFF===1?'on':''}">明日の予定 ${md(nx)}</button></div>
    ${dpBunHTML()}`;   // 2026-10-06 泰広さん指示：「予定を押すと詳細」の文字は出さない
  if(!items.length){ h+=`<div class="dp-empty">${dpState()||(RC.koji&&RC.koji[date])?(DP_OFF?'明日':'今日')+'の作業予定はありません':'予定を読み込んでいます…'}</div>`; DP_LAST=[]; return h; }
  let lo=7*60, hi=17*60; items.forEach(x=>{ lo=Math.min(lo,Math.floor(x.s/60)*60); hi=Math.max(hi,Math.ceil(x.e/60)*60); });
  const span=hi-lo, px=v=>((v-lo)/span*100).toFixed(2)+'%';
  const lanes=DP_LANES.filter(([k])=>items.some(x=>x.lane===k));
  h+=`<div class="dp-g"><div><div class="ax"></div>${lanes.map(([k,l])=>`<div class="ln">${l}</div>`).join('')}</div><div class="dp-a" style="height:${16+30*lanes.length}px">`;
  lanes.forEach(([k],i)=>{ h+=`<div class="row" style="top:${16+30*i}px"></div>`; });
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  items.forEach((x,idx)=>{ const i=lanes.findIndex(l=>l[0]===x.lane); const w=Math.max((x.e-x.s)/span*100, x.small?5.5:12);
    h+=`<button type="button" class="dp-b ${x.cls} ${x.small?'s':''} ${DP_OFF===0&&x.e<nm&&x.cls!=='dp-on'?'done':''}" data-dp="${idx}" style="top:${16+30*i+3}px;left:${Math.max(0,Math.min((x.s-lo)/span*100, 100-Math.max(w, x.label.length*3.7+2))).toFixed(2)}%;min-width:${w.toFixed(2)}%">${esc(x.label)}</button>`; });
  h+=`</div></div>`;
  DP_LAST=items;
  return h;
}
let DP_LAST=[];

/* ---- 勤務予定（出勤・休みの氏名。2026-10-01 泰広さん指示：本日の予定の下部に小さく） ---- */
function dpKinmuHTML(){
  const date=dpDate(), K=MFG&&MFG.shukkin, M=K&&K.months&&K.months[date.slice(0,7)];
  const day=M&&(M.days||[]).find(x=>x.d===date);
  if(!M||!M.staff||!day) return '';
  const on=[], off=[], agri=[];
  M.staff.forEach((s,k)=>{ const n=nrm(s); if(!n) return; const v=String((day.c&&day.c[k])||'').trim();
    /* 2026-10-01 泰広さん指示：出勤表の「研修」列は載せない。ただし ／＼× 以外の名前（例：辻）が入っていればその人を出勤に入れる */
    if(/研修/.test(n)){ const w=nrm(v); if(w && !/^[＼\\／\/×]/.test(w)) on.push(esc(w)); return; }
    if(v==='アグリ'){ agri.push(esc(n)); return; }
    if(/^[＼\\／\/×]/.test(v) && !/0\.5/.test(v)){ off.push(esc(n)+(/当/.test(v)?'<small>（当番）</small>':'')); return; }
    let note='';
    if(/a0\.5|ａ0\.5/i.test(v)) note='午前休'; else if(/p0\.5|ｐ0\.5/i.test(v)) note='午後休'; else if(v && !/^(泊|当|３F|3F)$/.test(v)) note=v;
    on.push(esc(n)+(note?`<small>（${esc(note)}）</small>`:'')); });
  if(!on.length&&!off.length&&!agri.length) return '';
  return `<div class="dp-kn"><div><b>出勤 ${on.length}</b><span>${on.join('・')||'—'}</span></div>`
    +`<div class="off"><b>休み ${off.length}</b><span>${off.join('・')||'—'}</span></div>`
    +`</div>`;   // 2026-10-06 泰広さん指示：アグリの行は出さない
}

/* カレンダーの題名から電話番号を消す（2026-10-06 泰広さん指示：本日の予定のカレンダーはシンプルに。場所・電話番号は出さない） */
function dpCalTitle(t){
  let s=String(t||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  if(/酵母/.test(s)){   // 2026-10-06 泰広さん指示：酵母の種類は出さない（カッコの中＝時刻以外と、酵母の名前・記号を消す）
    s=s.replace(/[（(][^）)]*[）)]/g,m=>/^[（(]\s*\d{1,2}:\d{2}/.test(m)?m:'')
       .replace(/(試験場酵母|きょうかい酵母|協会酵母|協会\d+号|K-?\d+号?|[A-Z]{1,3}\d+[A-Za-z]*(?:arg|BY)?)/g,'').replace(/\s+([（(])/g,'$1');
  }
  s=s.replace(/(?:TEL|Tel|tel|ＴＥＬ|電話番号|電話|携帯|☎|📞)?\s*[:：]?\s*\(?0\d{1,4}\)?[-‐－−ー―\s]?\d{1,4}[-‐－−ー―\s]?\d{3,4}/g,'');
  s=s.replace(/[（(]\s*[)）]/g,'').replace(/\s*[／/・,、]\s*$/,'').replace(/^\s*[／/・,、]\s*/,'').replace(/\s{2,}/g,' ').trim();
  return s||String(t||'');
}
/* ---- カレンダーの予定（箇条書き） ---- */
let DP_CAL_LAST=[];
(function(){ const s=document.createElement('style'); s.textContent='.dp-cal li.dp-cl{cursor:pointer}.dp-cal li.dp-cl i{font-style:normal;color:var(--sub);margin-left:4px}.dp-cal li.dp-cl:active{background:#f3efe4}'; document.head.appendChild(s); })();
/* 押すと詳細（題名そのまま・時刻・場所・説明欄） */
document.addEventListener('click', e=>{
  const li=e.target.closest && e.target.closest('[data-dpcal]'); if(!li) return;

  dpSheet({d:{title:x.title, lines}});

function dpCalHTML(){
  const date=dpDate(), c=(lsGet('dp.cal2',{})||{})[date], ev=(c&&c.events)||null;
  const kd=dpShukkinDay(date);
  let li='';

  if(ev){ DP_CAL_LAST=ev.slice().sort((a,b)=>(a.allDay?'0':'1'+a.start).localeCompare(b.allDay?'0':'1'+b.start));

  else if(kd&&kd.n) li=String(kd.n).split(/[\/／]/).map(s=>s.trim()).filter(Boolean).map(s=>`<li>${esc(s)} <small>（出勤表の備考）</small></li>`).join('');
  if(!li) return `<div class="dp-cal"><div style="color:var(--sub);font-size:12px">${ev||!O2_URL?(DP_OFF?'明日':'今日')+'の予定はありません':'読み込んでいます…'}</div></div>`;
  return `<div class="dp-cal"><ul>${li}</ul></div>`;   // 2026-10-06 泰広さん指示：「カレンダーの予定」の見出しは出さない
}

/* ---- ホーム全体（home() から呼ばれる。六角形の代わりに角丸アイコン） ---- */
function dpHome(hexes){

  return `${kirinzanBand()}<div class="hx" style="display:none"></div>

  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) m.remove(); };

}, true);

/* ---- 裏で最新を取り、予定の枠だけ描き直す ---- */
let DP_TICK=null;
function dpRedraw(){ const p=document.getElementById('dpPlan'), c=document.getElementById('dpCal'), k=document.getElementById('dpKn'), me=document.getElementById('dpMe'); if(p) p.innerHTML=dpPlanHTML(); if(me&&typeof dpMeHTML==='function') me.innerHTML=dpMeHTML(); if(k) k.innerHTML=dpKinmuHTML(); if(c) c.innerHTML=dpCalHTML(); }
function dpAfterHome(){
  if(!document.getElementById('dpBox')) return;
  clearInterval(DP_TICK); DP_TICK=setInterval(()=>{ if(document.getElementById('dpBox')) dpRedraw(); else clearInterval(DP_TICK); }, 60000);
  dpLoad(dpDate());
}
const DP_LOADING={};
function dpLoad(d){
  if(DP_LOADING[d]) return DP_LOADING[d];
  return DP_LOADING[d]=(async()=>{
    const tasks=[];
    if(!(RC.koji&&RC.koji[d])) tasks.push((async()=>{ let r=null;
      try{ const c=await PC.get(recKey({action:'koji_today',date:d})); if(c&&c.s) r=JSON.parse(c.s); }catch(e){}
      if(!r){ try{ r=await recApi({action:'koji_today',date:d},40000); }catch(e){} }
      if(r&&r.ok) RC.koji[d]=r; })());
    if(!RC.state || Date.now()-(RC.at||0)>5*60000) tasks.push(recState(false).catch(()=>{}));
    const cm=lsGet('dp.cal2',{})||{}, c=cm[d];
    if(O2_URL && !(c&&Date.now()-(c.at||0)<10*60000)) tasks.push((async()=>{ try{ const j=await o2Api({action:'cal_day',date:d},20000);
      if(j&&j.ok&&j.events){ const m=lsGet('dp.cal2',{})||{}; Object.keys(m).forEach(k=>{ if(k<dtoday()) delete m[k]; }); m[d]={events:j.events,at:Date.now()}; lsSet('dp.cal2',m); } }catch(e){} })());
    await Promise.all(tasks);
    if(!(MFG&&MFG.shukkin) && typeof mfgRefresh==='function' && ST.token) { try{ await mfgRefresh(); }catch(e){} }
    delete DP_LOADING[d];
    if(dpDate()===d) dpRedraw();
  })();
}
document.addEventListener('click', e=>{

});
/* ツールの読み込み前に描かれたホーム（六角形）を、角丸の形で描き直す */
try{ if(ST && ST.token && typeof app!=='undefined' && app.querySelector('.hx') && !document.getElementById('dpBox') && nav[nav.length-1]===home) go(home,false); }catch(e){}

<script>
/* ================= 🍶 仕込み：仕込中・醪中・予定（上槽済は別ページ）＋ 汲水・酵素剤（2026-10-02） =================
   泰広さん指示：ホーム→仕込み の中の酒母は削除。仕込んでいるものから表示、上槽済は別ページ。
   仕込んでいなくても予定はすべて表示。汲水・酵素剤などは間違えないように表示。
   ・一覧：①きょうの仕込み（添・仲・留の汲水・麹・掛、きょう入れる資材）を大きく ②仕込中（添〜留の前）③醪中 ④予定（全部）⑤上槽済 › 別ページ
   ・1本の画面（moromiSheet）の上に「仕込み配合（計画）」：添・仲・留・四段の 麹kg・掛kg・汲水L、追水・アル添、資材（名前・量・入れる日）
   ・データ：醸造記録 R8BY の state（仕込み一覧_追加.gs で master に kg・kumi、shizai＝資材予定 を足す）
   ・酵素剤：液種マスタ（醪管理R8BY）。普通酒系＝スミチームSG（留）、純米系＝グルク吟・チアミン・フェルメイドK（留）、四段＝マグナックス1
   控え：seishu-workbook_github\_src_shikomi.js（index.html の <!-- /tools --> の直前に入っている）
   ======================================================================== */
const SHK_CSS=`

.shk-zai li small{font-size:11px;color:var(--sub)}

.shk-row .st{align-self:stretch;background:#d8d2c2;border-radius:0 3px 3px 0}

(function(){ const s=document.createElement('style'); s.textContent=SHK_CSS; document.head.appendChild(s); })();

const shkNum=(v,d=2)=>{ const n=shN(v); return n===null?'':n.toLocaleString('ja-JP',{maximumFractionDigits:d}); };
function shkPhase(m,t,today){
  if((t||{}).state==='上槽済') return 'done';
  if(m.tome && today>=m.tome) return 'moromi';
  if(m.soe && today>=m.soe) return 'shikomi';
  return 'plan';
}
/* その日の作業（添・仲・留）と、その日に入れる資材（酒母の乳酸は除く） */
function shkEvents(st,date){
  const ev=[], Z=st.shizai||{};
  st.master.forEach(m=>{
    if(((st.today||{})[m.no]||{}).state==='上槽済') return;
    const kg=m.kg||{}, ku=m.kumi||{};
    const zai=(Z[m.no]||[]).filter(z=>z.date===date && z.timing!=='酛立日');
    const used=new Set();
    [['添',m.soe,ku.soe,kg.soeKoji,kg.soeKake],['仲',m.naka,ku.naka,kg.nakaKoji,kg.nakaKake],['留',m.tome,ku.tome,kg.tomeKoji,kg.tomeKake]].forEach(([s,d,kumi,koji,kake])=>{
      if(d!==date) return;
      const z=s==='留'?zai.filter(x=>x.timing==='留日'):[];
      z.forEach(x=>used.add(x));
      ev.push({m,stage:s,kumi,koji,kake,zai:z});
    });
    const rest=zai.filter(x=>!used.has(x));
    const by={}; rest.forEach(x=>{ const k=x.timing==='四段'?'四段':x.timing==='上槽日'?'アル添':x.timing==='留日'?'留':x.timing; (by[k]=by[k]||[]).push(x); });
    Object.keys(by).forEach(k=>ev.push({m,stage:k,zai:by[k],kg4:k==='四段'?kg.yodan:''}));
  });
  const ord={'添':1,'仲':2,'留':3,'2日目':4,'四段':5,'アル添':6};
  return ev.sort((a,b)=>(ord[a.stage]||9)-(ord[b.stage]||9)||String(a.m.tank).localeCompare(String(b.m.tank))||a.m.no-b.m.no);
}
function shkZaiHTML(z){
  if(!z||!z.length) return '';
  return `<ul class="shk-zai">${z.map(x=>`<li>${esc(x.name)}<b>${shkNum(x.qty)}</b><span>${esc(x.unit)}</span></li>`).join('')}</ul>`;
}
function shkEventHTML(e){
  const m=e.m;
  let h=`<button class="shk-ev s-${e.stage}" data-no="${m.no}"><div class="h"><span class="stg">${e.stage}</span><span class="nm">No.${m.no} ${esc(m.sym||'')} ${esc(m.liquid||'')}<small>T${esc(m.tank||'')}</small></span></div>`;
  if(e.stage==='添'||e.stage==='仲'||e.stage==='留'){
    h+=`<div class="kumi"><small>汲水</small><b>${e.kumi!==''&&e.kumi!==undefined?shkNum(e.kumi,0):'—'}</b><span>L</span></div>`;
    h+=`<div class="kg">麹 ${shkNum(e.koji,0)||'—'} kg ・ 掛 ${shkNum(e.kake,0)||'—'} kg</div>`;
  }
  if(e.stage==='四段' && e.kg4) h+=`<div class="kg">四段 ${shkNum(e.kg4,0)} kg（上槽前日）</div>`;
  if(e.stage==='アル添') h+=`<div class="kg">上槽予定日</div>`;
  h+=shkZaiHTML(e.zai);
  if((e.stage==='留') && !(e.zai&&e.zai.length)) h+=`<div class="kg" style="color:var(--sub)">留で入れる資材の登録なし</div>`;
  return h+`</button>`;
}
function shkRowHTML(m,ph,today,t){
  const dd=d=>d?rcDays(today,d):null;
  let r='';
  if(ph==='shikomi'){
    const nx=[['仲',m.naka],['留',m.tome]].find(([,d])=>d&&d>=today);
    const od=m.soe&&dadd(m.soe,1)===today;
    r= m.soe===today?`<b class="hot">きょう 添</b>`: od?`<b>踊</b>`: nx?(nx[1]===today?`<b class="hot">きょう ${nx[0]}</b>`:`<b>${nx[0]}まで${dd(nx[1])}日</b>`):'';
  } else if(ph==='plan'){
    const n=dd(m.soe||m.tome); r=`<b>${n===0?'きょう 添':'あと'+n+'日'}</b>`;
  } else if(ph==='done'){
    r=`<b>上槽 ${rcMD(t&&t.josoActual||m.joso)}</b>`;
  }
  return `<button class="shk-row ${ph==='shikomi'?'on':''}" data-no="${m.no}"><span class="st"></span>
    <span class="id">${m.no}<small>${esc(m.sym||'')} T${esc(m.tank||'')}</small></span>
    <span class="mid">${esc(m.liquid||'')}<small>添 ${rcMD(m.soe)}・仲 ${rcMD(m.naka)}・留 ${rcMD(m.tome)}・上槽 ${rcMD(m.joso)}</small></span>
    <span class="r">${r}</span></button>`;
}

let SHK_DAY='today';
async function moromiHome(){
  head('仕込み','仕込中・醪中・予定（上槽済は一番下から）');
  rcLoading('仕込の一覧を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const today=dtoday(), T=st.today||{};
  const all=st.master.map(m=>({m,t:T[m.no]||{},ph:shkPhase(m,T[m.no],today)}));
  const shk=all.filter(x=>x.ph==='shikomi').sort((a,b)=>String(a.m.soe).localeCompare(String(b.m.soe))||a.m.no-b.m.no);
  const mor=all.filter(x=>x.ph==='moromi').map(x=>({...x,d:rcMoromiDay(x.m,today)})).sort((a,b)=>String(a.m.tome).localeCompare(String(b.m.tome))||a.m.no-b.m.no);
  const plan=all.filter(x=>x.ph==='plan').sort((a,b)=>String(a.m.soe||a.m.tome).localeCompare(String(b.m.soe||b.m.tome))||a.m.no-b.m.no);
  const done=all.filter(x=>x.ph==='done');
  const date=SHK_DAY==='today'?today:dadd(today,1);
  const ev=st.shkVer?shkEvents(st,date):[];
  let h=`<div class="rc-status" id="rcStatus"></div>`;
  h+=`<div class="shk-today"><div class="t">${SHK_DAY==='today'?'きょう':'あす'}の仕込み・資材<small>${djp(date)}</small></div>
    <div class="shk-tabs"><button data-dy="today" class="${SHK_DAY==='today'?'on':''}">きょう</button><button data-dy="tom" class="${SHK_DAY!=='today'?'on':''}">あす</button></div>
    ${!st.shkVer?`<div class="tl-warn" style="margin:0">汲水・資材は、Apps Script「醸造記録 R8BY」に <b>仕込み一覧_追加.gs</b> を入れると出ます。</div>`
      : ev.length?ev.map(shkEventHTML).join(''):`<div class="shk-none">${SHK_DAY==='today'?'きょう':'あす'}の仕込み・資材はありません</div>`}
    ${st.shkVer?`<p class="tl-note" style="margin:4px 2px 0">汲水・kg は計画（造りexの配合）、資材は液種マスタの量。実際と違うときは杜氏に確認。</p>`:''}</div>`;
  h+=`<div class="shk-sec">仕込中<small>添〜留の前 ${shk.length}本</small></div>`;
  h+=shk.length?shk.map(x=>shkRowHTML(x.m,'shikomi',today,x.t)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<div class="shk-sec">醪中<small>留から上槽まで ${mor.length}本・「未」＝今日の品温（AM）がまだ</small></div>`;
  h+=mor.length?mor.map(({m,t,d})=>moromiRowHTML(m,t,d)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<div class="shk-sec">予定<small>まだ仕込んでいないもの 全${plan.length}本</small></div>`;
  h+=plan.length?plan.map(x=>shkRowHTML(x.m,'plan',today,x.t)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<button class="sh-link" id="shkDone">🍶 上槽済（${done.length}本）<span>›</span></button>
    <div class="rc-bar" style="margin-top:8px"><button class="rc-ghost" id="rcReload">更新</button><span class="tl-note" style="margin:0">押すとその仕込の経過表と仕込み配合（汲水・資材）が開きます。</span></div>`;
  app.innerHTML=h;
  const bind=()=>app.querySelectorAll('.sh-row[data-no],.shk-row[data-no],.shk-ev[data-no]').forEach(b=>b.onclick=()=>go(()=>moromiSheet(b.dataset.no)));
  bind();
  app.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>{ SHK_DAY=b.dataset.dy; moromiHome(); });
  $('#shkDone').onclick=()=>go(()=>shkDoneScreen());
  $('#rcReload').onclick=async()=>{ rcStatus('更新中…'); await recState(true); mor.forEach(({m})=>RC.bun[m.no]=null); moromiHome(); };
  const myTop=nav[nav.length-1];
  shFetchMany(mor.filter(({m})=>!RC.bun[m.no]).map(({m})=>m.no),'bunseki_get',RC.bun,no=>{
    if(nav[nav.length-1]!==myTop) return;
    const b=app.querySelector(`.sh-row[data-no="${no}"]`), x=mor.find(y=>String(y.m.no)===String(no));
    if(b&&x){ const t=document.createElement('div'); t.innerHTML=moromiRowHTML(x.m,x.t,x.d); b.replaceWith(t.firstElementChild); bind(); }
  });
}
async function shkDoneScreen(){
  head('上槽済','上槽が済んだ仕込（押すと仕込カルテ）');
  rcLoading();
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const T=st.today||{}, today=dtoday();
  const list=st.master.filter(m=>(T[m.no]||{}).state==='上槽済').sort((a,b)=>String(b.joso).localeCompare(String(a.joso))||b.no-a.no);
  app.innerHTML=(list.length?list.map(m=>shkRowHTML(m,'done',today,T[m.no])).join(''):`<p class="muted" style="text-align:center;padding:20px 0">上槽済の仕込はまだありません</p>`)
    +`<p class="tl-note">上槽の値・粕・原酒評価は仕込カルテから入力します。</p>`;

}

/* 仕込カルテの一覧（酒母は出さない：泰広さん指示 2026-10-02） */
async function shikomiScreen(f){

      <span class="r"><b>${s[0]}</b><span>${t.smv!==''&&t.smv!==undefined?`日本酒度 ${rcN(t.smv)}`:''}</span></span></button>`; }).join(''):`<p class="muted" style="text-align:center;padding:20px 0">該当なし</p>`;
  h+=`<p class="tl-note">印刷用の仕込カルテ・仕込一覧・資材予定は <a href="${REC_SS_MOROMI}" target="_blank" rel="noopener">醪管理R8BY（スプレッドシート）</a>。仕込計画が変わったら 造りex の帳票から作り直す（杜氏）。</p>`;

function shkMixHTML(m,st){
  if(!m||!m.kg) return `<div class="tl-warn" style="margin:0 0 10px">汲水・資材は、Apps Script「醸造記録 R8BY」に 仕込み一覧_追加.gs を入れると出ます。</div>`;
  const today=dtoday(), kg=m.kg, ku=m.kumi||{};
  const zai=((st&&st.shizai)||{})[m.no]||[];
  const yd=(zai.find(z=>z.timing==='四段')||{}).date||'';
  const cols=[['添',m.soe,kg.soeKoji,kg.soeKake,ku.soe],['仲',m.naka,kg.nakaKoji,kg.nakaKake,ku.naka],['留',m.tome,kg.tomeKoji,kg.tomeKake,ku.tome]];
  const has4=shN(kg.yodan)!==null; if(has4) cols.push(['四段',yd,'',kg.yodan,'']);
  const td=d=>d&&d===today?'td':'';
  let h=`<div class="shk-mix"><div class="rc-h" style="margin:2px 0 4px">仕込み配合（計画）<small>造りexの配合・液種マスタ。黄色＝きょう</small></div><table>
    <tr><th class="k"></th>${cols.map(c=>`<th class="${td(c[1])}">${c[0]}<small>${rcMD(c[1])}</small></th>`).join('')}</tr>
    <tr><td class="k">麹 kg</td>${cols.map(c=>`<td class="${td(c[1])}">${shkNum(c[2],0)}</td>`).join('')}</tr>
    <tr><td class="k">掛 kg</td>${cols.map(c=>`<td class="${td(c[1])}">${shkNum(c[3],0)}</td>`).join('')}</tr>
    <tr class="kumi"><td class="k">汲水 L</td>${cols.map(c=>`<td class="${td(c[1])}">${shkNum(c[4],0)}</td>`).join('')}</tr></table>
    <div class="ft">追水計画 ${shkNum(m.oimizu,0)||'—'} L ／ 四段 ${shkNum(m.yodan,0)||'—'} L ／ アル添(40%) ${shkNum(m.alc,0)||'—'} L${m.alcDate?`（${rcMD(m.alcDate)}）`:''}</div>`;
  const z2=zai.filter(z=>z.timing!=='酛立日' && !/アルコール/.test(z.name));
  h+= z2.length?`<ul class="shk-zai">${z2.map(z=>`<li class="${td(z.date)}">${esc(z.name)} <small>${z.timing==='留日'?'留':z.timing}（${rcMD(z.date)}）</small><b>${shkNum(z.qty)}</b><span>${esc(z.unit)}</span></li>`).join('')}</ul>`
           :`<div class="ft" style="color:var(--sub)">酵素剤などの登録なし</div>`;
  return h+`</div>`;
}

<script>
/* ================= 🧪 分析（その日に分析する全タンクを1枚の表で入力・経過はボタンで） 2026-10-02 =================

   ・入れた値は端末に下書きとして残る（途中で閉じても消えない）。「まとめて保存」で1回に送る

.bn-bar{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,var(--paper) 75%,rgba(247,244,236,0));padding:12px 0 calc(10px + env(safe-area-inset-bottom));margin-top:10px;display:flex;gap:8px;align-items:center}

`;
(function(){ const s=document.createElement('style'); s.textContent=BN_CSS; document.head.appendChild(s); })();

const BN_F={
  sb:[['be','Be'],['ta','酸度'],['alc','alc']],
  mr:[['be','Be/度'],['alc','alc'],['ta','酸度'],['aa','ｱﾐﾉ']]
};
/* ありえない値（赤）。範囲はゆるめ。打ち間違い（桁・小数点）を拾うため */
const BN_RANGE={ sb:{be:[0,25],ta:[0,20],alc:[0,20]}, mr:{be:[-30,40],alc:[0,23],ta:[0,6],aa:[0,6]} };
const BN={date:null, open:{}};
const bnKey=(k,no)=>k+'_'+no;
const bnStore=k=>k==='sb'?RC.shubo:RC.bun;
function bnDraft(date){ return lsGet('bn.draft.'+date,{})||{}; }
function bnDraftSet(date,d){ if(Object.keys(d).length) lsSet('bn.draft.'+date,d); else { try{ localStorage.removeItem('bn.draft.'+date); }catch(e){} } }

/* その日に分析する仕込（ホームの dpBunseki と同じ決まり） */
function bnTargets(st,date){
  const M=(st&&st.master)||[], out=[];
  M.filter(m=>m.motodate && dadd(m.motodate,2)<=date && (!m.soe || date<=dadd(m.soe,-1)))   // 2026-10-06：酒母は酛立を1日目として3日目から
   .sort((a,b)=>a.motodate.localeCompare(b.motodate)||a.no-b.no)
   .forEach(m=>{ const d=rcShuboDay(m,date); if(d>=1&&d<=13) out.push({k:'sb',m,d}); });
  M.filter(m=>m.tome && dadd(m.tome,2)<=date && (!m.joso || date<=m.joso) && ((st.today||{})[m.no]||{}).state!=='上槽済')
   .sort((a,b)=>a.tome.localeCompare(b.tome)||a.no-b.no)
   .forEach(m=>{ const d=rcMoromiDay(m,date); if(d>=1&&d<=36) out.push({k:'mr',m,d}); });
  return out;
}
/* その日より前で一番近い値 */
function bnPrev(days,d,f){ for(let i=d-2;i>=0;i--){ const x=days[i]; const v=x?shN(x[f]):null; if(v!==null) return {v,day:x.day}; } return null; }
/* 前回と比べた注意（黄）。保存は止めない */
function bnCheck(k,f,v,prev){
  const r=BN_RANGE[k][f]; if(r&&(v<r[0]||v>r[1])) return ['bad','ありえない値です（桁・小数点を確認）'];
  if(!prev) return null; const p=prev.v;
  if(f==='alc'&&v<p-0.3) return ['warn',`alc が前回（${shF(p)}）より下がっています`];
  if(f==='alc'&&k==='mr'&&v>p+4) return ['warn',`alc が前回（${shF(p)}）から急に上がっています`];
  if(f==='ta'&&Math.abs(v-p)>=(k==='sb'?3:0.6)) return ['warn',`酸度が前回（${shF(p)}）から大きく変わっています`];
  if(f==='aa'&&Math.abs(v-p)>=0.5) return ['warn',`アミノ酸度が前回（${shF(p)}）から大きく変わっています`];
  if(f==='be'&&k==='sb'&&v>p+1) return ['warn',`Be が前回（${shF(p)}）より上がっています`];
  return null;
}

async function bunHome(date){
  date=date||BN.date||dtoday(); BN.date=date;
  head('分析', '酒母・醪の分析値をまとめて入力');
  rcLoading('分析する仕込を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const T=bnTargets(st,date), sb=T.filter(x=>x.k==='sb'), mr=T.filter(x=>x.k==='mr');
  const draft=bnDraft(date), isToday=date===dtoday();
  const row=x=>{ const key=bnKey(x.k,x.m.no), F=BN_F[x.k];
    const id=x.k==='sb'?`${x.m.no}<small>酒母${esc(x.m.shuboSym||'')}${x.m.shuboT?' T'+esc(x.m.shuboT):''}</small>`:`${x.m.no}<small>${esc(x.m.sym||'')} T${esc(x.m.tank||'')}</small>`;
    return `<tr class="bn-r" data-key="${key}"><td class="id">${id}</td><td class="dy">${x.k==='mr'&&x.d===1?'留':x.d+'日'}</td>
      ${F.map(([f])=>{ const dv=draft[key]&&draft[key][f]; return `<td><input class="bn-in ${dv!==undefined?'dirty':''}" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-key="${key}" data-f="${f}" value="${dv!==undefined?esc(dv):''}" disabled><span class="bn-pv" data-pv="${key}_${f}">…</span></td>`; }).join('')}
      <td><button type="button" class="bn-hb" data-h="${key}">経過</button></td></tr>
      <tr class="bn-m"><td class="bn-msg" colspan="${F.length+3}" data-msg="${key}"></td></tr>
      <tr class="bn-hist" data-hist="${key}" style="display:none"><td colspan="${F.length+3}"></td></tr>`; };
  const table=(k,list)=>`<table class="bn-t"><colgroup><col class="c1"><col class="c2">${BN_F[k].map(()=>'<col>').join('')}<col class="c9"></colgroup><tr><th style="text-align:left;padding-left:8px">順号</th><th>日目</th>${BN_F[k].map(([,l])=>`<th>${l}</th>`).join('')}<th></th></tr>${list.map(row).join('')}</table>`;
  const d=dparse(date);
  let h=`<div class="bn-top"><button type="button" id="bnPrev">‹ 前日</button><div class="dt">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）<small>${isToday?'今日の分析':date<dtoday()?'過去の日':'先の日（予定）'}</small></div><button type="button" id="bnNext">翌日 ›</button></div>
    <div class="bn-sum"><div><b>${T.length}</b>本</div><div><b>${sb.length}</b>酒母</div><div><b>${mr.length}</b>醪</div><div class="ok" id="bnDoneBox"><b id="bnDone">…</b>入力済</div></div>
    <div class="rc-status" id="rcStatus"></div>`;
  if(!T.length) h+=`<p class="muted" style="text-align:center;padding:24px 0">この日に分析する仕込はありません</p>`;
  if(sb.length) h+=`<div class="bn-h">🧫 酒母<small>Be・酸度・alc</small></div>${table('sb',sb)}`;
  if(mr.length) h+=`<div class="bn-h">🍶 醪<small>Be は3.0未満になったら日本酒度で（R7BYと同じ）</small></div>${table('mr',mr)}`;
  if(T.length) h+=`<p class="bn-note">数字の下の小さな字＝前回の値（何日目か）。入れると黄色の枠＝まだ保存していない値（この端末に下書きとして残ります）。前回から大きく外れると枠が光り、行の下に理由が出ます。「経過」でその仕込の全体の流れ（グラフと全日の表）が開きます。品温は 酒母・仕込み の画面で。</p>
    <div class="bn-bar"><button class="rc-ghost" id="bnReload" type="button">更新</button><button class="rc-btn" id="bnSave" type="button" disabled>まとめて保存</button></div>`;
  app.innerHTML=h;
  $('#bnPrev').onclick=()=>bunHome(dadd(date,-1));
  $('#bnNext').onclick=()=>bunHome(dadd(date,1));
  if(!T.length) return;
  const myTop=nav[nav.length-1];
  const live=()=>nav[nav.length-1]===myTop && BN.date===date && document.getElementById('bnSave');

  /* 1行ぶんに値を流し込む（自分が打った欄は触らない） */
  const fill=x=>{ if(!live()) return; const key=bnKey(x.k,x.m.no), s=bnStore(x.k)[x.m.no]; if(!s) return;
    const days=s.days||[], D=days[x.d-1]||{};
    BN_F[x.k].forEach(([f])=>{ const inp=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(!inp) return;
      if(!inp.classList.contains('dirty')) inp.value=shN(D[f])!==null?String(D[f]):'';
      const p=bnPrev(days,x.d,f), pv=app.querySelector(`[data-pv="${key}_${f}"]`);
      if(pv) pv.textContent=p?`前${shF(p.v)}(${x.k==='mr'&&p.day===1?'留':p.day+'日'})`:'前 —';
      inp.disabled=false; });
    if(x.k==='sb'){ const miss=shSetupMissing(s); const msg=app.querySelector(`[data-msg="${key}"]`);
      if(miss.length){ BN_F.sb.forEach(([f])=>{ const i=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(i) i.disabled=true; });
        if(msg) msg.innerHTML=`<span class="e">仕込時の値（${esc(miss.join('・'))}）が未入力のため保存できません。</span><button type="button" class="bn-setup" data-setup="${x.m.no}">→ 仕込時の値を入れる</button>`;
        const b=msg&&msg.querySelector('[data-setup]'); if(b) b.onclick=()=>go(()=>shuboInput(x.m.no, Math.min(13,Math.max(1,x.d)), 'setup')); } }
    validateRow(key); count(); };
  const count=()=>{ if(!live()) return; let n=0, k=0;
    T.forEach(x=>{ const s=bnStore(x.k)[x.m.no]; if(!s) return; k++; const D=(s.days||[])[x.d-1]||{};
      if(BN_F[x.k].some(([f])=>shN(D[f])!==null)) n++; });
    const e=$('#bnDone'); if(e) e.textContent=k<T.length?`${n}/${T.length}…`:`${n}/${T.length}`;
    const box=$('#bnDoneBox'); if(box) box.className=n>=T.length?'ok':'ng'; };
  const validateRow=key=>{ const x=T.find(y=>bnKey(y.k,y.m.no)===key); if(!x) return; const s=bnStore(x.k)[x.m.no]; const days=(s&&s.days)||[];
    const msgs=[];
    BN_F[x.k].forEach(([f,l])=>{ const inp=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(!inp) return;
      inp.classList.remove('warn','bad'); const raw=String(inp.value).trim(); if(raw==='') return;
      const v=Number(raw); if(isNaN(v)){ inp.classList.add('bad'); msgs.push(['bad',l+'：数字ではありません']); return; }
      const c=bnCheck(x.k,f,v,bnPrev(days,x.d,f)); if(c){ inp.classList.add(c[0]); msgs.push([c[0],l+'：'+c[1]]); } });
    const msg=app.querySelector(`[data-msg="${key}"]`); if(!msg||msg.querySelector('[data-setup]')) return;
    if(msgs.length) msg.innerHTML=msgs.map(([c,t])=>`<span class="${c==='bad'?'e':'w'}">⚠ ${esc(t)}</span>`).join('<br>');
    else if(!msg.querySelector('.o')) msg.innerHTML=''; };
  const dirtyN=()=>app.querySelectorAll('.bn-in.dirty').length;
  const syncBtn=()=>{ const b=$('#bnSave'); if(!b) return; const n=dirtyN(); b.disabled=!n; b.textContent=n?`まとめて保存（${n}項目）`:'まとめて保存'; };

  /* 入力：下書きに残す・Enterで次の欄へ */
  app.querySelectorAll('.bn-in').forEach(inp=>{
    inp.addEventListener('input',()=>{ const key=inp.dataset.key, f=inp.dataset.f; const dr=bnDraft(date);
      inp.classList.add('dirty'); (dr[key]=dr[key]||{})[f]=inp.value; bnDraftSet(date,dr);
      const r=inp.closest('tr'); r.classList.remove('done','err'); validateRow(key); syncBtn(); });
    inp.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; e.preventDefault();
      const all=[...app.querySelectorAll('.bn-in:not(:disabled)')]; const i=all.indexOf(inp);
      if(i>=0&&i<all.length-1){ all[i+1].focus(); all[i+1].select&&all[i+1].select(); } else inp.blur(); });
    inp.addEventListener('focus',()=>{ try{ inp.select(); }catch(e){} });
  });
  syncBtn();

  /* 経過（押すと行の下に開く） */
  app.querySelectorAll('.bn-hb').forEach(b=>b.onclick=()=>{ const key=b.dataset.h, tr=app.querySelector(`[data-hist="${key}"]`);
    const open=tr.style.display==='none'; tr.style.display=open?'':'none'; b.classList.toggle('on',open); BN.open[key]=open;
    if(open) bnHist(T.find(y=>bnKey(y.k,y.m.no)===key), tr.firstElementChild); });

  const bnHistRefresh=x=>{ const key=bnKey(x.k,x.m.no); if(!BN.open[key]||!live()) return; const tr=app.querySelector(`[data-hist="${key}"]`); if(tr&&tr.style.display!=='none') bnHist(x,tr.firstElementChild); };
  /* データ：手元の分ですぐ出し、裏で最新を取り直す */
  T.forEach(fill);
  const byK={sb:T.filter(x=>x.k==='sb'), mr:T.filter(x=>x.k==='mr')};
  const refetch=async()=>{ await Promise.all([
    shFetchMany(byK.sb.map(x=>x.m.no),'shubo_get',RC.shubo,no=>{ const x=byK.sb.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } }),
    shFetchMany(byK.mr.map(x=>x.m.no),'bunseki_get',RC.bun,no=>{ const x=byK.mr.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } }) ]);
    if(live()) T.forEach(x=>{ if(!bnStore(x.k)[x.m.no]){ const m=app.querySelector(`[data-msg="${bnKey(x.k,x.m.no)}"]`); if(m&&!m.innerHTML) m.innerHTML='<span class="e">読み込めませんでした（更新を押してください）</span>'; } }); };
  refetch();
  T.forEach(x=>{ const key=bnKey(x.k,x.m.no); if(BN.open[key]){ const tr=app.querySelector(`[data-hist="${key}"]`), b=app.querySelector(`[data-h="${key}"]`); if(tr){ tr.style.display=''; b.classList.add('on'); bnHist(x,tr.firstElementChild); } } });

  $('#bnReload').onclick=async()=>{ rcStatus('更新中…'); await recState(true); T.forEach(x=>bnStore(x.k)[x.m.no]=null); bunHome(date); };

  /* まとめて保存（2本ずつ並行で送る） */
  $('#bnSave').onclick=async()=>{
    const jobs=[];
    T.forEach(x=>{ const key=bnKey(x.k,x.m.no), s=bnStore(x.k)[x.m.no]; const D=((s&&s.days)||[])[x.d-1]||{}; const values={};
      app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).forEach(inp=>{ if(inp.disabled) return; const v=String(inp.value).trim(); if(v!==String(D[inp.dataset.f]??'')) values[inp.dataset.f]=v; });
      const dirty=app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).length;
      if(Object.keys(values).length) jobs.push({x,key,values});
      else if(dirty && s){ app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).forEach(i=>{ if(!i.disabled) i.classList.remove('dirty'); }); const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr); } });
    if(!jobs.length){ syncBtn(); rcStatus('変わったところがありません'); return; }
    const bad=app.querySelectorAll('.bn-in.dirty.bad').length;
    if(bad && !confirm(`ありえない値が ${bad} か所あります。このまま保存しますか？`)) return;
    /* 2026-10-06 泰広さん指示：待たずに裏で送り、前の画面に戻る（推奨追水・警告は画面の下の知らせに出る） */
    jobs.forEach(({x,key,values})=>{
      const st=x.k==='mr'?RC.bun[x.m.no]:RC.shubo[x.m.no], D=st&&st.days&&st.days[x.d-1]; if(D) Object.assign(D,values);
      const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr);
      app.querySelectorAll(`.bn-in[data-key="${key}"]`).forEach(e=>e.classList.remove('dirty'));
      recSaveBg({action:x.k==='sb'?'shubo_save':'bunseki_save', no:x.m.no, day:x.d, values}, `${x.k==='sb'?'酒母':'醪'} 順号${x.m.no} ${x.k==='mr'&&x.d===1?'留':x.d+'日目'}`, true); });
    rcToast(`${jobs.length}本 を裏で保存しています。ほかの作業に移ってOKです`);
    hBack.click(); return;
    const btn=$('#bnSave'); btn.disabled=true; let ok=0, ng=0, i=0, warnN=0;
    rcStatus(`保存中… 0/${jobs.length}`);
    const one=async j=>{ const {x,key,values}=j, tr=app.querySelector(`tr.bn-r[data-key="${key}"]`), msg=app.querySelector(`[data-msg="${key}"]`);
      try{ const res=await recApi({action:x.k==='sb'?'shubo_save':'bunseki_save', no:x.m.no, day:x.d, values},50000);
        if(res&&res.ok){ ok++;
          if(x.k==='mr'&&res.all) RC.bun[x.m.no]=res.all; else { const s=RC.shubo[x.m.no]; const D=s&&s.days&&s.days[x.d-1]; if(D) Object.assign(D,values); }
          const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr);
          if(live()){ app.querySelectorAll(`.bn-in[data-key="${key}"]`).forEach(e=>e.classList.remove('dirty'));
            if(tr){ tr.classList.remove('err'); tr.classList.add('done'); }
            const w=x.k==='mr'&&res.calc?(res.calc.warn||res.calc.miss||''):''; const c=x.k==='mr'&&res.calc;
            if(w) warnN++;
            if(msg) msg.innerHTML=`<span class="o">✓ 保存しました</span>${c&&shN(c.bmd)!==null?`　BMD ${shF(c.bmd)}${shN(c.bmdStd)!==null?'（標準 '+shF(c.bmdStd)+'）':''}`:''}${c&&c.rec?`　<span class="w">推奨追水 ${rcN(c.rec)}L</span>`:''}${w?`<br><span class="w">⚠ ${esc(w)}</span>`:''}`;
            bnHistRefresh(x); }
        } else { ng++; if(live()){ if(tr) tr.classList.add('err'); if(msg) msg.innerHTML=`<span class="e">保存できませんでした：${esc(res&&res.err||'')}</span>`; } }
      }catch(e){ ng++; if(live()){ if(tr) tr.classList.add('err'); if(msg) msg.innerHTML='<span class="e">保存できませんでした（電波を確認して、もう一度「まとめて保存」）</span>'; } }
      rcStatus(`保存中… ${ok+ng}/${jobs.length}`); };
    const worker=async()=>{ while(i<jobs.length){ await one(jobs[i++]); } };
    await Promise.all([worker(),worker()]);
    RC.at=0;
    if(!live()) return;
    syncBtn(); count();
    rcStatus(ng?`${ok}本 保存、${ng}本 保存できませんでした（赤い行）。値は残っているので、もう一度「まとめて保存」を押してください`:`${ok}本 保存しました${warnN?`（注意 ${warnN}本：行の下を確認）`:''}`, !!(ng||warnN));
    /* 酒母は保存後に最新を取り直す（計算はないが、ほかの人の入力も反映） */
    const sbNos=jobs.filter(j=>j.x.k==='sb').map(j=>j.x.m.no);
    if(sbNos.length) shFetchMany(sbNos,'shubo_get',RC.shubo,no=>{ const x=byK.sb.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } });
  };
}

/* 経過：グラフ＋全日の表（その日の列を黄色）。酒母は分析酒母、醪は分析醪と同じ並び */
function bnHist(x, td){
  if(!x||!td) return;
  const s=bnStore(x.k)[x.m.no];
  if(!s){ td.innerHTML='<div class="muted" style="font-size:12px">読み込んでいます…</div>'; return; }
  const days=s.days||[], m=x.m;
  let h='';
  if(x.k==='sb'){
    h+=`<div class="ttl">${esc(m.liquid||'')}<small>　酛立 ${rcMD(m.motodate)}・酛卸予定 ${rcMD(s.motooroshi||s.motooroshiPlan||(m.soe?dadd(m.soe,-1):''))}・酵母 ${esc(m.yeast||'—')}</small></div>`;
    h+=shChart(days.length, days.map(y=>y.day), [
      {name:'ボーメ', color:'#1f5fa8', axis:'L', vals:days.map(y=>shN(y.be))},
      {name:'酸度', color:'#2f7d5d', axis:'R', vals:days.map(y=>shN(y.ta))},
      {name:'品温(●AM○PM)', color:'#c0392b', axis:'R', vals:days.map(y=>shN(y.temp)), pm:days.map(y=>shN(y.tPM))}], x.d-1);
    h+=shTable(days, y=>y.day, [
      ['Be', y=>shF(y.be)], ['alc', y=>shF(y.alc)], ['酸度', y=>shF(y.ta)],
      ['品温', y=>{ const a=shF(y.temp), p=shF(y.tPM); return a||p?`${a||'—'}<span class="pm">${p||'—'}</span>`:''; }],
      ['備考', y=>y.biko?`<span style="font-weight:400;font-size:11px">${esc(String(y.biko).slice(0,8))}</span>`:'']], x.d);
    h+=`<button type="button" class="go" data-open="1">この酒母の画面を開く ›</button>`;
  }else{
    const calc=s.calc||{}, dl=d=>d===1?'留':d;
    const last=Math.max(x.d, ...days.filter(y=>shN(y.be)!==null||shN(y.tAM)!==null).map(y=>y.day), 1);
    const dd=days.slice(0, Math.min(days.length, Math.max(last+3, 12)));
    h+=`<div class="ttl">${esc(m.liquid||'')}<small>　留 ${rcMD(m.tome)}・上槽予定 ${rcMD(m.joso)}・酵母 ${esc(m.yeast||'—')}・追水計画 ${esc(m.oimizu||'—')}L</small></div>`;
    h+=shChart(dd.length, dd.map(y=>dl(y.day)), [
      {name:'標準BMD', color:'#1f5fa8', axis:'L', std:true, vals:dd.map(y=>shN((calc[y.day]||{}).bmdStd))},
      {name:'BMD', color:'#1f5fa8', axis:'L', vals:dd.map(y=>shN((calc[y.day]||{}).bmd))},
      {name:'alc', color:'#7a4fb0', axis:'R', vals:dd.map(y=>shN(y.alc))}], x.d-1);
    h+=shTable(dd, y=>dl(y.day), [
      ['Be/度', y=>shF(y.be)], ['alc', y=>shF(y.alc)], ['酸', y=>shF(y.ta)], ['ｱﾐﾉ', y=>shF(y.aa)], ['追水', y=>shF(y.oimizu,0)],
      ['品温', y=>{ const a=shF(y.tAM), p=shF(y.tPM); return a||p?`${a||'—'}${p?`<span class="pm">${p}</span>`:''}`:''; }],
      ['BMD', y=>shF((calc[y.day]||{}).bmd)],
      ['注意', y=>{ const k=calc[y.day]||{}; return k.warn?`<span class="wn">!</span>`:(k.rec?`<span style="font-size:10px">追${rcN(k.rec)}</span>`:''); }]], x.d);
    h+=`<button type="button" class="go" data-open="1">この醪の画面を開く（仕込み時の値・カルテ）›</button>`;
  }
  td.innerHTML=h.replace(/id="shTw"/g,'');
  const tw=td.querySelector('.sh-tw'), on=tw&&tw.querySelector('th.td');
  if(on) tw.scrollLeft=Math.max(0,on.offsetLeft-tw.clientWidth/2+on.offsetWidth/2);
  td.querySelector('[data-open]').onclick=()=>go(()=>x.k==='sb'?shuboSheet(x.m.no):moromiSheet(x.m.no));
}

(function(){ const s=document.createElement('style'); s.textContent=TODO_CSS; document.head.appendChild(s); })();

/* ---------- データ（端末の控え＋預かり分） ---------- */
const TODO = { items:lsGet('todo.items',[]), at:lsGet('todo.at',0), sheet:lsGet('todo.sheet',''), busy:false, tab:lsGet('todo.tab','すべて'), cat:'',
               vendors:lsGet('todo.vendors',[]), vendor:lsGet('todo.vendor',''), vAll:false };
const TODO_VTAB='🏢 業者別';
const todoQ = ()=>lsGet('todo.q',[]);
const todoMe = ()=>({ id:String(ST.id||''), name:String(ST.name||'') });
const todoNow = ()=>{ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const todoCid = ()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function todoDays(s){ if(!s) return 0; const t=new Date(String(s).slice(0,10)+'T00:00:00'); if(isNaN(t)) return 0; return Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-t)/86400000)); }
/* 見てよいもの：「自分」は登録した本人だけ（端末に前の人の控えが残っていても出さない） */
function todoVisible(x){ return x.cat!==TODO_ME || (!!ST.id && String(x.byId||'')===String(ST.id)); }
function todoOpen(){ return TODO.items.filter(x=>x.status!=='完了' && todoVisible(x)); }
/* 自分のやること（終わっていないもの） */
function todoMine(){ return todoOpen().filter(x=>x.cat===TODO_ME); }
/* すぐにやらなければならない順（小さいほど上）：時期 × 10 ＋ 状態 */
const TODO_WHEN_RANK={'今すぐ':0,'今月中':1,'造り前':2,'造り期間中':3,'':4,'甑倒し後':5,'夏場':6,'来期':7};
const TODO_STAT_RANK={'止まっている':0,'未着手':1,'進行中':2};
function todoRank(x){ const w=TODO_WHEN_RANK[x.when||'']; return (w===undefined?4:w)*10+(TODO_STAT_RANK[x.status||'未着手']??1); }
/* ---------- 業者（発注先） ---------- */
function todoVNames(){ return TODO.vendors.map(v=>String(v.name||'')).filter(Boolean); }
/* その「やること」の発注先：業者欄 → 空なら文面・メモに登録業者の名前が入っていればそれ（いちばん長い名前。古い登録分のため） */
function todoVendorOf(x){
  if(x.vendor) return { name:x.vendor, guess:false };
  const t=String(x.text||'')+' '+String(x.memo||''); let best='';
  todoVNames().forEach(n=>{ if(n.length>=2 && t.includes(n) && n.length>best.length) best=n; });
  return best ? { name:best, guess:true } : null;
}
/* 業者ごとの「終わっていない」件数 */
function todoVCount(){ const c={}; todoOpen().forEach(x=>{ const v=todoVendorOf(x); if(v) c[v.name]=(c[v.name]||0)+1; }); return c; }
/* 業者を登録（端末にすぐ反映→送る）。同じ名前があれば何もしない */
function todoVendorAdd(name){
  name=String(name||'').trim().slice(0,40); if(!name) return '';
  if(!todoVNames().includes(name)) todoPush({action:'vendor_add', name});
  return name;
}
/* ホームのアイコンの数字：終わっていない件数 */
function todoBadge(){ return todoOpen().length; }

async function todoApi(body, ms){
  if(!TODO_URL) throw new Error('no_url');
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||25000) : null;
  try{
    const r=await fetch(TODO_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function todoStore(j){
  TODO.items = (j.items||[]); TODO.at=Date.now(); if(j.sheetUrl) TODO.sheet=j.sheetUrl;
  if(Array.isArray(j.vendors)) TODO.vendors=j.vendors;
  /* まだ送れていない分を上に重ねて見せる */
  todoQ().forEach(op=>todoApplyLocal(op));
  TODO.items = TODO.items.filter(todoVisible);
  lsSet('todo.items',TODO.items); lsSet('todo.at',TODO.at); lsSet('todo.sheet',TODO.sheet); lsSet('todo.vendors',TODO.vendors);
  if(typeof dpRedraw==='function' && document.getElementById('dpMe')) dpRedraw();   // ホームの「自分のやること」も新しく
}
function todoApplyLocal(op){
  if(op.action==='add'){ if(!TODO.items.some(x=>x.id===op.item.id)) TODO.items.push(Object.assign({pend:1},op.item)); }
  else if(op.action==='update'){ const x=TODO.items.find(x=>x.id===op.id); if(x) Object.assign(x,op.fields,{upd:op.at,updBy:op.who.name,pend:1}); }
  else if(op.action==='delete'){ TODO.items=TODO.items.filter(x=>x.id!==op.id); }
  else if(op.action==='vendor_add'){ if(!todoVNames().includes(op.name)){ TODO.vendors.push({name:op.name, kind:'', pend:1}); lsSet('todo.vendors',TODO.vendors); } }
}
/* 書き込み：まず端末に反映→預かり箱へ→送る */
function todoPush(op){
  op.cid=op.cid||todoCid(); op.who=todoMe(); op.at=todoNow();
  todoApplyLocal(op); lsSet('todo.items',TODO.items);
  const q=todoQ(); q.push(op); lsSet('todo.q',q);
  return todoFlush();
}
let TODO_FLUSH=null;
function todoFlush(){
  if(TODO_FLUSH) return TODO_FLUSH;
  TODO_FLUSH=(async()=>{ let sent=0, last=null;
    try{ let g=0; while(g++<50){ const op=todoQ()[0]; if(!op) break;   // 送っている間に足された分も続けて送る
        try{ const j=await todoApi(op,25000);
          if(j&&j.ok){ lsSet('todo.q',todoQ().filter(x=>x.cid!==op.cid)); sent++; last=j; }
          else if(j&&/unknown action/.test(String(j.error||''))){ lsSet('todo.q',todoQ().filter(x=>x.cid!==op.cid)); }   // 裏側が古くて受け付けない操作は捨てる（詰まらせない）
          else break; }
        catch(e){ break; } }
      if(last) todoStore(last);
    }catch(e){}
    TODO_FLUSH=null; return sent; })();
  return TODO_FLUSH;
}
async function todoFetch(){
  if(!TODO_URL || TODO.busy) return false;
  TODO.busy=true;
  try{ if(todoQ().length) await todoFlush(); const j=await todoApi({action:'list', who:todoMe()},20000); if(j&&j.ok){ todoStore(j); return true; } }
  catch(e){} finally{ TODO.busy=false; }
  return false;
}
window.addEventListener('online', ()=>{ if(todoQ().length) todoFlush().then(n=>{ if(n && typeof TODO_REDRAW==='function') TODO_REDRAW(); }); });
let TODO_REDRAW=null;

/* ---------- 一覧画面 ---------- */
function todoScreen(){
  head('やることリスト','やらなければいけないこと・手が付いていないこと');
  let msg='', warn=false;
  function list(){
    let xs=TODO.items.filter(todoVisible);
    if(TODO.tab===TODO_VTAB){
      if(!TODO.vendor) return [];
      return xs.filter(x=>x.status!=='完了' && (todoVendorOf(x)||{}).name===TODO.vendor)
               .sort((a,b)=>todoRank(a)-todoRank(b)||String(a.at||'').localeCompare(String(b.at||'')));
    }
    if(TODO.tab==='完了') xs=xs.filter(x=>x.status==='完了');
    else { xs=xs.filter(x=>x.status!=='完了'); if(TODO.tab!=='すべて') xs=xs.filter(x=>x.when===TODO.tab); }
    if(TODO.cat) xs=xs.filter(x=>x.cat===TODO.cat);
    if(TODO.tab==='完了') xs.sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
    else xs.sort((a,b)=>todoRank(a)-todoRank(b)||String(a.at||'').localeCompare(String(b.at||'')));   // すぐやるものほど上、同じなら古いものほど上
    return xs;
  }
  function item(x){
    const dn=x.status==='完了', d=todoDays(x.at);
    const ac=dn?'dn':d>=90?'a90':d>=60?'a60':d>=30?'a30':'';
    const sc={'進行中':'s1','止まっている':'s2','完了':'s3'}[x.status]||'';
    const mine=x.cat===TODO_ME, late=!dn&&x.due&&x.due<dtoday();
    const age=dn?`完了 ${esc(String(x.doneAt||'').slice(5,10).replace('-','/'))}${x.doneBy?'（'+esc(x.doneBy)+'）':''}`:(d===0?'今日':d+'日');
    return `<div role="button" tabindex="0" class="td-it ${ac} ${mine?'mine':''}" data-id="${esc(x.id)}"><div class="bd">
      <div class="tx">${esc(x.text)}</div>
      ${x.memo?`<div class="mm">${esc(x.memo)}</div>`:''}
      <div class="mt"><span class="pl st ${sc}">${esc(x.status||'未着手')}</span>${(v=>v?`<span class="pl vd ${v.guess?'gs':''}">🏢 ${esc(v.name)}${v.guess?'（メモから）':''}</span>`:'')(todoVendorOf(x))}${x.cat?`<span class="pl ${mine?'me':''}">${esc(todoCatL(x.cat))}</span>`:''}${x.due?`<span class="pl due ${late?'late':''}">📅 ${esc(rcMD?rcMD(x.due):x.due)}${late?' 期限切れ':''}</span>`:''}${x.when?`<span class="pl ${x.when==='今すぐ'?'w0':x.when==='今月中'?'w1':''}">${esc(x.when)}</span>`:''}
        <span>${esc(x.by||'')}</span>${x.pend?'<span class="pend">（送信待ち）</span>':''}<span class="age">${age}</span></div></div>
      ${dn?`<button type="button" class="td-ok back" data-ok="0" aria-label="未完了に戻す">戻す</button>`:`<button type="button" class="td-ok" data-ok="1" aria-label="済にする">済</button>`}</div>`;
  }
  function draw(){
    TODO_REDRAW=draw;
    const open=todoOpen(), cnt=w=>open.filter(x=>x.when===w).length;
    const tabs=['すべて',TODO_VTAB,...TODO_WHENS,'完了'];
    const vc=todoVCount(), vOn=TODO.tab===TODO_VTAB;
    let h=`<div class="td-tabs">${tabs.map(t=>{ const n=t==='すべて'?open.length:t==='完了'?TODO.items.filter(x=>x.status==='完了'&&todoVisible(x)).length:t===TODO_VTAB?Object.values(vc).reduce((a,b)=>a+b,0):cnt(t);
      return `<button type="button" data-t="${t}" class="${t===TODO_VTAB?'vt ':''}${TODO.tab===t?'on':''}">${t==='完了'?'✓ 済み':t}${n?`<small>${n}</small>`:''}</button>`; }).join('')}</div>`;
    if(TODO.undo && TODO.items.some(x=>x.id===TODO.undo.id)) h+=`<div class="td-undo"><span>「${esc(TODO.undo.text)}」を${TODO.undo.done?'済みリストに移しました':'やることに戻しました'}</span><button type="button" id="tdUndo">元に戻す</button></div>`;
    if(vOn){
      /* 発注するものがある業者を先に（件数の多い順）、ほかの業者は「ほかの業者」を押すと出る */
      const vs=TODO.vendors.map((v,i)=>({name:String(v.name||''), kind:v.kind||'', n:vc[v.name]||0, i})).filter(v=>v.name);
      vs.sort((a,b)=>(b.n>0)-(a.n>0)||b.n-a.n||a.i-b.i);
      const has=vs.filter(v=>v.n>0), rest=vs.filter(v=>!v.n);
      const vb=v=>`<button type="button" data-v="${esc(v.name)}" class="${v.n?'':'z '}${TODO.vendor===v.name?'on':''}">${esc(v.name)}${v.n?`<b>${v.n}</b>`:''}${v.kind?`<small>${esc(v.kind)}</small>`:''}</button>`;
      const showRest=TODO.vAll || (TODO.vendor && !vc[TODO.vendor]);
      h+=`<div class="td-vs">${has.map(vb).join('')}${showRest?rest.map(vb).join(''):''}
          ${rest.length?`<button type="button" class="more" id="tdVMore">${showRest?'▲ 閉じる':`ほかの業者（${rest.length}）▾`}</button>`:''}
          <button type="button" class="reg" id="tdVReg">＋ 業者を登録</button></div>`;
      if(!TODO.vendors.length) h+=`<div class="card" style="color:var(--sub);text-align:center">業者の一覧を読み込んでいます…（出ないときは電波のよい所で開き直してください）</div>`;
      if(TODO.vendor){
        h+=`<div class="td-vh">🏢 ${esc(TODO.vendor)} に発注するもの <small>${vc[TODO.vendor]||0}件</small></div>
          <button type="button" class="td-add vd" id="tdAdd" ${TODO_URL?'':'disabled'}>＋ ${esc(TODO.vendor)} に発注するものを書く</button>`;
      } else if(TODO.vendors.length) h+=`<div class="td-msg">上の業者を押すと、その業者に発注するものが出ます。</div>`;
    } else {
      const base=(()=>{ const c=TODO.cat; TODO.cat=''; const r=list(); TODO.cat=c; return r; })();   // 分類で絞る前（件数用）
      h+=`<div class="td-cats">${TODO_CATS.filter(c=>c!==TODO_ME||ST.id).map(c=>{ const k=base.filter(x=>x.cat===c).length;
        return `<button type="button" data-c="${c}" class="${c===TODO_ME?'me ':''}${TODO.cat===c?'on':''}">${todoCatL(c)}${k?`<small>${k}</small>`:''}</button>`; }).join('')}</div>
      ${TODO.tab==='完了'?'':`<button type="button" class="td-add" id="tdAdd" ${TODO_URL?'':'disabled'}>＋ やることを書く</button>`}`;
    }
    if(!TODO_URL) h+=`<div class="tl-warn" style="margin-bottom:10px">記録先（Apps Script）の設定がまだ済んでいません。設定が済むと、書き込み・共有ができるようになります。</div>`;
    if(msg) h+=`<div class="td-msg ${warn?'w':''}">${esc(msg)}</div>`;
    const xs=list();
    if(!(vOn && !TODO.vendor))
    h+= xs.length ? xs.map(item).join('')
      : `<div class="card" style="color:var(--sub);text-align:center">${TODO.tab==='完了'?'終わったものはまだありません。':vOn?'この業者に発注するものはありません。':'ここに入っているものはありません。'}</div>`;
    if(TODO.cat===TODO_ME && !vOn) h+=`<p class="tl-note">👤 自分 … あなた（${esc(ST.name||'')}）にだけ表示されます。ほかの人には見えません。予定日を入れると、ホームの本日の予定の下にも出ます。</p>`;
    const q=todoQ().length;
    h+=`<p class="tl-note">すぐやるものほど上に出ます（時期：今すぐ→今月中→造り前…、同じ時期は 止まっている→未着手→進行中、さらに古いもの）。左の色：<b style="color:#c9a800">黄</b>＝30日以上、<b style="color:#e07a10">橙</b>＝60日以上、<b style="color:#d62b22">赤</b>＝90日以上。
      右端の「済」を押すと「✓ 済み」に移ります（済みも分類で絞り込めます）。ボックスを押すと、状況やメモを変えられます。${q?`<br><b>送信待ち ${q}件</b>（電波が入ると自動で送られます）`:''}
      ${TODO.sheet?`<br><a href="${esc(TODO.sheet)}" target="_blank" rel="noopener">スプレッドシートで見る</a>`:''}</p>`;
    app.innerHTML=h;
    app.querySelectorAll('.td-tabs button').forEach(b=>b.onclick=()=>{ TODO.tab=b.dataset.t; lsSet('todo.tab',TODO.tab); draw(); });
    app.querySelectorAll('.td-cats button').forEach(b=>b.onclick=()=>{ TODO.cat=TODO.cat===b.dataset.c?'':b.dataset.c; draw(); });
    app.querySelectorAll('.td-vs button[data-v]').forEach(b=>b.onclick=()=>{ TODO.vendor=TODO.vendor===b.dataset.v?'':b.dataset.v; lsSet('todo.vendor',TODO.vendor); draw(); });
    const vm=$('#tdVMore'); if(vm) vm.onclick=()=>{ TODO.vAll=!TODO.vAll; if(!TODO.vAll && TODO.vendor && !todoVCount()[TODO.vendor]){ TODO.vendor=''; lsSet('todo.vendor',''); } draw(); };
    const vr=$('#tdVReg'); if(vr) vr.onclick=()=>todoVendorForm(draw);
    const a=$('#tdAdd'); if(a) a.onclick=()=>todoEdit(null, draw);
    app.querySelectorAll('.td-it').forEach(b=>b.onclick=e=>{ const x=TODO.items.find(x=>x.id===b.dataset.id); if(!x) return;
      const ok=e.target.closest('.td-ok');
      if(ok){ e.stopPropagation(); const done=ok.dataset.ok==='1'; todoSetDone(x, done); TODO.undo={id:x.id, text:x.text, done};
        clearTimeout(TODO.undoT); TODO.undoT=setTimeout(()=>{ TODO.undo=null; if(TODO_REDRAW===draw && nav[nav.length-1]===todoScreen) draw(); }, 8000);
        draw(); todoFlush().then(()=>{ if(TODO_REDRAW===draw) draw(); }); return; }
      todoEdit(x, draw); });
    const ud=$('#tdUndo'); if(ud) ud.onclick=()=>{ const u=TODO.undo, x=u&&TODO.items.find(x=>x.id===u.id); TODO.undo=null; clearTimeout(TODO.undoT);
      if(x) todoSetDone(x, !u.done); draw(); todoFlush().then(()=>{ if(TODO_REDRAW===draw) draw(); }); };
  }
  draw();
  if(TODO_URL){ msg=TODO.items.length?'':'読み込み中…'; draw();
    todoFetch().then(ok=>{ if(TODO_REDRAW!==draw || nav[nav.length-1]!==todoScreen) return; msg=ok?'':(TODO.items.length?'電波が弱いため、端末に残っている分を出しています':'読み込めませんでした。電波のよい所でもう一度開いてください'); warn=!ok; draw(); }); }
}

/* ---------- 書く・直す（下から出る） ---------- */
function todoEdit(x, redraw){

  }catch(e){ if(e && e.name==='AbortError') throw new Error('時間がかかりすぎました。電波のよい所でもう一度'); throw e; }
  finally { if(t) clearTimeout(t); }
}
function mxSaveLocal(){ try{ lsSet('mx.list',MX.list); lsSet('mx.admin',MX.admin); lsSet('mx.docs',MX.docs); }catch(e){} }
function mxKeepList(j){ MX.list=j.items||[]; MX.admin=!!j.admin; MX.sheet=j.sheetUrl||''; mxSaveLocal(); }
function mxKeepDoc(j){
  if(!j || !j.meta) return;
  MX.docs[j.meta.id]={ meta:j.meta, pub:j.pub, draft:j.draft, history:j.history||[], at:Date.now() };
  if(typeof j.admin==='boolean') MX.admin=j.admin;
  MX.list=MX.list||[]; const i=MX.list.findIndex(x=>x.id===j.meta.id); if(i>=0) MX.list[i]=j.meta; else MX.list.push(j.meta);
  mxSaveLocal();
}
async function mxFetchList(){ try{ mxKeepList(await mxApi({action:'list'},30000)); MX.err=''; return true; }catch(e){ MX.err=String(e.message||e); return false; } }
async function mxFetchDoc(id){ try{ mxKeepDoc(await mxApi({action:'get',id},40000)); return true; }catch(e){ return false; } }
function mxSoon(){ const d=new Date(Date.now()+14*86400000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mxDue(m){ return !!(m && m.pubVer && m.review && m.review <= mxSoon()); }
