<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="製造ツール">
<title>製造ツール</title>
<style>
:root{
  --navy:#1b2a41; --navy2:#263c5a; --gold:#b08d3f; --gold-l:#d8b96a;
  --paper:#f7f4ec; --card:#ffffff; --ink:#22262b; --sub:#6b7280;
  --ok:#2f7d5d; --ng:#b23b3b; --line:#e4ded1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.7;
  font-size:16px; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 40px}
header{
  background:var(--navy); color:#fff;
  padding:12px 14px; padding-top:calc(12px + min(env(safe-area-inset-top),48px));
  position:sticky; top:0; z-index:20; box-shadow:0 1px 6px rgba(0,0,0,.15);
}
#boot{background:#fff8e6;border:1px solid #e8d9a8;border-radius:12px;padding:14px;margin-top:16px;
  font-size:14px;line-height:1.8}
#boot b{color:#8a6d1f}
#boot code{font-size:11px;color:#b23b3b;word-break:break-all;display:block;margin-top:8px}
header .hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.04em;flex:1}
header .sm{font-size:11px;color:#b9c4d4;font-weight:400;display:block;letter-spacing:.02em}
.btn-back{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;
  padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-back:active{background:rgba(255,255,255,.12)}
.who{background:none;border:1px solid rgba(255,255,255,.3);color:#dfe6f0;border-radius:999px;
  padding:4px 10px;font-size:11px;line-height:1.35;cursor:pointer;font-family:inherit;text-align:right;
  max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.who:active{background:rgba(255,255,255,.12)}
.who.hide{display:none}

h2{font-size:15px;margin:22px 0 10px;font-weight:600;color:var(--navy);
   border-left:3px solid var(--gold);padding-left:9px}
.muted{color:var(--sub);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.crs{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;
  font-family:inherit;font-size:16px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:10px;color:inherit}
.crs:active{background:#fbf9f4}
.crs .nm{font-weight:600;font-size:15px}
.crs .ds{font-size:12px;color:var(--sub)}
.crs .go{color:var(--gold);font-size:18px}
.crs[disabled]{opacity:.5;cursor:default}

/* ===== ホーム：麒麟山の帯（写真があれば写真、無ければ絵） ===== */
.kz{position:relative;margin:0 -14px 0;height:132px;overflow:hidden;background:linear-gradient(180deg,#1c3350,#3d6285)}
.kz img{width:100%;height:100%;object-fit:cover;display:block}
.kz svg{width:100%;height:100%;display:block}
.kz .fade{position:absolute;left:0;right:0;bottom:0;height:46px;pointer-events:none;
  background:linear-gradient(180deg,rgba(247,244,236,0),var(--paper))}
.kz .cap{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10.5px;
  color:var(--navy);z-index:2;letter-spacing:.01em}
.kz .cap b{color:#7a5f22}
.kz.photo .cap{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.65)}
.kz.photo .cap b{color:#f0dda8}
.kz.photo .fade{height:58px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28) 45%,rgba(0,0,0,.58))}
.kz .sig{position:absolute;top:8px;left:14px;z-index:2;color:#fff;font-size:11px;
  letter-spacing:.14em;text-shadow:0 1px 4px rgba(0,0,0,.6);opacity:.9}
.kz-hide{display:none!important}
.kz-pride{text-align:center;font-size:11.5px;color:var(--sub);margin:12px 4px 0}
.kz-pride b{color:var(--gold)}

/* ===== ホーム：亀甲（六角形）ならべ ===== */
/* 正六角形：高さ＝幅×1.1547。3列を等間隔に並べる（ずらして噛み合わせない）。 */
.hx{--g:10px;--w:calc((100% - 2 * var(--g)) / 3);margin:10px 0 2px;user-select:none}
.hx .row{display:flex;gap:var(--g);justify-content:space-between}
.hx .row + .row{margin-top:12px}
.hxb{width:var(--w);aspect-ratio:1 / 1.1547;flex:0 0 auto;position:relative;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  -webkit-clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  border:0;padding:0;margin:0;font-family:inherit;color:#26210f;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;overflow:hidden;transition:filter .12s,transform .12s;
  filter:drop-shadow(0 2px 3px rgba(84,72,24,.22))}
.hxb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(152deg,rgba(255,255,255,.42),rgba(255,255,255,0) 56%)}
.hxb:active{filter:drop-shadow(0 1px 2px rgba(84,72,24,.2)) brightness(1.06);transform:scale(.93)}
.hxb{will-change:transform}
/* 稲の模様（穂・籾・葉）。墨の線をうっすら */
.hxb .tex{position:absolute;inset:0;z-index:0;pointer-events:none}

/* ---- 出てくるときの動き（1つずつ順に） ---- */
@keyframes hxIn{
  0%  {opacity:0;transform:scale(.62) translateY(12px)}
  62% {opacity:1;transform:scale(1.045) translateY(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.hx .hxb{animation:hxIn .46s cubic-bezier(.22,1.1,.36,1) both;
  animation-delay:calc(var(--i,0) * 42ms)}
.hx .hxw{animation:hxIn .46s cubic-bezier(.22,1.1,.36,1) both;
  animation-delay:calc(var(--i,0) * 42ms)}
.hx .hxw .hxb{animation:none}

/* ---- 光が一度すっと流れる ---- */
.hxb .sheen{position:absolute;top:0;left:0;width:55%;height:100%;z-index:2;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:translateX(-160%) skewX(-12deg);
  animation:hxSheen 1.15s ease-out both;
  animation-delay:calc(var(--i,0) * 42ms + 300ms)}
@keyframes hxSheen{0%{transform:translateX(-160%) skewX(-12deg)}100%{transform:translateX(330%) skewX(-12deg)}}

/* ---- 赤い丸：ゆっくり脈打つ ---- */
@keyframes hxPulse{
  0%,72%,100%{transform:scale(1)}
  80%{transform:scale(1.18)}
  88%{transform:scale(1)}
}
.hxn{animation:hxPop .3s cubic-bezier(.2,1.4,.4,1) both calc(var(--i,0) * 42ms + 380ms),
  hxPulse 3.2s ease-in-out 1.6s infinite;transform-origin:center}
@keyframes hxPop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}

/* ---- 「きょう」の行はあとから浮き上がる ---- */
@keyframes hxUp{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:translateY(0)}}
.hx-today span{animation:hxUp .42s ease-out both;animation-delay:calc(440ms + var(--i,0) * 70ms)}

@media (prefers-reduced-motion:reduce){
  .hx .hxb,.hx .hxw,.hxb .sheen,.hxn,.hx-today span,.hxtag{animation:none!important}
  .hxb .sheen{display:none}
}
.hxb .e{font-size:clamp(20px,6.4vw,26px);line-height:1;position:relative;z-index:1}
.hxb .lb{font-size:clamp(9.5px,2.9vw,11.5px);font-weight:700;line-height:1.25;text-align:center;
  padding:0 7px;position:relative;z-index:1;letter-spacing:-.02em}
.hxb .sm{display:block;font-weight:400;font-size:.86em;opacity:.7}
.hxw{position:relative;flex:0 0 auto;width:var(--w);aspect-ratio:1 / 1.1547}
.hxw .hxb{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
/* 在庫未確認の赤い帯（16:45以降。米管理の六角形の中に重ねる） */
@keyframes hxBlink{0%,100%{opacity:1}50%{opacity:.3}}
.hxtag{position:absolute;left:6%;right:6%;bottom:17%;z-index:3;background:#d62b22;color:#fff;
  font-size:9.5px;font-weight:700;text-align:center;border-radius:4px;padding:2.5px 0;
  letter-spacing:.01em;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.25);
  animation:hxBlink 1.1s ease-in-out infinite}
.hx-today span.w.bl{animation:hxUp .42s ease-out both,hxBlink 1.1s ease-in-out 1s infinite}
.hxn{position:absolute;top:8%;right:7%;z-index:3;background:#d62b22;color:#fff;
  font-size:11px;font-weight:700;min-width:21px;height:21px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  border:2px solid var(--paper);pointer-events:none}
.hx-today{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 2px 2px}
.hx-today span{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:3px 11px;white-space:nowrap}
.hx-today b{color:var(--navy);font-size:12.5px}
.hx-today span.w{border-color:#e6b9b6;background:#fdf3f2;color:#8a2c28}
.hx-today span.w b{color:#b02a26}

.ring{width:46px;height:46px;flex:0 0 46px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--navy)}

.bar{height:7px;background:#eae4d7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:99px}

.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tab{flex:1;min-width:90px;padding:9px 6px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:13px;font-family:inherit;cursor:pointer;color:var(--sub)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

.sub{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  background:#fff;border-radius:10px;margin-bottom:7px;cursor:pointer;font-family:inherit;
  font-size:14px;width:100%;text-align:left;color:inherit}
.sub:active{background:#fbf9f4}
.sub .nm{flex:1;font-size:14px}
.sub .pct{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.sub .mini{width:52px;flex:0 0 52px}

.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:9px;letter-spacing:.02em}
.btn.p{background:var(--navy);color:#fff}
.btn.g{background:var(--gold);color:#fff}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4;cursor:default}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin:14px 0 6px}
.chip{display:inline-block;background:#efe9dc;color:#6b5c34;border-radius:99px;padding:2px 10px;font-size:11px;margin-right:6px}
.qtext{font-size:16px;line-height:1.85;margin:14px 0 18px;font-weight:500}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);
  background:#fff;border-radius:11px;margin-bottom:8px;font-size:15px;font-family:inherit;cursor:pointer;
  color:inherit;line-height:1.6}
.opt:active{background:#fbf9f4}
.opt.sel-ok{border-color:var(--ok);background:#effaf4}
.opt.sel-ng{border-color:var(--ng);background:#fdf0f0}
.opt.ans{border-color:var(--ok);background:#effaf4}
.opt.dim{opacity:.5}
.ox{display:flex;gap:10px}
.ox .opt{flex:1;text-align:center;font-size:26px;padding:16px 0;font-weight:700}

.res{border-radius:11px;padding:13px 14px;margin:14px 0;font-size:14px;line-height:1.8}
.res.ok{background:#effaf4;border:1px solid #bfe3d1}
.res.ng{background:#fdf0f0;border:1px solid #f0cccc}
.res .jd{font-weight:700;margin-bottom:6px;font-size:15px}
.res .jd.ok{color:var(--ok)} .res .jd.ng{color:var(--ng)}
.res .sc{font-size:12px;color:var(--sub);margin-top:8px}

.score{text-align:center;padding:22px 0 8px}
.score .big{font-size:44px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.score .lbl{font-size:13px;color:var(--sub)}
.rrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:flex-start}
.rrow .mk{flex:0 0 20px;font-weight:700}
.rrow .mk.ok{color:var(--ok)} .rrow .mk.ng{color:var(--ng)}

.stat{display:flex;gap:8px;margin:12px 0}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}

/* 添付資料の表 */
details.tbl{border:1px solid var(--line);background:#fff;border-radius:11px;margin:0 0 16px;overflow:hidden}
details.tbl>summary{padding:12px 14px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:8px}
details.tbl>summary::-webkit-details-marker{display:none}
details.tbl>summary::before{content:'▸';color:var(--gold);font-size:13px}
details.tbl[open]>summary::before{content:'▾'}
.tblbody{padding:0 14px 14px}
.tblmeta{font-size:11px;color:var(--sub);line-height:1.7;margin-bottom:8px}
.tblwrap{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table.dat{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.dat th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;font-weight:600;
  padding:7px 8px;text-align:right;white-space:nowrap}
table.dat td{padding:6px 8px;text-align:right;border-top:1px solid #eee;white-space:nowrap}
table.dat tr:nth-child(even) td{background:#fbf9f4}
table.dat tr.hl td{background:#efe9dc;font-weight:700}
.nocopy{font-size:10px;color:#b23b3b;margin-top:6px;text-align:right}
.btn.skip{background:none;color:var(--sub);border:1px dashed var(--line);font-weight:400;font-size:14px;
  padding:11px;margin-top:4px}
.btn.skip:active{background:#f2eee5}
.skipnote{font-size:11px;text-align:center;margin-top:-4px}
.legend{font-size:11px;color:var(--sub);margin:6px 0 12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin:0 3px 0 9px;vertical-align:middle}
.hide{display:none}
footer{text-align:center;font-size:11px;color:#a29c8e;margin-top:26px;padding-bottom:10px}
textarea{width:100%;height:150px;font-family:ui-monospace,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:8px;padding:8px}
</style>
</head>
<body>
<header><div class="hin">
  <button class="btn-back hide" id="back">‹ 戻る</button>
  <h1 id="ttl">製造ツール<span class="sm" id="sub"></span></h1>
  <button class="who hide" id="who" aria-label="設定を開く"></button>
</div></header>
<div class="wrap" id="app">
  <div id="boot">
    <b>アプリを起動できませんでした。</b><br>
    このまま何も表示されない場合は、JavaScript が動かない画面で開かれています。<br><br>
    右下の <b>共有ボタン → 「Safariで開く」</b>、または「ファイル」アプリに保存してから開き直してください。
    <code id="bootErr"></code>
  </div>
</div>
<noscript><div class="wrap"><div id="boot"><b>JavaScriptが無効です。</b><br>ブラウザの設定でJavaScriptを有効にしてください。</div></div></noscript>

<script>
window.onerror=function(m,s,l,c){
  var e=document.getElementById('bootErr');
  if(e)e.textContent='['+l+':'+c+'] '+m;
  return false;
};
</script>
<script>
/* 問題データはサーバーから配信されます（ログイン成功時） */
let COURSES=[], TABLES={}, QUESTIONS=[];
const OX=["○","×"];
function applyData(d){
  COURSES=(d&&d.courses)||[]; TABLES=(d&&d.tables)||{}; QUESTIONS=(d&&d.questions)||[];
}

/* ===== サーバー（Apps Script ウェブアプリ）===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwVyR-kBMHw8V2Co258MK6u9XCTWb4vQMGF20an9BXNGeH-H_4Fe_5JD_2JG8cmiXNX/exec";
/* ============================================== */

/* ========== 端末に保存する内容 ========== */
const KEY='sakeWB2';
let MEM=null, CANSAVE=true;
(function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ CANSAVE=false; } })();
function fresh(){return{stats:{},logs:[],name:'',id:'',token:'',q:[],data:null,dataVer:''}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return MEM||fresh()}}
function save(){ MEM=ST; try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){CANSAVE=false} }
let ST=load();
function st(id){return ST.stats[id]||{c:0,w:0,k:0,t:0}}
function record(id,ok){
  const s=st(id);
  if(ok){s.c++;s.k++}else{s.w++;s.k=0}
  s.t=Date.now(); ST.stats[id]=s; save();
}

/* ========== サーバーとのやりとり ========== */
const ONLINE_OK=!!API_URL;
async function api(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),redirect:'follow'});
  return await r.json();
}
const ERRJP={
  no_id:'そのIDは登録されていません。杜氏に確認してください。',
  bad_pw:'パスワードが違います。',
  not_registered:'このIDはまだパスワードが設定されていません。「初めての方」から設定してください。',
  already:'このIDはすでにパスワードが設定されています。「ログイン」からお進みください。',
  weak_pw:'パスワードは4文字以上にしてください。',
  suspended:'このIDは現在使えません。杜氏に確認してください。',
  bad_token:'ログインし直してください。（別の端末でログインすると、前の端末は自動でログアウトされます）',
  busy:'混み合っています。少し待ってからお試しください。'
};
const errJP=e=>ERRJP[e]||('うまくいきませんでした（'+(e||'原因不明')+'）');

/* ログインを速くする：端末に同じ版のデータがあれば送ってもらわない／学習記録が端末にあれば復元用を読まない */
function loginBody(b){
  if(ST.data&&ST.data.questions&&ST.data.questions.length&&ST.dataVer) b.have=ST.dataVer;
  if(Object.keys(ST.stats||{}).length) b.hasLocal=true;
  return b;
}
/* ログイン画面を出した時点でサーバーを起こしておく（ID・パスワードを打っている間に準備が済む） */
let WARMED=false;
function warmServer(){ if(WARMED||!ONLINE_OK)return; WARMED=true; try{ fetch(API_URL,{method:'GET',mode:'no-cors',cache:'no-store'}).catch(()=>{}); }catch(e){} }
function newSid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* 未送信の記録をためて、順に送る */
function enqueue(p){ ST.q.push(p); if(ST.q.length>100)ST.q=ST.q.slice(-100); save(); flush() }
let flushing=false;
function flush(cb){
  if(!ONLINE_OK||!ST.token||flushing||!ST.q.length){if(cb)cb();return}
  flushing=true;
  const item=Object.assign({action:'sync',token:ST.token},ST.q[0]);
  let settled=false;
  const done=(ok)=>{ if(settled)return; settled=true;
    if(ok){ ST.q.shift(); save(); flushing=false; flush(cb) } else { flushing=false; if(cb)cb() } };
  const t=setTimeout(()=>done(false),15000);
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(item),redirect:'follow'})
    .then(r=>r.json()).then(j=>{clearTimeout(t);
      if(j&&j.err==='bad_token'){ logout(true); done(false); return }
      done(!!(j&&j.ok));})
    .catch(()=>{clearTimeout(t);done(false)});
}

function buildPayload(course,range,ansList){
  const bySub={};
  ansList.forEach(a=>{const k=a.q.sub;bySub[k]=bySub[k]||{sub:k,c:0,t:0};bySub[k].t++;if(a.ok)bySub[k].c++});
  const sum=COURSES.map(c=>{
    const qs=QUESTIONS.filter(q=>q.course===c.id); if(!qs.length)return null;
    const cnt=[0,0,0,0]; qs.forEach(q=>cnt[lvl(q.id)]++);
    const tries=qs.reduce((n,q)=>n+st(q.id).c+st(q.id).w,0);
    return {course:c.name,pct:mastery(qs),m3:cnt[3],m2:cnt[2],m1:cnt[1],m0:cnt[0],tries:tries};
  }).filter(Boolean);
  return {sid:newSid(),course:course,range:range,
    subs:Object.keys(bySub).map(k=>bySub[k]), sum:sum,
    st:ST.stats, lg:ST.logs.slice(-30), ts:new Date().toISOString()};
}

/* 2026-10-06 ホーム固定の高さ：iPhoneのホーム画面アプリでは CSS の画面高さが実際より短いことがあるので、JSで実寸を入れる */
function hmSize(){ const b=document.body; if(!b.classList.contains('hm')){ b.style.height=''; document.documentElement.classList.remove('hm'); return; }
  /* iPhoneのホーム画面アプリでは、画面の高さが「上の安全領域（時計の帯）」の分だけ短く報告されることがある */
  let st=0; try{ const pr=document.createElement('div'); pr.style.cssText='position:fixed;top:0;left:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden'; b.appendChild(pr); st=pr.offsetHeight; pr.remove(); }catch(e){}
  let h=Math.max(window.innerHeight, document.documentElement.clientHeight||0);
  const sa = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if(sa && window.screen){ const land=window.matchMedia&&matchMedia('(orientation: landscape)').matches;
    const sh=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    h=Math.max(h, Math.min(sh, h+st)); }
  document.documentElement.classList.add('hm'); b.style.height=h+'px';
  /* 予定の枠の高さを実寸で決める（アイコンが必ず全部見えるように） */
  requestAnimationFrame(()=>{ const box=document.getElementById('dpBox'), ics=document.querySelector('#app .dp-ics'), app=document.getElementById('app');
    if(!box||!ics||!app) return;
    const pb=parseFloat(getComputedStyle(app).paddingBottom)||0, mt=parseFloat(getComputedStyle(ics).marginTop)||0;
    let between=0; let n=box.nextElementSibling; while(n&&n!==ics){ between+=n.getBoundingClientRect().height; n=n.nextElementSibling; }
    const avail=Math.floor(h - pb - box.getBoundingClientRect().top - between - mt - ics.getBoundingClientRect().height);
    box.style.maxHeight=Math.max(72,avail)+'px'; box.style.height=Math.max(72,avail)+'px'; });
}

/* ===== ホームの赤い丸と「今日」の行 =====
   米管理・出勤表のデータ（MFG）は下の tools の中にあり、ここより後で読み込まれる。
   まだ無くても落ちないように、いつも typeof で確かめてから使う。 */
function homeMfg(){ try{ return (typeof MFG!=='undefined' && MFG) ? MFG : null; }catch(e){ return null; } }
function homeDay(){ const d=new Date(); const p=n=>('0'+n).slice(-2);
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
/* その日に確認がすんでいない品種の数（品種受払に動きがある日だけ数える） */
function homeRiceLeft(){
  const M=homeMfg(); const Z=M&&M.zaiko; if(!Z||!Z.days) return 0;
  const d=homeDay(); const x=Z.days[d]; if(!x) return 0;
  const ks=Object.keys(Z.days).sort(); let at=null;
  for(const k of ks) if(k<=d) at=k;
  const st=at?Z.days[at].s:[];
  const done={}; ((M.zvchecks)||[]).forEach(r=>{ if(r.date===d) done[r.v]=1; });
  let n=0;
  Z.vars.forEach((v,k)=>{ if(((st[k]||0)||(x.i[k]||0)||(x.o[k]||0)) && !done[v]) n++; });
  return n;
}
/* 在庫未確認の知らせを出す時刻（泰広さん指定 16:45）。
   この時刻をすぎて、まだ確認がすんでいない品種があれば、米管理に赤い帯を出す。
   品種受払に動きが無い日は homeRiceLeft() が 0 を返すので、何も出ない。 */
const RICE_ALERT_H = 16, RICE_ALERT_M = 45;
function riceAlertOn(){
  const n=new Date();
  return (n.getHours()*60+n.getMinutes()) >= (RICE_ALERT_H*60+RICE_ALERT_M);
}
function riceAlert(){ return riceAlertOn() && homeRiceLeft()>0; }
/* まだ16:45前なら、その時刻になった瞬間にホームを描き直す（開きっぱなしでも切り替わる） */
let RICE_TIMER=null;
function riceAlertTimer(redraw){
  if(RICE_TIMER){ clearTimeout(RICE_TIMER); RICE_TIMER=null; }
  if(riceAlertOn()) return;
  const n=new Date(), t=new Date(n); t.setHours(RICE_ALERT_H,RICE_ALERT_M,5,0);
  const ms=t-n; if(ms<=0 || ms>13*3600000) return;
  RICE_TIMER=setTimeout(()=>{ try{ redraw(); }catch(e){} }, ms);
}
function homeBadge(kind){
  const M=homeMfg(); if(!M) return 0;
  if(kind==='rice') return homeRiceLeft();
  if(kind==='cal'){
    const me=M.me||{}, rs=M.requests||[];
    const p=rs.filter(r=>r.status==='申請中');
    return me.admin ? p.length : p.filter(r=>r.applicantId===me.id).length;
  }
  return 0;
}
function homeToday(){
  const M=homeMfg(); if(!M) return '';
  const d=homeDay(); const out=[];
  const S=M.senmai;
  if(S&&S.days&&S.days[d]){
    const e=S.days[d].e||[];
    const kg=e.reduce((a,x)=>a+Number(x[6]||0),0);
    out.push(`<span>きょうの洗米 <b>${e.length}件・${Math.round(kg).toLocaleString('ja-JP')}kg</b></span>`);
  }
  const left=homeRiceLeft();
  if(left) out.push(riceAlertOn()
    ? `<span class="w bl">⚠ 在庫未確認 <b>${left}品種</b></span>`
    : `<span class="w">在庫チェック 残り <b>${left}品種</b></span>`);
  const cal=homeBadge('cal');
  if(cal) out.push(`<span>振休の承認待ち <b>${cal}件</b></span>`);
  if(!out.length) return '';
  return `<div class="hx-today">${out.map((x,i)=>x.replace('<span','<span style="--i:'+i+'"')).join('')}</div>`;
}

/* ===== 六角形の中の稲の模様 =====
   ho＝実った穂の粒、momi＝籾のすじ、ha＝葉脈。墨の細い線をうっすら重ねる。 */
function hexTex(kind){
  const o = a => `stroke="#3d3413" stroke-opacity="${a}" fill="none" stroke-linecap="round"`;
  let g = '';
  if(kind==='ho'){
    for(let c=0;c<3;c++){ const bx=26+c*24;
      for(let i=0;i<7;i++){ const y=14+i*12, dx=(i%2?4:-4);
        g += `<ellipse cx="${bx+dx}" cy="${y}" rx="4.6" ry="7" ${o(.17)} stroke-width="1.4" transform="rotate(${dx>0?14:-14} ${bx+dx} ${y})"/>`; } }
  } else if(kind==='momi'){
    for(let i=-4;i<=4;i++){ const x=50+i*9;
      g += `<path d="M${x},6 C${x+i*1.6},34 ${x+i*1.6},66 ${x},94" ${o(.16)} stroke-width="1.6"/>`; }
  } else if(kind==='ha'){
    g = `<path d="M50,4 C50,35 50,68 50,96" ${o(.22)} stroke-width="2"/>`;
    for(let i=0;i<7;i++){ const y=14+i*11.5;
      g += `<path d="M50,${y} C36,${y+3} 26,${y+9} 20,${y+17}" ${o(.15)} stroke-width="1.5"/>`;
      g += `<path d="M50,${y} C64,${y+3} 74,${y+9} 80,${y+17}" ${o(.15)} stroke-width="1.5"/>`; }
  } else return '';
  return `<svg class="tex" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
}

function kirinzanBind(){
  const img=$('#kzImg'), svg=$('#kzSvg'), band=$('#kzBand');
  if(!img||!band) return;
  img.onload =()=>{ img.classList.remove('kz-hide'); if(svg) svg.classList.add('kz-hide'); band.classList.add('photo'); };
  img.onerror=()=>{ img.classList.add('kz-hide'); if(svg) svg.classList.remove('kz-hide'); band.classList.remove('photo'); };
  if(img.complete && img.naturalWidth) img.onload();
}

/* ========== コース画面 ========== */
let curCourse=null,curGrade=null;
function course(cid){
  const c=COURSES.find(x=>x.id===cid); curCourse=cid;
  const grades=[...new Set(QUESTIONS.filter(q=>q.course===cid).map(q=>q.grade))];
  if(!grades.includes(curGrade))curGrade=grades[0];
  head(c.name,c.desc);
  render();
  function render(){
    const qs=qsOf(cid,curGrade);
    let h='';
    if(grades.length>1){h+=`<div class="tabs">`+grades.map(g=>`<button class="tab ${g===curGrade?'on':''}" data-g="${g}">${g}</button>`).join('')+`</div>`}
    const fresh=qs.filter(q=>lvl(q.id)===0);
    const weak=qs.filter(q=>lvl(q.id)===1);
    h+=`<h2>まとめて解く</h2>`;
    if(fresh.length)h+=`<button class="btn p" id="mNew">続きから（まだ解いていない${fresh.length}問）</button>`;
    else h+=`<div class="card" style="text-align:center;color:var(--ok);font-weight:600;margin-bottom:10px">${curGrade}の全${qs.length}問に着手済みです</div>`;
    h+=`<button class="btn g" id="mWeak">苦手だけ復習${weak.length?`（${weak.length}問）`:''}</button>
      <button class="btn o" id="mRnd">ランダム10問</button>
      <button class="btn o" id="mAll">全${qs.length}問に挑戦</button>
      <h2>科目べつに解く</h2>
      <div class="legend">習熟度
        <span class="dot" style="background:${LVC[0]}"></span>未着手
        <span class="dot" style="background:${LVC[1]}"></span>要復習
        <span class="dot" style="background:${LVC[2]}"></span>学習中
        <span class="dot" style="background:${LVC[3]}"></span>習得</div>`;
    subsOf(cid,curGrade).forEach(s=>{
      const list=qsOf(cid,curGrade,s), m=mastery(list);
      const dots=list.map(q=>`<span style="display:inline-block;width:6px;height:6px;border-radius:99px;background:${LVC[lvl(q.id)]};margin-right:2px"></span>`).join('');
      h+=`<button class="sub" data-s="${esc(s)}">
        <div style="flex:1"><div class="nm">${esc(s)}</div><div style="margin-top:3px">${dots}</div></div>
        <div class="mini bar"><i style="width:${m}%"></i></div>
        <div class="pct">${m}%</div></button>`;
    });
    app.innerHTML=h;
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curGrade=b.dataset.g;render();});
    $('#mAll').onclick=()=>go(()=>quiz(qs,`${curGrade} 全科目`));
    $('#mRnd').onclick=()=>go(()=>quiz(shuffle(qs).slice(0,10),`${curGrade} ランダム`));
    if($('#mNew'))$('#mNew').onclick=()=>go(()=>quiz(fresh,`${curGrade} 続きから`));
    $('#mWeak').onclick=()=>{
      if(!weak.length){alert('この範囲に間違えたままの問題はありません。');return}
      go(()=>quiz(shuffle(weak),`${curGrade} 苦手復習`))};
    document.querySelectorAll('.sub').forEach(b=>b.onclick=()=>{
      const s=b.dataset.s; go(()=>quiz(qsOf(cid,curGrade,s),`${curGrade} ${s}`))});
  }
}

/* ========== 出題 ========== */
let Q=[],idx=0,ans=[],skipped=[],title='';
function quiz(list,t){
  Q=list;idx=0;ans=[];skipped=[];title=t;
  if(!Q.length){alert('問題がありません');nav.pop();return}
  head(t,'');
  step();
}
function step(){
  if(idx>=Q.length){result();return}
  const q=Q[idx];
  hSub.textContent=`${idx+1} / ${Q.length}問`;
  let opts='';
  if(q.type==='ox'){
    opts=`<div class="ox">${OX.map((o,i)=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
  }else{
    opts=q.c.map((o,i)=>`<button class="opt" data-v="${i}">${esc(o)}</button>`).join('');
  }
  app.innerHTML=`
    <div class="bar" style="margin-top:14px"><i style="width:${idx/Q.length*100}%"></i></div>
    <div class="qhead"><div><span class="chip">${esc(q.sub)}</span><span class="chip">${esc(q.grade)}</span></div>
      <div>${idx+1}/${Q.length}</div></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.tbl?tableHTML(q.tbl):''}
    <div id="opts">${opts}</div>
    <div id="skipwrap"><button class="btn skip" id="skip">この問題を飛ばす</button>
      <div class="muted skipnote">飛ばした問題は記録に残らず、最後にまとめて解き直せます。</div></div>
    <div id="fb"></div>`;
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>pick(b.dataset.v));
  $('#skip').onclick=()=>{ skipped.push(q); idx++; step(); };
}
function pick(v){
  const q=Q[idx];
  const val=q.type==='ox'?v:parseInt(v,10);
  const ok=(val===q.a)||(q.type==='ox'&&val===q.a);
  record(q.id,ok);
  scheduleSnap();
  ans.push({q,val,ok});
  document.querySelectorAll('#opts .opt').forEach(b=>{
    const bv=q.type==='ox'?b.dataset.v:parseInt(b.dataset.v,10);
    b.disabled=true; b.style.cursor='default';
    if(bv===q.a)b.classList.add('ans');
    else if(bv===val)b.classList.add('sel-ng');
    else b.classList.add('dim');
  });
  const sw=$('#skipwrap'); if(sw)sw.remove();
  const shown=q.type==='ox'?q.a:esc(q.c[q.a]);
  const s=st(q.id);
  $('#fb').innerHTML=`
    <div class="res ${ok?'ok':'ng'}">
      <div class="jd ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　<span style="font-weight:400;font-size:13px;color:var(--sub)">正答：${shown}</span></div>
      <div style="white-space:pre-line">${esc(q.e)}</div>
      <div class="sc">出典：${esc(q.src||'—')}　／　この問題 ${s.c}○ ${s.w}× ・${LVN[lvl(q.id)]}</div>
    </div>
    <button class="btn p" id="nx">${idx+1<Q.length?'次の問題へ':'結果を見る'}</button>`;
  $('#nx').onclick=()=>{idx++;step()};
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function result(){
  const ok=ans.filter(a=>a.ok).length, tot=ans.length;

    head('結果',title);
    app.innerHTML=`<div class="card" style="margin-top:16px;text-align:center">
        <div style="font-weight:600">解答した問題はありませんでした</div>

      ${skipped.length?'<button class="btn p" id="sk">飛ばした'+skipped.length+'問を解く</button>':''}
      <button class="btn o" id="hm">ホームへ戻る</button>`;
    if(skipped.length){const s=skipped.slice();$('#sk').onclick=()=>{nav.pop();go(()=>quiz(s,title))}}
    $('#hm').onclick=()=>{nav=[];go(home)};
    return;
  }
  const pt=ans.filter(a=>a.ok).reduce((s,a)=>s+(a.q.pt||1),0);
  const ptAll=ans.reduce((s,a)=>s+(a.q.pt||1),0);
  ST.logs.push({d:Date.now(),t:title,ok,tot}); if(ST.logs.length>200)ST.logs=ST.logs.slice(-200); save();
  if(ONLINE_OK&&ST.token){
    const cs=[...new Set(ans.map(a=>a.q.course))].map(id=>(COURSES.find(c=>c.id===id)||{}).name||id);
    enqueue(buildPayload(cs.join('／'),title,ans));
  }
  head('結果',title);
  const bySub={};
  ans.forEach(a=>{const k=a.q.sub;bySub[k]=bySub[k]||[0,0];bySub[k][1]++;if(a.ok)bySub[k][0]++});
  let h=`<div class="score"><div class="big">${ok}<span style="font-size:20px;color:var(--sub)"> / ${tot}</span></div>
    <div class="lbl">正答率 ${Math.round(ok/tot*100)}%　／　配点換算 ${pt} / ${ptAll}点</div></div>
    <div class="bar" style="margin:10px 0 18px"><i style="width:${ok/tot*100}%"></i></div>
    <h2>科目べつ</h2>`;
  Object.keys(bySub).forEach(k=>{const[c,t]=bySub[k];
    h+=`<div class="sub" style="cursor:default"><div class="nm">${esc(k)}</div>
      <div class="mini bar"><i style="width:${c/t*100}%"></i></div><div class="pct">${c}/${t}</div></div>`});
  const ngs=ans.filter(a=>!a.ok);
  if(ngs.length){
    h+=`<h2>間違えた問題（${ngs.length}）</h2><div class="card">`;
    ngs.forEach(a=>{h+=`<div class="rrow"><div class="mk ng">×</div><div><div>${esc(a.q.q)}</div>
      <div class="muted" style="margin-top:3px">正答：${a.q.type==='ox'?a.q.a:esc(a.q.c[a.q.a])}</div></div></div>`});
    h+=`</div><button class="btn g" id="again">間違えた${ngs.length}問をもう一度</button>`;
  }else{ h+=`<div class="card" style="text-align:center;color:var(--ok);font-weight:600">全問正解です。お見事。</div>` }
  if(skipped.length){
    h+=`<h2>飛ばした問題（${skipped.length}）</h2><div class="card">`;
    skipped.forEach(q=>{h+=`<div class="rrow"><div class="mk" style="color:var(--sub)">–</div>
      <div><div>${esc(q.q)}</div><div class="muted" style="margin-top:3px">${esc(q.sub)}</div></div></div>`});
    h+=`</div><button class="btn p" id="skgo">飛ばした${skipped.length}問を解く</button>`;
  }
  if(ONLINE_OK&&ST.token)h+=`<div class="muted" style="text-align:center;margin:10px 0" id="sndMsg">記録を送信しています…</div>`;
  h+=`<button class="btn o" id="hm">ホームへ戻る</button>`;
  app.innerHTML=h;
  if(ONLINE_OK&&ST.token){
    let tries=0;
    const tick=()=>{
      const m=$('#sndMsg'); if(!m)return;
      if(!ST.q.length){m.textContent='記録を送信しました';return}
      if(++tries>30){m.textContent=`未送信 ${ST.q.length}件（電波が入ると自動で送られます）`;return}
      m.textContent='記録を送信しています…'; setTimeout(tick,800);
    };
    setTimeout(tick,800);
  }
  if(ngs.length)$('#again').onclick=()=>{nav.pop();go(()=>quiz(shuffle(ngs.map(a=>a.q)),title+'（復習）'))};
  if(skipped.length){const s=skipped.slice();$('#skgo').onclick=()=>{nav.pop();go(()=>quiz(s,title+'（飛ばした分）'))}}
  $('#hm').onclick=()=>{nav=[];go(home)};
}

function exportText(){
  const d=new Date(), p=n=>('0'+n).slice(-2);
  let s=`【製造ツール 進捗】${ST.name||'（未設定）'}　${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}\n`;
  COURSES.forEach(c=>{
    const qs=QUESTIONS.filter(q=>q.course===c.id); if(!qs.length)return;
    s+=`\n■${c.name}　習熟度${mastery(qs)}%\n`;
    [...new Set(qs.map(q=>q.grade))].forEach(g=>{
      let yet=[];
      subsOf(c.id,g).forEach(sub=>{
        const l=qsOf(c.id,g,sub);
        const t=l.reduce((n,q)=>n+st(q.id).c+st(q.id).w,0);
        const cc=l.reduce((n,q)=>n+st(q.id).c,0);
        if(!t){yet.push(sub);return}
        s+=` ${g}／${sub}：習熟度${mastery(l)}%（${t}回中${cc}回正解）\n`;
      });
      if(yet.length)s+=` ${g}／未着手：${yet.join('、')}\n`;
    });
  });
  const tries=Object.values(ST.stats).reduce((n,x)=>n+x.c+x.w,0);
  s+=`\n通算解答 ${tries}回／学習セッション ${ST.logs.length}回`;
  return s;
}

    else if(ST.token){ 
      head('製造ツール','読み込んでいます…');
      app.innerHTML='<div class="card" style="margin-top:16px;text-align:center" class="muted">問題を読み込んでいます…</div>';
      const j=await api(loginBody({action:'login',token:ST.token}));
      if(j.ok) afterLogin(j); else logout(j.err==='bad_token');
    }
    else { nav=[]; loginScreen(); }
  }catch(err){
    if(ST.token&&ST.data){ applyData(ST.data); go(home); }
    else { nav=[]; loginScreen('通信できませんでした。電波の良い場所でお試しください。'); }
  }
})();

/* 裏で最新の問題データを取り直す */
async function refreshData(){
  if(!ONLINE_OK||!ST.token)return;
  try{
    const j=await api(loginBody({action:'login',token:ST.token}));
    if(j&&j.ok&&j.data&&j.data.questions&&j.data.questions.length){
      const before=QUESTIONS.length;
      ST.token=j.token||ST.token; ST.data=j.data; ST.dataVer=j.dataVer||''; save(); applyData(ST.data);
      if(QUESTIONS.length!==before && nav.length<=1) go(home,false);
    }else if(j&&j.err==='bad_token'){ logout(true) }
  }catch(e){}
}

/* ---------- 容量計算（タンク容量早見表） ---------- */
let TANKS=null, TANKS_INFO='';
function decodeTank(t){
  if(t._v) return t;
  const v=[t.f]; let cur=t.f;
  for(const tok of String(t.d||'').split(',')){
    if(!tok) continue;
    const [a,n]=tok.split('*'); const step=parseInt(a,36); const cnt=n?parseInt(n,10):1;
    for(let i=0;i<cnt;i++){ cur-=step; v.push(cur); }
  }
  t._v=v; return t;
}
async function loadTanks(){
  if(TANKS) return TANKS;
  // 古い早見表が端末に残っていると「計算しない」表示が続くので消す
  try{ localStorage.removeItem('tool.tanks'); localStorage.removeItem('tool.tanks2'); }catch(e){}

  const fromLogin = (ST.data && ((ST.data.dictionary&&ST.data.dictionary.tanks) || ST.data.tanks)) || null;
  if(fromLogin){ TANKS=fromLogin; TANKS_INFO='サーバー'; return TANKS; }
  // ② 同じ場所の tanks.json（端末に保存して、電波が無くても使えるようにする）
  try{
    const r=await fetch('tanks.json?v='+Date.now(),{cache:'no-store'});
    if(r.ok){ const d=await r.json(); lsSet('tool.tanks3',d); TANKS=d; TANKS_INFO='最新'; return TANKS; }
  }catch(e){}
  const c=lsGet('tool.tanks3',null); if(c){ TANKS=c; TANKS_INFO='端末に保存した版'; return TANKS; }
  return null;
}
function tankByNo(no){
  if(!TANKS||no===null||no==='') return null;
  const t=TANKS.tanks.find(x=>String(x.no)===String(no).trim());
  return t?decodeTank(t):null;
}
/* 空寸（mm）→ 容量（ℓ）。表は2mmごと。間は直線で補う */
function volAt(t,mm){
  const v=t._v, maxd=(v.length-1)*2;
  if(mm<0||mm>maxd) return null;
  const i=Math.floor(mm/2), r=(mm-2*i)/2;
  const a=v[i], b=(i+1<v.length)?v[i+1]:a;
  return a+(b-a)*r;
}
/* 容量（ℓ）→ 空寸（mm） */
function mmAt(t,L){
  const v=t._v;
  if(L>v[0]||L<v[v.length-1]) return null;
  for(let i=0;i<v.length-1;i++){
    if(v[i]>=L && L>=v[i+1]){ const d=v[i]-v[i+1]; return 2*i + (d? 2*(v[i]-L)/d : 0); }
  }
  return (v.length-1)*2;
}

      </div>`:''}

      ${t&&!blocked?`<div style="margin-top:8px;font-size:12px;color:#1d6b45">✓ 造りexが書き出した早見表そのまま（容器番号も造りexのもの）</div>`:''}
    </div>`;
}
/* パネルで今わかっている量（ℓ）。合計に使う */
function capVol(k){
  const st=Object.assign({no:'',mode:'mm',mm:'',L:''}, lsGet('tool.cap'+k,{}));
  const t=tankByNo(st.no);
  if(!t || t.verify || t.blocked || !t.checked) return null;
  if(st.mode==='mm'){ const m=pnum(st.mm); if(m===null) return null; const v=volAt(t,m); return v===null?null:Math.round(v); }

}
async function capacityScreen(){

        ${(()=>{const b=TANKS.tanks.filter(x=>x.blocked);return b.length?`<br><b style="color:#8a1c1c">容器 ${b.map(x=>x.no).join('・')} は造りexの数値に直らないところがあるため、計算しません。</b>`:'';})()}</p>
      <button class="tl-link" id="capClr">入力を消す</button>`;
    app.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{ lsSet('tool.capsel',Number(b.dataset.cs)); draw(); });

/* ---------- 濾過計算（タンクを合わせたときの成分） ---------- */
const FIELDS=[['sm','日本酒度'],['alc','Alc'],['ta','酸度'],['aa','アミノ酸度']];
function wavg(rows,key){ let s=0,w=0; for(const r of rows){ const x=pnum(r[key]), L=pnum(r.L); if(x!==null&&L!==null&&L>0){ s+=x*L; w+=L; } } return w?s/w:null; }
function sumL(rows){ return rows.reduce((a,r)=>a+(pnum(r.L)||0),0); }
function filterScreen(){
  head('濾過計算','タンクを合わせたときの数値');
  let G=lsGet('tool.filter',null);
  if(!G) G=[{name:'',rows:[{},{}]}];
  const save=()=>lsSet('tool.filter',G);
  const draw=()=>{
    let h=`<div style="height:12px"></div>`;
    G.forEach((g,gi)=>{
      h+=`<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <input class="tl-in" style="flex:1;font-weight:700" placeholder="まとめ ${gi+1}（例：濾過 36）" data-g="${gi}" data-gf="name" value="${esc(g.name||'')}">
        ${G.length>1?`<button class="tl-mini" data-delg="${gi}" aria-label="このまとめを消す">×</button>`:''}</div>
        <div class="tl-scroll"><table class="tl-tbl"><tr><th>タンク</th>${FIELDS.map(f=>`<th>${f[1]}</th>`).join('')}<th>ℓ</th><th></th></tr>`;
      g.rows.forEach((r,ri)=>{
        h+=`<tr><td class="tno"><input data-g="${gi}" data-r="${ri}" data-f="tank" value="${esc(r.tank||'')}"></td>`+
          FIELDS.map(f=>`<td><input inputmode="decimal" data-g="${gi}" data-r="${ri}" data-f="${f[0]}" value="${esc(r[f[0]]??'')}"></td>`).join('')+
          `<td><input inputmode="numeric" data-g="${gi}" data-r="${ri}" data-f="L" value="${esc(r.L??'')}"></td>
          <td>${g.rows.length>1?`<button class="tl-mini" data-delr="${gi}:${ri}" aria-label="この行を消す">×</button>`:''}</td></tr>`;
      });
      h+=`<tr class="tot"><td>合計</td>${FIELDS.map(f=>`<td>${fnum(wavg(g.rows,f[0]),f[0]==='sm'?1:2)}</td>`).join('')}<td>${fnum(sumL(g.rows),0)}</td><td></td></tr></table></div>
        <button class="tl-link" data-addr="${gi}">＋ タンクを足す</button></div>`;
    });
    const all=G.flatMap(g=>g.rows);
    h+=`<button class="btn o" id="addG">＋ まとめを足す</button>
      <div class="card" style="margin-top:10px"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">全部を合わせると</div>
      ${FIELDS.map(f=>`<div class="tl-row"><span>${f[1]}</span><b>${fnum(wavg(all,f[0]),f[0]==='sm'?1:2)}</b></div>`).join('')}
      <div class="tl-row"><span>合計量</span><b class="tl-big">${fnum(sumL(all),0)} ℓ</b></div></div>
      <p class="tl-note">各数値は量（ℓ）で重みをつけた平均です。空欄のタンクはその項目の計算から外します（Excel版は空欄を0として計算していました）。</p>
      <button class="tl-link" id="fClr">すべて消す</button>`;
    app.innerHTML=h;
    app.querySelectorAll('input[data-g]').forEach(inp=>inp.addEventListener('change',()=>{
      const g=G[+inp.dataset.g];
      if(inp.dataset.gf) g[inp.dataset.gf]=inp.value; else g.rows[+inp.dataset.r][inp.dataset.f]=inp.value;
      save(); draw(); }));
    app.querySelectorAll('[data-addr]').forEach(b=>b.onclick=()=>{ G[+b.dataset.addr].rows.push({}); save(); draw(); });
    app.querySelectorAll('[data-delr]').forEach(b=>b.onclick=()=>{ const [gi,ri]=b.dataset.delr.split(':').map(Number); G[gi].rows.splice(ri,1); save(); draw(); });
    app.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{ G.splice(+b.dataset.delg,1); save(); draw(); });
    $('#addG').onclick=()=>{ G.push({name:'',rows:[{},{}]}); save(); draw(); };
    $('#fClr').onclick=()=>{ if(!confirm('入力をすべて消しますか？'))return; G=[{name:'',rows:[{},{}]}]; save(); draw(); };

/* ---------- アル添計算（目標の日本酒度とアルコール添加量） ---------- */
/* 日本酒度は量で加重平均できるものとして計算（Excel「伝辛」シートと同じ式）
   添加量 = { (醪ℓ+四段ℓ)×目標 − (醪日本酒度×醪ℓ + 四段日本酒度×四段ℓ) } ÷ (アルコールの日本酒度 − 目標) */
function alcCalc(p,target){
  const G=((p.mL+p.yL)*target-(p.mSM*p.mL+p.ySM*p.yL))/(p.aSM-target);
  const tot=p.mL+p.yL+G;
  const alc=(p.mL*p.mAlc+p.yL*p.yAlc+p.aAlc*G)/tot;
  return {G,tot,alc};
}
function alcScreen(){
  head('アル添計算','目標の日本酒度とアルコール添加量');
  const def={mSM:'3',mL:'9456',mAlc:'18.3',ySM:'-150',yL:'718',yAlc:'1',aSM:'73.6',aAlc:'40',tgt:'7',step:'0.5'};
  let s=Object.assign({},def,lsGet('tool.alc',{}));
  const draw=()=>{
    const p={mSM:pnum(s.mSM),mL:pnum(s.mL)||0,mAlc:pnum(s.mAlc),ySM:pnum(s.ySM)||0,yL:pnum(s.yL)||0,yAlc:pnum(s.yAlc)||0,aSM:pnum(s.aSM),aAlc:pnum(s.aAlc)};
    const tgt=pnum(s.tgt), step=pnum(s.step)||0.5;
    const ok=[p.mSM,p.mAlc,p.aSM,p.aAlc,tgt].every(x=>x!==null)&&p.mL>0&&p.aSM!==tgt;
    const r=ok?alcCalc(p,tgt):null;
    const inp=(k,lab,mode)=>`<label>${lab}</label><input class="tl-in${k==='tgt'?' key':''}" inputmode="${mode||'decimal'}" data-a="${k}" value="${esc(s[k])}">`;
    let tbl='';
    if(ok){
      const rows=[]; for(let i=-2;i<=4;i++){ const t=Math.round((tgt+i*step)*100)/100; if(p.aSM===t)continue; rows.push([t,alcCalc(p,t)]); }
      tbl=`<div class="card"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">目標を変えると</div><div class="tl-scroll"><table class="tl-tbl">
        <tr><th>目標の日本酒度</th><th>アルコール</th><th>添加後の量</th><th>添加後のAlc</th></tr>
        ${rows.map(([t,x])=>`<tr class="${t===tgt?'hl':''}"><td>${fnum(t,1)}</td><td>${x.G<0?'—':fnum(x.G,0)+' ℓ'}</td><td>${fnum(x.tot,0)} ℓ</td><td>${fnum(x.alc,2)} %</td></tr>`).join('')}
      </table></div></div>`;
    }
    app.innerHTML=`<div style="height:12px"></div>
      <div class="card"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">醪</div><div class="tl-grid">${inp('mSM','日本酒度')}${inp('mL','量（ℓ）','numeric')}${inp('mAlc','Alc（%）')}</div></div>
      <div class="card"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">四段</div><div class="tl-grid">${inp('ySM','日本酒度')}${inp('yL','量（ℓ）','numeric')}${inp('yAlc','Alc（%）')}</div>
        <p class="tl-note">四段が無いときは量を0に。四段のAlcはExcel版と同じ1%を初期値にしています。</p></div>
      <div class="card"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">アルコール</div><div class="tl-grid">${inp('aSM','日本酒度')}${inp('aAlc','度数（%）')}</div></div>
      <div class="card"><div class="tl-grid">${inp('tgt','目標の日本酒度')}${inp('step','表の刻み')}</div>
        ${r?`<div style="margin-top:10px">
          <div class="tl-row"><span>アルコール添加量</span><b class="tl-big">${r.G<0?'不要（すでに目標より辛い）':fnum(r.G,0)+' ℓ'}</b></div>
          <div class="tl-row"><span>添加後の量</span><b>${fnum(r.tot,0)} ℓ</b></div>
          <div class="tl-row"><span>添加後のAlc</span><b>${fnum(r.alc,2)} %</b></div></div>`:'<p class="tl-note">醪・アルコール・目標の数字を入れると計算します。</p>'}
      </div>${tbl}
      <p class="tl-note">式はExcel「Aｌｃ添加」の伝辛シートと同じです。日本酒度を量で加重平均できるものとして計算しています。</p>
      <button class="tl-link" id="aDef">初期値（伝辛シートの例）に戻す</button>`;
    app.querySelectorAll('[data-a]').forEach(i=>i.addEventListener('change',()=>{ s[i.dataset.a]=i.value; lsSet('tool.alc',s); draw(); }));
    $('#aDef').onclick=()=>{ s=Object.assign({},def); lsSet('tool.alc',s); draw(); };
  };
  draw();
}

  '伝辛':['#fdefc0','#276b12'], 'ぽたり五百万':['#d9f0d2','#176a2c'], '金雲母':['#e6cdba','#9c1f16'],

/* 製造ツールの返事かどうか（清酒学習帳の受信窓口が返す {ok:true,msg:…} を取り違えないため） */
function mfgValid(j){ return !!(j && j.ok && (j.mfg || j.kinds || j.meta || j.shukkin || j.senmai || j.zaiko)); }
if(MFG && !mfgValid(MFG)) { MFG=null; try{ localStorage.removeItem('mfg.cache'); }catch(e){} }

function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dparse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dadd(s,n){ const d=dparse(s); d.setDate(d.getDate()+n); return dstr(d); }
function dtoday(){ return dstr(new Date()); }
function djp(s,withYear){ const d=dparse(s); return (withYear?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'; }
function dshort(s){ const d=dparse(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
function tjp(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return String(iso); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function kgfmt(v){ return (Math.round(v*10)/10).toLocaleString('ja-JP'); }
function bags(kg){
  const neg = kg<0, a=Math.abs(kg), n=Math.floor(a/BAG_KG+1e-9), r=Math.round((a-n*BAG_KG)*10)/10;
  const t = n&&r ? `<b>${n}</b>袋＋<b>${kgfmt(r)}</b>kg` : n ? `<b>${n}</b>袋` : `<b>${kgfmt(r)}</b>kg`;
  return (neg?'−':'')+t;
}
const nrm = s=>String(s||'').replace(/[\s　]/g,'');
/* 酵母割当（造りex\酵母割当\*.xlsx）。液種の指定が優先、なければ仕込番号 */
function yeastOf(prod, no){
  const Y = MFG && MFG.yeast; if(!Y) return '';
  return (Y.byProd && Y.byProd[prod]) || (Y.byNo && Y.byNo[String(no)]) || '';
}
function prodChip(p){ const c=MFG_PROD_COLORS[p]||['#eef0f3','#333']; return `<span class="mf-prod" style="background:${c[0]};color:${c[1]}">${esc(p)}</span>`; }
function ratioBadge(r){ return `<span class="mf-bdg" style="background:${MFG_RATIO_COLORS[r]||'#555'}">${r}%</span>`; }

async function mfgLoad(force){
  if(MFG && !force) { mfgRefresh(); return MFG; }
  return mfgRefresh();
}
function mfgRefresh(){
  if(MFG_LOADING) return MFG_LOADING;
  MFG_LOADING = (async()=>{
    try{
      const j = await apiT({action:'mfg_get', token:ST.token}, 20000);
      if(mfgValid(j)){ MFG=j; MFG._at=Date.now(); MFG_ERR=''; MFG_STALE=false; lsSet('mfg.cache', MFG); }
      else if(j && j.ok){ /* 学習帳の受信窓口が答えている＝製造ツールの処理が動いていない。前の内容は消さない */
        MFG_ERR='サーバー側の製造ツール機能が動いていません（Apps Script を「新バージョン」でデプロイし直してください）。'; MFG_STALE=true; }
      else MFG_ERR = (j&&j.err==='bad_token') ? 'ログイン情報を確認できませんでした。いったんログアウトしてログインし直してください。'
                   : (j&&j.err&&j.err!=='server') ? 'サーバーの準備がまだ済んでいません（米管理・出勤表の設定手順を実施してください）。'
                   : 'サーバーでエラーが起きました' + (j&&j.msg?'（'+j.msg+'）':''), MFG_STALE=true;
    }catch(e){ MFG_ERR='通信できませんでした。'; MFG_STALE=true; }
    MFG_LOADING=null; return MFG;
  })();
  return MFG_LOADING;
}

/* ================= 酵母・麹ライブラリ =================
   全国の酵母・種麹のデータ。毎朝のネット調査でサーバー側が増えていく。
   端末に丸ごと持つので、一度読み込めば通信できないときも使える。 */
let LIB = lsGet('lib.cache', null), LIB_ERR = '', LIB_LOADING = null;
const LIB_TAB = {v:'trend'};               // trend=トレンド / ask=提案 / find=さがす
const LIB_SEL = {aroma:'', taste:[], kire:'', yoin:'', acid:'', power:'', foam:'', use:[], kind:'酵母', kura:''};
const LIB_FIND = {q:'', group:'', kind:''};

const LIB_Q = [
  {k:'aroma', label:'香り',   opts:['カプロン酸エチル系','酢酸イソアミル系','バランス型','穏やか'], multi:false},
  {k:'taste', label:'味',     opts:['甘み・ふくらみ','旨み・コク','酸が立つ','淡麗・軽快'],        multi:true },
  {k:'kire',  label:'キレ',   opts:['キレが良い','標準','やわらか'],                               multi:false},
  {k:'yoin',  label:'余韻',   opts:['長い','標準','短い・すっきり'],                               multi:false}
];
const LIB_Q2 = [
  {k:'acid',  label:'酸',     opts:['高い','標準','少なめ'],           multi:false},
  {k:'power', label:'発酵力', opts:['強い','標準','低温向き'],         multi:false},
  {k:'foam',  label:'泡',     opts:['泡あり','泡なし'],                multi:false},
  {k:'use',   label:'用途',   opts:['吟醸・出品','純米・純吟','普通酒・本醸造','ブレンド・特殊'], multi:true}
];

function libRefresh(){
  if(LIB_LOADING) return LIB_LOADING;
  LIB_LOADING = (async()=>{
    try{
      const j = await apiT({action:'mfg_lib', token:ST.token}, 60000);
      if(j && j.ok && j.json){
        try{ LIB = JSON.parse(j.json); LIB_ERR=''; lsSet('lib.cache', LIB); }
        catch(e){ LIB_ERR='データを読めませんでした。'; }
      }
      else if(j && j.err==='no_lib') LIB_ERR='サーバーにライブラリがまだありません。';
      else if(j && j.ok) LIB_ERR='サーバー側の製造ツール機能が動いていません（Apps Script のデプロイを確認してください）。';
      else LIB_ERR='受け取れませんでした'+(j&&j.err?'（'+j.err+'）':'');
    }catch(e){ LIB_ERR='通信できませんでした。'; }
    LIB_LOADING=null; return LIB;
  })();
  return LIB_LOADING;
}
const libItems = ()=> (LIB && LIB.items) || [];
function libCf(c){ return c==='複数出典'?'c2':c==='単一出典'?'c1':'c0'; }
function libArr(v){ return Array.isArray(v)?v:(v?[v]:[]); }

/* 選んだ条件との合い方。合えば+2、食い違えば-1、データが無ければ0 */
function libScore(e){
  let sc=0, hit=0, tot=0, miss=0;
  const one=(sel, val)=>{ if(!sel) return; tot++; if(val==null||val===''){ miss++; return; }
    if(val===sel){ sc+=2; hit++; } else sc-=1; };
  const many=(sels, vals)=>{ if(!sels.length) return; tot+=sels.length;
    const V=libArr(vals);
    if(!V.length){ miss+=sels.length; return; }
    sels.forEach(x=>{ if(V.indexOf(x)>=0){ sc+=2; hit++; } else sc-=1; }); };
  one(LIB_SEL.aroma, e.aroma); many(LIB_SEL.taste, e.taste);
  one(LIB_SEL.kire, e.kire);   one(LIB_SEL.yoin, e.yoin);
  one(LIB_SEL.acid, e.acid);   one(LIB_SEL.power, e.power);
  one(LIB_SEL.foam, e.foam);   many(LIB_SEL.use, e.use);
  return {sc, hit, tot, miss};
}
function libAnyCond(){
  return !!(LIB_SEL.aroma||LIB_SEL.kire||LIB_SEL.yoin||LIB_SEL.acid||LIB_SEL.power||LIB_SEL.foam
            ||LIB_SEL.taste.length||LIB_SEL.use.length);
}
function libTags(e){
  const t=[];
  if(e.aroma) t.push(e.aroma);
  libArr(e.taste).forEach(x=>t.push(x));
  if(e.kire) t.push(e.kire); if(e.yoin) t.push('余韻'+e.yoin);
  if(e.acid) t.push('酸'+e.acid); if(e.power) t.push('発酵力'+e.power);
  if(e.foam) t.push(e.foam);
  if(e.gluco) t.push('糖化力'+e.gluco); if(e.amylase) t.push('液化力'+e.amylase);
  if(e.protease) t.push('タンパク分解'+e.protease); if(e.haze) t.push(e.haze);
  libArr(e.use).forEach(x=>t.push(x));
  return t.map(x=>`<span class="lb-tag">${esc(x)}</span>`).join('');
}
function libCard(e, r){
  const hit = r ? `<div class="lb-hit ${r.hit?'':'few'}">条件に合う ${r.hit} / ${r.tot}${r.miss?`　<span style="color:var(--sub);font-weight:400">（${r.miss}項目はデータなし）</span>`:''}</div>` : '';
  return `<button class="lb-card" data-lib="${esc(e.name)}">
    <div class="lb-nm">${esc(e.name)}
      <span class="lb-cf ${libCf(e.confidence)}">${esc(e.confidence)}</span>
      ${e.kura?'<span class="lb-kura">自蔵で使用</span>':''}</div>
    <div class="lb-sub">${esc(e.kind)}／${esc(e.group||'')}${e.supplier?'　'+esc(e.supplier):''}${e.pref?'　'+esc(e.pref):''}</div>
    ${hit}
    <div class="lb-tags">${libTags(e)}</div>
  </button>`;
}

/* ================= 📈 最新TREND（2026-10-06） =================
   毎朝6:35の調査タスク（Claude）がスプレッドシート「銘柄ウォッチ」（日報／銘柄ウォッチ）に書く。
   それを Apps Script「製造ツール 共有データ」（SHARED_URL）の action:'trend' で読むだけ。 */
const TREND = { d: lsGet('trend.cache', null), at: lsGet('trend.at', 0), sel:'', err:'', busy:false, more:false };
async function trendFetch(){
  if(TREND.busy) return; TREND.busy = true;
  try{
    if(typeof SHARED_URL==='undefined' || !SHARED_URL) throw new Error('記録先の設定がまだ済んでいません');
    const r = await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'trend'}),redirect:'follow'});
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j&&j.error)==='unknown action' ? 'サーバー側の更新（Apps Script「製造ツール 共有データ」の新バージョン）がまだです' : ((j&&j.error)||'受け取れませんでした'));
    TREND.d = j; TREND.at = Date.now(); TREND.err = '';
    lsSet('trend.cache', j); lsSet('trend.at', TREND.at);
  }catch(e){ TREND.err = String(e.message||e); }
  TREND.busy = false;
}
function trendMd(t){
  const inl = x => esc(x)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(https?:\/\/[^\s<>）)]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener" class="tr-src">出典</a>`);
  const out = []; let list = '';
  const close = ()=>{ if(list){ out.push(`</${list}>`); list=''; } };
  String(t||'').split(/\r?\n/).forEach(line=>{
    const l = line.trim(); if(!l){ close(); return; }
    let m;
    if((m = l.match(/^[-・*]\s+(.*)/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li>${inl(m[1])}</li>`); }
    else if((m = l.match(/^\d+[.．、]\s*(.*)/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push(`<li>${inl(m[1])}</li>`); }
    else { close(); out.push(`<p>${inl(l)}</p>`); }
  });
  close(); return out.join('');
}
function trendSections(body){
  const secs = []; let cur = null;
  String(body||'').split(/\r?\n/).forEach(line=>{
    const m = line.match(/^#{2,3}\s*(.+)/);
    if(m){ cur = { h: m[1].replace(/^\d+[.．]\s*/,'').trim(), t: [] }; secs.push(cur); }
    else if(cur) cur.t.push(line);
  });
  return secs.map(x=>({ h:x.h, t:x.t.join('\n') }));
}
function trendBody(){
  if(!TREND.d && !TREND.busy && !TREND.err){ setTimeout(()=>trendFetch().then(()=>{ if(app.dataset.mfg==='libRender' && LIB_RERENDER) LIB_RERENDER(); }),0); }
  let h = '';
  if(TREND.err) h += `<div class="mf-warn">${esc(TREND.err)}<button class="btn" id="trReload" style="margin-top:6px">もう一度読み込む</button></div>`;
  const d = TREND.d;
  if(!d){ return h + `<div class="card" style="color:var(--sub)">${TREND.busy||!TREND.err?'トレンドを読み込んでいます…':'まだ読み込めていません。'}</div>`; }
  const days = d.days || [];
  if(!days.length) h += `<div class="card" style="color:var(--sub)">まだ日報がありません。毎朝6:35ごろの調査で入ります。</div>`;
  else {
    const day = days.find(x=>x.date===TREND.sel) || days[0];
    h += `<div class="tr-days">` + days.slice(0,7).map(x=>`<button class="lb-opt ${x.date===day.date?'on':''}" data-trd="${esc(x.date)}">${esc(x.date.slice(5).replace('-','/'))}</button>`).join('') + `</div>`;
    h += `<div class="card tr-sum"><div class="tr-h">${esc(day.date)}　今日の3行まとめ</div>${trendMd(day.sum)}</div>`;
    const secs = trendSections(day.body);
    const hint = secs.find(x=>/ヒント/.test(x.h));
    if(hint) h += `<div class="card tr-hint"><div class="tr-h">💡 ${esc(hint.h)}</div>${trendMd(hint.t)}</div>`;
    secs.filter(x=>x!==hint).forEach(x=>{
      h += `<details class="card tr-sec"><summary>${esc(x.h)}</summary>${trendMd(x.t)}</details>`;
    });
    if(day.url) h += `<p class="mf-info"><a href="${esc(day.url)}" target="_blank" rel="noopener">この日の日報（Googleドキュメント）を開く</a></p>`;
  }
  const w = d.watch || [];
  if(w.length){
    const n = TREND.more ? w.length : 12;
    h += `<div class="mf-sec">銘柄ウォッチ<span>${w.length}件・最近話題に出た順</span></div>`;
    h += w.slice(0,n).map(x=>`<div class="card tr-w">
      <div class="lb-nm">${esc(x.name)}</div>
      <div class="lb-sub">${[x.kura,x.pref].filter(v=>v&&v!=='—').map(esc).join('／')}${x.last?`　最終 ${esc(x.last.slice(5).replace('-','/'))}`:''}</div>
      <div style="font-size:14px;margin-top:4px">${esc(x.topic)}${x.url?`　<a href="${esc(x.url)}" target="_blank" rel="noopener" class="tr-src">出典</a>`:''}</div></div>`).join('');
    if(w.length>12) h += `<button class="btn" id="trMore" style="border:1px solid var(--line);background:#fff">${TREND.more?'▲ たたむ':'▼ すべて見る'}</button>`;
  }
  h += `<p class="mf-info">毎朝6:35ごろの調査で更新されます。${TREND.at?'この端末の読み込み '+new Date(TREND.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}<br>
    話題の内容は出典を見て確かめてから使ってください。<button class="btn" id="trReload2" style="margin-top:6px;border:1px solid var(--line);background:#fff">最新を読み込む</button></p>`;
  return h;
}
function trendBind(render){
  app.querySelectorAll('[data-trd]').forEach(b=>b.onclick=()=>{ TREND.sel=b.dataset.trd; render(); });
  const re = async()=>{ TREND.err=''; TREND.busy=false; render(); await trendFetch(); render(); };
  ['trReload','trReload2'].forEach(id=>{ const b=$('#'+id); if(b) b.onclick=re; });
  const m=$('#trMore'); if(m) m.onclick=()=>{ TREND.more=!TREND.more; render(); };
  if(TREND.d && Date.now()-TREND.at > 3*3600000 && !TREND.busy){ trendFetch().then(()=>{ if(app.dataset.mfg==='libRender') render(); }); }
}

function yoDay(d){
  const box = $('#yoDay'); if(!box) return;
  const S = MFG && MFG.senmai; if(!S) { box.innerHTML=''; return; }
  const x = S.days[d];
  if(!x || !(x.e||[]).length){ box.innerHTML=`<div class="mf-day"><div style="font-weight:700;color:var(--navy)">${djp(d)}</div><div style="margin-top:6px;color:var(--sub)">この日は洗米がありません。</div></div>`; return; }
  const cols = S.cols;
  const ents = (x.e||[]).map(e=>({ci:e[0], kubun:cols[e[0]][0], grp:cols[e[0]][1], rice:e[1], ratio:e[2], code:e[3], prod:e[4], no:e[5], kg:Number(e[6]||0)}))
                        .sort((a,b)=>a.ci-b.ci || a.no-b.no);
  const by = {}; ents.forEach(e=>{ const k=e.rice+'|'+e.ratio; by[k]=(by[k]||0)+e.kg; });
  const tot = ents.reduce((a,e)=>a+e.kg,0);
  let h = `<div class="mf-day"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${djp(d)}</div>`;
  ['麹','掛'].forEach(g=>{
    const list = ents.filter(e=>e.grp===g); if(!list.length) return;
    h += `<div class="mf-sec" style="margin-top:6px">${g==='麹'?'麹米':'掛米'}<span>${kgfmt(list.reduce((a,e)=>a+e.kg,0))} kg</span></div>`;
    list.forEach(e=>{
      const y = yeastOf(e.prod, e.no);
      h += `<div class="tl-row"><span style="font-size:13px"><b>${esc(e.kubun)}</b>　${esc(e.rice)}${ratioBadge(e.ratio)} ${prodChip(e.prod)} <b>${e.no}</b>${y?` <span class="yb">${esc(y)}</span>`:''}</span>
        <span style="white-space:nowrap"><b>${kgfmt(e.kg)}</b>kg　<span style="font-size:12px">${bags(e.kg)}</span></span></div>`;
    });
  });
  h += `<div class="mf-sec" style="margin-top:8px">品種・精米歩合ごと<span>1袋＝${BAG_KG}kg</span></div>`;
  Object.keys(by).sort().forEach(k=>{ const [r,ra]=k.split('|');
    h += `<div class="tl-row"><span style="font-size:13px"><b>${esc(r)}</b>${ratioBadge(Number(ra))}</span><b>${kgfmt(by[k])} kg　<span style="font-weight:400;font-size:12px">${bags(by[k])}</span></b></div>`; });
  h += `<div class="tl-row" style="border-top:2px solid var(--navy)"><span style="color:var(--navy);font-weight:700;font-size:14px">総米</span><b style="font-size:16px">${kgfmt(tot)} kg</b></div>`;
  if(x.t!=null && Math.abs(x.t-tot)>0.05) h += `<div class="mf-warn">洗米予定表の総米（${kgfmt(x.t)}kg）と合計が合いません。</div>`;
  h += `</div>`;
  box.innerHTML = h;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ===== 米の見通し（引取予定 × 品種受払 × 洗米予定） =====
   見通し在庫 ＝ 品種受払で最後に受入がある日の在庫 ＋ それ以降の引取予定 − それ以降の払出
   不足の判定は「前日までの在庫」だけで見る（当日の引取は当てにしない）。 */
let RICE = null, RICE_AT = 0;
function riceCalc(){
  const Z = MFG && MFG.zaiko, H = MFG && MFG.hikitori, S = MFG && MFG.senmai;
  if(!Z || !Z.vars) return null;
  if(RICE && RICE_AT === (MFG._at||0)) return RICE;
  const vars = Z.vars, idx = {}; vars.forEach((v,i)=>idx[v]=i);
  const zk = Object.keys(Z.days).sort();
  let R = null; zk.forEach(d=>{ if((Z.days[d].i||[]).some(v=>v>0)) R = d; });
  const base = R ? Z.days[R].s.slice() : vars.map(()=>0);
  const bag = (H && H.bag) || BAG_KG;

  // 洗米予定表から、その日に要る量（kg）を品種・歩合ごとに
  const need = {};
  if(S && S.days) Object.keys(S.days).forEach(d=>{
    const o = {};
    (S.days[d].e||[]).forEach(e=>{ const v = e[1]+e[2]+'%'; o[v] = (o[v]||0) + Number(e[6]||0); });
    if(Object.keys(o).length) need[d] = o;
  });

  const dates = {};
  zk.forEach(d=>{ if(!R || d>R) dates[d]=1; });
  if(H && H.days) Object.keys(H.days).forEach(d=>{ if(!R || d>R) dates[d]=1; });
  Object.keys(need).forEach(d=>{ if(!R || d>R) dates[d]=1; });
  const ds = Object.keys(dates).sort();

  const bal = {}, cur = base.slice();
  ds.forEach(d=>{
    const hk = (H && H.days && H.days[d]) || {};
    Object.keys(hk).forEach(v=>{ if(idx[v]!==undefined) cur[idx[v]] += hk[v]*bag; });
    const zd = Z.days[d];
    if(zd) (zd.o||[]).forEach((v,i)=>{ cur[i] -= (v||0); });
    bal[d] = cur.slice();
  });
  const balAt = d => { const k = ds.filter(x=>x<d).pop(); return k ? bal[k] : base; };

  // 不足：洗米日ごとに、前日までの在庫で足りるか
  // 引取予定が1件も無いときは判定しない（入ってくる米が分からないので、全部「不足」になってしまう）
  const hasHiki = !!(H && H.days && Object.keys(H.days).length);
  const short = [], tight = [];
  if(hasHiki) Object.keys(need).sort().forEach(d=>{
    if(H.last && d > H.last) return;           // 引取予定がまだ無い期間は判定しない
    if(H.first && d < H.first) return;         // 引取予定より前の期間も判定しない
    const prev = balAt(d);
    Object.keys(need[d]).forEach(v=>{
      const k = idx[v];
      const have = (k===undefined) ? null : (prev[k]||0);
      const want = need[d][v];
      if(k===undefined) short.push({d, v, want, have:null, lack:want, unknown:true});
      else if(have < want - 0.05) short.push({d, v, want, have, lack: want-have});
      else if(have - want < bag) tight.push({d, v, want, have, margin: have-want});
    });
  });
  RICE = {vars, base, R, bal, ds, balAt, need, short, tight, hasHiki,
          coverTo: (H&&H.last)||null, from: (H&&H.first)||null, bag};
  RICE_AT = MFG._at||0;
  return RICE;
}
/* 品種受払の「在庫」欄と、前日在庫＋受入−払出 が合っているか */
function zaiDiff(d){
  const Z = MFG && MFG.zaiko; if(!Z) return null;
  const ks = Object.keys(Z.days).sort(), i = ks.indexOf(d);
  if(i <= 0) return null;
  const prev = Z.days[ks[i-1]].s, x = Z.days[d];
  return Z.vars.map((v,k)=>{
    const calc = (prev[k]||0) + (x.i[k]||0) - (x.o[k]||0);
    return {v, s:(x.s[k]||0), calc, inn:(x.i[k]||0), out:(x.o[k]||0), prev:(prev[k]||0), diff:(x.s[k]||0)-calc};
  }).filter(r=>Math.abs(r.diff) > 0.05);
}
/* 品種ごとに「いつからずれているか」。品種受払の全日を古い順にたどり、
   いちばん新しい“合っていた日”のあとから、ずっとずれ続けているかを見る。 */
let ZSINCE=null, ZSINCE_AT=0;
function zaiSince(){
  const Z = MFG && MFG.zaiko; if(!Z || !Z.days) return null;
  if(ZSINCE && ZSINCE_AT===(MFG._at||0)) return ZSINCE;
  const ks = Object.keys(Z.days).sort();
  const out = {};
  Z.vars.forEach((v,k)=>{
    let from=null, lastOk=null, run=0, latest=null, cur=0;
    for(let i=1;i<ks.length;i++){
      const prev=Z.days[ks[i-1]].s, x=Z.days[ks[i]];
      const calc=(prev[k]||0)+(x.i[k]||0)-(x.o[k]||0);
      const d=(x.s[k]||0)-calc;
      if(Math.abs(d)<=0.05){ lastOk=ks[i]; from=null; run=0; }
      else { if(from===null) from=ks[i]; run++; latest=ks[i]; cur=d; }
    }
    out[v] = from ? {from, lastOk, days:run, last:latest, diff:cur} : null;
  });
  ZSINCE = out; ZSINCE_AT = MFG._at||0;
  return out;
}
/* その日の品種ごとのチェック記録（誰のでも、新しいものを採用） */
function zvOf(date){
  const m = {};
  ((MFG&&MFG.zvchecks)||[]).forEach(r=>{ if(r.date!==date) return; const o=m[r.v]; if(!o || o.at<r.at) m[r.v]=r; });
  return m;
}

      <span class="lk">${x.unknown?'':'不足 '+kgfmt(x.lack)+'kg（'+bags(x.lack).replace(/<\/?b>/g,'')+'）'}</span></div>`;
  });
  h += `<div class="nt">前日までの在庫だけで見ています（当日の引取は数えていません）。引取予定を入れ直すか、洗米予定をずらしてください。</div></div>`;
  return h + riceTightView();
}
/* 足りてはいるが、余裕が1袋未満の日 */
function riceTightView(){
  const R = riceCalc(); if(!R || !R.hasHiki || !R.tight) return '';
  const soon = R.tight.filter(x=>x.d >= dtoday()).slice(0,5);
  if(!soon.length) return '';
  let h = `<div class="mf-warn" style="border-width:2px"><b>余裕が少ない日があります（前日在庫 − 必要量 が1袋未満）</b>`;
  soon.forEach(x=>{

      　<b style="color:#b8570b">余り ${kgfmt(x.margin)}kg</b></div>`;
  });
  h += `<div style="font-size:11.5px;color:#8a6d1f;margin-top:5px">引取が1日でも遅れると足りなくなります。</div></div>`;
  return h;

/* ---------- 在庫管理（品種受払） ---------- */
let ZAI_DAY = null;
function zaikoScreen(day){
  ZAI_DAY = day || dtoday();
  const render=function zaiRender(){
    app.dataset.mfg='zaiRender';
    head('在庫管理','品種・精米歩合ごとの在庫');

    if(!Z){ app.innerHTML = h + '<div class="card">品種受払のデータがこの端末にまだありません。<button class="btn p" style="margin-top:10px" onclick="mfgReload()">もう一度読み込む</button></div>' + mfgSrcInfo('zaiko','造りex 仕込調整 品種受払'); bindDayNav(zaikoScreen); return; }
    const keys = Object.keys(Z.days).sort();
    const at = keys.filter(d=>d<=ZAI_DAY).pop();
    const st = at ? Z.days[at].s : Z.vars.map(()=>0);
    const today = Z.days[ZAI_DAY];
    const inn = today ? today.i : Z.vars.map(()=>0), out = today ? today.o : Z.vars.map(()=>0);
    // その先7日の払出予定
    const fut = Z.vars.map(()=>0);
    keys.filter(d=>d>ZAI_DAY && d<=dadd(ZAI_DAY,7)).forEach(d=>Z.days[d].o.forEach((v,i)=>fut[i]+=v));
    h += riceShortView(ZAI_DAY);
    const dif = zaiDiff(ZAI_DAY), difMap = {};
    if(dif) dif.forEach(r=>difMap[r.v]=r);
    const zv = zvOf(ZAI_DAY);
    const live = Z.vars.filter((v,i)=>((at?Z.days[at].s[i]:0)||0)||(today?today.i[i]||today.o[i]:0));

      const s = (mi===null) ? raw : mi;                    // 表に出すのは「引取予定を入れた在庫」
      const dim = !s && !raw && !inn[i] && !out[i] && !fut[i];
      tS+=s; tI+=inn[i]||0; tO+=out[i]||0; tF+=fut[i]; tM+=raw;

      if(zr) btn = `<button class="zvb done ${zr.mode==='現状維持'?'keep':''}" data-zvx="${esc(zr.id)}" title="${esc(nrm(zr.by))} ${tjp(zr.at)}">${zr.mode==='現状維持'?'現状<br>維持':'✓'}</button>`;
      else if(dq) btn = `<button class="zvb keep" data-zvk="${esc(v)}">現状<br>維持</button>`;
      else btn = `<button class="zvb ok" data-zvc="${esc(v)}">確認</button>`;

      h += `<tr style="${dim?'opacity:.4':''}"><td style="white-space:nowrap">${lab}</td>
        <td class="${s<0?'mf-neg':''}" style="font-weight:700">${kgfmt(s)}${dq?`<span class="zx" data-zdif="${esc(v)}">※</span>`:''}
          ${gap?`<div style="font-size:10.5px;font-weight:400;color:var(--sub);white-space:nowrap">受払欄 ${kgfmt(raw)}</div>`:''}</td>
        <td class="${s<0?'mf-neg':''}" style="white-space:nowrap;font-size:12px">${s?bags(s):'—'}</td>
        <td>${inn[i]?kgfmt(inn[i]):''}</td><td>${out[i]?kgfmt(out[i]):''}</td><td style="color:var(--sub)">${fut[i]?kgfmt(fut[i]):''}</td>
        <td class="zvc">${btn}</td></tr>`;
    });
    h += `<tr class="tot"><td>合計</td><td class="${tS<0?'mf-neg':''}">${kgfmt(tS)}</td><td></td><td>${tI?kgfmt(tI):''}</td><td>${tO?kgfmt(tO):''}</td><td>${tF?kgfmt(tF):''}</td><td></td></tr></tbody></table></div>
      <p class="tl-note">単位はkg。${mib?`<b>在庫</b>は<b>引取予定を入れて計算した数</b>です（受入が品種受払にまだ入力されていなくても正しく出ます）。<br>
        小さい「受払欄」は、造りexの品種受払にいま入っている在庫の値です。受入を入力していない分だけマイナスになります。`
        :'いまの数は品種受払の在庫欄そのままです。引取予定が届くと、それを入れて計算した数に変わります。'}
      ${dif&&dif.length?`<br><b style="color:#b02a26">※</b> は前日の在庫・受入・払出から計算した数と合わないところです。押すと内訳が出ます。`:''}</p>
      <div id="zdifBox"></div>`;
    if(Z.first && ZAI_DAY<Z.first) h += `<div class="mf-warn">この日は品種受払の期間（${djp(Z.first,true)}〜）より前です。</div>`;
    if(Z.last && ZAI_DAY>Z.last) h += `<div class="mf-warn">この日は品種受払の期間（〜${djp(Z.last,true)}）より後です。最終日の在庫を表示しています。</div>`;
    // 在庫チェック（品種ごと）

    const rest = live.filter(v=>!zv[v]);
    const restOk = rest.filter(v=>!difMap[v]);
    const since = zaiSince() || {};
    const ngNow = live.filter(v=>difMap[v]);
    h += `<div class="mf-sec">在庫チェック<span>${doneN?doneN+'品種すんでいます':'まだ確認されていません'}</span></div>`;
    h += `<div class="card" style="font-size:13px;line-height:1.7">

      <b class="zvl ok">確認</b>＝計算と合っているのを見た。
      <b class="zvl keep">現状維持</b>＝合っていないが、いまは直さずこのままにする。<br>
      <span style="color:var(--sub)">現状維持を押しても <b style="color:#b02a26">※</b> は消えません。造りexを直して数が合うまで出続けます。</span></div>`;
    if(restOk.length) h += `<button class="btn p" id="zAllOk" style="background:var(--ok);border-color:var(--ok);margin-top:8px">合っている ${restOk.length}品種 をまとめて確認</button>`;
    if(ngNow.length){
      h += `<div class="mf-warn" style="margin-top:8px"><b>合っていない品種が ${ngNow.length} あります</b>`;
      ngNow.forEach(v=>{ const sc=since[v];
        h += `<div style="font-size:12.5px;padding:2px 0">${esc(v)}　${kgfmt(difMap[v].diff)}kg ちがい${sc?`　<b style="color:#b02a26">${djp(sc.from,true)}から ${sc.days}日</b>`:''}</div>`; });
      h += `</div>`;
    }
    h += `<button class="tl-link" id="zHist">ずれと確認の履歴を見る ›</button>`;

    app.querySelectorAll('[data-zdif]').forEach(b=>b.onclick=()=>{
      const r = difMap[b.dataset.zdif]; const box = $('#zdifBox'); if(!r||!box) return;
      box.innerHTML = `<div class="mf-day"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${esc(r.v)}　${djp(ZAI_DAY)}</div>

        <div class="tl-row"><span>＋ この日の受入</span><b>${kgfmt(r.inn)} kg</b></div>
        <div class="tl-row"><span>− この日の払出</span><b>${kgfmt(r.out)} kg</b></div>
        <div class="tl-row" style="border-top:1px solid var(--line)"><span>＝ 計算すると</span><b>${kgfmt(r.calc)} kg</b></div>
        <div class="tl-row"><span>品種受払の在庫欄</span><b>${kgfmt(r.s)} kg</b></div>
        <div class="tl-row" style="border-top:2px solid #d9534f"><span style="color:#b02a26;font-weight:700">ちがい</span>
          <b style="color:#b02a26;font-size:17px">${r.diff>0?'＋':''}${kgfmt(r.diff)} kg（${bags(Math.abs(r.diff)).replace(/<\/?b>/g,'')}）</b></div>
        <p class="tl-note" style="margin-top:8px">${r.diff>0?'在庫欄のほうが多い':'在庫欄のほうが少ない'}です。受入の入れ忘れ・二重計上・端数の丸めなどが考えられます。造りexの品種受払でご確認ください。</p></div>`;
      box.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    const zact=async(body,btn,label)=>{
      btn.disabled=true; btn.textContent='送信しています…';
      try{
        const j=await apiT(Object.assign({token:ST.token},body),40000);
        if(j&&j.ok){
          if(j.zchecks) MFG.zchecks=j.zchecks;
          if(j.zvchecks) MFG.zvchecks=j.zvchecks;
          lsSet('mfg.cache',MFG);
        }
        else alert(mfgErrJP(j&&j.err));
      }catch(e){ alert('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
      btn.disabled=false; btn.textContent=label; render();
    };
    const stockOf = v => { const i=Z.vars.indexOf(v); return i<0?null:(st[i]||0); };
    app.querySelectorAll('[data-zvc]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.zvc;
      zact({action:'mfg_zv', date:ZAI_DAY, v, mode:'確認', diff:0, stock:stockOf(v)}, b, '確認');
    });
    app.querySelectorAll('[data-zvk]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.zvk, d=difMap[v], sc=since[v];
      const msg = `${v} は計算と ${kgfmt(d?d.diff:0)}kg 合っていません。\n`
        + (sc?`${djp(sc.from,true)}から ${sc.days}日 ずれ続けています。\n`:'')
        + `\nいまは直さず「現状維持」として記録しますか？\n（※印は、造りexを直して数が合うまで消えません）`;
      if(!confirm(msg)) return;
      zact({action:'mfg_zv', date:ZAI_DAY, v, mode:'現状維持', diff:d?d.diff:0, stock:stockOf(v)}, b, '現状維持');
    });
    app.querySelectorAll('[data-zvx]').forEach(b=>b.onclick=()=>{
      if(confirm('このチェックを取り消しますか？')) zact({action:'mfg_zv_undo', id:b.dataset.zvx}, b, '取消');
    });
    const zao=$('#zAllOk');
    if(zao) zao.onclick=()=>{
      const items = restOk.map(v=>({v, mode:'確認', diff:0, stock:stockOf(v)}));
      zact({action:'mfg_zv', date:ZAI_DAY, items}, zao, 'まとめて確認');
    };
  };
  mfgOpen(render);
}

let ZH_TAB = 'zure';
function zcheckScreen(){
  const render=function zhRender(){
    app.dataset.mfg='zhRender';
    head('ずれと確認の履歴','いつから合わないか／誰がいつ見たか');
    let h = mfgErrView() + `<div class="mf-tabs">
      <button data-zh="zure" class="${ZH_TAB==='zure'?'on':''}">いつから合わないか</button>
      <button data-zh="log" class="${ZH_TAB==='log'?'on':''}">チェックの記録</button></div>`;
    const me=(MFG&&MFG.me)||{};
    if(ZH_TAB==='zure'){
      const sc = zaiSince();
      const Z = MFG && MFG.zaiko;
      if(!sc){ h += '<div class="card">品種受払のデータがこの端末にまだありません。</div>'; }
      else {
        const ng = Object.keys(sc).filter(v=>sc[v]).sort((a,b)=>sc[a].from<sc[b].from?-1:1);
        if(!ng.length) h += `<div class="card" style="text-align:center"><div style="font-size:30px">✅</div>
          <b>いまは全部の品種が合っています</b><div class="muted" style="margin-top:4px">前日の在庫＋受入−払出 と、品種受払の在庫欄が一致しています。</div></div>`;
        else {
          h += `<div class="mf-err" style="margin-bottom:10px"><div class="ti">⚠ 合っていない品種が ${ng.length} あります</div>
            <div class="nt">「いつから」は、品種受払で<b>最後に計算と合っていた日の次の日</b>です。そこからずっとずれ続けています。</div></div>`;
          ng.forEach(v=>{
            const x = sc[v], zs = ((MFG&&MFG.zvchecks)||[]).filter(r=>r.v===v).slice(0,3);
            h += `<div class="card" style="margin-bottom:8px">
              <div class="tl-row" style="border:0;padding-bottom:2px"><b style="font-size:15px">${esc(v)}</b>
                <b style="color:#b02a26">${x.diff>0?'＋':''}${kgfmt(x.diff)} kg</b></div>
              <div class="tl-row"><span>いつから</span><b>${djp(x.from,true)}（${x.days}日ぶん）</b></div>
              <div class="tl-row"><span>最後に合っていた日</span><b>${x.lastOk?djp(x.lastOk,true):'—'}</b></div>
              ${zs.length?`<div style="margin-top:6px">${zs.map(r=>`<div class="muted" style="font-size:12px">${djp(r.date,true)}　${esc(r.mode)}　${esc(nrm(r.by))}${r.memo?'　'+esc(r.memo):''}</div>`).join('')}</div>`:''}
              <button class="tl-link" data-zd="${esc(x.from)}" style="margin-top:4px">ずれ始めた日の在庫を見る ›</button>
              </div>`;
          });
        }
      }
    } else {
      const list = ((MFG&&MFG.zvchecks)||[]).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.at<b.at?1:-1));
      const old = ((MFG&&MFG.zchecks)||[]).slice();
      if(!list.length && !old.length) h += '<div class="card">まだチェックの記録がありません。</div>';
      let day='';
      for(const c of list){
        if(c.date!==day){ day=c.date; h+=`<div class="mf-sec">${djp(day,true)}<span></span></div>`; }
        h+=`<div class="mf-req"><span class="st ${c.mode==='現状維持'?'p':'a'}">${esc(c.mode)}</span>
          <div><b>${esc(c.v)}</b>${c.mode==='現状維持'&&c.diff?`　<span style="color:#b02a26;font-weight:700">${c.diff>0?'＋':''}${kgfmt(c.diff)}kg</span>`:''}
            <div class="muted" style="font-size:12px">${esc(nrm(c.by))}　${tjp(c.at)}${c.memo?'　'+esc(c.memo):''}</div></div>
          <div class="bt">${(c.byId===me.id||me.admin)?`<button data-zvd="${esc(c.id)}">取消</button>`:''}</div></div>`;
      }
      if(old.length){
        h += `<div class="mf-sec">品種ごとにする前の記録<span>${old.length}件</span></div>`;
        old.slice(0,20).forEach(c=>{ h+=`<div class="mf-req"><span class="st a">✅</span>
          <div><b>${esc(nrm(c.by))}</b>　<span class="muted">${djp(c.date,true)} ${tjp(c.at)} その日ぜんぶ確認</span>${c.memo?`<div class="muted" style="font-size:12px">${esc(c.memo)}</div>`:''}</div>
          <div class="bt"></div></div>`; });
      }
      h+=`<p class="tl-note">記録はスプレッドシート「在庫チェック品種」に残ります（対象日・品種・確認／現状維持・ちがい・確認者・確認日時・メモ）。</p>`;
    }
    app.innerHTML=h;
    app.querySelectorAll('[data-zh]').forEach(b=>b.onclick=()=>{ ZH_TAB=b.dataset.zh; zhRender(); });
    app.querySelectorAll('[data-zd]').forEach(b=>b.onclick=()=>{ nav.pop(); go(()=>zaikoScreen(b.dataset.zd)); });
    app.querySelectorAll('[data-zvd]').forEach(b=>b.onclick=async()=>{
      if(!confirm('このチェックを取り消しますか？')) return;
      b.disabled=true; b.textContent='…';
      try{ const j=await apiT({action:'mfg_zv_undo', token:ST.token, id:b.dataset.zvd},40000);
        if(j&&j.ok){ if(j.zvchecks){ MFG.zvchecks=j.zvchecks; lsSet('mfg.cache',MFG); } } else alert(mfgErrJP(j&&j.err));
      }catch(e){ alert('通信できませんでした。'); }
      zhRender();
    });
  };
  mfgOpen(render);
}
