let KN_YM = null, KN_SEL = null;
function knMyStaff(staff){
  const me = nrm(MFG&&MFG.me&&MFG.me.name || ST.name);
  if(!me) return -1;
  let i = staff.findIndex(s=>nrm(s)===me);
  if(i<0) i = staff.findIndex(s=>{ const n=nrm(s); return n.startsWith(me)||me.startsWith(n); });
  return i;
}
function knHead(s){
  const t=String(s||'').trim(), m=t.split(/[\s\u3000]+/);
  const [a,b] = m.length>1 ? [m[0], m.slice(1).join('')] : [t.slice(0,2), t.slice(2)];
  return esc(a)+(b?'<br>'+esc(b):'');
}
function reqActive(r){ return r.status==='申請中'||r.status==='承認'; }
function reqWant(r){ return r.status==='申請中'?'赤':r.status==='承認'?'黒':''; }
function kinmuScreen(){
  const render=function knRender(){
    app.dataset.mfg='knRender';
    head('製造カレンダー','出勤表・振休依頼');
    const K = MFG && MFG.shukkin;
    let h = calTabs('kinmu') + mfgErrView();
    if(!K || !K.months || !Object.keys(K.months).length){
      app.innerHTML = h + `<div class="card">出勤表のデータがこの端末にまだありません。<br>
        <span style="color:var(--sub);font-size:13px">一度でも表示できていれば、あとは通信できないときも最後の内容を表示します。</span>
        <button class="btn p" style="margin-top:10px" onclick="mfgReload()">もう一度読み込む</button></div>`
        + mfgSrcInfo('shukkin','出勤表'); bindCalTabs(); return;
    }
    const yms = Object.keys(K.months).sort();
    const cur = dtoday().slice(0,7);
    if(!KN_YM || !K.months[KN_YM]) KN_YM = K.months[cur] ? cur : yms.filter(y=>y<=cur).pop() || yms[yms.length-1];
    const M = K.months[KN_YM], hol = new Set(K.holidays||[]);
    const mine = knMyStaff(M.staff);
    const reqs = (MFG.requests||[]);
    const me = MFG.me||{};
    // 承認待ち（管理者）
    const pend = reqs.filter(r=>r.status==='申請中').sort((a,b)=>a.date<b.date?-1:1);
    h += `<button class="btn p" id="bReq" style="background:#b21b1b;border-color:#b21b1b">✋ 振休依頼</button>`;
    if(me.admin && pend.length){
      h += `<div class="mf-sec">承認待ち<span>${pend.length}件</span></div>`;
      for(const r of pend) h += reqRow(r, 'admin');
    }
    const my = reqs.filter(r=>r.applicantId===me.id && r.status!=='取消' && !(me.admin && r.status==='申請中')).sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
    if(my.length){
      h += `<div class="mf-sec">自分の依頼<span>最近${my.length}件</span></div>`;
      for(const r of my) h += reqRow(r, 'mine');
    }
    // 月の切り替え
    const i = yms.indexOf(KN_YM);
    const [yy,mm] = KN_YM.split('-').map(Number);
    h += `<div class="mf-nav" style="margin-top:16px"><button id="mPrev" ${i<=0?'disabled':''}>‹ 前月</button>
      <div class="mf-date" style="flex:1;margin:0">${yy}年${mm}月</div>
      <button id="mNext" ${i>=yms.length-1?'disabled':''}>翌月 ›</button></div>`;
    // 表
    const byCell = {};
    for(const r of reqs){ if(r.date.slice(0,7)===KN_YM) (byCell[r.date+'|'+nrm(r.staff)] = byCell[r.date+'|'+nrm(r.staff)]||[]).push(r); }
    const td = dtoday();
    h += `<div class="kn-wrap" id="knWrap"><table class="kn"><thead><tr><th class="dt">日</th>`;
    M.staff.forEach((s,k)=>{ h += `<th class="nm ${k===mine?'me':''}">${knHead(s)}</th>`; });
    h += `<th class="nt">備考</th></tr></thead><tbody>`;
    for(const d of M.days){
      const dd = dparse(d.d), isHol = hol.has(d.d);
      h += `<tr data-d="${d.d}" class="${isHol?'hol':''} ${d.d===td?'today':''} ${d.d===KN_SEL?'sel':''}"><td class="dt">${dd.getDate()} <span style="font-weight:400">${WD[dd.getDay()]}</span></td>`;
      M.staff.forEach((s,k)=>{
        let v = d.c[k]||'', cls = d.r[k]?'red':'';
        const rs = (byCell[d.d+'|'+nrm(s)]||[]);
        const act = rs.find(reqActive);
        if(act && act.excel!==reqWant(act)){ v = act.mark; cls = (act.status==='申請中'?'red ':'')+'pend'; }
        else if(!act && rs.some(r=>(r.excel==='赤'||r.excel==='黒'))){ cls += ' gone'; }
        h += `<td class="c ${k===mine?'me':''} ${v.length>2?'long':''}"><div><span class="${cls}">${esc(v)}</span></div></td>`;
      });
      h += `<td class="nt">${esc(d.n||'')}</td></tr>`;
    }
    h += `</tbody></table></div>
      <p class="tl-note"><span style="color:#d11a1a;font-weight:700">赤×</span>＝振休の申請中／黒×＝承認済み。点線の枠は、まだ出勤表Excelに書き込まれていないもの（会社PCが数分以内に反映します）。行を押すとその日の詳しい内容が出ます。</p>
      <div id="knDay"></div>`;
    app.innerHTML = h + mfgSrcInfo('shukkin','出勤表Excel');
    bindCalTabs();
    $('#bReq').onclick=()=>go(()=>furikyuForm());
    const mp=$('#mPrev'), mn=$('#mNext');
    if(mp) mp.onclick=()=>{ KN_YM=yms[i-1]; KN_SEL=null; knRender(); };
    if(mn) mn.onclick=()=>{ KN_YM=yms[i+1]; KN_SEL=null; knRender(); };
    app.querySelectorAll('tr[data-d]').forEach(tr=>tr.onclick=()=>{ KN_SEL=tr.dataset.d; showDay(M, KN_SEL); app.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); });
    bindReqButtons(knRender);
    if(KN_SEL) showDay(M, KN_SEL);
  };
  mfgOpen(render);
}
function showDay(M, d){
  const x = M.days.find(z=>z.d===d); if(!x) return;
  const reqs = (MFG.requests||[]).filter(r=>r.date===d && r.status!=='取消');
  let h = `<div class="mf-day"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${djp(d)}</div><div class="g">`;
  M.staff.forEach((s,k)=>{ if(x.c[k]) h += `<span class="muted">${esc(nrm(s))}</span><span class="${x.r[k]?'red':''}" style="${x.r[k]?'color:#d11a1a;font-weight:700':''}">${esc(x.c[k])}</span>`; });
  if(x.j) h += `<span class="muted">上槽</span><span>${esc(x.j)}</span>`;
  if(x.k) h += `<span class="muted">粕</span><span>${esc(x.k)}</span>`;
  if(x.p) h += `<span class="muted">蔵人員</span><span>${esc(x.p)}人</span>`;
  if(x.n) h += `<span class="muted">備考</span><span>${esc(x.n)}</span>`;
  h += `</div>`;
  if(reqs.length){ h += `<div style="margin-top:8px">`; reqs.forEach(r=>{ h += `<div class="muted">振休依頼：${esc(nrm(r.staff))}・${esc(r.kind)}（${esc(r.status)}）</div>`; }); h+='</div>'; }
  h += `<button class="btn o" id="dayReq" style="margin-top:10px">この日で振休依頼</button></div>`;
  $('#knDay').innerHTML = h;
  $('#dayReq').onclick=()=>go(()=>furikyuForm(d));
}
function reqRow(r, mode){
  const st = r.status==='申請中'?'p':r.status==='承認'?'a':'x';
  let bt = '';
  if(mode==='admin') bt = `<button class="ok" data-ok="${r.id}">承認</button><button data-ng="${r.id}">却下</button>`;
  else if(r.status==='申請中') bt = `<button data-cx="${r.id}">取り消す</button>`;
  const sync = reqActive(r) && r.excel!==reqWant(r) ? '<div class="muted" style="font-size:11px">出勤表へ反映待ち</div>' : '';
  return `<div class="mf-req"><span class="st ${st}">${esc(r.status)}</span>
    <div><b>${esc(nrm(r.staff))}</b>　${dshort(r.date)}　${esc(r.kind)}${r.memo?`<div class="muted" style="font-size:12px">${esc(r.memo)}</div>`:''}${mode==='admin'&&r.applicant&&nrm(r.applicant)!==nrm(r.staff)?`<div class="muted" style="font-size:11px">申請：${esc(r.applicant)}</div>`:''}${sync}</div>
    <div class="bt">${bt}</div></div>`;
}
function bindReqButtons(rerender){
  const act = async(body, btn)=>{
    btn.disabled=true; btn.textContent='…';
    try{
      const j = await api(Object.assign({token:ST.token}, body));
      if(j && j.ok){ if(j.requests){ MFG.requests=j.requests.map(x=>Object.assign({},x)); lsSet('mfg.cache',MFG); } }
      else alert(mfgErrJP(j&&j.err));
    }catch(e){ alert('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
    rerender();
  };
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>act({action:'mfg_decide', id:b.dataset.ok, ok:true}, b));
  app.querySelectorAll('[data-ng]').forEach(b=>b.onclick=()=>{ if(confirm('この依頼を却下しますか？')) act({action:'mfg_decide', id:b.dataset.ng, ok:false}, b); });
  app.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{ if(confirm('この依頼を取り消しますか？')) act({action:'mfg_cancel', id:b.dataset.cx}, b); });
}
function mfgErrJP(e){
  return ({dup:'この日・この人の振休依頼はすでに出ています。', bad_kind:'区分を選んでください。', bad_date:'日付を選んでください。',
    bad_staff:'対象者を選んでください。', cannot:'この依頼はもう変更できません。', not_yours:'自分の依頼だけ取り消せます。',
    not_admin:'承認できるのは杜氏だけです。', bad_token:'ログインし直してください。', not_found:'依頼が見つかりませんでした。'}[e]) || ('うまくいきませんでした（'+(e||'原因不明')+'）');
}

/* ---------- 振休依頼の入力 ---------- */
function furikyuForm(day){
  head('振休依頼','出勤表に赤×で入ります');
  const K = MFG && MFG.shukkin;
  if(!K){ app.innerHTML = '<div class="card" style="margin-top:14px">出勤表のデータがまだ届いていないため、依頼できません。</div>'; return; }
  const yms = Object.keys(K.months).sort();
  const latest = K.months[dtoday().slice(0,7)] || K.months[yms[yms.length-1]];
  const staffAll = [...new Set([...(latest?latest.staff:[]), ...yms.slice(-3).flatMap(y=>K.months[y].staff)])];
  const mine = knMyStaff(staffAll);
  const kinds = (MFG.kinds && MFG.kinds.length) ? MFG.kinds : ['1日','午前半休','午後半休','午前1/4休','午後1/4休'];
  const marks = MFG.marks || {};
  let sel = { staff: mine>=0?staffAll[mine]:'', date: day || dadd(dtoday(),1), kind: kinds[0], memo:'' };
  const render=()=>{
    const M = K.months[sel.date.slice(0,7)];
    let curVal = '';
    if(M){ const k=M.staff.findIndex(s=>nrm(s)===nrm(sel.staff)); const dd=M.days.find(z=>z.d===sel.date); if(k>=0&&dd) curVal=dd.c[k]||''; }
    app.innerHTML = `<div class="mf-lbl">対象者</div>
      <select class="mf-sel" id="fStaff"><option value="">選んでください</option>${staffAll.map(s=>`<option ${s===sel.staff?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <div class="mf-lbl">日付</div>
      <input type="date" class="mf-sel" id="fDate" value="${sel.date}">
      <div class="muted" style="margin-top:4px">${djp(sel.date,true)}${K.holidays&&K.holidays.includes(sel.date)?'　<b style="color:#c62828">会社休日</b>':''}</div>
      <div class="mf-lbl">区分</div>
      <div class="mf-kinds">${kinds.map(k=>`<button data-k="${esc(k)}" class="${k===sel.kind?'on':''}">${esc(k)}</button>`).join('')}</div>
      <div class="muted" style="margin-top:6px">出勤表には <b style="color:#d11a1a">${esc(marks[sel.kind]||'×')}</b>（赤）で入り、承認されると黒に変わります。</div>
      <div class="mf-lbl">メモ（任意）</div>
      <input class="mf-sel" id="fMemo" maxlength="100" value="${esc(sel.memo)}" placeholder="例：○日の休日出勤の振替">
      ${curVal?`<div class="mf-warn">この日の出勤表にはすでに「${esc(curVal)}」が入っています。依頼すると置き換わります（却下・取り消しで元に戻ります）。</div>`:''}
      ${!M?`<div class="mf-warn">この月の出勤表シートがまだありません。シートができたら書き込まれます。</div>`:''}
      <button class="btn p" id="fSend" style="margin-top:16px;background:#b21b1b;border-color:#b21b1b">依頼する</button>
      <div id="fMsg" class="muted" style="text-align:center;margin-top:8px"></div>`;
    $('#fStaff').onchange=e=>{ sel.staff=e.target.value; render(); };
    $('#fDate').onchange=e=>{ if(e.target.value){ sel.date=e.target.value; render(); } };
    $('#fMemo').oninput=e=>{ sel.memo=e.target.value; };
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ sel.kind=b.dataset.k; render(); });
    $('#fSend').onclick=async()=>{
      if(!sel.staff){ $('#fMsg').textContent='対象者を選んでください。'; return; }
      const b=$('#fSend'); b.disabled=true; b.textContent='送信しています…';
      try{
        const j = await api({action:'mfg_request', token:ST.token, staff:sel.staff, date:sel.date, kind:sel.kind, memo:sel.memo});
        if(j && j.ok){
          if(j.requests){ MFG.requests=j.requests; lsSet('mfg.cache',MFG); }
          KN_YM = sel.date.slice(0,7); KN_SEL = sel.date;
          app.innerHTML = `<div class="card" style="margin-top:16px;text-align:center"><div style="font-size:34px">✅</div>
            <b>振休依頼を送りました</b><div class="muted" style="margin-top:6px">${esc(nrm(sel.staff))}　${djp(sel.date)}　${esc(sel.kind)}<br>出勤表に赤×で入ります。承認されると黒になります。</div></div>
            <button class="btn p" id="fBack">出勤表にもどる</button>`;
          $('#fBack').onclick=()=>{ nav.pop(); const f=nav[nav.length-1]; f?f():go(home); hBack.classList.toggle('hide',nav.length<=1); };
        } else { b.disabled=false; b.textContent='依頼する'; $('#fMsg').textContent=mfgErrJP(j&&j.err); }
      }catch(e){ b.disabled=false; b.textContent='依頼する'; $('#fMsg').textContent='通信できませんでした。電波の良い場所でもう一度お試しください。'; }
    };
  };
  render();
}

.ws-sum .v.bad{color:var(--ng)} .ws-sum .v.warn{color:#a8761e} .ws-sum .v.ok{color:var(--ok)}
.ws-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ws-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-family:inherit;color:var(--sub);cursor:pointer}
.ws-chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.ws-status{font-size:12px;color:var(--sub);min-height:1.2em;margin:0 0 6px}
.ws-status.warn{color:var(--ng)}
.ws-row{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;margin-bottom:8px;display:grid;grid-template-columns:6px 60px 1fr auto;gap:0 10px;align-items:center;text-align:left;font-family:inherit;color:inherit;cursor:pointer;overflow:hidden}
.ws-row .st{align-self:stretch;border-radius:12px 0 0 12px;background:var(--line)}
.ws-row.bad .st{background:var(--ng)} .ws-row.warn .st{background:#c08a2a} .ws-row.done .st{background:var(--ok)}
.ws-row .tk{font-size:24px;font-weight:700;line-height:1;color:var(--navy)}
.ws-row .tk small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px}
.ws-row .mid{min-width:0}
.ws-row .b{font-weight:600;font-size:15px}
.ws-row .d{font-size:12px;color:var(--sub)}
.ws-row .dl{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ws-row .date{font-weight:700;font-size:14px}
.ws-row .left{font-size:12px;color:var(--sub)}
.ws-row .left.bad{color:var(--ng);font-weight:700} .ws-row .left.warn{color:#a8761e;font-weight:700}
.ws-steps{display:flex;gap:4px}
.ws-steps span{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--sub)}
.ws-steps span.on{background:#e1efe4;border-color:var(--ok);color:var(--ok);font-weight:700}
.ws-tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.ws-tl div{background:#eef1f5;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--sub)}
.ws-tl div b{display:block;color:var(--ink);font-size:14px}
.ws-tl div.hot b{color:var(--ng)}
.ws-fs{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 10px;min-width:0;background:var(--card)}
.ws-fs.on{border-color:var(--ok);background:#e9f3ec}
.ws-fs legend{padding:0 6px;font-weight:700}
.ws-fs legend label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ws-fs legend input{width:22px;height:22px;accent-color:var(--ok)}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ws-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.ws-f span{font-size:11px;color:var(--sub)}
.ws-f input,.ws-f select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.ws-seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ws-seg button{flex:1;border:0;background:#fff;padding:9px 4px;font-size:14px;font-family:inherit;color:inherit;cursor:pointer}
.ws-seg button+button{border-left:1px solid var(--line)}
.ws-seg button.ok{background:var(--ok);color:#fff} .ws-seg button.ng{background:var(--ng);color:#fff}
.ws-hint{font-size:11px;color:var(--sub)} .ws-hint.bad{color:var(--ng);font-weight:700}
.ws-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.ws-btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
.ws-ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;color:inherit;cursor:pointer}
.ws-ta{width:100%;min-height:70px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
@media(max-width:480px){.ws-sum{grid-template-columns:repeat(2,1fr)} .ws-row{grid-template-columns:6px 52px 1fr auto;gap:0 8px} .ws-row .tk{font-size:21px} .ws-row .d{display:none}}
`;
(function(){ const s=document.createElement('style'); s.textContent=WASH_CSS; document.head.appendChild(s); })();

const WS = { plan:[], records:{}, staff:[], filter:'todo', loadedAt:0 };
const wsPad=n=>String(n).padStart(2,'0');
const wsToday=()=>{const d=new Date();return `${d.getFullYear()}-${wsPad(d.getMonth()+1)}-${wsPad(d.getDate())}`};
const wsNow=()=>{const d=new Date();return `${wsPad(d.getHours())}:${wsPad(d.getMinutes())}`};
const wsMD=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'—';
const wsJD=s=>s?`${+s.slice(5,7)}月${+s.slice(8,10)}日`:'';
const wsDays=s=>Math.round((new Date(s+'T00:00:00')-new Date(wsToday()+'T00:00:00'))/86400000);
function wsRec(id){ return WS.records[id]||{}; }
function wsStage(r){ return ((r.wash&&r.wash.done)?1:0)+((r.finish&&r.finish.done)?1:0)+((r.check&&r.check.done)?1:0); }
function wsUrg(p,r){ if(wsStage(r)===3)return 'done'; const d=wsDays(p.deadline); if(d<=3)return 'bad'; if(d<=14)return 'warn'; return ''; }
async function washApi(body, ms){
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||30000) : null;
  try{
    const r=await fetch(WASH_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function wsApply(d){ WS.plan=d.plan||[]; WS.records=d.records||{}; if(d.staff&&d.staff.length) WS.staff=d.staff; WS.loadedAt=Date.now(); lsSet('tool.wash',{plan:WS.plan,records:WS.records,staff:WS.staff,at:WS.loadedAt}); }
async function wsLoad(force){
  if(!force && WS.plan.length && Date.now()-WS.loadedAt<60000) return true;
  if(!WS.plan.length){ const c=lsGet('tool.wash',null); if(c&&c.plan){ WS.plan=c.plan; WS.records=c.records||{}; WS.staff=c.staff||[]; } }
  try{ const j=await washApi({action:'wash_get'},25000); if(j&&j.ok){ wsApply(j.data); return true; } }catch(e){}
  return false;
}
function wsStatus(t,warn){ const s=$('#wsStatus'); if(!s)return; s.textContent=t; s.className='ws-status'+(warn?' warn':''); if(!warn) setTimeout(()=>{ if(s.textContent===t) s.textContent=''; },4000); }

async function washScreen(){
  head('タンク洗浄管理','R8BY 醪タンク（期限＝酛下日）');
  app.innerHTML='<p class="muted" style="margin-top:14px">洗浄の予定と記録を読み込んでいます…</p>';
  const ok=await wsLoad(false);
  if(!WS.plan.length){ app.innerHTML=`<div class="tl-warn" style="margin-top:14px">洗浄の予定を読み込めませんでした。電波の届く所でもう一度開いてください。</div>`; return; }
  const draw=()=>{
    const f=WS.filter;
    let over=0,soon=0,todo=0,done=0;
    WS.plan.forEach(p=>{ const s=wsStage(wsRec(p.id)); if(s===3){done++;return;} todo++; const d=wsDays(p.deadline); if(d<0)over++; else if(d<=14)soon++; });
    const vis=p=>{ const s=wsStage(wsRec(p.id)), d=wsDays(p.deadline);
      if(f==='all')return true; if(f==='done')return s===3; if(f==='todo')return s<3; if(f==='soon')return s<3&&d<=14; if(f==='over')return s<3&&d<0; return true; };
    const rows=WS.plan.filter(vis).sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.n-b.n);
    let h=`<div class="ws-sum">
      <button data-f="over"><span class="k">期限超過</span><span class="v ${over?'bad':''}">${over}</span></button>
      <button data-f="soon"><span class="k">14日以内</span><span class="v ${soon?'warn':''}">${soon}</span></button>
      <button data-f="todo"><span class="k">未完了</span><span class="v">${todo}</span></button>
      <button data-f="done"><span class="k">完了</span><span class="v ok">${done}</span></button></div>
    <div class="ws-bar">
      <button class="ws-chip ${f==='todo'?'on':''}" data-f="todo">未完了</button>
      <button class="ws-chip ${f==='soon'?'on':''}" data-f="soon">14日以内</button>
      <button class="ws-chip ${f==='done'?'on':''}" data-f="done">完了</button>
      <button class="ws-chip ${f==='all'?'on':''}" data-f="all">全部</button>
      <span style="flex:1"></span>
      <button class="ws-ghost" id="wsStaff">担当者名</button>
      <button class="ws-ghost" id="wsReload">更新</button></div>
    <div id="wsStaffBox" class="card" style="display:none">
      <div style="font-size:13px;margin-bottom:6px">担当者を1行に1人ずつ。全員の画面の選択肢に反映されます。</div>
      <textarea class="ws-ta" id="wsStaffTa">${esc(WS.staff.join('\n'))}</textarea>
      <div class="ws-actions"><button class="ws-ghost" id="wsStaffNo">閉じる</button><button class="ws-btn" id="wsStaffOk">保存</button></div></div>
    <div class="ws-status" id="wsStatus">${ok?'':'（電波が無いため、端末に保存した内容を表示しています）'}</div>`;
    if(!rows.length) h+=`<p class="muted" style="text-align:center;padding:24px 0">該当するタンクはありません</p>`;
    h+=rows.map(p=>{ const r=wsRec(p.id), s=wsStage(r), u=wsUrg(p,r), d=wsDays(p.deadline);
      const left=s===3?'完了':d<0?`${-d}日超過`:d===0?'今日まで':`あと${d}日`;
      return `<button class="ws-row ${u}" data-id="${p.id}"><span class="st"></span>
        <span class="tk">${p.tank}<small>No.${p.n} ${esc(p.kigo)}</small></span>
        <span class="mid"><span class="b">${esc(p.brand)}</span><br><span class="d">添 ${wsMD(p.soe)}・留 ${wsMD(p.tome)}・上槽 ${wsMD(p.josou)}${p.prev?`　前回上槽 ${wsMD(p.prev)}`:''}</span></span>
        <span class="dl"><span class="date">${wsMD(p.deadline)}まで</span><span class="left ${u==='done'?'':u}">${left}</span>
          <span class="ws-steps"><span class="${r.wash&&r.wash.done?'on':''}">洗</span><span class="${r.finish&&r.finish.done?'on':''}">仕</span><span class="${r.check&&r.check.done?'on':''}">確</span></span></span></button>`; }).join('');
    h+=`<p class="tl-note">記録はスプレッドシート「タンク洗浄記録_R8BY」に保存されます。印刷用の表は
      <a href="${WASH_URL}" target="_blank" rel="noopener">こちら（印刷ボタン付き）</a>。仕込計画が変わったら予定表を作り直します。</p>`;
    app.innerHTML=h;
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ WS.filter=b.dataset.f; draw(); });
    app.querySelectorAll('.ws-row').forEach(b=>b.onclick=()=>go(()=>washEdit(b.dataset.id)));
    $('#wsReload').onclick=async()=>{ wsStatus('更新中…'); await wsLoad(true); draw(); };
    $('#wsStaff').onclick=()=>{ const x=$('#wsStaffBox'); x.style.display=x.style.display==='none'?'block':'none'; };
    $('#wsStaffNo').onclick=()=>{ $('#wsStaffBox').style.display='none'; };
    $('#wsStaffOk').onclick=async()=>{ const names=$('#wsStaffTa').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!names.length)return;
      WS.staff=names; $('#wsStaffBox').style.display='none'; wsStatus('担当者名を保存中…');
      try{ const j=await washApi({action:'wash_staff',names}); wsStatus(j&&j.ok?'担当者名を保存しました':'担当者名を保存できませんでした',!(j&&j.ok)); }catch(e){ wsStatus('担当者名を保存できませんでした',true); } };
  };
  draw();
}

function washEdit(id){
  const p=WS.plan.find(x=>x.id===id); if(!p){ go(washScreen,false); return; }
  const r=JSON.parse(JSON.stringify(wsRec(id))); r.wash=r.wash||{}; r.finish=r.finish||{}; r.check=r.check||{};
  head(`タンク ${p.tank}`, `${p.brand}　仕込No.${p.n}（記号 ${p.kigo}）`);
  const d=wsDays(p.deadline);
  const opt=(cur)=>`<option value="">—</option>`+WS.staff.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  app.innerHTML=`
    <div class="ws-tl">
      <div>${p.prev?'前回上槽':'今期初使用'}<b>${p.prev?wsJD(p.prev):'—'}</b></div>
      <div class="${d<=3&&wsStage(r)<3?'hot':''}">洗浄期限（酛下日）<b>${wsJD(p.deadline)}</b></div>
      <div>添仕込<b>${wsJD(p.soe)}</b></div></div>
    <fieldset class="ws-fs ${r.wash.done?'on':''}" id="fsWash"><legend><label><input type="checkbox" id="wDone" ${r.wash.done?'checked':''}>洗浄</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="wDate" value="${esc(r.wash.date||'')}"></label>
        <label class="ws-f"><span>時刻</span><input type="time" id="wTime" value="${esc(r.wash.time||'')}"></label>
        <label class="ws-f"><span>測定方法</span><select id="wMethod"><option ${!r.wash.method||r.wash.method==='酸素濃度計'?'selected':''}>酸素濃度計</option><option ${r.wash.method==='その他'?'selected':''}>その他</option></select></label>
        <label class="ws-f"><span>酸素濃度（%）</span><input type="number" id="wO2" inputmode="decimal" step="0.1" min="0" max="25" placeholder="20.9" value="${r.wash.o2??''}"><span class="ws-hint" id="o2hint"></span></label>
        <label class="ws-f"><span>担当</span><select id="wBy">${opt(r.wash.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.finish.done?'on':''}" id="fsFin"><legend><label><input type="checkbox" id="fDone" ${r.finish.done?'checked':''}>仕上げ</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="fDate" value="${esc(r.finish.date||'')}"></label>
        <label class="ws-f"><span>担当</span><select id="fBy">${opt(r.finish.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.check.done?'on':''}" id="fsChk"><legend><label><input type="checkbox" id="cDone" ${r.check.done?'checked':''}>チェック</label></legend>
      <div class="ws-grid">
        <div class="ws-f"><span>臭い</span><div class="ws-seg" id="segSmell"><button type="button" data-v="OK" class="${r.check.smell==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.smell==='NG'?'ng':''}">あり</button></div></div>
        <div class="ws-f"><span>汚れ</span><div class="ws-seg" id="segDirt"><button type="button" data-v="OK" class="${r.check.dirt==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.dirt==='NG'?'ng':''}">あり</button></div></div>
        <label class="ws-f"><span>確認者</span><select id="cBy">${opt(r.check.by)}</select></label></div></fieldset>
    <label class="ws-f"><span>備考</span><input type="text" id="wsNote" value="${esc(r.note||'')}" placeholder="やり直し・気付きなど"></label>
    <div class="ws-status" id="wsStatus" style="margin-top:8px"></div>
    <div class="ws-actions"><button class="ws-ghost" id="wsCancel">やめる</button><button class="ws-btn" id="wsSave">保存</button></div>`;
  const cur={smell:r.check.smell||'',dirt:r.check.dirt||''};
  const seg=(id,key)=>{ const s=$('#'+id); s.querySelectorAll('button').forEach(b=>b.onclick=()=>{ cur[key]=b.dataset.v; s.querySelectorAll('button').forEach(x=>x.className=''); b.className=b.dataset.v==='OK'?'ok':'ng'; }); };
  seg('segSmell','smell'); seg('segDirt','dirt');
  const o2=()=>{ const v=parseFloat($('#wO2').value), h=$('#o2hint'); if(isNaN(v)){h.textContent='';h.className='ws-hint';return;} if(v<18){h.textContent='18%未満 — 立入不可、再換気';h.className='ws-hint bad';} else {h.textContent='18%以上 OK';h.className='ws-hint';} };
  $('#wO2').oninput=o2; o2();
  $('#wDone').onchange=e=>{ $('#fsWash').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#wDate').value)$('#wDate').value=wsToday(); if(!$('#wTime').value)$('#wTime').value=wsNow(); if(!$('#wBy').value&&ST.name&&WS.staff.includes(ST.name))$('#wBy').value=ST.name; } };
  $('#fDone').onchange=e=>{ $('#fsFin').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#fDate').value)$('#fDate').value=wsToday(); if(!$('#fBy').value&&ST.name&&WS.staff.includes(ST.name))$('#fBy').value=ST.name; } };
  $('#cDone').onchange=e=>{ $('#fsChk').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!cur.smell){cur.smell='OK';$('#segSmell button[data-v=OK]').className='ok';} if(!cur.dirt){cur.dirt='OK';$('#segDirt button[data-v=OK]').className='ok';} if(!$('#cBy').value&&ST.name&&WS.staff.includes(ST.name))$('#cBy').value=ST.name; } };
  $('#wsCancel').onclick=()=>hBack.click();
  $('#wsSave').onclick=async()=>{
    const data={
      wash:{done:$('#wDone').checked,date:$('#wDate').value,time:$('#wTime').value,method:$('#wMethod').value,o2:$('#wO2').value===''?null:parseFloat($('#wO2').value),by:$('#wBy').value},
      finish:{done:$('#fDone').checked,date:$('#fDate').value,by:$('#fBy').value},
      check:{done:$('#cDone').checked,smell:cur.smell,dirt:cur.dirt,by:$('#cBy').value},
      note:$('#wsNote').value };
    const miss=[];
    if(data.wash.done&&!data.wash.by)miss.push('洗浄の担当');
    if(data.wash.done&&data.wash.o2===null)miss.push('酸素濃度');
    if(data.finish.done&&!data.finish.by)miss.push('仕上げの担当');
    if(data.check.done&&!data.check.by)miss.push('確認者');
    if(miss.length){ wsStatus('未入力: '+miss.join('・'),true); return; }
    $('#wsSave').disabled=true; wsStatus('保存中…');
    try{
      const j=await washApi({action:'wash_save',id,data},30000);
      if(j&&j.ok){ wsApply(j.data); wsStatus(`タンク${p.tank} を保存しました`); setTimeout(()=>hBack.click(),400); }
      else { wsStatus('保存できませんでした: '+(j&&j.error||''),true); $('#wsSave').disabled=false; }
    }catch(e){ wsStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#wsSave').disabled=false; }
  };
}
</script>
