.shk-mix th,.shk-mix td{border-bottom:1px solid #f1ecdf;padding:4px 3px;text-align:right}
.shk-mix th{font-size:11px;color:var(--sub);font-weight:700}
.shk-mix th small{display:block;font-weight:400}
.shk-mix td.k,.shk-mix th.k{text-align:left;color:var(--navy);font-weight:700}
.shk-mix tr.kumi td{font-weight:800;color:#103e74;background:#e7f0fb}
.shk-mix .td{background:#fff3c4!important}
.shk-mix .ft{font-size:12px;color:var(--ink);margin:6px 2px 0}
`;
(function(){ const s=document.createElement('style'); s.textContent=SHK_CSS; document.head.appendChild(s); })();

const shkNum=(v,d=2)=>{ const n=shN(v); return n===null?'':n.toLocaleString('ja-JP',{maximumFractionDigits:d}); };
function shkPhase(m,t,today){
  if((t||{}).state==='上槽済') return 'done';
  if(m.tome && today>=m.tome) return 'moromi';
  if(m.soe && today>=m.soe) return 'shikomi';
  return 'plan';
}
/* その日の作業（添・仲・留）と、その日に入れる資材（酒母の乳酸は除く） */
function shkEvents(st,date){
  const ev=[], Z=st.shizai||{};
  st.master.forEach(m=>{
    if(((st.today||{})[m.no]||{}).state==='上槽済') return;
    const kg=m.kg||{}, ku=m.kumi||{};
    const zai=(Z[m.no]||[]).filter(z=>z.date===date && z.timing!=='酛立日');
    const used=new Set();
    [['添',m.soe,ku.soe,kg.soeKoji,kg.soeKake],['仲',m.naka,ku.naka,kg.nakaKoji,kg.nakaKake],['留',m.tome,ku.tome,kg.tomeKoji,kg.tomeKake]].forEach(([s,d,kumi,koji,kake])=>{
      if(d!==date) return;
      const z=s==='留'?zai.filter(x=>x.timing==='留日'):[];
      z.forEach(x=>used.add(x));
      ev.push({m,stage:s,kumi,koji,kake,zai:z});
    });
    const rest=zai.filter(x=>!used.has(x));
    const by={}; rest.forEach(x=>{ const k=x.timing==='四段'?'四段':x.timing==='上槽日'?'アル添':x.timing==='留日'?'留':x.timing; (by[k]=by[k]||[]).push(x); });
    Object.keys(by).forEach(k=>ev.push({m,stage:k,zai:by[k],kg4:k==='四段'?kg.yodan:''}));
  });
  const ord={'添':1,'仲':2,'留':3,'2日目':4,'四段':5,'アル添':6};
  return ev.sort((a,b)=>(ord[a.stage]||9)-(ord[b.stage]||9)||String(a.m.tank).localeCompare(String(b.m.tank))||a.m.no-b.m.no);
}
function shkZaiHTML(z){
  if(!z||!z.length) return '';
  return `<ul class="shk-zai">${z.map(x=>`<li>${esc(x.name)}<b>${shkNum(x.qty)}</b><span>${esc(x.unit)}</span></li>`).join('')}</ul>`;
}
function shkEventHTML(e){
  const m=e.m;
  let h=`<button class="shk-ev s-${e.stage}" data-no="${m.no}"><div class="h"><span class="stg">${e.stage}</span><span class="nm">No.${m.no} ${esc(m.sym||'')} ${esc(m.liquid||'')}<small>T${esc(m.tank||'')}</small></span></div>`;
  if(e.stage==='添'||e.stage==='仲'||e.stage==='留'){
    h+=`<div class="kumi"><small>汲水</small><b>${e.kumi!==''&&e.kumi!==undefined?shkNum(e.kumi,0):'—'}</b><span>L</span></div>`;
    h+=`<div class="kg">麹 ${shkNum(e.koji,0)||'—'} kg ・ 掛 ${shkNum(e.kake,0)||'—'} kg</div>`;
  }
  if(e.stage==='四段' && e.kg4) h+=`<div class="kg">四段 ${shkNum(e.kg4,0)} kg（上槽前日）</div>`;
  if(e.stage==='アル添') h+=`<div class="kg">上槽予定日</div>`;
  h+=shkZaiHTML(e.zai);
  if((e.stage==='留') && !(e.zai&&e.zai.length)) h+=`<div class="kg" style="color:var(--sub)">留で入れる資材の登録なし</div>`;
  return h+`</button>`;
}
function shkRowHTML(m,ph,today,t){
  const dd=d=>d?rcDays(today,d):null;
  let r='';
  if(ph==='shikomi'){
    const nx=[['仲',m.naka],['留',m.tome]].find(([,d])=>d&&d>=today);
    const od=m.soe&&dadd(m.soe,1)===today;
    r= m.soe===today?`<b class="hot">きょう 添</b>`: od?`<b>踊</b>`: nx?(nx[1]===today?`<b class="hot">きょう ${nx[0]}</b>`:`<b>${nx[0]}まで${dd(nx[1])}日</b>`):'';
  } else if(ph==='plan'){
    const n=dd(m.soe||m.tome); r=`<b>${n===0?'きょう 添':'あと'+n+'日'}</b>`;
  } else if(ph==='done'){
    r=`<b>上槽 ${rcMD(t&&t.josoActual||m.joso)}</b>`;
  }
  return `<button class="shk-row ${ph==='shikomi'?'on':''}" data-no="${m.no}"><span class="st"></span>
    <span class="id">${m.no}<small>${esc(m.sym||'')} T${esc(m.tank||'')}</small></span>
    <span class="mid">${esc(m.liquid||'')}<small>添 ${rcMD(m.soe)}・仲 ${rcMD(m.naka)}・留 ${rcMD(m.tome)}・上槽 ${rcMD(m.joso)}</small></span>
    <span class="r">${r}</span></button>`;
}

let SHK_DAY='today';
async function moromiHome(){
  head('仕込み','仕込中・醪中・予定（上槽済は一番下から）');
  rcLoading('仕込の一覧を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const today=dtoday(), T=st.today||{};
  const all=st.master.map(m=>({m,t:T[m.no]||{},ph:shkPhase(m,T[m.no],today)}));
  const shk=all.filter(x=>x.ph==='shikomi').sort((a,b)=>String(a.m.soe).localeCompare(String(b.m.soe))||a.m.no-b.m.no);
  const mor=all.filter(x=>x.ph==='moromi').map(x=>({...x,d:rcMoromiDay(x.m,today)})).sort((a,b)=>String(a.m.tome).localeCompare(String(b.m.tome))||a.m.no-b.m.no);
  const plan=all.filter(x=>x.ph==='plan').sort((a,b)=>String(a.m.soe||a.m.tome).localeCompare(String(b.m.soe||b.m.tome))||a.m.no-b.m.no);
  const done=all.filter(x=>x.ph==='done');
  const date=SHK_DAY==='today'?today:dadd(today,1);
  const ev=st.shkVer?shkEvents(st,date):[];
  let h=`<div class="rc-status" id="rcStatus"></div>`;
  h+=`<button class="sh-link zai-go" id="shkZai">🧰 資材の在庫<span>›</span></button>`;
  h+=`<div class="shk-today"><div class="t">${SHK_DAY==='today'?'きょう':'あす'}の仕込み・資材<small>${djp(date)}</small></div>
    <div class="shk-tabs"><button data-dy="today" class="${SHK_DAY==='today'?'on':''}">きょう</button><button data-dy="tom" class="${SHK_DAY!=='today'?'on':''}">あす</button></div>
    ${!st.shkVer?`<div class="tl-warn" style="margin:0">汲水・資材は、Apps Script「醸造記録 R8BY」に <b>仕込み一覧_追加.gs</b> を入れると出ます。</div>`
      : ev.length?ev.map(shkEventHTML).join(''):`<div class="shk-none">${SHK_DAY==='today'?'きょう':'あす'}の仕込み・資材はありません</div>`}
    ${st.shkVer?`<p class="tl-note" style="margin:4px 2px 0">汲水・kg は計画（造りexの配合）、資材は液種マスタの量。実際と違うときは杜氏に確認。</p>`:''}</div>`;
  h+=`<div class="shk-sec">仕込中<small>${shk.length}本</small></div>`;
  h+=shk.length?shk.map(x=>shkRowHTML(x.m,'shikomi',today,x.t)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<div class="shk-sec">醪中<small>${mor.length}本</small></div>`;
  h+=mor.length?mor.map(({m,t,d})=>moromiRowHTML(m,t,d)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<div class="shk-sec">予定<small>${plan.length}本</small></div>`;
  h+=plan.length?plan.map(x=>shkRowHTML(x.m,'plan',today,x.t)).join(''):`<div class="shk-none">ありません</div>`;
  h+=`<button class="sh-link" id="shkDone">🍶 上槽済（${done.length}本）<span>›</span></button>
    <div class="rc-bar" style="margin-top:8px"><button class="rc-ghost" id="rcReload">更新</button><span class="tl-note" style="margin:0">押すとその仕込の経過表と仕込み配合（汲水・資材）が開きます。</span></div>`;
  app.innerHTML=h;
  const bind=()=>app.querySelectorAll('.sh-row[data-no],.shk-row[data-no],.shk-ev[data-no]').forEach(b=>b.onclick=()=>go(()=>moromiSheet(b.dataset.no)));
  bind();

(function(){ const s=document.createElement('style'); s.textContent=BN_CSS; document.head.appendChild(s); })();

const BN_F={
  sb:[['be','Be'],['alc','alc'],['ta','酸度'],['aa','ｱﾐﾉ']],
  mr:[['be','Be/度'],['alc','alc'],['ta','酸度'],['aa','ｱﾐﾉ']],
  od:[['be','Be'],['ta','酸度'],['aa','ｱﾐﾉ']]   /* 2026-10-13 踊（添の翌日）。仕込み時の値（setup.odori）に入る */
};
/* ありえない値（赤）。範囲はゆるめ。打ち間違い（桁・小数点）を拾うため */
const BN_RANGE={ sb:{be:[0,25],ta:[0,20],alc:[0,20],aa:[0,10]}, mr:{be:[-30,40],alc:[0,23],ta:[0,6],aa:[0,6]}, od:{be:[0,25],ta:[0,10],aa:[0,10]} };
const BN={date:null, open:{}};
const bnKey=(k,no)=>k+'_'+no;
const bnStore=k=>k==='sb'?RC.shubo:RC.bun;
/* その行の値の入れ物：酒母・醪＝その日の days、踊＝仕込み時の setup.odori（2026-10-13） */
const bnDay=(x,s)=>x.k==='od'?(((s&&s.setup)||{}).odori||{}):(((s&&s.days)||[])[x.d-1]||{});
function bnDraft(date){ return lsGet('bn.draft.'+date,{})||{}; }
/* 2026-10-11：酛卸の日（酒母は全項目を分析する日）・小数1桁・はい／いいえの確認窓 */
function bnOro(x){ if(!x||x.k!=='sb') return ''; const s=RC.shubo[x.m.no]; return (s&&(s.motooroshi||s.motooroshiPlan))||(x.m.soe?dadd(x.m.soe,-1):''); }
const bnF1=v=>{ const t=String(v??'').trim(); return (t!==''&&shN(t)!==null)?shF(t,1):t; };
function bnAsk(msg,sub,btns){ return new Promise(res=>{ const d=document.createElement('div'); d.className='bn-ask';
  d.innerHTML=`<div class="box" role="dialog"><p>${esc(msg)}</p>${sub?`<small>${sub}</small>`:''}<div class="bt">${btns.map((b,i)=>`<button type="button" data-i="${i}" class="${b[1]||''}">${esc(b[0])}</button>`).join('')}</div></div>`;
  document.body.appendChild(d); d.querySelectorAll('button').forEach(b=>b.onclick=()=>{ d.remove(); res(+b.dataset.i); }); }); }
function bnDraftSet(date,d){ if(Object.keys(d).length) lsSet('bn.draft.'+date,d); else { try{ localStorage.removeItem('bn.draft.'+date); }catch(e){} } }

/* その日に分析する仕込（ホームの dpBunseki と同じ決まり） */
function bnTargets(st,date){
  const M=(st&&st.master)||[], out=[];
  M.filter(m=>m.motodate && dadd(m.motodate,2)<=date && (!m.soe || date<=dadd(m.soe,-1)))   // 2026-10-06：酒母は酛立を1日目として3日目から
   .sort((a,b)=>a.motodate.localeCompare(b.motodate)||a.no-b.no)
   .forEach(m=>{ const d=rcShuboDay(m,date); if(d>=1&&d<=13) out.push({k:'sb',m,d}); });
  /* 2026-10-13 泰広さん指示：踊（添の翌日）の分析 Be・酸度・ｱﾐﾉ */
  M.filter(m=>m.soe && dadd(m.soe,1)===date && ((st.today||{})[m.no]||{}).state!=='上槽済')
   .sort((a,b)=>a.soe.localeCompare(b.soe)||a.no-b.no)
   .forEach(m=>out.push({k:'od',m,d:0}));
  M.filter(m=>m.tome && dadd(m.tome,2)<=date && (!m.joso || date<=m.joso) && ((st.today||{})[m.no]||{}).state!=='上槽済')
   .sort((a,b)=>a.tome.localeCompare(b.tome)||a.no-b.no)
   .forEach(m=>{ const d=rcMoromiDay(m,date); if(d>=1&&d<=36) out.push({k:'mr',m,d}); });
  return out;
}
/* その日より前で一番近い値 */
function bnPrev(days,d,f){ for(let i=d-2;i>=0;i--){ const x=days[i]; const v=x?shN(x[f]):null; if(v!==null) return {v,day:x.day}; } return null; }
/* 前回と比べた注意（黄）。保存は止めない */
function bnCheck(k,f,v,prev){
  const r=BN_RANGE[k][f]; if(r&&(v<r[0]||v>r[1])) return ['bad','ありえない値です（桁・小数点を確認）'];
  if(!prev) return null; const p=prev.v;
  if(f==='alc'&&v<p-0.3) return ['warn',`alc が前回（${shF(p)}）より下がっています`];
  if(f==='alc'&&k==='mr'&&v>p+4) return ['warn',`alc が前回（${shF(p)}）から急に上がっています`];
  if(f==='ta'&&Math.abs(v-p)>=(k==='sb'?3:0.6)) return ['warn',`酸度が前回（${shF(p)}）から大きく変わっています`];
  if(f==='aa'&&Math.abs(v-p)>=0.5) return ['warn',`アミノ酸度が前回（${shF(p)}）から大きく変わっています`];
  if(f==='be'&&k==='sb'&&v>p+1) return ['warn',`Be が前回（${shF(p)}）より上がっています`];
  return null;
}

async function bunHome(date){
  date=date||BN.date||dtoday(); BN.date=date;
  head('分析', '酒母・醪の分析値をまとめて入力');
  rcLoading('分析する仕込を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  const T=bnTargets(st,date), sb=T.filter(x=>x.k==='sb'), od=T.filter(x=>x.k==='od'), mr=T.filter(x=>x.k==='mr');
  const draft=bnDraft(date), isToday=date===dtoday();
  const row=x=>{ const key=bnKey(x.k,x.m.no), F=BN_F[x.k];
    const id=x.k==='sb'?`${x.m.no}<small>酒母${esc(x.m.shuboSym||'')}${x.m.shuboT?' T'+esc(x.m.shuboT):''}</small>`:`${x.m.no}<small>${esc(x.m.sym||'')} T${esc(x.m.tank||'')}</small>`;
    return `<tr class="bn-r" data-key="${key}"><td class="id">${id}</td><td class="dy">${x.k==='od'?'踊':x.k==='mr'&&x.d===1?'留':x.d+'日'}${x.k==='sb'?`<span class="oro" data-oro="${key}" style="${bnOro(x)===date?'':'display:none'}">酛卸</span>`:''}</td>
      ${F.map(([f])=>{ const dv=draft[key]&&draft[key][f]; return `<td><input class="bn-in ${dv!==undefined?'dirty':''}" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-key="${key}" data-f="${f}" value="${dv!==undefined?esc(bnF1(dv)):''}" disabled><span class="bn-pv" data-pv="${key}_${f}">…</span></td>`; }).join('')}
      <td><button type="button" class="bn-hb" data-h="${key}">経過</button></td></tr>
      <tr class="bn-m"><td class="bn-msg" colspan="${F.length+3}" data-msg="${key}"></td></tr>
      <tr class="bn-hist" data-hist="${key}" style="display:none"><td colspan="${F.length+3}"></td></tr>`; };
  const table=(k,list)=>`<table class="bn-t"><colgroup><col class="c1"><col class="c2">${BN_F[k].map(()=>'<col>').join('')}<col class="c9"></colgroup><tr><th style="text-align:left;padding-left:8px">順号</th><th>日目</th>${BN_F[k].map(([,l])=>`<th>${l}</th>`).join('')}<th></th></tr>${list.map(row).join('')}</table>`;
  const d=dparse(date);
  let h=`<div class="bn-top"><button type="button" id="bnPrev">‹ 前日</button><div class="dt">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）<small>${isToday?'今日の分析':date<dtoday()?'過去の日':'先の日（予定）'}</small></div><button type="button" id="bnNext">翌日 ›</button></div>
    <div class="rc-status" id="rcStatus"></div>`;
  if(!T.length) h+=`<p class="muted" style="text-align:center;padding:24px 0">この日に分析する仕込はありません</p>`;
  if(sb.length) h+=`<div class="bn-h">🧫 酒母<small>Be・alc・酸度・ｱﾐﾉ（酛卸の日は全項目）</small></div>${table('sb',sb)}`;
  if(od.length) h+=`<div class="bn-h">🍶 踊<small>添の翌日（Be・酸度・ｱﾐﾉ）</small></div>${table('od',od)}`;
  if(mr.length) h+=`<div class="bn-h">🍶 醪<small>Be は3.0未満になったら日本酒度で（R7BYと同じ）</small></div>${table('mr',mr)}`;
  if(T.length) h+=`<p class="bn-note">数字の下の小さな字＝前回の値（何日目か）。入れると黄色の枠＝まだ保存していない値（この端末に下書きとして残ります）。前回から大きく外れると枠が光り、行の下に理由が出ます。「経過」でその仕込の全体の流れ（グラフと全日の表）が開きます。品温は 酒母・仕込み の画面で。</p>
    <div class="bn-bar"><button class="rc-ghost" id="bnReload" type="button">更新</button><button class="rc-btn" id="bnSave" type="button" disabled>まとめて保存</button></div>`;
  app.innerHTML=h;
  $('#bnPrev').onclick=()=>bunHome(dadd(date,-1));
  $('#bnNext').onclick=()=>bunHome(dadd(date,1));
  if(!T.length) return;
  const myTop=nav[nav.length-1];
  const live=()=>nav[nav.length-1]===myTop && BN.date===date && document.getElementById('bnSave');

  /* 1行ぶんに値を流し込む（自分が打った欄は触らない） */
  const fill=x=>{ if(!live()) return; const key=bnKey(x.k,x.m.no), s=bnStore(x.k)[x.m.no]; if(!s) return;
    const days=s.days||[], D=bnDay(x,s);
    BN_F[x.k].forEach(([f])=>{ const inp=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(!inp) return;
      if(!inp.classList.contains('dirty')) inp.value=shF(D[f],1);
      const p=bnPrev(days,x.d,f), pv=app.querySelector(`[data-pv="${key}_${f}"]`);
      if(pv) pv.textContent=p?`前${shF(p.v)}(${x.k==='mr'&&p.day===1?'留':p.day+'日'})`:'前 —';
      inp.disabled=false; });
    if(x.k==='sb'){ const o=app.querySelector(`[data-oro="${key}"]`); if(o) o.style.display=bnOro(x)===date?'':'none'; }
    if(x.k==='sb'){ const miss=shSetupMissing(s); const msg=app.querySelector(`[data-msg="${key}"]`);
      if(miss.length){ BN_F.sb.forEach(([f])=>{ const i=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(i) i.disabled=true; });
        if(msg) msg.innerHTML=`<span class="e">仕込時の値（${esc(miss.join('・'))}）が未入力のため保存できません。</span><button type="button" class="bn-setup" data-setup="${x.m.no}">→ 仕込時の値を入れる</button>`;
        const b=msg&&msg.querySelector('[data-setup]'); if(b) b.onclick=()=>go(()=>shuboInput(x.m.no, Math.min(13,Math.max(1,x.d)), 'setup')); } }
    validateRow(key); count(); };
  const count=()=>{ if(!live()) return; let n=0, k=0;
    T.forEach(x=>{ const s=bnStore(x.k)[x.m.no]; if(!s) return; k++; const D=bnDay(x,s);
      if(BN_F[x.k].some(([f])=>shN(D[f])!==null)) n++; });
    const e=$('#bnDone'); if(e) e.textContent=k<T.length?`${n}/${T.length}…`:`${n}/${T.length}`;
    const box=$('#bnDoneBox'); if(box) box.className=n>=T.length?'ok':'ng'; };
  const validateRow=key=>{ const x=T.find(y=>bnKey(y.k,y.m.no)===key); if(!x) return; const s=bnStore(x.k)[x.m.no]; const days=(s&&s.days)||[];
    const msgs=[], oro=x.k==='sb'&&bnOro(x)===date;
    BN_F[x.k].forEach(([f,l])=>{ const inp=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(!inp) return;
      inp.classList.remove('warn','bad','need'); const raw=String(inp.value).trim(); if(raw===''){ if(oro&&!inp.disabled) inp.classList.add('need'); return; }
      const v=Number(raw); if(isNaN(v)){ inp.classList.add('bad'); msgs.push(['bad',l+'：数字ではありません']); return; }
      const c=bnCheck(x.k,f,v,bnPrev(days,x.d,f)); if(c){ inp.classList.add(c[0]); msgs.push([c[0],l+'：'+c[1]]); } });
    const msg=app.querySelector(`[data-msg="${key}"]`); if(!msg||msg.querySelector('[data-setup]')) return;
    if(msgs.length) msg.innerHTML=msgs.map(([c,t])=>`<span class="${c==='bad'?'e':'w'}">⚠ ${esc(t)}</span>`).join('<br>');
    else if(!msg.querySelector('.o')) msg.innerHTML=''; };
  const dirtyN=()=>app.querySelectorAll('.bn-in.dirty').length;
  const syncBtn=()=>{ const b=$('#bnSave'); if(!b) return; const n=dirtyN(); b.disabled=!n; b.textContent=n?`まとめて保存（${n}項目）`:'まとめて保存'; };

  /* 入力：下書きに残す・Enterで次の欄へ */
  app.querySelectorAll('.bn-in').forEach(inp=>{
    inp.addEventListener('input',()=>{ const key=inp.dataset.key, f=inp.dataset.f; const dr=bnDraft(date);
      inp.classList.add('dirty'); (dr[key]=dr[key]||{})[f]=inp.value; bnDraftSet(date,dr);
      const r=inp.closest('tr'); r.classList.remove('done','err'); validateRow(key); syncBtn(); });
    inp.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; e.preventDefault();
      const all=[...app.querySelectorAll('.bn-in:not(:disabled)')]; const i=all.indexOf(inp);
      if(i>=0&&i<all.length-1){ all[i+1].focus(); all[i+1].select&&all[i+1].select(); } else inp.blur(); });
    inp.addEventListener('focus',()=>{ try{ inp.select(); }catch(e){} });
    inp.addEventListener('blur',()=>{ const f1=bnF1(inp.value); if(f1===inp.value) return; inp.value=f1;
      if(inp.classList.contains('dirty')){ const dr=bnDraft(date); (dr[inp.dataset.key]=dr[inp.dataset.key]||{})[inp.dataset.f]=f1; bnDraftSet(date,dr); } });
  });
  syncBtn();

  /* 経過（押すと行の下に開く） */
  app.querySelectorAll('.bn-hb').forEach(b=>b.onclick=()=>{ const key=b.dataset.h, tr=app.querySelector(`[data-hist="${key}"]`);
    const open=tr.style.display==='none'; tr.style.display=open?'':'none'; b.classList.toggle('on',open); BN.open[key]=open;
    if(open) bnHist(T.find(y=>bnKey(y.k,y.m.no)===key), tr.firstElementChild); });

  const bnHistRefresh=x=>{ const key=bnKey(x.k,x.m.no); if(!BN.open[key]||!live()) return; const tr=app.querySelector(`[data-hist="${key}"]`); if(tr&&tr.style.display!=='none') bnHist(x,tr.firstElementChild); };
  /* データ：手元の分ですぐ出し、裏で最新を取り直す */
  T.forEach(fill);
  const byK={sb:T.filter(x=>x.k==='sb'), mr:T.filter(x=>x.k==='mr'||x.k==='od')};
  const refetch=async()=>{ await Promise.all([
    shFetchMany(byK.sb.map(x=>x.m.no),'shubo_get',RC.shubo,no=>{ const x=byK.sb.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } }),
    shFetchMany(byK.mr.map(x=>x.m.no),'bunseki_get',RC.bun,no=>{ const x=byK.mr.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } }) ]);
    if(live()) T.forEach(x=>{ if(!bnStore(x.k)[x.m.no]){ const m=app.querySelector(`[data-msg="${bnKey(x.k,x.m.no)}"]`); if(m&&!m.innerHTML) m.innerHTML='<span class="e">読み込めませんでした（更新を押してください）</span>'; } }); };
  refetch();
  T.forEach(x=>{ const key=bnKey(x.k,x.m.no); if(BN.open[key]){ const tr=app.querySelector(`[data-hist="${key}"]`), b=app.querySelector(`[data-h="${key}"]`); if(tr){ tr.style.display=''; b.classList.add('on'); bnHist(x,tr.firstElementChild); } } });

  $('#bnReload').onclick=async()=>{ rcStatus('更新中…'); await recState(true); T.forEach(x=>bnStore(x.k)[x.m.no]=null); bunHome(date); };

  /* まとめて保存（2本ずつ並行で送る） */
  $('#bnSave').onclick=async()=>{
    const jobs=[];
    T.forEach(x=>{ const key=bnKey(x.k,x.m.no), s=bnStore(x.k)[x.m.no]; const D=bnDay(x,s); const values={};
      app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).forEach(inp=>{ if(inp.disabled) return; const v=String(inp.value).trim(), o=D[inp.dataset.f], nv=shN(v), no=shN(o);
        const same=(v!==''&&nv!==null&&no!==null)?nv===no:v===String(o??''); if(!same) values[inp.dataset.f]=(v!==''&&nv!==null)?String(nv):v; });
      const dirty=app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).length;
      if(Object.keys(values).length) jobs.push({x,key,values});
      else if(dirty && s){ app.querySelectorAll(`.bn-in.dirty[data-key="${key}"]`).forEach(i=>{ if(!i.disabled) i.classList.remove('dirty'); }); const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr); } });
    if(!jobs.length){ syncBtn(); rcStatus('変わったところがありません'); return; }
    const bad=app.querySelectorAll('.bn-in.dirty.bad').length;
    if(bad && !confirm(`ありえない値が ${bad} か所あります。このまま保存しますか？`)) return;
    /* 2026-10-11 泰広さん指示：酛卸の日は全項目を分析する。未入力があれば はい／いいえ で確認 → はい なら「次は全て分析する事！」 */
    const oroMiss=[]; let oroFirst=null;
    T.forEach(x=>{ if(x.k!=='sb'||bnOro(x)!==date) return; const s=RC.shubo[x.m.no]; if(!s) return; const key=bnKey('sb',x.m.no); const D=(s.days||[])[x.d-1]||{};
      const miss=BN_F.sb.filter(([f])=>{ const i=app.querySelector(`.bn-in[data-key="${key}"][data-f="${f}"]`); if(!i||i.disabled) return false;
        const e=String(i.value).trim()===''&&shN(D[f])===null; if(e&&!oroFirst) oroFirst=i; return e; }).map(([,l])=>l);
      if(miss.length) oroMiss.push(`順号${x.m.no}：${miss.join('・')}`); });
    if(oroMiss.length){
      const a=await bnAsk('酛卸時は全て分析する事となっていますが、よろしいですか？', '未入力　'+oroMiss.map(esc).join('<br>'), [['いいえ',''],['はい','yes']]);
      if(a!==1){ if(oroFirst){ oroFirst.scrollIntoView({block:'center'}); oroFirst.focus(); } return; }
      await bnAsk('次は全項目分析してください！','',[['はい','yes']]);   /* 2026-10-20 泰広さん指示で文言変更 */
    }
    /* 2026-10-06 泰広さん指示：待たずに裏で送り、前の画面に戻る（推奨追水・警告は画面の下の知らせに出る） */
    jobs.forEach(({x,key,values})=>{
      const st=x.k!=='sb'?RC.bun[x.m.no]:RC.shubo[x.m.no], D=x.k==='od'?(st&&((st.setup=st.setup||{}).odori=st.setup.odori||{})):(st&&st.days&&st.days[x.d-1]); if(D) Object.assign(D,values);
      const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr);
      app.querySelectorAll(`.bn-in[data-key="${key}"]`).forEach(e=>e.classList.remove('dirty'));
      if(x.k==='od') recSaveBg({action:'bunseki_save', no:x.m.no, setup:{stage:'odori', values}}, `踊 順号${x.m.no}`, true);
      else recSaveBg({action:x.k==='sb'?'shubo_save':'bunseki_save', no:x.m.no, day:x.d, values}, `${x.k==='sb'?'酒母':'醪'} 順号${x.m.no} ${x.k==='mr'&&x.d===1?'留':x.d+'日目'}`, true); });
    rcToast(`${jobs.length}本 を裏で保存しています。ほかの作業に移ってOKです`);
    hBack.click(); return;
    const btn=$('#bnSave'); btn.disabled=true; let ok=0, ng=0, i=0, warnN=0;
    rcStatus(`保存中… 0/${jobs.length}`);
    const one=async j=>{ const {x,key,values}=j, tr=app.querySelector(`tr.bn-r[data-key="${key}"]`), msg=app.querySelector(`[data-msg="${key}"]`);
      try{ const res=await recApi({action:x.k==='sb'?'shubo_save':'bunseki_save', no:x.m.no, day:x.d, values},50000);
        if(res&&res.ok){ ok++;
          if(x.k==='mr'&&res.all) RC.bun[x.m.no]=res.all; else { const s=RC.shubo[x.m.no]; const D=s&&s.days&&s.days[x.d-1]; if(D) Object.assign(D,values); }
          const dr=bnDraft(date); delete dr[key]; bnDraftSet(date,dr);
          if(live()){ app.querySelectorAll(`.bn-in[data-key="${key}"]`).forEach(e=>e.classList.remove('dirty'));
            if(tr){ tr.classList.remove('err'); tr.classList.add('done'); }
            const w=x.k==='mr'&&res.calc?(res.calc.warn||res.calc.miss||''):''; const c=x.k==='mr'&&res.calc;
            if(w) warnN++;
            if(msg) msg.innerHTML=`<span class="o">✓ 保存しました</span>${c&&shN(c.bmd)!==null?`　BMD ${shF(c.bmd)}${shN(c.bmdStd)!==null?'（標準 '+shF(c.bmdStd)+'）':''}`:''}${c&&c.rec?`　<span class="w">推奨追水 ${rcN(c.rec)}L</span>`:''}${w?`<br><span class="w">⚠ ${esc(w)}</span>`:''}`;
            bnHistRefresh(x); }
        } else { ng++; if(live()){ if(tr) tr.classList.add('err'); if(msg) msg.innerHTML=`<span class="e">保存できませんでした：${esc(res&&res.err||'')}</span>`; } }
      }catch(e){ ng++; if(live()){ if(tr) tr.classList.add('err'); if(msg) msg.innerHTML='<span class="e">保存できませんでした（電波を確認して、もう一度「まとめて保存」）</span>'; } }
      rcStatus(`保存中… ${ok+ng}/${jobs.length}`); };
    const worker=async()=>{ while(i<jobs.length){ await one(jobs[i++]); } };
    await Promise.all([worker(),worker()]);
    RC.at=0;
    if(!live()) return;
    syncBtn(); count();
    rcStatus(ng?`${ok}本 保存、${ng}本 保存できませんでした（赤い行）。値は残っているので、もう一度「まとめて保存」を押してください`:`${ok}本 保存しました${warnN?`（注意 ${warnN}本：行の下を確認）`:''}`, !!(ng||warnN));
    /* 酒母は保存後に最新を取り直す（計算はないが、ほかの人の入力も反映） */
    const sbNos=jobs.filter(j=>j.x.k==='sb').map(j=>j.x.m.no);
    if(sbNos.length) shFetchMany(sbNos,'shubo_get',RC.shubo,no=>{ const x=byK.sb.find(y=>String(y.m.no)===String(no)); if(x){ fill(x); bnHistRefresh(x); } });
  };
}

/* 経過：グラフ＋全日の表（その日の列を黄色）。酒母は分析酒母、醪は分析醪と同じ並び */
function bnHist(x, td){
  if(!x||!td) return;
  const s=bnStore(x.k)[x.m.no];
  if(!s){ td.innerHTML='<div class="muted" style="font-size:12px">読み込んでいます…</div>'; return; }
  const days=s.days||[], m=x.m;
  let h='';
  if(x.k==='sb'){
    h+=`<div class="ttl">${esc(m.liquid||'')}<small>　酛立 ${rcMD(m.motodate)}・酛卸予定 ${rcMD(s.motooroshi||s.motooroshiPlan||(m.soe?dadd(m.soe,-1):''))}・酵母 ${esc(m.yeast||'—')}</small></div>`;
    h+=shChart(days.length, days.map(y=>y.day), [
      {name:'ボーメ', color:'#1f5fa8', axis:'L', vals:days.map(y=>shN(y.be))},
      {name:'酸度', color:'#2f7d5d', axis:'R', vals:days.map(y=>shN(y.ta))},
      {name:'品温(●AM○PM)', color:'#c0392b', axis:'R', vals:days.map(y=>shN(y.temp)), pm:days.map(y=>shN(y.tPM))}], x.d-1);
    h+=shTable(days, y=>y.day, [
      ['Be', y=>shF(y.be)], ['alc', y=>shF(y.alc)], ['酸度', y=>shF(y.ta)],
      ['品温', y=>{ const a=shF(y.temp), p=shF(y.tPM); return a||p?`${a||'—'}<span class="pm">${p||'—'}</span>`:''; }],
      ['備考', y=>y.biko?`<span style="font-weight:400;font-size:11px">${esc(String(y.biko).slice(0,8))}</span>`:'']], x.d);
    h+=`<button type="button" class="go" data-open="1">この酒母の画面を開く ›</button>`;
  }else{
    const calc=s.calc||{}, dl=d=>d===1?'留':d;
    const last=Math.max(x.d, ...days.filter(y=>shN(y.be)!==null||shN(y.tAM)!==null).map(y=>y.day), 1);
    const dd=days.slice(0, Math.min(days.length, Math.max(last+3, 12)));
    h+=`<div class="ttl">${esc(m.liquid||'')}<small>　留 ${rcMD(m.tome)}・上槽予定 ${rcMD(m.joso)}・酵母 ${esc(m.yeast||'—')}・追水計画 ${esc(m.oimizu||'—')}L</small></div>`;
    h+=shChart(dd.length, dd.map(y=>dl(y.day)), [
      {name:'標準BMD', color:'#1f5fa8', axis:'L', std:true, vals:dd.map(y=>shN((calc[y.day]||{}).bmdStd))},
      {name:'BMD', color:'#1f5fa8', axis:'L', vals:dd.map(y=>shN((calc[y.day]||{}).bmd))},
      {name:'alc', color:'#7a4fb0', axis:'R', vals:dd.map(y=>shN(y.alc))}], x.d-1);
    h+=shTable(dd, y=>dl(y.day), [
      ['Be/度', y=>shF(y.be)], ['alc', y=>shF(y.alc)], ['酸', y=>shF(y.ta)], ['ｱﾐﾉ', y=>shF(y.aa)], ['追水', y=>shF(y.oimizu,0)],
      ['品温', y=>{ const a=shF(y.tAM), p=shF(y.tPM); return a||p?`${a||'—'}${p?`<span class="pm">${p}</span>`:''}`:''; }],
      ['BMD', y=>shF((calc[y.day]||{}).bmd)],
      ['注意', y=>{ const k=calc[y.day]||{}; return k.warn?`<span class="wn">!</span>`:(k.rec?`<span style="font-size:10px">追${rcN(k.rec)}</span>`:''); }]], x.d);
    h+=`<button type="button" class="go" data-open="1">この醪の画面を開く（仕込み時の値・カルテ）›</button>`;
  }
  td.innerHTML=h.replace(/id="shTw"/g,'');
  const tw=td.querySelector('.sh-tw'), on=tw&&tw.querySelector('th.td');
  if(on) tw.scrollLeft=Math.max(0,on.offsetLeft-tw.clientWidth/2+on.offsetWidth/2);
  td.querySelector('[data-open]').onclick=()=>go(()=>x.k==='sb'?shuboSheet(x.m.no):moromiSheet(x.m.no));
}

/* ホーム「本日の予定」の「分析 ◯本」を押すと、その日の分析画面へ */
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('#app .dp-bn'); if(!b) return;
  const d=(typeof dpDate==='function')?dpDate():dtoday(); go(()=>bunHome(d));
});

</script>

function todoDays(s){ if(!s) return 0; const t=new Date(String(s).slice(0,10)+'T00:00:00'); if(isNaN(t)) return 0; return Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-t)/86400000)); }
/* 見てよいもの：「自分」は登録した本人だけ（端末に前の人の控えが残っていても出さない） */

const TODO_WHEN_RANK={'今すぐ':0,'今月中':1,'造り前':2,'造り期間中':3,'':4,'甑倒し後':5,'夏場':6,'来期':7};
const TODO_STAT_RANK={'止まっている':0,'未着手':1,'進行中':2,'発注済':3};
function todoRank(x){ const w=TODO_WHEN_RANK[x.when||'']; return (w===undefined?4:w)*10+(TODO_STAT_RANK[x.status||'未着手']??1); }

function todoVendorOf(x){
  if(x.vendor) return { name:x.vendor, guess:false };
  const t=String(x.text||'')+' '+String(x.memo||''); let best='';
  todoVNames().forEach(n=>{ if(n.length>=2 && t.includes(n) && n.length>best.length) best=n; });
  return best ? { name:best, guess:true } : null;
}

async function todoApi(body, ms){
  if(!TODO_URL) throw new Error('no_url');
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||25000) : null;
  try{
    const r=await fetch(TODO_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function todoStore(j){
  TODO.items = (j.items||[]); TODO.at=Date.now(); if(j.sheetUrl) TODO.sheet=j.sheetUrl;
  if(Array.isArray(j.vendors)) TODO.vendors=j.vendors;
  /* まだ送れていない分を上に重ねて見せる */
  todoQ().forEach(op=>todoApplyLocal(op));
  TODO.items = TODO.items.filter(todoVisible);
  lsSet('todo.items',TODO.items); lsSet('todo.at',TODO.at); lsSet('todo.sheet',TODO.sheet); lsSet('todo.vendors',TODO.vendors);
  if(typeof dpRedraw==='function' && document.getElementById('dpMe')) dpRedraw();   // ホームの「自分のやること」も新しく
}
function todoApplyLocal(op){
  if(op.action==='add'){ if(!TODO.items.some(x=>x.id===op.item.id)) TODO.items.push(Object.assign({pend:1},op.item)); }
  else if(op.action==='update'){ const x=TODO.items.find(x=>x.id===op.id); if(x) Object.assign(x,op.fields,{upd:op.at,updBy:op.who.name,pend:1}); }
  else if(op.action==='delete'){ TODO.items=TODO.items.filter(x=>x.id!==op.id); }
  else if(op.action==='vendor_add'){ if(!todoVNames().includes(op.name)){ TODO.vendors.push({name:op.name, kind:'', pend:1}); lsSet('todo.vendors',TODO.vendors); } }
}
/* 書き込み：まず端末に反映→預かり箱へ→送る */
function todoPush(op){
  op.cid=op.cid||todoCid(); op.who=todoMe(); op.at=todoNow();
  todoApplyLocal(op); lsSet('todo.items',TODO.items);
  const q=todoQ(); q.push(op); lsSet('todo.q',q);
  return todoFlush();
}
let TODO_FLUSH=null;
function todoFlush(){
  if(TODO_FLUSH) return TODO_FLUSH;
  TODO_FLUSH=(async()=>{ let sent=0, last=null;
    try{ let g=0; while(g++<50){ const op=todoQ()[0]; if(!op) break;   // 送っている間に足された分も続けて送る
        try{ const j=await todoApi(op,25000);
          if(j&&j.ok){ lsSet('todo.q',todoQ().filter(x=>x.cid!==op.cid)); sent++; last=j; }
          else if(j&&/unknown action/.test(String(j.error||''))){ lsSet('todo.q',todoQ().filter(x=>x.cid!==op.cid)); }   // 裏側が古くて受け付けない操作は捨てる（詰まらせない）
          else break; }
        catch(e){ break; } }
      if(last) todoStore(last);
    }catch(e){}
    TODO_FLUSH=null; return sent; })();
  return TODO_FLUSH;
}
async function todoFetch(){
  if(!TODO_URL || TODO.busy) return false;
  TODO.busy=true;
  try{ if(todoQ().length) await todoFlush(); const j=await todoApi({action:'list', who:todoMe()},20000); if(j&&j.ok){ todoStore(j); return true; } }
  catch(e){} finally{ TODO.busy=false; }
  return false;
}

    }
    if(TODO.tab==='完了') xs=xs.filter(x=>x.status==='完了');
    else if(TODO.tab===TODO_OTAB) xs=xs.filter(x=>x.status==='発注済');
    else { xs=xs.filter(x=>x.status!=='完了'); if(TODO.tab!=='すべて') xs=xs.filter(x=>x.when===TODO.tab); }
    if(TODO.cat) xs=xs.filter(x=>x.cat===TODO.cat);
    if(TODO.tab==='完了') xs.sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
    else if(TODO.tab===TODO_OTAB) xs.sort((a,b)=>String((todoVendorOf(a)||{}).name||'\uffff').localeCompare(String((todoVendorOf(b)||{}).name||'\uffff'),'ja')||String(a.upd||a.at||'').localeCompare(String(b.upd||b.at||'')));
    else xs.sort((a,b)=>todoRank(a)-todoRank(b)||String(a.at||'').localeCompare(String(b.at||'')));   // すぐやるものほど上、同じなら古いものほど上
    return xs;
  }
  function item(x){
    const dn=x.status==='完了', d=todoDays(x.at);
    const ac=dn?'dn':d>=90?'a90':d>=60?'a60':d>=30?'a30':'';
    const sc={'進行中':'s1','止まっている':'s2','完了':'s3','発注済':'s4'}[x.status]||'';
    const mine=x.cat===TODO_ME, late=!dn&&x.due&&x.due<dtoday();
    const age=dn?`完了 ${esc(String(x.doneAt||'').slice(5,10).replace('-','/'))}${x.doneBy?'（'+esc(x.doneBy)+'）':''}`:(d===0?'今日':d+'日');
    return `<div role="button" tabindex="0" class="td-it ${ac} ${mine?'mine':''}" data-id="${esc(x.id)}"><div class="bd">
      <div class="tx">${esc(x.text)}</div>
      ${todoMemoBody(x.memo)?`<div class="mm">${esc(todoMemoBody(x.memo))}</div>`:''}
      <div class="mt"><button type="button" class="pl st ${sc} td-stb" aria-label="状況を変える">${esc(x.status||'未着手')}</button>${todoRingi(x)?(r=>`<button type="button" class="pl rg ${r==='提出済'?'r2':r==='承認済'?'r3':''} td-rgb" aria-label="稟議を変える">稟議 ${r}</button>`)(todoRingiOf(x)):''}${(v=>v?`<span class="pl vd ${v.guess?'gs':''}">🏢 ${esc(v.name)}${v.guess?'（メモから）':''}</span>`:'')(todoVendorOf(x))}${x.cat?`<span class="pl ${mine?'me':''}">${esc(todoCatL(x.cat))}</span>`:''}${x.due?`<span class="pl due ${late?'late':''}">📅 ${esc(rcMD?rcMD(x.due):x.due)}${late?' 期限切れ':''}</span>`:''}${x.when?`<span class="pl ${x.when==='今すぐ'?'w0':x.when==='今月中'?'w1':''}">${esc(x.when)}</span>`:''}
        <span>${esc(x.by||'')}</span>${x.pend?'<span class="pend">（送信待ち）</span>':''}<span class="age">${age}</span></div></div>
      ${dn?`<button type="button" class="td-ok back" data-ok="0" aria-label="未完了に戻す">戻す</button>`:`<button type="button" class="td-ok" data-ok="1" aria-label="済にする">済</button>`}</div>`;
  }
  function draw(){
    TODO_REDRAW=draw;
    const open=todoOpen(), cnt=w=>open.filter(x=>x.when===w).length;
    const tabs=['すべて',TODO_VTAB,TODO_OTAB,...TODO_WHENS,'完了'];
    const vc=todoVCount(), vOn=TODO.tab===TODO_VTAB;
    let h=`<div class="td-tabs">${tabs.map(t=>{ const n=t==='すべて'?open.length:t==='完了'?TODO.items.filter(x=>x.status==='完了'&&todoVisible(x)).length:t===TODO_VTAB?Object.values(vc).reduce((a,b)=>a+b,0):t===TODO_OTAB?open.filter(x=>x.status==='発注済').length:cnt(t);
      return `<button type="button" data-t="${t}" class="${t===TODO_VTAB?'vt ':t===TODO_OTAB?'ot ':''}${TODO.tab===t?'on':''}">${t==='完了'?'✓ 済み':t}${n?`<small>${n}</small>`:''}</button>`; }).join('')}</div>`;
    if(TODO.undo && TODO.items.some(x=>x.id===TODO.undo.id)) h+=`<div class="td-undo"><span>「${esc(TODO.undo.text)}」を${TODO.undo.done?'済みリストに移しました':'やることに戻しました'}</span><button type="button" id="tdUndo">元に戻す</button></div>`;
    if(vOn){
      /* 発注するものがある業者を先に（件数の多い順）、ほかの業者は「ほかの業者」を押すと出る */
      const vs=TODO.vendors.map((v,i)=>({name:String(v.name||''), kind:v.kind||'', n:vc[v.name]||0, i})).filter(v=>v.name);
      vs.sort((a,b)=>(b.n>0)-(a.n>0)||b.n-a.n||a.i-b.i);
      const has=vs.filter(v=>v.n>0), rest=vs.filter(v=>!v.n);
      const vb=v=>`<button type="button" data-v="${esc(v.name)}" class="${v.n?'':'z '}${TODO.vendor===v.name?'on':''}">${esc(v.name)}${v.n?`<b>${v.n}</b>`:''}${v.kind?`<small>${esc(v.kind)}</small>`:''}</button>`;
      const showRest=TODO.vAll || (TODO.vendor && !vc[TODO.vendor]);
      h+=`<div class="td-vs">${has.map(vb).join('')}${showRest?rest.map(vb).join(''):''}
          ${rest.length?`<button type="button" class="more" id="tdVMore">${showRest?'▲ 閉じる':`ほかの業者（${rest.length}）▾`}</button>`:''}
          <button type="button" class="reg" id="tdVReg">＋ 業者を登録</button></div>`;
      if(!TODO.vendors.length) h+=`<div class="card" style="color:var(--sub);text-align:center">業者の一覧を読み込んでいます…（出ないときは電波のよい所で開き直してください）</div>`;
      if(TODO.vendor){
        h+=`<div class="td-vh">🏢 ${esc(TODO.vendor)} に発注するもの <small>${vc[TODO.vendor]||0}件</small></div>
          <button type="button" class="td-add vd" id="tdAdd" ${TODO_URL?'':'disabled'}>＋ ${esc(TODO.vendor)} に発注するものを書く</button>`;
      } else if(TODO.vendors.length) h+=`<div class="td-msg">上の業者を押すと、その業者に発注するものが出ます。</div>`;
    } else {
      const base=(()=>{ const c=TODO.cat; TODO.cat=''; const r=list(); TODO.cat=c; return r; })();   // 分類で絞る前（件数用）
      h+=`<div class="td-cats">${TODO_CATS.filter(c=>c!==TODO_ME||ST.id).map(c=>{ const k=base.filter(x=>x.cat===c).length;
        return `<button type="button" data-c="${c}" class="${c===TODO_ME?'me ':''}${TODO.cat===c?'on':''}">${todoCatL(c)}${k?`<small>${k}</small>`:''}</button>`; }).join('')}</div>
      ${TODO.tab==='完了'?'':TODO.tab===TODO_OTAB?`<div class="td-msg">状況が「発注済」のもの（業者ごと・発注の古い順）。届いたら右の「済」を押してください。</div>`:`<button type="button" class="td-add" id="tdAdd" ${TODO_URL?'':'disabled'}>＋ やることを書く</button>`}`;
    }
    if(!TODO_URL) h+=`<div class="tl-warn" style="margin-bottom:10px">記録先（Apps Script）の設定がまだ済んでいません。設定が済むと、書き込み・共有ができるようになります。</div>`;
    if(msg) h+=`<div class="td-msg ${warn?'w':''}">${esc(msg)}</div>`;
    const xs=list();
    if(!(vOn && !TODO.vendor))
    h+= xs.length ? xs.map(item).join('')
      : `<div class="card" style="color:var(--sub);text-align:center">${TODO.tab==='完了'?'終わったものはまだありません。':TODO.tab===TODO_OTAB?'発注済のものはありません。':vOn?'この業者に発注するものはありません。':'ここに入っているものはありません。'}</div>`;
    if(TODO.cat===TODO_ME && !vOn) h+=`<p class="tl-note">👤 自分 … あなた（${esc(ST.name||'')}）にだけ表示されます。ほかの人には見えません。予定日を入れると、ホームの本日の予定の下にも出ます。</p>`;
    const q=todoQ().length;
    h+=`<p class="tl-note">すぐやるものほど上に出ます（時期：今すぐ→今月中→造り前…、同じ時期は 止まっている→未着手→進行中、さらに古いもの）。左の色：<b style="color:#c9a800">黄</b>＝30日以上、<b style="color:#e07a10">橙</b>＝60日以上、<b style="color:#d62b22">赤</b>＝90日以上。
      右端の「済」を押すと「✓ 済み」に移ります（済みも分類で絞り込めます）。ボックスを押すと、状況やメモを変えられます。${q?`<br><b>送信待ち ${q}件</b>（電波が入ると自動で送られます）`:''}
      ${TODO.sheet?`<br><a href="${esc(TODO.sheet)}" target="_blank" rel="noopener">スプレッドシートで見る</a>`:''}</p>`;
    app.innerHTML=h;
    app.querySelectorAll('.td-tabs button').forEach(b=>b.onclick=()=>{ TODO.tab=b.dataset.t; lsSet('todo.tab',TODO.tab); draw(); });
    app.querySelectorAll('.td-cats button').forEach(b=>b.onclick=()=>{ TODO.cat=TODO.cat===b.dataset.c?'':b.dataset.c; draw(); });
    app.querySelectorAll('.td-vs button[data-v]').forEach(b=>b.onclick=()=>{ TODO.vendor=TODO.vendor===b.dataset.v?'':b.dataset.v; lsSet('todo.vendor',TODO.vendor); draw(); });
    const vm=$('#tdVMore'); if(vm) vm.onclick=()=>{ TODO.vAll=!TODO.vAll; if(!TODO.vAll && TODO.vendor && !todoVCount()[TODO.vendor]){ TODO.vendor=''; lsSet('todo.vendor',''); } draw(); };
    const vr=$('#tdVReg'); if(vr) vr.onclick=()=>todoVendorForm(draw);
    const a=$('#tdAdd'); if(a) a.onclick=()=>todoEdit(null, draw);
    app.querySelectorAll('.td-it').forEach(b=>b.onclick=e=>{ const x=TODO.items.find(x=>x.id===b.dataset.id); if(!x) return;
      const stb=e.target.closest('.td-stb');
      if(stb){ e.stopPropagation(); todoStatPick(stb, x, draw); return; }
      const rgb=e.target.closest('.td-rgb');
      if(rgb){ e.stopPropagation(); todoStatPick(rgb, x, draw, 'ringi'); return; }
      const ok=e.target.closest('.td-ok');
      if(ok){ e.stopPropagation(); const done=ok.dataset.ok==='1'; todoSetDone(x, done); TODO.undo={id:x.id, text:x.text, done};
        clearTimeout(TODO.undoT); TODO.undoT=setTimeout(()=>{ TODO.undo=null; if(TODO_REDRAW===draw && nav[nav.length-1]===todoScreen) draw(); }, 8000);
        draw(); todoFlush().then(()=>{ if(TODO_REDRAW===draw) draw(); }); return; }
      todoEdit(x, draw); });
    const ud=$('#tdUndo'); if(ud) ud.onclick=()=>{ const u=TODO.undo, x=u&&TODO.items.find(x=>x.id===u.id); TODO.undo=null; clearTimeout(TODO.undoT);
      if(x) todoSetDone(x, !u.done); draw(); todoFlush().then(()=>{ if(TODO_REDRAW===draw) draw(); }); };
  }
  draw();
  if(TODO_URL){ msg=TODO.items.length?'':'読み込み中…'; draw();
    todoFetch().then(ok=>{ if(TODO_REDRAW!==draw || nav[nav.length-1]!==todoScreen) return; msg=ok?'':(TODO.items.length?'電波が弱いため、端末に残っている分を出しています':'読み込めませんでした。電波のよい所でもう一度開いてください'); warn=!ok; draw(); }); }
}

/* ---------- 状況を一覧から変える（小さなボタン → リスト） 2026-10-06 ---------- */
function todoStatPick(btn, x, redraw, kind){
  const rk=kind==='ringi';
  document.querySelectorAll('.td-pop').forEach(p=>p.remove());
  const cur=rk?todoRingiOf(x):(x.status||'未着手'), pop=document.createElement('div'); pop.className='td-pop';
  pop.innerHTML=(rk?'<div style="font-size:12px;color:var(--sub);padding:4px 12px 2px">稟議</div>':'')+(rk?TODO_RINGIS:TODO_STATS).map(v=>`<button type="button" data-v="${v}" class="${v===cur?'on':''}">${v===cur?'✓ ':''}${v}</button>`).join('');
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(), ph=pop.offsetHeight, pw=pop.offsetWidth;
  let top=r.bottom+4; if(top+ph>window.innerHeight-8) top=Math.max(8, r.top-ph-4);
  pop.style.top=top+'px'; pop.style.left=Math.min(Math.max(8, r.left), window.innerWidth-pw-8)+'px';
  const off=e=>{ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('pointerdown', off, true); } };
  setTimeout(()=>document.addEventListener('pointerdown', off, true), 0);
  pop.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); pop.remove(); document.removeEventListener('pointerdown', off, true);
    const v=b.dataset.v; if(v===cur) return;
    if(rk){ todoPush({action:'update', id:x.id, fields:{ memo:todoMemoWith(todoMemoBody(x.memo), v) }}); }
    else if(v==='完了') todoSetDone(x, true);
    else { const fields={status:v}; if(cur==='完了'){ fields.doneBy=''; fields.doneAt=''; } todoPush({action:'update', id:x.id, fields}); }
    redraw(); todoFlush().then(()=>{ if(TODO_REDRAW===redraw) redraw(); }); });
}
/* ---------- 書く・直す（下から出る） ---------- */
function todoEdit(x, redraw){
  const isNew=!x;
  const vNew=TODO.tab===TODO_VTAB && TODO.vendor;
  const f={ text:x?x.text:'', cat:x?x.cat:'', when:x?x.when:(TODO_WHENS.includes(TODO.tab)?TODO.tab:''), status:x?(x.status||'未着手'):'未着手', memo:x?todoMemoBody(x.memo):'', ringi:x?todoRingiOf(x):'なし',
            vendor:x?((todoVendorOf(x)||{}).name||''):(vNew?TODO.vendor:''), due:x?(x.due||''):'' };
  const canMe = !!ST.id && (isNew || String(x.byId||'')===String(ST.id));   // 「自分」にできるのは登録した本人だけ
  if(isNew && TODO.cat && !vNew) f.cat=TODO.cat;
  if(isNew && vNew) f.cat='購入・備品';
  const vlist=todoVNames(); if(f.vendor && !vlist.includes(f.vendor)) vlist.unshift(f.vendor);
  const vSel=`<select id="tdVendor"><option value="">（なし）</option>${vlist.map(n=>`<option value="${esc(n)}" ${f.vendor===n?'selected':''}>${esc(n)}</option>`).join('')}<option value="__new">＋ 新しい業者を登録…</option></select>
    <input type="text" id="tdVNew" placeholder="新しい業者の名前" style="display:none" maxlength="40">`;
  const m=document.createElement('div'); m.className='o2-mask';
  const chips=(k,arr,cls)=>`<div class="ch ${cls||''}" data-k="${k}">${arr.map(v=>`<button type="button" data-v="${v}" class="${v===TODO_ME?'me ':''}${f[k]===v?'on':''}">${todoCatL(v)}</button>`).join('')}</div>`;
  m.innerHTML=`<div class="o2-sheet" style="max-height:90vh"><div class="t">${isNew?'やることを書く':'やることを直す'}<button type="button" class="x">閉じる</button></div>
    <div class="td-f">
      <label>やること（必須）</label><textarea id="tdText" rows="2" placeholder="例：蒸米機のコンベア修理">${esc(f.text)}</textarea>
      <label>分類</label>${chips('cat',TODO_CATS.filter(c=>c!==TODO_ME||canMe||f.cat===TODO_ME))}
      <div id="tdDueW" style="display:${f.cat===TODO_ME?'block':'none'}"><label>予定日（入れるとホームの本日の予定に自分だけ表示）</label>
        <input type="date" id="tdDue" value="${esc(f.due)}"><div class="inf" style="margin-top:4px">👤 自分 … 自分にだけ表示され、ほかの人には見えません。</div></div>
      <label>発注先（業者）</label>${vSel}
      <label>時期</label>${chips('when',TODO_WHENS)}
      ${isNew?'':`<label>状況</label>${chips('status',TODO_STATS,'stc')}`}
      <label>稟議（要るときは、あげたかどうかを選ぶ）</label>${chips('ringi',TODO_RINGIS,'rgc')}
      <label>メモ（見積額・サイズ・枚数など）</label><textarea id="tdMemo" rows="3">${esc(f.memo)}</textarea>
      ${isNew?`<div class="inf">登録者は「${esc(ST.name||'（名前未設定）')}」で入ります。</div>`
        :`<div class="inf">登録：${esc(x.by||'')}　${esc(String(x.at||'').slice(0,10))}${x.upd?`<br>最後に直した人：${esc(x.updBy||'')}　${esc(String(x.upd).slice(0,16))}`:''}${x.doneAt?`<br>完了：${esc(x.doneBy||'')}　${esc(String(x.doneAt).slice(0,10))}`:''}</div>`}
      <div class="bt">${isNew?'':'<button type="button" class="del">消す</button>'}<button type="button" class="ok">${isNew?'登録する':'保存する'}</button></div>
    </div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) close(); };
  m.querySelector('.x').onclick=close;
  m.querySelectorAll('.ch').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=g.dataset.k; f[k]=(f[k]===b.dataset.v && k!=='status' && k!=='ringi')?'':b.dataset.v;
    g.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o.dataset.v===f[k]));
    if(k==='cat') m.querySelector('#tdDueW').style.display=f.cat===TODO_ME?'block':'none'; }));
  const ok=m.querySelector('.ok'), tx=m.querySelector('#tdText');
  const chk=()=>{ ok.disabled=!tx.value.trim(); }; tx.oninput=chk; chk();
  if(isNew) setTimeout(()=>tx.focus(),50);
  const vs=m.querySelector('#tdVendor'), vn=m.querySelector('#tdVNew');
  vs.onchange=()=>{ vn.style.display=vs.value==='__new'?'block':'none'; if(vs.value==='__new') vn.focus(); };
  ok.onclick=()=>{
    f.text=tx.value.trim(); f.memo=todoMemoWith(todoMemoBody(m.querySelector('#tdMemo').value.trim()), f.ringi); if(!f.text) return;
    f.due = f.cat===TODO_ME ? (m.querySelector('#tdDue').value||'') : '';
    f.vendor = vs.value==='__new' ? todoVendorAdd(vn.value) : todoVendorAdd(vs.value);   // 一覧にない業者はここで登録
    const me=todoMe();
    if(isNew){
      todoPush({action:'add', item:{ id:todoCid(), text:f.text, cat:f.cat, when:f.when, status:'未着手', memo:f.memo, vendor:f.vendor, due:f.due, byId:me.id, by:me.name, at:todoNow() }});
    } else {
      const fields={ text:f.text, cat:f.cat, when:f.when, status:f.status, memo:f.memo, vendor:f.vendor, due:f.due };
      if(f.status==='完了' && x.status!=='完了'){ fields.doneBy=me.name; fields.doneAt=todoNow(); }
      if(f.status!=='完了' && x.status==='完了'){ fields.doneBy=''; fields.doneAt=''; }
      todoPush({action:'update', id:x.id, fields});
    }
    close(); redraw();
    todoFlush().then(()=>{ if(TODO_REDRAW===redraw) redraw(); });
  };
  const del=m.querySelector('.del');
  if(del) del.onclick=()=>{
    if(del.dataset.s!=='1'){ del.dataset.s='1'; del.textContent='本当に消す'; return; }   // 2回押しで消す（確認の窓は出さない）
    todoPush({action:'delete', id:x.id}); close(); redraw();
    todoFlush().then(()=>{ if(TODO_REDRAW===redraw) redraw(); });
  };
}
/* ---------- 済（完了）にする・戻す ---------- */
function todoSetDone(x, done){
  const me=todoMe();
  const fields = done ? { status:'完了', doneBy:me.name, doneAt:todoNow() } : { status:'未着手', doneBy:'', doneAt:'' };
  todoPush({action:'update', id:x.id, fields});
}

/* ---------- ホーム「本日の予定」の下：👤 自分のやること（本人にだけ） ---------- */
function dpMeHTML(){
  if(!ST.id) return '';
  const date=(typeof dpDate==='function')?dpDate():dtoday(), td=dtoday(), isToday=date===td;
  const xs=todoMine().filter(x=> x.due ? (isToday ? x.due<=td : x.due===date) : (isToday && x.when==='今すぐ'));
  if(!xs.length) return '';
  xs.sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9'))||todoRank(a)-todoRank(b));

  if(!MANX_URL) throw new Error('記録先の設定がまだ済んでいません');
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||30000) : null;
  try{
    body.who = body.who || mxWho();
    const r=await fetch(MANX_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    const j=await r.json(); if(!j || !j.ok) throw new Error((j&&j.error)||'保存できませんでした'); return j;
  }catch(e){ if(e && e.name==='AbortError') throw new Error('時間がかかりすぎました。電波のよい所でもう一度'); throw e; }
  finally { if(t) clearTimeout(t); }

function manxView(id){
  const tag='view:'+id, d0=MX.docs[id], m0=(d0&&d0.meta)||(MX.list||[]).find(x=>x.id===id)||{title:''};
  head(m0.title||'マニュアル', m0.genre||'');
  let msg=MX.flash, warn=false, busy=false, showDraft=false; MX.flash='';
  const draw=()=>{
    if(!mxTop(tag)) return;

    const hasPub=!!(m.pubVer&&d.pub), hasDraft=!!(m.draftVer&&d.draft);
    const seeDraft=(showDraft&&hasDraft)||(!hasPub&&hasDraft);
    const doc=seeDraft?d.draft:d.pub;
    let h='';
    if(msg) h+=`<div class="mx-msg ${warn?'w':'g'}">${esc(msg)}</div>`;
    if(hasDraft){
      const pend=m.draftKind==='承認待ち';
      h+=`<div class="mx-ban ${pend?'p':'d'}">${pend?`<b>承認待ちの版があります</b>（${esc(m.draftBy||'')}・第${m.draftVer}版）`:`<b>下書き</b>${hasPub?'の版があります':'です（まだ全員には出ていません）'}（${esc(m.draftBy||'')}・第${m.draftVer}版）`}
        <div class="bt">${hasPub?`<button class="mx-gh" id="mxSw">${seeDraft?'公開中の版を見る':'その版を見る'}</button>`:''}
        ${MX.admin?`<button class="mx-ok" id="mxAp">${pend?'承認する':'公開する'}</button><button class="mx-ng" id="mxRj">${pend?'差し戻す':'下書きを捨てる'}</button>`:''}</div></div>`;
    }
    if(seeDraft&&hasPub) h+=`<div class="mx-meta" style="color:#9a5a12;font-weight:700">いま見ているのは${esc(m.draftKind)}の版です。</div>`;
    if(mxDue(m)) h+=`<div class="mx-ban r"><b>見直しの時期です</b>（${esc(m.review)}まで）。今のやり方と合っているか確かめてください。直すところがなくても「直す」→「公開する」を押すと、見直し日が延びます。</div>`;
    h+= doc&&doc.cards&&doc.cards.length ? mxCardsHTML(doc.cards) : `<div class="card" style="color:var(--sub);text-align:center">中身がまだありません。「直す」から書けます。</div>`;
    h+=`<div class="mx-meta">第${seeDraft?m.draftVer:m.pubVer}版　最終更新 ${esc(m.upd||'')}（${esc(m.updBy||'')}）${m.review&&m.pubVer?'<br>次の見直し日 '+esc(m.review):''}</div>

    app.innerHTML=h; mxBindPhotos();

    on('#mxHi',()=>mxGo('his:'+id,()=>manxHistory(id)));
    on('#mxPr',()=>window.print());
    on('#mxSrc',()=>mxOpenSrc(m.src));
    const act=async(action,label)=>{ if(busy) return;
      const note=action==='reject'?(prompt(label==='差し戻'?'差し戻す理由（なくても可）':'捨てる理由（なくても可）')??null):'';
      if(note===null) return;
      busy=true; msg=label+'しています…'; warn=false; draw();
      try{ mxKeepDoc(await mxApi({action,id,note},40000)); msg=label+'しました'; showDraft=false; }
      catch(e){ msg=String(e.message||e); warn=true; } busy=false; draw(); };
    on('#mxAp',()=>act('approve', m.draftKind==='承認待ち'?'承認':'公開'));
    on('#mxRj',()=>act('reject', m.draftKind==='承認待ち'?'差し戻':'下書きを捨て'));
    const del=$('#mxDel'); if(del) del.onclick=async()=>{ if(del.dataset.s!=='1'){ del.dataset.s='1'; del.textContent='本当に消す（もう一度押す）'; return; }
      try{ mxKeepList(await mxApi({action:'delete',id},30000)); delete MX.docs[id]; mxSaveLocal(); nav.pop(); const f=nav[nav.length-1]; if(f) f(); }catch(e){ msg=String(e.message||e); warn=true; draw(); } };
  };
  draw();

async function mxOpenSrc(src){
  if(!MAN_LIST || !MAN_LIST.files) await manFetchList();
  const files=(MAN_LIST&&MAN_LIST.files)||[], s=String(src||'').replace(/\\/g,'/');
  const name=s.split('/').pop();
  const f=files.find(x=>String(x.rel||'').replace(/\\/g,'/')===s) || files.find(x=>name===(x.title+'.'+x.ext)) || files.find(x=>name.startsWith(x.title));
  if(!f){ alert('元のファイルが見つかりませんでした。「元のファイル（Word・Excel）を見る」の一覧から探してください。'); return; }
  const g=manGroups(files).flatMap(x=>x.items).find(x=>x.vers.some(v=>v.id===f.id));

}

/* ---------- 書く・直す ---------- */
function mxClone(o){ return JSON.parse(JSON.stringify(o||{})); }
function manxEdit(id){
  const d=id?MX.docs[id]:null;
  if(id && !d){ nav.pop(); return; }
  const m=d?d.meta:null;
  /* 直すもとは：下書き/承認待ちがあればそれ、無ければ公開中の版 */
  const base = d ? mxClone((m.draftVer&&d.draft)?d.draft:(d.pub||d.draft||{})) : { title:'', genre:'', haccp:false, cards:[{t:'step',body:'',point:'',caution:'',photos:[]}] };
  const doc={ title:base.title||(m&&m.title)||'', genre:base.genre||(m&&m.genre)||MAN_GENRES[0], haccp:!!(base.haccp||(m&&m.haccp)), cards:(base.cards||[]).map(c=>Object.assign({t:'step'},c,{photos:(c.photos||[]).slice()})) };
  const wasHaccp=!!(m&&m.haccp);
  head(id?'マニュアルを直す':'新しいマニュアル', doc.title||'');
  let note='', msg='', warn=false, busy=false, uploading=0;
  const genres=MAN_GENRES.slice(); if(doc.genre && !genres.includes(doc.genre)) genres.push(doc.genre);
  const cardHTML=(c,i)=>{
    const hd=`<div class="mx-eh"><span>${c.t==='step'?'手順カード':c.t==='text'?'文章カード':'表カード'}</span>
      <button data-a="up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button data-a="dn" data-i="${i}" ${i===doc.cards.length-1?'disabled':''}>↓</button><button class="del" data-a="del" data-i="${i}">消す</button></div>`;
    const n=(c.photos||[]).length+(c._up||0);
    const ph=(c.t==='table')?'':`<label>写真（${MANX_PHOTO_MAX}枚まで。OK例／NG例 の印を付けられます）</label><div class="mx-eph">${(c.photos||[]).map((p,k)=>`<div class="p"><img src="${mxImg(p.id,300)}" alt="">
        <div class="lb"><button class="OK ${p.ok==='OK'?'on':''}" data-a="ok" data-i="${i}" data-k="${k}">OK例</button><button class="NG ${p.ok==='NG'?'on':''}" data-a="ng" data-i="${i}" data-k="${k}">NG例</button><button class="x" data-a="px" data-i="${i}" data-k="${k}">✕</button></div>
        <input type="text" placeholder="ひとこと" data-f="cap" data-i="${i}" data-k="${k}" value="${esc(p.cap||'')}"></div>`).join('')}
        ${Array.from({length:c._up||0}).map(()=>'<div class="up">送っています…</div>').join('')}
        ${n<MANX_PHOTO_MAX?`<label class="add"><b>＋</b>写真<input type="file" accept="image/*" data-file="${i}" style="display:none" multiple></label>`:''}</div>`;
    if(c.t==='text') return `<div class="mx-ec text">${hd}<label>見出し</label><input type="text" data-f="title" data-i="${i}" value="${esc(c.title||'')}"><label>本文</label><textarea rows="4" data-f="body" data-i="${i}">${esc(c.body||'')}</textarea>${ph}</div>`;
    if(c.t==='table'){
      const rows=(c.rows&&c.rows.length)?c.rows:(c.rows=[['','']]);
      return `<div class="mx-ec table">${hd}<label>表の名前</label><input type="text" data-f="title" data-i="${i}" value="${esc(c.title||'')}">
        <div class="mx-etb"><table>${rows.map((r,ri)=>`<tr>${r.map((x,ci)=>`<td><input type="text" data-f="cell" data-i="${i}" data-r="${ri}" data-c="${ci}" value="${esc(x||'')}"></td>`).join('')}</tr>`).join('')}</table>
        <div class="ops"><button data-a="r+" data-i="${i}">＋行</button><button data-a="r-" data-i="${i}">−行</button><button data-a="c+" data-i="${i}">＋列</button><button data-a="c-" data-i="${i}">−列</button></div></div>
        <label>表の下の説明（なくても可）</label><input type="text" data-f="body" data-i="${i}" value="${esc(c.body||'')}"></div>`;
    }
    return `<div class="mx-ec">${hd}<label>作業内容（必須）</label><textarea rows="2" data-f="body" data-i="${i}">${esc(c.body||'')}</textarea>
      <label>ポイント（コツ・目安の数値など）</label><textarea rows="2" data-f="point" data-i="${i}">${esc(c.point||'')}</textarea>
      <label style="color:#b31b14">注意（赤い枠で出ます）</label><textarea rows="1" data-f="caution" data-i="${i}">${esc(c.caution||'')}</textarea>${ph}</div>`;
  };
  const needAp=()=>(doc.haccp||wasHaccp)&&!MX.admin;
  const draw=()=>{
    const y=window.scrollY;
    let h=`<div class="mx-ed"><label>題名（必須）</label><input type="text" id="mxT" value="${esc(doc.title)}">
      <label>ジャンル</label><select id="mxG">${genres.map(g=>`<option ${g===doc.genre?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <label class="mx-chk"><input type="checkbox" id="mxH" ${doc.haccp?'checked':''} ${wasHaccp&&!MX.admin?'disabled':''}><span>HACCP（衛生管理の記録・手順）に関わる<br><small style="color:var(--sub)">印があると、直したものは管理者の承認後に公開されます</small></span></label>
      <div style="height:8px"></div>`;
    doc.cards.forEach((c,i)=>{ h+=(i?`<button class="mx-ins" data-a="ins" data-i="${i}">＋ ここにカードを入れる</button>`:'')+cardHTML(c,i); });
    h+=`<div class="mx-addc"><button data-a="add" data-t="step">＋ 手順</button><button data-a="add" data-t="text">＋ 文章</button><button data-a="add" data-t="table">＋ 表</button></div>
      <div class="mx-save"><input type="text" id="mxN" placeholder="どこを直したか（例：手順3の温度を変更）" value="${esc(note)}">
      ${msg?`<div class="mx-msg ${warn?'w':''}">${esc(msg)}</div>`:''}
      <div class="bt"><button class="drf" id="mxSD" ${busy||uploading?'disabled':''}>下書き保存</button><button class="pub" id="mxSP" ${busy||uploading?'disabled':''}>${uploading?'写真を送っています…':needAp()?'承認を申請する':'公開する'}</button></div></div></div>`;
    app.innerHTML=h; window.scrollTo(0,y); bind();
  };
  const ins=(i,t)=>{ const c=t==='table'?{t:'table',title:'',rows:[['',''],['','']],body:''}:t==='text'?{t:'text',title:'',body:'',photos:[]}:{t:'step',body:'',point:'',caution:'',photos:[]}; doc.cards.splice(i,0,c); };
  const bind=()=>{
    $('#mxT').oninput=e=>{ doc.title=e.target.value; };
    $('#mxG').onchange=e=>{ doc.genre=e.target.value; };
    $('#mxH').onchange=e=>{ doc.haccp=e.target.checked; draw(); };
    $('#mxN').oninput=e=>{ note=e.target.value; };
    app.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{ const c=doc.cards[+el.dataset.i]; const f=el.dataset.f;
      if(f==='cap') c.photos[+el.dataset.k].cap=el.value;
      else if(f==='cell') c.rows[+el.dataset.r][+el.dataset.c]=el.value;
      else c[f]=el.value; });
    app.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a, i=+b.dataset.i, c=doc.cards[i];
      if(a==='add') ins(doc.cards.length,b.dataset.t);
      else if(a==='ins'){ const t=prompt('入れるカードの番号：1＝手順　2＝文章　3＝表','1'); if(!t) return; ins(i,t.trim()==='3'?'table':t.trim()==='2'?'text':'step'); }
      else if(a==='up'&&i>0){ [doc.cards[i-1],doc.cards[i]]=[doc.cards[i],doc.cards[i-1]]; }
      else if(a==='dn'&&i<doc.cards.length-1){ [doc.cards[i+1],doc.cards[i]]=[doc.cards[i],doc.cards[i+1]]; }
      else if(a==='del'){ if(b.dataset.s!=='1'){ b.dataset.s='1'; b.textContent='本当に消す'; return; } doc.cards.splice(i,1); }
      else if(a==='ok'||a==='ng'){ const p=c.photos[+b.dataset.k], v=a==='ok'?'OK':'NG'; p.ok=p.ok===v?'':v; }
      else if(a==='px'){ c.photos.splice(+b.dataset.k,1); }
      else if(a==='r+'){ c.rows.push(c.rows[0].map(()=>'')); }
      else if(a==='r-'){ if(c.rows.length>1) c.rows.pop(); }
      else if(a==='c+'){ c.rows.forEach(r=>r.push('')); }
      else if(a==='c-'){ if(c.rows[0].length>1) c.rows.forEach(r=>r.pop()); }
      else return;
      draw();
    });
    app.querySelectorAll('input[type=file][data-file]').forEach(f=>f.onchange=()=>{
      const c=doc.cards[+f.dataset.file]; c.photos=c.photos||[];
      const files=[...f.files].slice(0, Math.max(0, MANX_PHOTO_MAX-c.photos.length-(c._up||0)));
      files.forEach(file=>{ c._up=(c._up||0)+1; uploading++;
        mxUploadPhoto(file).then(pid=>{ c.photos.push({id:pid,ok:'',cap:''}); }).catch(e=>{ msg='写真を送れませんでした：'+String(e.message||e); warn=true; })
          .finally(()=>{ c._up--; uploading--; if(mxTop(tagE)) draw(); });
      });
      draw();
    });
    const save=async mode=>{
      if(!doc.title.trim()){ msg='題名を入れてください'; warn=true; draw(); return; }
      const cards=doc.cards.map(c=>{ const o=mxClone(c); delete o._up; return o; })
        .filter(c=>c.t==='table'?(c.rows||[]).some(r=>r.some(x=>String(x).trim())):(String(c.body||'').trim()||String(c.title||'').trim()||(c.photos||[]).length));
      busy=true; msg='保存しています…'; warn=false; draw();
      try{
        const j=await mxApi({action:'save', id:id||undefined, doc:{title:doc.title.trim(),genre:doc.genre,haccp:doc.haccp,cards}, mode, note},60000);
        mxKeepDoc(j); const k=j.meta.draftKind;
        MX.flash = mode==='draft'?'下書きに保存しました（まだ全員には出ていません）':k==='承認待ち'?'承認を申請しました（管理者の承認後に全員に出ます）':'公開しました';
        busy=false;
        const nid=j.meta.id; nav.pop(); const f=nav[nav.length-1];
        if(f && f.mxTag==='view:'+nid) f(); else mxGo('view:'+nid,()=>manxView(nid));
      }catch(e){ busy=false; msg=String(e.message||e); warn=true; draw(); }
    };
    $('#mxSD').onclick=()=>save('draft');
    $('#mxSP').onclick=()=>save('publish');
  };
  const tagE=id?'edit:'+id:'edit:new';
  draw();
}
/* 写真：端末の中で長い辺1600pxに縮めてから送る */
function mxResize(file, max){
  return new Promise((ok,ng)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ try{ let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,(max||1600)/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg',0.82)); }catch(e){ ng(e); } };
    im.onerror=()=>{ URL.revokeObjectURL(url); ng(new Error('この写真は読めませんでした')); };
    im.src=url;
  });
}
async function mxUploadPhoto(file){
  const data=await mxResize(file,1600);
  const j=await mxApi({action:'upload', name:'man_'+Date.now()+'.jpg', mime:'image/jpeg', data},90000);
  return j.id;
}

const CT = { items:lsGet('ct.items',[]), at:lsGet('ct.at',0), sheet:'', q:'', kind:'', proc:'', err:'', flash:'', mode:lsGet('ct.mode','item') };
async function ctApi(body, ms){
  if(!SHARED_URL) throw new Error('記録先の設定がまだ済んでいません');
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||25000) : null;
  try{
    body.table='連絡先'; body.who={ id:String(ST.id||''), name:String(ST.name||'') };
    const r=await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    const j=await r.json(); if(!j||!j.ok) throw new Error((j&&j.error)||'保存できませんでした'); return j;
  }catch(e){ if(e&&e.name==='AbortError') throw new Error('時間がかかりすぎました。電波のよい所でもう一度'); throw e; }
  finally{ if(t) clearTimeout(t); }
}
function ctKeep(j){ CT.items=j.items||[]; CT.at=Date.now(); CT.sheet=j.sheetUrl||''; lsSet('ct.items',CT.items); lsSet('ct.at',CT.at); }
async function ctFetch(){ try{ ctKeep(await ctApi({action:'list'},20000)); CT.err=''; return true; }catch(e){ CT.err=String(e.message||e); return false; } }
const ctProcs = x=>String(x.proc||'').split(/[、,]/).map(s=>s.trim()).filter(Boolean);
const ctNorm = s=>String(s||'').replace(/[\s　\-－‐ー()（）]/g,'').toLowerCase();
const ctTelHref = t=>{ const d=String(t||'').replace(/[^\d+]/g,''); return d?('tel:'+d):''; };

/* ---------- 一覧 ---------- */
function ctScreen(){
  head('連絡先','資材・設備・部品の発注先と電話番号');
  const draw=()=>{
    if(nav[nav.length-1]!==ctScreen) return;
    let h=`<div class="ct-mode"><button data-m="item" class="${CT.mode==='item'?'on':''}">📦 品目ごと</button><button data-m="co" class="${CT.mode==='co'?'on':''}">🏢 企業ごと</button></div>
      <div class="ct-top"><input id="ctQ" type="search" placeholder="${CT.mode==='co'?'会社名・品目・電話で探す':'名前・発注先・電話・品番で探す'}" value="${esc(CT.q)}"><button class="ct-new" id="ctNew" ${SHARED_URL?'':'disabled'}>＋ 登録</button></div>
      <div class="ct-chips">${['',...CT_KINDS].map(k=>`<button data-k="${k}" class="${CT.kind===k?'on':''}">${k||'すべて'}</button>`).join('')}</div>
      <div class="ct-chips p">${CT_STEPS.map(p=>`<button data-p="${p}" class="${CT.proc===p?'on':''}">${p}</button>`).join('')}</div>
      <div class="ct-chips p">${CT_PLACES.map(p=>`<button data-p="${p}" class="${CT.proc===p?'on':''}">📍${p}</button>`).join('')}</div>`;
    if(!SHARED_URL) h+=`<div class="tl-warn" style="margin-top:8px">記録先（Apps Script）の設定がまだ済んでいません。設定が済むと、登録・共有ができるようになります。</div>`;
    if(CT.flash){ h+=`<div class="ct-msg g">${esc(CT.flash)}</div>`; CT.flash=''; }
    const q=ctNorm(CT.q);
    let xs=CT.items.filter(x=>(!CT.kind||x.kind===CT.kind)&&(!CT.proc||ctProcs(x).includes(CT.proc)));
    if(q) xs=xs.filter(x=>ctNorm([x.name,x.kind,x.proc,x.vendor,x.person,x.tel,x.fax,x.mail,x.model,x.memo].join(' ')).includes(q));
    xs.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja',{numeric:true}));
    if(CT.mode==='co'){
      const cos=ctCompanies(xs);
      h+= cos.length ? cos.map(c=>{ const th=ctTelHref(c.tel);
        return `<div class="ct-it co"><div class="m" data-co="${esc(c.vendor)}"><div class="n">🏢 ${esc(c.vendor||'発注先 未登録')}</div>
          <div class="s"><span class="k">${c.items.length}品目</span>${c.kinds.map(k=>`<span>${esc(k)}</span>`).join('')}</div>
          <div class="v">${c.person?esc(c.person)+'　':''}${c.tel?esc(c.tel):'電話番号 未登録'}${c.fax?'　FAX '+esc(c.fax):''}</div>
          <div class="v" style="font-size:12px">${esc(c.items.slice(0,4).map(x=>x.name).join('、'))}${c.items.length>4?' ほか':''}</div></div>
          <a class="ct-tel ${th?'':'no'}" href="${th||'#'}">📞<small>${th?'電話':'番号なし'}</small></a></div>`; }).join('')
        : `<div class="card" style="text-align:center;color:var(--sub);margin-top:8px">当てはまる企業がありません。</div>`;
    } else
    h+= xs.length ? xs.map(ctItemHTML).join('')
      : `<div class="card" style="text-align:center;color:var(--sub);margin-top:8px">${CT.items.length?'当てはまるものがありません。':'まだ登録がありません。「＋ 登録」から入れてください。'}</div>`;
    h+=`<p class="tl-note">だれでも登録・修正できます。名前を押すと中身を見たり直したりできます。逆引き検索の検索にも出ます。${CT.err&&CT.items.length?'<br><b style="color:#b02a26">'+esc(CT.err)+'（前回の内容を表示しています）</b>':''}${CT.sheet?`<br><a href="${esc(CT.sheet)}" target="_blank" rel="noopener">スプレッドシートで見る</a>`:''}</p>`;
    app.innerHTML=h;
    const inp=$('#ctQ'); inp.oninput=()=>{ CT.q=inp.value; const pos=inp.selectionStart; draw(); const n=$('#ctQ'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} };
    $('#ctNew').onclick=()=>{ const f=()=>ctEdit(null); f.ctTag='edit'; go(f); };
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ CT.kind=b.dataset.k; draw(); });
    app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ CT.proc=CT.proc===b.dataset.p?'':b.dataset.p; draw(); });
    app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ CT.mode=b.dataset.m; lsSet('ct.mode',CT.mode); draw(); });
    app.querySelectorAll('.ct-it .m[data-id]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; const f=()=>ctEdit(id); f.ctTag='edit'; go(f); });
    app.querySelectorAll('.ct-it .m[data-co]').forEach(b=>b.onclick=()=>{ const v=b.dataset.co; const f=()=>ctCompany(v); f.ctTag='co'; go(f); });
  };
  draw();
  if(SHARED_URL) ctFetch().then(draw);
}
function ctItemHTML(x){ const th=ctTelHref(x.tel);
  return `<div class="ct-it"><div class="m" data-id="${esc(x.id)}"><div class="n">${esc(x.name)}</div>
    <div class="s">${x.kind?`<span class="k">${esc(x.kind)}</span>`:''}${ctProcs(x).map(p=>`<span>${esc(p)}</span>`).join('')}${x.model?`<span>${esc(x.model)}</span>`:''}</div>
    <div class="v">${x.vendor?`<b>${esc(x.vendor)}</b>`:'発注先 未登録'}${x.person?'（'+esc(x.person)+'）':''}${x.tel?'　'+esc(x.tel):''}</div></div>
    <a class="ct-tel ${th?'':'no'}" href="${th||'#'}">📞<small>${th?'電話':'番号なし'}</small></a></div>`; }
/* 企業ごとにまとめる。電話番号などは、その会社の品目のうち一番新しく直されたものを使う */
function ctCompanies(xs){
  const m={};
  xs.forEach(x=>{ const v=String(x.vendor||'').trim(); (m[v]=m[v]||[]).push(x); });
  return Object.keys(m).map(v=>{ const items=m[v]; const by=items.slice().sort((a,b)=>String(b.upd||b.at).localeCompare(String(a.upd||a.at)));
    const pick=k=>(by.find(x=>String(x[k]||'').trim())||{})[k]||'';
    return { vendor:v, items, tel:pick('tel'), fax:pick('fax'), mail:pick('mail'), person:pick('person'), kinds:[...new Set(items.map(x=>x.kind).filter(Boolean))] }; })
    .sort((a,b)=>(a.vendor?0:1)-(b.vendor?0:1)||b.items.length-a.items.length||a.vendor.localeCompare(b.vendor,'ja'));
}
/* ---------- 1社の画面：連絡先をまとめて直す＋その会社の品目一覧 ---------- */
function ctCompany(vendor){
  const items=()=>CT.items.filter(x=>String(x.vendor||'').trim()===vendor);
  head(vendor||'発注先 未登録','この会社から買っているもの');
  const c0=ctCompanies(items())[0]||{tel:'',fax:'',mail:'',person:'',items:[]};
  const f={tel:c0.tel,fax:c0.fax,mail:c0.mail,person:c0.person}; let msg='', warn=false, busy=false, open=false;
  const draw=()=>{
    const xs=items().sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja',{numeric:true})), th=ctTelHref(f.tel);
    let h=`<div class="ct-cohd"><div class="r"><div style="flex:1;min-width:0"><b>${esc(vendor||'発注先 未登録')}</b>
        <div class="v">${f.person?'担当 '+esc(f.person)+'<br>':''}${f.tel?'TEL '+esc(f.tel):'電話番号 未登録'}${f.fax?'　FAX '+esc(f.fax):''}${f.mail?'<br>'+esc(f.mail):''}</div></div>
        <a class="ct-tel ${th?'':'no'}" href="${th||'#'}">📞<small>${th?'電話':'番号なし'}</small></a></div>
      ${vendor?`<button class="ct-coed" id="ctCoEd">${open?'閉じる':'この会社の電話番号・担当者をまとめて直す'}</button>`:''}</div>`;
    if(open) h+=`<div class="ct-f" style="margin-top:4px">
      <label>担当者</label><input type="text" data-c="person" value="${esc(f.person)}">
      <label>電話番号</label><input type="tel" data-c="tel" value="${esc(f.tel)}" placeholder="例：0254-00-0000">
      <label>FAX</label><input type="tel" data-c="fax" value="${esc(f.fax)}">
      <label>メール</label><input type="email" data-c="mail" value="${esc(f.mail)}">
      <div class="inf">保存すると、この会社の ${xs.length}品目 すべてに同じ番号が入ります。</div>
      <div class="bt"><button class="ok" id="ctCoOk" ${busy||!SHARED_URL?'disabled':''}>まとめて保存する</button></div></div>`;
    if(msg) h+=`<div class="ct-msg ${warn?'w':'g'}">${esc(msg)}</div>`;
    h+=`<div class="ct-sec">この会社の品目 ${xs.length}件</div>`+xs.map(ctItemHTML).join('');
    app.innerHTML=h;
    const e=$('#ctCoEd'); if(e) e.onclick=()=>{ open=!open; draw(); };
    app.querySelectorAll('[data-c]').forEach(el=>el.oninput=()=>{ f[el.dataset.c]=el.value; });
    app.querySelectorAll('.ct-it .m[data-id]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; const g=()=>ctEdit(id); g.ctTag='edit'; go(g); });
    const ok=$('#ctCoOk'); if(ok) ok.onclick=async()=>{
      busy=true; const list=items(); let n=0, j=null; msg='保存しています… 0 / '+list.length; warn=false; draw();
      try{ for(const x of list){ const it={}; ['name','kind','proc','vendor','person','tel','fax','mail','model','memo'].forEach(k=>it[k]=x[k]||''); Object.assign(it,{id:x.id,tel:f.tel.trim(),fax:f.fax.trim(),mail:f.mail.trim(),person:f.person.trim()}); j=await ctApi({action:'save',item:it},25000); n++; msg='保存しています… '+n+' / '+list.length; const m=app.querySelector('.ct-msg'); if(m) m.textContent=msg; }
        if(j) ctKeep(j); msg=n+'品目に保存しました'; open=false; }
      catch(err){ if(j) ctKeep(j); msg='途中で止まりました（'+n+' / '+list.length+'）：'+String(err.message||err); warn=true; }
      busy=false; draw();
    };
  };
  draw();
}

/* ---------- 登録・修正 ---------- */
function ctEdit(id){
  const x0=id?CT.items.find(x=>x.id===id):null;
  if(id && !x0){ nav.pop(); const f=nav[nav.length-1]; if(f) f(); return; }
  head(id?'連絡先を直す':'連絡先を登録', id?x0.name:'');
  const f=Object.assign({name:'',kind:'',proc:'',vendor:'',person:'',tel:'',fax:'',mail:'',model:'',memo:''}, x0||{});
  if(!id){ if(CT.kind) f.kind=CT.kind; if(CT.proc) f.proc=CT.proc; }
  let procs=ctProcs(f), msg='', warn=false, busy=false, hint='';
  const vendors=[...new Set(CT.items.map(x=>x.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const fld=(k,label,type,ph)=>`<label>${label}</label><input type="${type||'text'}" data-f="${k}" value="${esc(f[k]||'')}" placeholder="${esc(ph||'')}" ${k==='vendor'?'list="ctVendors"':''}>`;
  const draw=()=>{
    app.innerHTML=`<div class="ct-f">
      <label>名前（必須）</label><input type="text" data-f="name" value="${esc(f.name)}" placeholder="例：脱色炭、モーノポンプのOリング">
      <label>種類</label><div class="ch" data-g="kind">${CT_KINDS.map(k=>`<button data-v="${k}" class="${f.kind===k?'on':''}">${k}</button>`).join('')}</div>
      <label>工程（いくつでも選べます）</label><div class="ch" data-g="proc">${CT_STEPS.map(p=>`<button data-v="${p}" class="${procs.includes(p)?'on':''}">${p}</button>`).join('')}</div>
      <label>場所（使う場所があれば）</label><div class="ch" data-g="proc">${CT_PLACES.map(p=>`<button data-v="${p}" class="${procs.includes(p)?'on':''}">📍${p}</button>`).join('')}</div>
      ${fld('vendor','発注先','text','会社名（前に入れた会社は候補に出ます）')}<datalist id="ctVendors">${vendors.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      ${hint?`<div class="hint">${esc(hint)}</div>`:''}
      ${fld('person','担当者')}${fld('tel','電話番号','tel','例：0254-00-0000')}${fld('fax','FAX','tel')}${fld('mail','メール','email')}${fld('model','品番・型番')}
      <label>メモ（注文のしかた・納期・単位など）</label><textarea rows="3" data-f="memo">${esc(f.memo||'')}</textarea>
      ${msg?`<div class="ct-msg ${warn?'w':''}">${esc(msg)}</div>`:''}
      ${x0?`<div class="inf">登録：${esc(x0.by||'')}　${esc(x0.at||'')}${x0.upd?`<br>最後に直した人：${esc(x0.updBy||'')}　${esc(x0.upd)}`:''}</div>`:''}
      <div class="bt">${x0?'<button class="del" id="ctDel">消す</button>':''}<button class="ok" id="ctOk" ${busy||!SHARED_URL?'disabled':''}>${x0?'保存する':'登録する'}</button></div></div>`;
    app.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{ f[el.dataset.f]=el.value; });
    const ven=app.querySelector('[data-f=vendor]');

      if(same){ let n=0; ['tel','fax','mail','person'].forEach(k=>{ if(!String(f[k]||'').trim()&&same[k]){ f[k]=same[k]; n++; } }); hint=n?'同じ発注先の前の登録から、電話番号などを入れました（違えば直してください）':''; draw(); } };

    };

    };
  };
  draw();
  if(!id) setTimeout(()=>{ const n=app.querySelector('[data-f=name]'); if(n) n.focus(); },50);
}

const ZN={data:null, p:null};
const ZN_V=3;   // サーバー（昨年度参照.gs）の答えの版。3＝四アル上槽（上槽まで）入り
const znNorm=s=>String(s||'').replace(/[\s　]/g,'');
function znSameLiq(a,b){ a=znNorm(a); b=znNorm(b); return !!a&&!!b&&(a===b||a.indexOf(b)>=0||b.indexOf(a)>=0); }
function znYear(d,n){ if(!d) return ''; const x=dparse(d); x.setFullYear(x.getFullYear()+n); return dstr(x); }
function znCurBY(){ const d=new Date(); return d.getFullYear()-2018-(d.getMonth()<6?1:0); }   // 酒造年度（7月はじまり）。2026年10月→R8
function znByShift(){ const by=(ZN.data&&ZN.data.by)||'R7BY', m=String(by).match(/R(\d+)/); return m?Math.max(1,znCurBY()-Number(m[1])):1; }   // R7BY→今年(R8BY)まで1年
function znDays(kind,x){
  const start=kind==='shubo'?x.d0:x.st.tome[0]; let meter=false;
  return (x.v||[]).map((r,i)=>{
    const d={ day:i+1, date:start?dadd(start,i):'', sm:r[0], alc:r[1], ta:r[2], aa:r[3] };
    if(kind==='shubo'){ d.tAM=r[4]; d.tPM=r[5]; } else { d.oimizu=r[4]; d.tAM=r[5]; d.tPM=r[6]; }
    if(d.sm!==null){ if(d.sm<0) meter=true; d.kind=meter?'度':'Be'; d.beq=meter?Math.round(-d.sm*10)/100:d.sm; if(kind==='moromi'&&d.day>=3&&d.beq>0) d.bmd=Math.round(d.beq*d.day*10)/10; }
    return d; });
}
function znSum(kind,x){
  const days=x._days||(x._days=znDays(kind,x));
  const last=k=>{ for(let i=days.length-1;i>=0;i--) if(days[i][k]!==null&&days[i][k]!==undefined) return days[i]; return null; };
  const s={ n:days.length, sm:last('sm'), alc:last('alc'), ta:last('ta') };
  if(kind==='moromi'){ let mx=null, bm=null; days.forEach(d=>{ [d.tAM,d.tPM].forEach(t=>{ if(t!==null&&d.day>=2&&(mx===null||t>mx)) mx=t; }); if(d.bmd!==undefined&&(bm===null||d.bmd>bm.v)) bm={v:d.bmd,day:d.day}; }); s.tMax=mx; s.bmd=bm; }
  return s;
}
async function znLoad(force){
  if(ZN.data&&!force) return ZN.data;
  let old=null;
  if(!force){ try{ const c=await PC.get('zn:data'); if(c&&c.ok){ if((c.v||0)>=ZN_V){ ZN.data=c; return c; } old=c; } }catch(e){} }   // 古い形の控え（上槽なし）は取り直す
  if(ZN.p) return ZN.p;
  ZN.p=(async()=>{ try{ const r=await recApi({action:'zennen_get',force:!!force},90000);
      if(r&&r.ok){ ZN.data=r; try{ await PC.set('zn:data',r); }catch(e){} return r; }
      if(old){ ZN.data=old; return old; } return r||null; }catch(e){ if(old){ ZN.data=old; return old; } return null; } finally{ ZN.p=null; } })();
  return ZN.p;
}
function znBtnHTML(kind,no){
  const t=kind==='shubo'?'昨年度の同じ時期の酒母':'昨年度の同じ時期の仕込み';

  return `<button class="zn-btn" data-zn="${kind}" data-zno="${no||''}">📅 <span>${t}</span><span class="go">›</span></button>`;
}
