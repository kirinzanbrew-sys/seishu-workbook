/* ---------- 1冊を見る ---------- */
function manxView(id){
  const tag='view:'+id, d0=MX.docs[id], m0=(d0&&d0.meta)||(MX.list||[]).find(x=>x.id===id)||{title:''};
  head(m0.title||'マニュアル', m0.genre||'');
  let msg=MX.flash, warn=false, busy=false, showDraft=false; MX.flash='';
  const draw=()=>{
    if(!mxTop(tag)) return;
    const d=MX.docs[id];
    if(!d){ app.innerHTML=msg?`<div class="mf-warn">${esc(msg)}</div>`:`<div class="card" style="text-align:center;color:var(--sub);margin-top:12px">読み込んでいます…</div>`; return; }
    const m=d.meta; head(m.title, (m.genre||'')+(m.haccp?'　HACCP':''));
    const hasPub=!!(m.pubVer&&d.pub), hasDraft=!!(m.draftVer&&d.draft);
    const seeDraft=(showDraft&&hasDraft)||(!hasPub&&hasDraft);
    const doc=seeDraft?d.draft:d.pub;
    let h='';
    if(msg) h+=`<div class="mx-msg ${warn?'w':'g'}">${esc(msg)}</div>`;
    if(hasDraft){
      const pend=m.draftKind==='承認待ち';
      h+=`<div class="mx-ban ${pend?'p':'d'}">${pend?`<b>承認待ちの版があります</b>（${esc(m.draftBy||'')}・第${m.draftVer}版）`:`<b>下書き</b>${hasPub?'の版があります':'です（まだ全員には出ていません）'}（${esc(m.draftBy||'')}・第${m.draftVer}版）`}
        <div class="bt">${hasPub?`<button class="mx-gh" id="mxSw">${seeDraft?'公開中の版を見る':'その版を見る'}</button>`:''}
        ${MX.admin?`<button class="mx-ok" id="mxAp">${pend?'承認する':'公開する'}</button><button class="mx-ng" id="mxRj">${pend?'差し戻す':'下書きを捨てる'}</button>`:''}</div></div>`;
    }
    if(seeDraft&&hasPub) h+=`<div class="mx-meta" style="color:#9a5a12;font-weight:700">いま見ているのは${esc(m.draftKind)}の版です。</div>`;
    if(mxDue(m)) h+=`<div class="mx-ban r"><b>見直しの時期です</b>（${esc(m.review)}まで）。今のやり方と合っているか確かめてください。直すところがなくても「直す」→「公開する」を押すと、見直し日が延びます。</div>`;
    h+= doc&&doc.cards&&doc.cards.length ? mxCardsHTML(doc.cards) : `<div class="card" style="color:var(--sub);text-align:center">中身がまだありません。「直す」から書けます。</div>`;
    h+=`<div class="mx-meta">第${seeDraft?m.draftVer:m.pubVer}版　最終更新 ${esc(m.upd||'')}（${esc(m.updBy||'')}）${m.review&&m.pubVer?'<br>次の見直し日 '+esc(m.review):''}</div>
      <div class="mx-foot"><button class="pri" id="mxEd">直す</button><button id="mxHi">改訂履歴</button></div>
      <div class="mx-foot"><button id="mxPr">印刷する</button>${MX.admin?'<button id="mxDel" style="color:#b31b14">このマニュアルを消す</button>':''}</div>`;
    app.innerHTML=h; mxBindPhotos();
    const on=(s,f)=>{ const e=$(s); if(e) e.onclick=f; };
    on('#mxSw',()=>{ showDraft=!seeDraft; draw(); });
    on('#mxEd',()=>mxGo('edit:'+id,()=>manxEdit(id)));
    on('#mxHi',()=>mxGo('his:'+id,()=>manxHistory(id)));
    on('#mxPr',()=>window.print());
    on('#mxSrc',()=>mxOpenSrc(m.src));
    const act=async(action,label)=>{ if(busy) return;
      const note=action==='reject'?(prompt(label==='差し戻'?'差し戻す理由（なくても可）':'捨てる理由（なくても可）')??null):'';
      if(note===null) return;
      busy=true; msg=label+'しています…'; warn=false; draw();
      try{ mxKeepDoc(await mxApi({action,id,note},40000)); msg=label+'しました'; showDraft=false; }
      catch(e){ msg=String(e.message||e); warn=true; } busy=false; draw(); };
    on('#mxAp',()=>act('approve', m.draftKind==='承認待ち'?'承認':'公開'));
    on('#mxRj',()=>act('reject', m.draftKind==='承認待ち'?'差し戻':'下書きを捨て'));
    const del=$('#mxDel'); if(del) del.onclick=async()=>{ if(del.dataset.s!=='1'){ del.dataset.s='1'; del.textContent='本当に消す（もう一度押す）'; return; }
      try{ mxKeepList(await mxApi({action:'delete',id},30000)); delete MX.docs[id]; mxSaveLocal(); nav.pop(); const f=nav[nav.length-1]; if(f) f(); }catch(e){ msg=String(e.message||e); warn=true; draw(); } };
  };
  draw();
  mxFetchDoc(id).then(ok=>{ if(!ok && !MX.docs[id]){ msg='読み込めませんでした。電波のよい所でもう一度開いてください。'; warn=true; } draw(); });
}
/* 元のWord・Excel：今までのマニュアル画面の一覧から探して開く */

  if(g) go(()=>manualView(g, g.vers.findIndex(v=>v.id===f.id)));
}

  const doc={ title:base.title||(m&&m.title)||'', genre:base.genre||(m&&m.genre)||MAN_GENRES[0], haccp:!!(base.haccp||(m&&m.haccp)), cards:(base.cards||[]).map(c=>Object.assign({t:'step'},c,{photos:(c.photos||[]).slice()})) };
  const wasHaccp=!!(m&&m.haccp);
  head(id?'マニュアルを直す':'新しいマニュアル', doc.title||'');

    const ph=(c.t==='table')?'':`<label>写真（${MANX_PHOTO_MAX}枚まで。OK例／NG例 の印を付けられます）</label><div class="mx-eph">${(c.photos||[]).map((p,k)=>`<div class="p"><img src="${mxImg(p.id,300)}" alt="">

        <input type="text" placeholder="ひとこと" data-f="cap" data-i="${i}" data-k="${k}" value="${esc(p.cap||'')}"></div>`).join('')}
        ${Array.from({length:c._up||0}).map(()=>'<div class="up">送っています…</div>').join('')}
        ${n<MANX_PHOTO_MAX?`<label class="add"><b>＋</b>写真<input type="file" accept="image/*" data-file="${i}" style="display:none" multiple></label>`:''}</div>`;
    if(c.t==='text') return `<div class="mx-ec text">${hd}<label>見出し</label><input type="text" data-f="title" data-i="${i}" value="${esc(c.title||'')}"><label>本文</label><textarea rows="4" data-f="body" data-i="${i}">${esc(c.body||'')}</textarea>${ph}</div>`;

      else if(a==='up'&&i>0){ [doc.cards[i-1],doc.cards[i]]=[doc.cards[i],doc.cards[i-1]]; }

        busy=false;

        if(f && f.mxTag==='view:'+nid) f(); else mxGo('view:'+nid,()=>manxView(nid));
      }catch(e){ busy=false; msg=String(e.message||e); warn=true; draw(); }

  };

/* 写真：端末の中で長い辺1600pxに縮めてから送る */
function mxResize(file, max){
  return new Promise((ok,ng)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ try{ let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,(max||1600)/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg',0.82)); }catch(e){ ng(e); } };
    im.onerror=()=>{ URL.revokeObjectURL(url); ng(new Error('この写真は読めませんでした')); };
    im.src=url;
  });
}
async function mxUploadPhoto(file){
  const data=await mxResize(file,1600);
  const j=await mxApi({action:'upload', name:'man_'+Date.now()+'.jpg', mime:'image/jpeg', data},90000);
  return j.id;
}
/* 移行用（Claudeが使う）：manuals.json と写真を読み、下書きとして入れる。
   base は フォルダのURL（'_mig/'）か、選んだファイルの一覧（manuals.json と img の写真。GitHubには置かない） */
async function manxImport(base, onlyIds){
  base=base||'_mig/'; const out=[];
  let fetchFile;
  if(typeof base!=='string'){ const map={}; [...base].forEach(f=>{ map[f.name]=f; });
    fetchFile=async p=>{ const f=map[p.split('/').pop()]; if(!f) throw new Error('写真なし '+p); return f; };
    var L=JSON.parse(await map['manuals.json'].text()); }
  else { fetchFile=p=>fetch(base+p).then(r=>{ if(!r.ok) throw new Error('写真なし '+p); return r.blob(); });
    var L=await fetch(base+'manuals.json?x='+Date.now()).then(r=>r.json()); }
  const who={id:'5501',name:'移行（Claude）'};
  const have=new Set(((await mxApi({action:'list',who},30000)).items||[]).map(x=>x.id));
  for(const M of L){
    if(onlyIds && !onlyIds.includes(M.id)) continue;
    if(have.has(M.id)){ out.push([M.id,'skip（入っています）']); continue; }
    try{
      const seq=[...(M.older||[]), M.doc];
      for(const d of seq){ for(const c of d.cards){ for(const p of (c.photos||[])){ if(p.file && !p.id){
        const blob=await fetchFile(p.file);
        const data=await new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.readAsDataURL(blob); });
        p.id=(await mxApi({action:'upload',name:p.file.split('/').pop(),mime:blob.type||'image/jpeg',data,who},120000)).id; delete p.file; } } } }
      let j=null;
      for(let k=0;k<seq.length;k++){
        const d=Object.assign({},seq[k]); const nt=d._note; delete d._note;
        const body={action:'save', id:M.id, src:M.src||'', doc:d, mode:'draft', who, note: k<seq.length-1 ? (nt||'前の版') : 'Word・Excelから移行（'+(M.src||'')+'）'};
        if(k===0){ body.newId=M.id; body.once=true; }
        j=await mxApi(body,90000);
      }
      out.push([M.id,'ok',j.meta.draftVer]);
    }catch(e){ out.push([M.id,'NG',String(e.message||e)]); }
  }
  return out;
}

      : `<div class="card" style="text-align:center;color:var(--sub);margin-top:8px">${CT.items.length?'当てはまるものがありません。':'まだ登録がありません。「＋ 登録」から入れてください。'}</div>`;

  };
  draw();
  if(SHARED_URL) ctFetch().then(draw);
}
function ctItemHTML(x){ const th=ctTelHref(x.tel);
  return `<div class="ct-it"><div class="m" data-id="${esc(x.id)}"><div class="n">${esc(x.name)}</div>
    <div class="s">${x.kind?`<span class="k">${esc(x.kind)}</span>`:''}${ctProcs(x).map(p=>`<span>${esc(p)}</span>`).join('')}${x.model?`<span>${esc(x.model)}</span>`:''}</div>
    <div class="v">${x.vendor?`<b>${esc(x.vendor)}</b>`:'発注先 未登録'}${x.person?'（'+esc(x.person)+'）':''}${x.tel?'　'+esc(x.tel):''}</div></div>
    <a class="ct-tel ${th?'':'no'}" href="${th||'#'}">📞<small>${th?'電話':'番号なし'}</small></a></div>`; }
/* 企業ごとにまとめる。電話番号などは、その会社の品目のうち一番新しく直されたものを使う */
function ctCompanies(xs){
  const m={};
  xs.forEach(x=>{ const v=String(x.vendor||'').trim(); (m[v]=m[v]||[]).push(x); });
  return Object.keys(m).map(v=>{ const items=m[v]; const by=items.slice().sort((a,b)=>String(b.upd||b.at).localeCompare(String(a.upd||a.at)));
    const pick=k=>(by.find(x=>String(x[k]||'').trim())||{})[k]||'';
    return { vendor:v, items, tel:pick('tel'), fax:pick('fax'), mail:pick('mail'), person:pick('person'), kinds:[...new Set(items.map(x=>x.kind).filter(Boolean))] }; })
    .sort((a,b)=>(a.vendor?0:1)-(b.vendor?0:1)||b.items.length-a.items.length||a.vendor.localeCompare(b.vendor,'ja'));
}
/* ---------- 1社の画面：連絡先をまとめて直す＋その会社の品目一覧 ---------- */
function ctCompany(vendor){
  const items=()=>CT.items.filter(x=>String(x.vendor||'').trim()===vendor);
  head(vendor||'発注先 未登録','この会社から買っているもの');
  const c0=ctCompanies(items())[0]||{tel:'',fax:'',mail:'',person:'',items:[]};
  const f={tel:c0.tel,fax:c0.fax,mail:c0.mail,person:c0.person}; let msg='', warn=false, busy=false, open=false;
  const draw=()=>{
    const xs=items().sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja',{numeric:true})), th=ctTelHref(f.tel);
    let h=`<div class="ct-cohd"><div class="r"><div style="flex:1;min-width:0"><b>${esc(vendor||'発注先 未登録')}</b>
        <div class="v">${f.person?'担当 '+esc(f.person)+'<br>':''}${f.tel?'TEL '+esc(f.tel):'電話番号 未登録'}${f.fax?'　FAX '+esc(f.fax):''}${f.mail?'<br>'+esc(f.mail):''}</div></div>
        <a class="ct-tel ${th?'':'no'}" href="${th||'#'}">📞<small>${th?'電話':'番号なし'}</small></a></div>
      ${vendor?`<button class="ct-coed" id="ctCoEd">${open?'閉じる':'この会社の電話番号・担当者をまとめて直す'}</button>`:''}</div>`;
    if(open) h+=`<div class="ct-f" style="margin-top:4px">
      <label>担当者</label><input type="text" data-c="person" value="${esc(f.person)}">
      <label>電話番号</label><input type="tel" data-c="tel" value="${esc(f.tel)}" placeholder="例：0254-00-0000">
      <label>FAX</label><input type="tel" data-c="fax" value="${esc(f.fax)}">
      <label>メール</label><input type="email" data-c="mail" value="${esc(f.mail)}">
      <div class="inf">保存すると、この会社の ${xs.length}品目 すべてに同じ番号が入ります。</div>
      <div class="bt"><button class="ok" id="ctCoOk" ${busy||!SHARED_URL?'disabled':''}>まとめて保存する</button></div></div>`;
    if(msg) h+=`<div class="ct-msg ${warn?'w':'g'}">${esc(msg)}</div>`;
    h+=`<div class="ct-sec">この会社の品目 ${xs.length}件</div>`+xs.map(ctItemHTML).join('');
    app.innerHTML=h;
    const e=$('#ctCoEd'); if(e) e.onclick=()=>{ open=!open; draw(); };
    app.querySelectorAll('[data-c]').forEach(el=>el.oninput=()=>{ f[el.dataset.c]=el.value; });
    app.querySelectorAll('.ct-it .m[data-id]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; const g=()=>ctEdit(id); g.ctTag='edit'; go(g); });
    const ok=$('#ctCoOk'); if(ok) ok.onclick=async()=>{
      busy=true; const list=items(); let n=0, j=null; msg='保存しています… 0 / '+list.length; warn=false; draw();
      try{ for(const x of list){ const it={}; ['name','kind','proc','vendor','person','tel','fax','mail','model','memo'].forEach(k=>it[k]=x[k]||''); Object.assign(it,{id:x.id,tel:f.tel.trim(),fax:f.fax.trim(),mail:f.mail.trim(),person:f.person.trim()}); j=await ctApi({action:'save',item:it},25000); n++; msg='保存しています… '+n+' / '+list.length; const m=app.querySelector('.ct-msg'); if(m) m.textContent=msg; }
        if(j) ctKeep(j); msg=n+'品目に保存しました'; open=false; }
      catch(err){ if(j) ctKeep(j); msg='途中で止まりました（'+n+' / '+list.length+'）：'+String(err.message||err); warn=true; }

}

/* ---------- 登録・修正 ---------- */
function ctEdit(id){
  const x0=id?CT.items.find(x=>x.id===id):null;
  if(id && !x0){ nav.pop(); const f=nav[nav.length-1]; if(f) f(); return; }
  head(id?'連絡先を直す':'連絡先を登録', id?x0.name:'');
  const f=Object.assign({name:'',kind:'',proc:'',vendor:'',person:'',tel:'',fax:'',mail:'',model:'',memo:''}, x0||{});
  if(!id){ if(CT.kind) f.kind=CT.kind; if(CT.proc) f.proc=CT.proc; }
  let procs=ctProcs(f), msg='', warn=false, busy=false, hint='';
  const vendors=[...new Set(CT.items.map(x=>x.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const fld=(k,label,type,ph)=>`<label>${label}</label><input type="${type||'text'}" data-f="${k}" value="${esc(f[k]||'')}" placeholder="${esc(ph||'')}" ${k==='vendor'?'list="ctVendors"':''}>`;
  const draw=()=>{
    app.innerHTML=`<div class="ct-f">
      <label>名前（必須）</label><input type="text" data-f="name" value="${esc(f.name)}" placeholder="例：脱色炭、モーノポンプのOリング">
      <label>種類</label><div class="ch" data-g="kind">${CT_KINDS.map(k=>`<button data-v="${k}" class="${f.kind===k?'on':''}">${k}</button>`).join('')}</div>
      <label>工程（いくつでも選べます）</label><div class="ch" data-g="proc">${CT_PROCS.map(p=>`<button data-v="${p}" class="${procs.includes(p)?'on':''}">${p}</button>`).join('')}</div>
      ${fld('vendor','発注先','text','会社名（前に入れた会社は候補に出ます）')}<datalist id="ctVendors">${vendors.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      ${hint?`<div class="hint">${esc(hint)}</div>`:''}
      ${fld('person','担当者')}${fld('tel','電話番号','tel','例：0254-00-0000')}${fld('fax','FAX','tel')}${fld('mail','メール','email')}${fld('model','品番・型番')}
      <label>メモ（注文のしかた・納期・単位など）</label><textarea rows="3" data-f="memo">${esc(f.memo||'')}</textarea>
      ${msg?`<div class="ct-msg ${warn?'w':''}">${esc(msg)}</div>`:''}
      ${x0?`<div class="inf">登録：${esc(x0.by||'')}　${esc(x0.at||'')}${x0.upd?`<br>最後に直した人：${esc(x0.updBy||'')}　${esc(x0.upd)}`:''}</div>`:''}
      <div class="bt">${x0?'<button class="del" id="ctDel">消す</button>':''}<button class="ok" id="ctOk" ${busy||!SHARED_URL?'disabled':''}>${x0?'保存する':'登録する'}</button></div></div>`;
    app.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{ f[el.dataset.f]=el.value; });
    const ven=app.querySelector('[data-f=vendor]');
    ven.onchange=()=>{ f.vendor=ven.value.trim(); const same=CT.items.filter(x=>x.vendor===f.vendor&&x.id!==id).sort((a,b)=>String(b.upd||b.at).localeCompare(String(a.upd||a.at)))[0];
      if(same){ let n=0; ['tel','fax','mail','person'].forEach(k=>{ if(!String(f[k]||'').trim()&&same[k]){ f[k]=same[k]; n++; } }); hint=n?'同じ発注先の前の登録から、電話番号などを入れました（違えば直してください）':''; draw(); } };
    app.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(g.dataset.g==='kind') f.kind=f.kind===v?'':v; else procs=procs.includes(v)?procs.filter(p=>p!==v):CT_PROCS.filter(p=>p===v||procs.includes(p));
      draw(); }));
    const done=(j,text)=>{ ctKeep(j); CT.flash=text; nav.pop(); const p=nav[nav.length-1]; if(p) p(); window.scrollTo(0,0); };
    $('#ctOk').onclick=async()=>{
      if(!String(f.name).trim()){ msg='名前を入れてください'; warn=true; draw(); return; }
      busy=true; msg='保存しています…'; warn=false; draw();
      try{ const item={}; ['name','kind','vendor','person','tel','fax','mail','model','memo'].forEach(k=>item[k]=String(f[k]||'').trim()); item.proc=procs.join('、'); if(x0) item.id=x0.id;
        done(await ctApi({action:'save',item},25000), (x0?'直しました：':'登録しました：')+item.name); }
      catch(e){ busy=false; msg=String(e.message||e); warn=true; draw(); }
    };
    const del=$('#ctDel'); if(del) del.onclick=async()=>{
      if(del.dataset.s!=='1'){ del.dataset.s='1'; del.textContent='本当に消す'; return; }
      try{ done(await ctApi({action:'delete',id:x0.id},25000),'消しました：'+x0.name); }catch(e){ msg=String(e.message||e); warn=true; draw(); }
    };
  };
  draw();
  if(!id) setTimeout(()=>{ const n=app.querySelector('[data-f=name]'); if(n) n.focus(); },50);
}

<script>
/* ================= 📅 昨年度を参照（酒母・仕込み）2026-10-03 =================
   泰広さん指示：酒母・仕込みを仕込むときに、前の年の同じ時期の仕込みを見たい。

   ・入口：🧫酒母 の一覧の上／1本の画面（タイルの下）、🍶仕込み の一覧の上／1本の画面（仕込み配合の下）
   ・一覧：昨年度の 酒母＝酛立日、醪＝添日 を1年ずらして、基準日（1本の画面からなら その酒母の酛立日／その仕込の添日、
           一覧からなら きょう）の前後で並べる。±7日／±14日／全部、同じ液種だけ、‹前の週・次の週›
   ・1本：分析酒母・分析醪シートと同じ並びの表＋グラフ（今年の1本から開いたときは 今年の値を緑で重ねる・同じ日目を黄色）
   ・データ：Apps Script「醸造記録 R8BY」の 昨年度参照.gs（action zennen_get）。★★各種分析シートR7BY を読むだけ（書き込まない）
           端末に控える（IndexedDB mfgcache の zn:data）。昨年度のデータは変わらないので、2回目からは通信なしで開く
   控え：seishu-workbook_github\_src_zennen.js（index.html の zennen の目印の間）
   ================================================================================ */
const ZN_CSS=`
.zn-btn{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;background:#f2f7ee;border:1px solid #7da86a;color:#2f5d22;border-radius:12px;padding:10px 12px;margin:8px 0 10px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:left}
.zn-btn small{display:block;font-weight:400;font-size:11px;color:#5d7a52}

.zn-t .k b{color:var(--navy);font-size:13px}.zn-t .k small{display:block;color:var(--sub);font-size:10px}
.zn-t td.ice{background:#e3f0fb;color:#103e74;font-weight:800}
.zn-t td.hin{font-weight:800;color:#8a2a1e}
.zn-t td.mz{color:#1f5fa8}
.zn-t td.sr{line-height:1.25}.zn-t td.sr .q{display:block;color:#103e74;font-weight:700;border-top:1px dotted #d8d2c2;margin-top:2px;padding-top:2px}

.zn-t tr.near td{background:#fff4c9}.zn-t tr.near .k{background:#ffeaa0}

`;
(function(){ const s=document.createElement('style'); s.textContent=ZN_CSS; document.head.appendChild(s); })();

const ZN={data:null, p:null};
const ZN_V=3;   // サーバー（昨年度参照.gs）の答えの版。3＝四アル上槽（上槽まで）入り
const znNorm=s=>String(s||'').replace(/[\s　]/g,'');
function znSameLiq(a,b){ a=znNorm(a); b=znNorm(b); return !!a&&!!b&&(a===b||a.indexOf(b)>=0||b.indexOf(a)>=0); }
function znYear(d,n){ if(!d) return ''; const x=dparse(d); x.setFullYear(x.getFullYear()+n); return dstr(x); }
function znCurBY(){ const d=new Date(); return d.getFullYear()-2018-(d.getMonth()<6?1:0); }   // 酒造年度（7月はじまり）。2026年10月→R8
function znByShift(){ const by=(ZN.data&&ZN.data.by)||'R7BY', m=String(by).match(/R(\d+)/); return m?Math.max(1,znCurBY()-Number(m[1])):1; }   // R7BY→今年(R8BY)まで1年
function znDays(kind,x){
  const start=kind==='shubo'?x.d0:x.st.tome[0]; let meter=false;
  return (x.v||[]).map((r,i)=>{
    const d={ day:i+1, date:start?dadd(start,i):'', sm:r[0], alc:r[1], ta:r[2], aa:r[3] };
    if(kind==='shubo'){ d.tAM=r[4]; d.tPM=r[5]; } else { d.oimizu=r[4]; d.tAM=r[5]; d.tPM=r[6]; }
    if(d.sm!==null){ if(d.sm<0) meter=true; d.kind=meter?'度':'Be'; d.beq=meter?Math.round(-d.sm*10)/100:d.sm; if(kind==='moromi'&&d.day>=3&&d.beq>0) d.bmd=Math.round(d.beq*d.day*10)/10; }
    return d; });
}
function znSum(kind,x){
  const days=x._days||(x._days=znDays(kind,x));
  const last=k=>{ for(let i=days.length-1;i>=0;i--) if(days[i][k]!==null&&days[i][k]!==undefined) return days[i]; return null; };
  const s={ n:days.length, sm:last('sm'), alc:last('alc'), ta:last('ta') };
  if(kind==='moromi'){ let mx=null, bm=null; days.forEach(d=>{ [d.tAM,d.tPM].forEach(t=>{ if(t!==null&&d.day>=2&&(mx===null||t>mx)) mx=t; }); if(d.bmd!==undefined&&(bm===null||d.bmd>bm.v)) bm={v:d.bmd,day:d.day}; }); s.tMax=mx; s.bmd=bm; }
  return s;
}
async function znLoad(force){
  if(ZN.data&&!force) return ZN.data;
  let old=null;
  if(!force){ try{ const c=await PC.get('zn:data'); if(c&&c.ok){ if((c.v||0)>=ZN_V){ ZN.data=c; return c; } old=c; } }catch(e){} }   // 古い形の控え（上槽なし）は取り直す
  if(ZN.p) return ZN.p;
  ZN.p=(async()=>{ try{ const r=await recApi({action:'zennen_get',force:!!force},90000);
      if(r&&r.ok){ ZN.data=r; try{ await PC.set('zn:data',r); }catch(e){} return r; }
      if(old){ ZN.data=old; return old; } return r||null; }catch(e){ if(old){ ZN.data=old; return old; } return null; } finally{ ZN.p=null; } })();
  return ZN.p;
}
function znBtnHTML(kind,no){

      return {x, dd, now, diff:now?rcDays(o.anc,now):9999, same: liq?znSameLiq(x.lq,liq):false}; })

  if(view!=='tbl') h+=`<div class="rc-bar">${[[7,'±7日'],[14,'±14日'],['all','全部']].map(([k,l])=>`<button class="rc-chip ${String(win)===String(k)?'on':''}" data-win="${k}">${l}</button>`).join('')}

/* 仕込み時の表：添・仲・留 × 水麹・氷・品温（仕込み後）・尺・ℓ（分析醪の 添H・仲M・留P 列。st＝[日付,尺,量,汲水,氷,水麹,蒸米,品温]） */
function znTblHTML(list,near){
  /* 列：[見出し, 単位, 値を出す関数(x)→文字 or [上段,下段], 色のclass] */
  const N=(v,d)=>{ const n=shN(v); return n===null?'':shF(n,d); };
  const S=(k,i,d)=>x=>N((x.st[k]||[])[i],d);
  const TW=(k)=>x=>[N((x.st[k]||[])[1],0),N((x.st[k]||[])[2],0)];
  const stage=(k,ice)=>[['水麹','℃',S(k,5,1),'mz'], ...(ice?[['氷','L',S(k,4,0),'ice']]:[]), ['品温','℃',S(k,7,1),'hin'], ['尺<br>ℓ','mm／L',TW(k),'sr']];
  const J=x=>x.jo||{};
  const sg=v=>v===''?'':(Number(v)>0?'+':'')+v;
  const josoDate=x=>{ const j=J(x), t=x.st.tome[0]; let d=j.date, mark='';
    if(!d||!t||rcDays(t,d)<5||rcDays(t,d)>60){ d=t&&x.v&&x.v.length?dadd(t,x.v.length-1):''; mark=d?'*':''; }
    return {d, mark, n:d&&t?rcDays(t,d)+1:null}; };
  const grp=[
    ['添', stage('soe',false)], ['仲', stage('naka',true)], ['留', stage('tome',true)],
    ['四段・アル添', [['四段','L',x=>N(J(x).yd&&(J(x).yd.outL??J(x).yd.L),0),''], ['アル添','L',x=>N(J(x).alcL,0),'alc']]],
    ['上槽', [['日付<br>日数','',x=>{ const o=josoDate(x); return [o.d?rcMD(o.d)+o.mark:'', o.n?o.n+'日':'']; },'sr'],
              ['尺<br>ℓ','上槽時',x=>[N(J(x).shaku,0),N(J(x).L,0)],'sr'],
              ['前 度<br>alc','',x=>{ const p=J(x).pre||{}; return [sg(N(p.smv,1)),N(p.alc,1)]; },'sr'],
              ['後 度<br>alc','合算',x=>{ const p=J(x).post||{}; return [sg(N(p.smv,1)),N(p.alc,1)]; },'sr'],
              ['上槽量','L',x=>N(J(x).outL,0),''],
              ['粕 %<br>kg','',x=>[N(J(x).kasuP,1),N(J(x).kasuKg,0)],'sr']]]];
  let h=`<div class="zn-tw" id="znTw"><table class="zn-t"><thead><tr class="g1"><th class="k" rowspan="2">順号・液種<small style="color:var(--sub);font-size:10px;font-weight:400">添日（昨年）</small></th>${grp.map(([g,cols])=>`<th class="g" colspan="${cols.length}">${g}</th>`).join('')}</tr>
    <tr class="g2">${grp.map(([,cols])=>cols.map(([l,u],i)=>`<th class="${i===cols.length-1?'e':''}">${l}<br><span style="font-weight:400">${u}</span></th>`).join('')).join('')}</tr></thead><tbody>`;
  list.forEach(r=>{ const x=r.x;
    h+=`<tr data-no="${x.no}" class="${r.same?'same':''} ${r===near?'near':''}"><td class="k"><b>${x.no} ${esc(x.sym)}</b> ${esc(x.lq)}<small>添 ${rcMD(x.st.soe[0])}・T${esc(x.tk||'—')}</small></td>`;
    grp.forEach(([,cols])=>cols.forEach(([l,u,fn,c],j)=>{ const e=j===cols.length-1?' e':''; const v=fn(x);
      if(Array.isArray(v)) h+=`<td class="sr${e}">${v[0]}<span class="q">${v[1]}</span></td>`;
      else h+=`<td class="${(c==='ice'||c==='alc')?(v?'ice':''):c}${e}">${v}</td>`; }));
    h+=`</tr>`; });
  return h+`</tbody></table></div><p class="sh-note">2段の列は 上段／下段（尺＝mm、ℓ＝L）。品温＝その段を仕込んだ後の品温。氷・アル添が入っている所は青（添は氷を入れないので列なし）。上槽は「四アル上槽」シートの値：前＝上槽前の最終値、後＝上槽後（合算）。日付の * は上槽日の記録が無いので最後の分析日。空欄はシートに記録が無いところ。行を押すとその仕込の経過表。</p>`;
}

/* ================= 🧫 酒母：一覧の表にそのまま入力・グラフを表の背景に（2026-10-05） =================
   泰広さん指示：酒母のページに入ったら、そのページで入力をそのままできるように。タンク番号は順号の下に表示、
   グラフは表の背景に半透明で表示。次のページ（1本の画面・入力画面）に行かなくてよいようにする。
   ・2026-10-05 追加：左の順号の下の酒母タンク（T◯◯）もそのまま入力（shubo_save の shuboT → 仕込マスタ「酒母T」）。備考は 暖器／冷器／その他…（選ぶと文字で入力）
   ・表のマス（Be・alc・酸度・アミノ酸・品温AM・品温PM・備考）を、1日目〜きょうの列まで直接入力（1・2日目は分析しないので Be・alc・酸度・アミノ酸は出さない）。
     アミノ酸は 酒母醪_追加.gs の「酒母追加」シート S〜AE列（2026-10-05）。サーバーが古い（days に aa が無い）ときは入力欄を止める
   ・入れたマスは黄色の枠＝未保存。下に出る「保存」でまとめて保存（shubo_save を 酒母×日 ごとに送る）
   ・Enter で同じ日の下のマスへ。数字でないものは赤、ありえない値は橙（保存のとき確認）
   ・仕込時の値（仕込尺・仕込量・水麹・蒸米）が未入力の酒母は、日々のマスを止める（今までの決まり）
   ・左の順号（タンク番号）を押すと、仕込時の値・酛卸日・酒母の備考の小さな入力窓（kgeDialog）
   ・背景のグラフ：酒母ごとに Be（青）・品温AM（赤点線）・PM（橙点線）を、その日の列の位置に半透明で描く（kgBg）
   ・表の描き直し（データが届いたとき）でも、未保存の値とカーソルの位置は残す（KGE.dirty） */
const KGE={ dirty:{}, draw:null, bg:null, msg:'' };
const kgFieldsShuboNow=[['日付',d=>d.date?rcMD(d.date):'','dt'],['Be',d=>kgN(d.sm,1),'','be'],['alc',d=>kgN(d.alc,1),'','alc'],['酸度',d=>kgN(d.ta,1),'','ta'],['アミノ酸',d=>kgN(d.aa,1),'','aa'],['品温AM',d=>kgN(d.tAM,1),'','temp'],['品温PM',d=>kgN(d.tPM,1),'','tPM'],['備考',d=>d.biko?`<span style="font-weight:400;font-size:10px">${esc(String(d.biko).slice(0,6))}</span>`:'','bk','biko']];
const KGE_RANGE={be:[-5,25,'Be'],alc:[0,22,'alc'],ta:[0,30,'酸度'],aa:[0,10,'アミノ酸'],temp:[0,40,'品温AM'],tPM:[0,40,'品温PM']};
const kgeKey=el=>`${el.dataset.no}|${el.dataset.day}|${el.dataset.k}`;
const kgeOrig=el=>el.dataset.orig!==undefined?el.dataset.orig:el.defaultValue;   // 選択（備考）は data-orig に元の値
const kgeChanged=el=>el.value!==kgeOrig(el);
/* 備考（日ごと）：暖器／冷器／その他（自由に入力）を選ぶ（2026-10-05 泰広さん指示） */
const KGE_BIKO=['暖器','冷器'];
function kgeBikoSel(r, i, val, fl){
  const lab=`順号${esc(String(r.no))} ${i}日目 ${fl}`, dis=r.lock?' disabled title="仕込時の値が未入力です（左の順号を押して入れてください）"':'';
  const known=val===''||KGE_BIKO.includes(val);
  if(!known) return `<input class="kg-i tx" data-no="${r.no}" data-day="${i}" data-k="biko" value="${esc(val)}" type="text" autocomplete="off" aria-label="${lab}"${dis}>`;
  return `<select class="kg-i sel" data-no="${r.no}" data-day="${i}" data-k="biko" data-orig="${esc(val)}" aria-label="${lab}"${dis}><option value=""${val===''?' selected':''}></option>${KGE_BIKO.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}<option value="__other">その他…</option></select>`;
}
function kgeCheck(el){   // '' ／ 'bad'（数字でない）／ 'warn'（ありえない値）
  const k=el.dataset.k, v=el.value.trim(); if(k==='biko'||k==='shuboT'||v==='') return '';
  const n=pnum(v); if(n===null) return 'bad';
  const R=KGE_RANGE[k]; return R&&(n<R[0]||n>R[1])?'warn':'';
}
function kgeMark(el){
  const c=kgeCheck(el);
  el.classList.toggle('dirty', kgeChanged(el));
  el.classList.toggle('bad', c==='bad'); el.classList.toggle('warn', c==='warn');
}
function kgeKeep(box){
  const a=document.activeElement;
  if(a&&a.classList&&a.classList.contains('kg-i')&&box.contains(a)) return {key:kgeKey(a), s:a.selectionStart, e:a.selectionEnd};
  return null;
}
function kgeNext(box, el){
  if(el.dataset.day==='0'){ el.blur(); return; }
  const same=[...box.querySelectorAll(`.kg-i[data-day="${el.dataset.day}"]`)].filter(x=>!x.disabled);
  const i=same.indexOf(el), nx=same[i+1];
  if(nx){ nx.focus(); try{ nx.select(); }catch(e){} } else el.blur();
}
function kgeBar(box){
  const bar=box.querySelector('.kg-sbar'); if(!bar) return;
  const ins=[...box.querySelectorAll('.kg-i')].filter(kgeChanged);
  const bad=ins.filter(x=>kgeCheck(x)==='bad').length;
  bar.hidden=!ins.length && !KGE.msg;
  bar.classList.toggle('ok', !ins.length && !!KGE.msg && !KGE.msgNg);
  bar.querySelector('.c').textContent=ins.length?`未保存 ${ins.length}マス`:'';
  const m=bar.querySelector('.m'); m.textContent=bad?'数字になっていないマスがあります（赤い枠）':(KGE.msg||'');
  m.classList.toggle('ng', !!bad || !!KGE.msgNg);
  bar.querySelector('#kgSave').hidden=!ins.length; bar.querySelector('#kgUndo').hidden=!ins.length;
}
function kgeSay(box, t, ng){ KGE.msg=t; KGE.msgNg=!!ng; kgeBar(box); if(!ng) setTimeout(()=>{ if(KGE.msg===t){ KGE.msg=''; kgeBar(box); } },5000); }
/* 「その他…」を選んだら、そのマスを文字の入力欄に切り替える */
function kgeToText(box, sel, val){
  const inp=document.createElement('input');
  inp.className='kg-i tx'; inp.type='text'; inp.autocomplete='off';
  ['no','day','k'].forEach(k=>inp.dataset[k]=sel.dataset[k]); inp.dataset.orig=kgeOrig(sel);
  inp.setAttribute('aria-label', sel.getAttribute('aria-label')||''); inp.value=val||''; inp.placeholder='その他（入力）';
  sel.replaceWith(inp); kgeWire(box, inp); return inp;
}
function kgeWire(box, el){
  const key=kgeKey(el);
  const upd=()=>{ if(!kgeChanged(el)) delete KGE.dirty[key]; else KGE.dirty[key]=el.value; kgeMark(el); kgeBar(box); };
  if(el.tagName==='SELECT'){
    el.addEventListener('change',()=>{
      if(el.value==='__other'){ const t=kgeToText(box, el, ''); KGE.dirty[key]=''; t.focus(); kgeMark(t); kgeBar(box); return; }
      upd(); });
  } else el.addEventListener('input',upd);
  el.addEventListener('click',e=>e.stopPropagation());   // 左の順号のマス（タンク）を押しても入力窓は開かない
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); kgeNext(box, el); } });
  if(el.tagName==='INPUT') el.addEventListener('focus',()=>{ try{ el.select(); }catch(e){} });
}
function kgeBind(box, opt, keep){
  let ins=[...box.querySelectorAll('.kg-i')];
  ins.forEach((el,ix)=>{
    const key=kgeKey(el);
    if(key in KGE.dirty && !el.disabled){
      const v=KGE.dirty[key];
      if(el.tagName==='SELECT' && !KGE_BIKO.includes(v) && v!==''){ el=ins[ix]=kgeToText(box, el, v); kgeMark(el); return; }
      el.value=v;
    }
    kgeMark(el); kgeWire(box, el);
  });
  box.insertAdjacentHTML('beforeend', `<div class="kg-sbar" hidden><span class="c"></span><span class="m"></span><button class="rc-ghost" id="kgUndo">元に戻す</button><button class="rc-btn" id="kgSave">保存</button></div>`);
  $('#kgSave').onclick=()=>kgeSave(box);
  $('#kgUndo').onclick=()=>{ if(!window.confirm('未保存の入力を消して、元の値に戻しますか？')) return;
    box.querySelectorAll('.kg-i').forEach(el=>{ if(kgeChanged(el)) delete KGE.dirty[kgeKey(el)]; }); if(KGE.draw) KGE.draw(); };
  kgeBar(box);
  if(keep){ const el=[...box.querySelectorAll('.kg-i')].find(x=>kgeKey(x)===keep.key); if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s,keep.e); }catch(e){} } }
}
async function kgeSave(box){
  const ins=[...box.querySelectorAll('.kg-i')].filter(el=>!el.disabled&&kgeChanged(el));
  if(!ins.length){ kgeSay(box,'変わったところがありません'); return; }
  const lab=el=>el.getAttribute('aria-label')||'';
  const bad=ins.filter(el=>kgeCheck(el)==='bad');
  if(bad.length){ kgeSay(box,'数字になっていないマス：'+bad.map(lab).slice(0,4).join('、'),true); bad[0].focus(); return; }
  const warn=ins.filter(el=>kgeCheck(el)==='warn');
  if(warn.length && !window.confirm(`ありえない値かもしれません。\n${warn.map(el=>`・${lab(el)}：${el.value}`).slice(0,10).join('\n')}\n\nこのまま保存しますか？`)) return;
  const G={}, lock=new Set();
  ins.forEach(el=>{ const no=el.dataset.no, day=Number(el.dataset.day), k=el.dataset.k, s=RC.shubo[no];
    if(day>0 && s&&shSetupMissing(s).length){ lock.add(no); return; }
    const v=el.value.trim(), val=(k==='biko'||k==='shuboT')?v:(v===''?'':String(pnum(v)));
    const g=(G[no+'|'+day]=G[no+'|'+day]||{no,day,values:{},els:[]}); if(day===0) g.shuboT=val; else g.values[k]=val; g.els.push(el); });
  const list=Object.values(G);
  if(!list.length){ kgeSay(box,`順号${[...lock].join('・')} は先に仕込時の値を入れてください（左の順号を押す）`,true); return; }
  /* 2026-10-06：待たずに裏で送る（値はすぐ表に反映。送れなかったら下の知らせ） */
  const nm=g=>g.day===0?`酒母 順号${g.no} タンク`:`酒母 順号${g.no} ${g.day}日目`;
  list.forEach(g=>{ const body=g.day===0?{action:'shubo_save',no:g.no,shuboT:g.shuboT}:{action:'shubo_save',no:g.no,day:g.day,values:g.values};
    if(g.day===0){ const m=rcMaster(g.no); if(m) m.shuboT=g.shuboT; try{ if(RC.state) lsSet('rec.state',RC.state); }catch(e){} }
    else { const s=RC.shubo[g.no], D=s&&s.days&&s.days[g.day-1]; if(D) Object.assign(D,g.values); }
    g.els.forEach(el=>{ delete KGE.dirty[kgeKey(el)]; });
    recSaveBg(body, nm(g), true); });
  rcToast(`${list.length}か所 を裏で保存しています。ほかの作業に移ってOKです`);
  kgeSay(box,`保存を受け付けました（${list.map(nm).join('、')}）。裏で送っています${lock.size?`。順号${[...lock].join('・')} は仕込時の値が未入力のため保存していません`:''}`, lock.size>0);
  if(KGE.draw && document.body.contains(box)) KGE.draw();
  return;
  const btn=$('#kgSave'); if(btn) btn.disabled=true;
  const ok=[], ng=[];
  for(let i=0;i<list.length;i++){ const g=list[i];
    kgeSay(box,`保存中… ${i+1}/${list.length}（${nm(g)}）`);
    try{ const body=g.day===0?{action:'shubo_save',no:g.no,shuboT:g.shuboT}:{action:'shubo_save',no:g.no,day:g.day,values:g.values};
      const r=await recApi(body,40000);
      if(r&&r.ok){ ok.push(g); g.els.forEach(el=>{ delete KGE.dirty[kgeKey(el)]; el.classList.add('saved'); });
        if(g.day===0){ const m=rcMaster(g.no); if(m) m.shuboT=g.shuboT; try{ if(RC.state) lsSet('rec.state',RC.state); }catch(e){} } }
      else ng.push(g); }
    catch(e){ ng.push(g); } }
  const nos=[...new Set(ok.filter(g=>g.day>0).map(g=>String(g.no)))];
  nos.forEach(no=>RC.shubo[no]=null);
  if(ng.length) kgeSay(box,`保存できなかった所があります：${ng.map(nm).join('、')}。電波を確認してもう一度「保存」を押してください${lock.size?`（順号${[...lock].join('・')} は仕込時の値が未入力）`:''}`,true);

/* 背景のグラフ（酒母ごとに、その酒母の Be〜品温PM の行の高さに、日の列の位置で描く） */
function kgBg(box, rows, fields){
  const wrap=box.querySelector('.kg-wrap'); if(!wrap) return;
  const old=wrap.querySelector('svg.kg-bg'); if(old) old.remove();
  const W=wrap.getBoundingClientRect(); if(!W.width) return;
  const fB=fields.findIndex(f=>f[0]==='Be'), fP=fields.findIndex(f=>f[0]==='品温PM'); if(fB<0||fP<0) return;
  const P=(x,y)=>x.toFixed(1)+','+y.toFixed(1);
  let g='';
  rows.forEach(r=>{
    const trs=[...wrap.querySelectorAll('tr[data-kg]')].filter(t=>t.dataset.kg===String(r.no)); if(trs.length<=fP) return;
    const a=trs[fB].getBoundingClientRect(), b=trs[fP].getBoundingClientRect();
    const y0=a.top-W.top+5, y1=b.bottom-W.top-5; if(y1-y0<24) return;
    const X={}, CW={}; trs[fB].querySelectorAll('td[data-i]').forEach(c=>{ const q=c.getBoundingClientRect(); X[c.dataset.i]=q.left-W.left+q.width/2; CW[c.dataset.i]=q.width; });
    const D=(r.days||[]).filter(d=>X[d.day]!==undefined);
    const pts=k=>D.map(d=>{ const v=d._r?shN(d._r[k]):null; return v===null?null:[X[d.day],v]; }).filter(Boolean);
    const draw=(p,lo,hi,color,w,dash,op)=>{ if(!p.length) return ''; const q=p.map(([x,v])=>[x, y1-(v-lo)/(hi-lo)*(y1-y0)]);
      return (q.length>1?`<polyline points="${q.map(([x,y])=>P(x,y)).join(' ')}" fill="none" stroke="${color}" stroke-width="${w}"${dash?' stroke-dasharray="6 4"':''} stroke-linejoin="round" stroke-linecap="round" opacity="${op}"/>`:'')
        + q.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dash?2.6:3.4}" fill="${color}" opacity="${op}"/>`).join(''); };
    const be=pts('be'), tA=pts('temp'), tP=pts('tPM');
    if(be.length){ const vs=be.map(p=>p[1]); g+=draw(be, Math.min(0,...vs), Math.max(10,...vs)*1.1, '#1f5fa8', 3.2, false, .30); }
    const tv=[...tA,...tP].map(p=>p[1]);
    if(tv.length){ const lo0=Math.min(...tv), hi0=Math.max(...tv), mid=(lo0+hi0)/2, half=Math.max(4,(hi0-lo0)/2+1);
      /* 2026-10-05 AM→PM を時間の順に1本の線（AM＝列の左寄り、PM＝右寄り） */
      const tt=[]; D.forEach(d=>{ const w=(CW[d.day]||0)/4, a=d._r?shN(d._r.temp):null, p=d._r?shN(d._r.tPM):null;
        if(a!==null) tt.push([X[d.day]-w,a]); if(p!==null) tt.push([X[d.day]+w,p]); });
      g+=draw(tt, mid-half, mid+half, '#c0392b', 2.4, true, .45); }
  });
  if(g) wrap.insertAdjacentHTML('afterbegin', `<svg class="kg-bg" width="${wrap.scrollWidth}" height="${wrap.scrollHeight}" aria-hidden="true">${g}</svg>`);
}
