let KN_YM = null, KN_SEL = null;
function knMyStaff(staff){
  const me = nrm(MFG&&MFG.me&&MFG.me.name || ST.name);
  if(!me) return -1;
  let i = staff.findIndex(s=>nrm(s)===me);
  if(i<0) i = staff.findIndex(s=>{ const n=nrm(s); return n.startsWith(me)||me.startsWith(n); });
  return i;
}
function knHead(s){
  const t=String(s||'').trim(), m=t.split(/[\s\u3000]+/);
  const [a,b] = m.length>1 ? [m[0], m.slice(1).join('')] : [t.slice(0,2), t.slice(2)];
  return esc(a)+(b?'<br>'+esc(b):'');
}
/* 出勤表でいま使われている記号を、多い順に集める（リストの手入れが要らないように） */
let KN_MARKS = null, KN_MARKS_AT = -1;
function knMarkList(){
  if(KN_MARKS && KN_MARKS_AT===(MFG&&MFG._at||0)) return KN_MARKS;
  const K = MFG && MFG.shukkin; const c = {};
  if(K && K.months) Object.keys(K.months).forEach(ym=>{
    (K.months[ym].days||[]).forEach(d=>(d.c||[]).forEach(v=>{ const t=String(v||'').trim(); if(t) c[t]=(c[t]||0)+1; }));
  });
  // 振休で使う記号は、出勤表にまだ無くても必ず出す
  Object.values((MFG&&MFG.marks)||{}).forEach(m=>{ const t=String(m||'').trim(); if(t&&!c[t]) c[t]=0.5; });
  const all = Object.keys(c).sort((a,b)=>c[b]-c[a] || (a<b?-1:1));
  KN_MARKS = { all, often: all.filter(m=>c[m]>=2 || c[m]===0.5).slice(0,24), n:c };
  KN_MARKS_AT = (MFG&&MFG._at||0);
  return KN_MARKS;
}
function markNote(m){
  const K = (MFG&&MFG.marks)||{};
  for(const k of Object.keys(K)) if(K[k]===m) return '振休（'+k+'）';
  return ({'＼':'休み','／':'休み（もう一方）','＼ｐ0.5':'午後半休','＼a0.5':'午前半休','泊':'泊まり','当':'当番','＼当':'休みだが当番'})[m] || '';
}
function reqActive(r){ return r.status==='申請中'||r.status==='承認'; }
function isEdit(r){ return r.kind==='直接変更'; }
function reqWant(r){ return r.status==='申請中'?'赤':r.status==='承認'?'黒':''; }
function kinmuScreen(){
  const render=function knRender(){
    app.dataset.mfg='knRender';
    head('製造カレンダー','出勤表・振休依頼');
    const K = MFG && MFG.shukkin;
    let h = calTabs('kinmu') + mfgErrView();
    if(!K || !K.months || !Object.keys(K.months).length){
      app.innerHTML = h + `<div class="card">出勤表のデータがこの端末にまだありません。<br>
        <span style="color:var(--sub);font-size:13px">一度でも表示できていれば、あとは通信できないときも最後の内容を表示します。</span>
        <button class="btn p" style="margin-top:10px" onclick="mfgReload()">もう一度読み込む</button></div>`
        + mfgSrcInfo('shukkin','出勤表'); bindCalTabs(); return;
    }
    const yms = Object.keys(K.months).sort();
    const cur = dtoday().slice(0,7);
    if(!KN_YM || !K.months[KN_YM]) KN_YM = K.months[cur] ? cur : yms.filter(y=>y<=cur).pop() || yms[yms.length-1];
    const M = K.months[KN_YM], hol = new Set(K.holidays||[]);
    const mine = knMyStaff(M.staff);
    const reqs = (MFG.requests||[]);
    const me = MFG.me||{};
    // 承認待ち（管理者）
    const pend = reqs.filter(r=>r.status==='申請中').sort((a,b)=>a.date<b.date?-1:1);
    h += `<button class="btn p" id="bReq" style="background:#b21b1b;border-color:#b21b1b">✋ 振休依頼</button>`;
    if(me.admin && pend.length){
      h += `<div class="mf-sec">承認待ち<span>${pend.length}件</span></div>`;
      for(const r of pend) h += reqRow(r, 'admin');
    }
    const my = reqs.filter(r=>r.applicantId===me.id && r.status!=='取消' && !isEdit(r) && !(me.admin && r.status==='申請中')).sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
    if(my.length){
      h += `<div class="mf-sec">自分の依頼<span>最近${my.length}件</span></div>`;
      for(const r of my) h += reqRow(r, 'mine');
    }
    const eds = reqs.filter(r=>isEdit(r) && r.status==='承認').sort((a,b)=>a.at<b.at?1:-1).slice(0,5);
    if(me.admin && eds.length){
      h += `<div class="mf-sec">アプリから直した分<span>最近${eds.length}件</span></div>`;
      for(const r of eds) h += reqRow(r, 'edit');
    }
    // 月の切り替え
    const i = yms.indexOf(KN_YM);
    const [yy,mm] = KN_YM.split('-').map(Number);
    h += `<div class="mf-nav" style="margin-top:16px"><button id="mPrev" ${i<=0?'disabled':''}>‹ 前月</button>
      <div class="mf-date" style="flex:1;margin:0">${yy}年${mm}月</div>
      <button id="mNext" ${i>=yms.length-1?'disabled':''}>翌月 ›</button></div>`;
    // 表
    const byCell = {};
    for(const r of reqs){ if(r.date.slice(0,7)===KN_YM) (byCell[r.date+'|'+nrm(r.staff)] = byCell[r.date+'|'+nrm(r.staff)]||[]).push(r); }
    const td = dtoday();
    h += `<div class="kn-wrap" id="knWrap"><table class="kn"><thead><tr><th class="dt">日</th>`;
    M.staff.forEach((s,k)=>{ h += `<th class="nm ${k===mine?'me':''}">${knHead(s)}</th>`; });
    h += `<th class="nt">備考</th></tr></thead><tbody>`;
    for(const d of M.days){
      const dd = dparse(d.d), isHol = hol.has(d.d);
      h += `<tr data-d="${d.d}" class="${isHol?'hol':''} ${d.d===td?'today':''} ${d.d===KN_SEL?'sel':''}"><td class="dt">${dd.getDate()} <span style="font-weight:400">${WD[dd.getDay()]}</span></td>`;
      M.staff.forEach((s,k)=>{
        let v = d.c[k]||'', cls = d.r[k]?'red':'';
        const rs = (byCell[d.d+'|'+nrm(s)]||[]);
        const act = rs.find(reqActive);
        if(act && act.excel!==reqWant(act)){ v = act.mark; cls = (act.status==='申請中'?'red ':'')+'pend'; }
        else if(!act && rs.some(r=>(r.excel==='赤'||r.excel==='黒'))){ cls += ' gone'; }
        h += `<td class="c ${k===mine?'me':''} ${v.length>2?'long':''}"><div><span class="${cls}">${esc(v)}</span></div></td>`;
      });
      h += `<td class="nt">${esc(d.n||'')}</td></tr>`;
    }
    h += `</tbody></table></div>
      <p class="tl-note"><span style="color:#d11a1a;font-weight:700">赤×</span>＝振休の申請中／黒×＝承認済み。点線の枠は、まだ出勤表Excelに書き込まれていないもの（会社PCが数分以内に反映します）。行を押すとその日の詳しい内容が出ます。</p>
      <div id="knDay"></div>`;
    app.innerHTML = h + mfgSrcInfo('shukkin','出勤表Excel');
    bindCalTabs();
    $('#bReq').onclick=()=>go(()=>furikyuForm());
    const mp=$('#mPrev'), mn=$('#mNext');
    if(mp) mp.onclick=()=>{ KN_YM=yms[i-1]; KN_SEL=null; knRender(); };
    if(mn) mn.onclick=()=>{ KN_YM=yms[i+1]; KN_SEL=null; knRender(); };
    app.querySelectorAll('tr[data-d]').forEach(tr=>tr.onclick=()=>{ KN_SEL=tr.dataset.d; showDay(M, KN_SEL); app.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); });
    bindReqButtons(knRender);
    if(KN_SEL) showDay(M, KN_SEL);
  };
  mfgOpen(render);
}
function showDay(M, d){
  const x = M.days.find(z=>z.d===d); if(!x) return;
  const reqs = (MFG.requests||[]).filter(r=>r.date===d && r.status!=='取消');
  let h = `<div class="mf-day"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${djp(d)}</div><div class="g">`;
  M.staff.forEach((s,k)=>{ if(x.c[k]) h += `<span class="muted">${esc(nrm(s))}</span><span class="${x.r[k]?'red':''}" style="${x.r[k]?'color:#d11a1a;font-weight:700':''}">${esc(x.c[k])}</span>`; });
  if(x.j) h += `<span class="muted">上槽</span><span>${esc(x.j)}</span>`;
  if(x.k) h += `<span class="muted">粕</span><span>${esc(x.k)}</span>`;
  if(x.p) h += `<span class="muted">蔵人員</span><span>${esc(x.p)}人</span>`;
  if(x.n) h += `<span class="muted">備考</span><span>${esc(x.n)}</span>`;
  h += `</div>`;
  if(reqs.length){ h += `<div style="margin-top:8px">`; reqs.forEach(r=>{
    h += `<div class="muted">${isEdit(r)?`アプリで変更：${esc(nrm(r.staff))}・${r.mark?esc(r.mark):'空'}（${esc(nrm(r.applicant))}）`:`振休依頼：${esc(nrm(r.staff))}・${esc(r.kind)}（${esc(r.status)}）`}</div>`; }); h+='</div>'; }
  h += `<button class="btn o" id="dayReq" style="margin-top:10px">この日で振休依頼</button>`;
  if(((MFG&&MFG.me)||{}).admin) h += `<button class="btn p" id="dayEdit" style="margin-top:8px">✏️ この日の出勤表を直す</button>`;
  h += `</div>`;
  $('#knDay').innerHTML = h;
  $('#dayReq').onclick=()=>go(()=>furikyuForm(d));
  const de=$('#dayEdit'); if(de) de.onclick=()=>go(()=>kinmuEditForm(d));
}

/* ---------- 出勤表を直す（権限のある人だけ） ---------- */
function kinmuEditForm(day, staff0){
  head('出勤表を直す','会社PCのExcelにも反映されます');
  const K = MFG && MFG.shukkin, me = (MFG&&MFG.me)||{};
  if(!me.admin){ app.innerHTML = '<div class="card" style="margin-top:14px">出勤表を直せるのは権限のある人だけです。</div>'; return; }
  if(!K || !K.months){ app.innerHTML = '<div class="card" style="margin-top:14px">出勤表のデータがまだ届いていないため、直せません。</div>'; return; }
  const yms = Object.keys(K.months).sort();
  const latest = K.months[dtoday().slice(0,7)] || K.months[yms[yms.length-1]];
  const staffAll = [...new Set([...(latest?latest.staff:[]), ...yms.slice(-3).flatMap(y=>K.months[y].staff)])];
  const ML = knMarkList();
  let sel = { staff: staff0 || '', date: day || dtoday(), mark: null, memo:'', all:false };   // mark===null は未選択、'' は空にする
  const render=()=>{
    const M = K.months[sel.date.slice(0,7)];
    let curVal = '';
    if(M){ const k=M.staff.findIndex(x=>nrm(x)===nrm(sel.staff)); const dd=M.days.find(z=>z.d===sel.date); if(k>=0&&dd) curVal=dd.c[k]||''; }
    const busy = (MFG.requests||[]).find(r=>r.date===sel.date && nrm(r.staff)===nrm(sel.staff) && reqActive(r));
    app.innerHTML = `<div class="mf-lbl">誰の欄を直しますか</div>
      <select class="mf-sel" id="eStaff"><option value="">選んでください</option>${staffAll.map(x=>`<option ${x===sel.staff?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <div class="mf-lbl">日付</div>
      <input type="date" class="mf-sel" id="eDate" value="${sel.date}">
      <div class="muted" style="margin-top:4px">${djp(sel.date,true)}${K.holidays&&K.holidays.includes(sel.date)?'　<b style="color:#c62828">会社休日</b>':''}</div>
      ${sel.staff?`<div class="tl-row" style="margin-top:8px"><span>いまの出勤表</span><b style="font-size:16px">${curVal?esc(curVal):'<span class="muted">空</span>'}</b></div>`:''}
      <div class="mf-lbl">何に直しますか</div>
      <div class="mf-kinds ekinds">
        <button data-em="" class="${sel.mark===''?'on':''}">空にする</button>
        ${(sel.all?ML.all:[...new Set([...ML.often, ...(sel.mark?[sel.mark]:[])])]).map(m=>`<button data-em="${esc(m)}" class="${sel.mark===m?'on':''}">${esc(m)}</button>`).join('')}</div>
      ${ML.all.length>ML.often.length?`<button class="tl-link" id="eAll">${sel.all?'よく使う記号だけにする':`ほかの記号も出す（ぜんぶで${ML.all.length}）`} ›</button>`:''}
      ${sel.mark!==null?`<div class="muted" style="margin-top:6px">出勤表の <b>${esc(nrm(sel.staff)||'—')}</b> の <b>${djp(sel.date,true)}</b> を
        <b style="font-size:15px">${sel.mark===''?'空':esc(sel.mark)}</b> にします。${markNote(sel.mark)?`（${esc(markNote(sel.mark))}）`:''}</div>`:''}
      <div class="mf-lbl">メモ（任意）</div>
      <input class="mf-sel" id="eMemo" maxlength="100" value="${esc(sel.memo)}" placeholder="例：本人と相談のうえ変更">
      ${busy?`<div class="mf-warn">この日・この人は、いま振休依頼（${esc(busy.status)}）が入っています。先にそちらを取り消してください。</div>`:''}
      ${!M?`<div class="mf-warn">この月の出勤表シートがまだありません。シートができたら書き込まれます。</div>`:''}
      <button class="btn p" id="eSend" style="margin-top:16px" ${busy?'disabled':''}>この内容に直す</button>
      <p class="tl-note">直したことは記録に残ります（誰が・いつ・どこを・何に）。<b>元に戻す</b>を押せば、直す前の値に戻せます。
        会社PCが数分以内にExcelへ書き込みます。Excelを開いたままでも書き込まれます（保存はご自身で）。</p>
      <div id="eMsg" class="muted" style="text-align:center;margin-top:8px"></div>`;
    $('#eStaff').onchange=e=>{ sel.staff=e.target.value; render(); };
    $('#eDate').onchange=e=>{ if(e.target.value){ sel.date=e.target.value; render(); } };
    $('#eMemo').oninput=e=>{ sel.memo=e.target.value; };
    app.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{ sel.mark=b.dataset.em; render(); });
    const ea=$('#eAll'); if(ea) ea.onclick=()=>{ sel.all=!sel.all; render(); };
    $('#eSend').onclick=async()=>{
      if(!sel.staff){ $('#eMsg').textContent='誰の欄を直すか選んでください。'; return; }
      if(sel.mark===null){ $('#eMsg').textContent='何に直すか選んでください。'; return; }
      const b=$('#eSend'); b.disabled=true; b.textContent='送信しています…';
      try{
        const j = await apiT({action:'mfg_edit', token:ST.token, staff:sel.staff, date:sel.date, mark:sel.mark, memo:sel.memo}, 40000);
        if(j && j.ok){
          if(j.requests){ MFG.requests=j.requests; lsSet('mfg.cache',MFG); }
          KN_YM = sel.date.slice(0,7); KN_SEL = sel.date;
          app.innerHTML = `<div class="card" style="margin-top:16px;text-align:center"><div style="font-size:34px">✅</div>
            <b>出勤表を直しました</b><div class="muted" style="margin-top:6px">${esc(nrm(sel.staff))}　${djp(sel.date)}　→ <b>${sel.mark===''?'空':esc(sel.mark)}</b><br>
            会社PCが数分以内にExcelへ書き込みます。</div></div>
            <button class="btn p" id="eBack">出勤表にもどる</button>`;
          $('#eBack').onclick=()=>{ nav.pop(); const f=nav[nav.length-1]; f?f():go(home); hBack.classList.toggle('hide',nav.length<=1); };
        } else { b.disabled=false; b.textContent='この内容に直す'; $('#eMsg').textContent=mfgErrJP(j&&j.err); }
      }catch(e){ b.disabled=false; b.textContent='この内容に直す'; $('#eMsg').textContent='通信できませんでした。電波の良い場所でもう一度お試しください。'; }
    };
  };
  render();
}
function reqRow(r, mode){
  const st = r.status==='申請中'?'p':r.status==='承認'?'a':'x';

const WS = { plan:[], records:{}, staff:[], filter:'todo', loadedAt:0 };
const wsPad=n=>String(n).padStart(2,'0');
const wsToday=()=>{const d=new Date();return `${d.getFullYear()}-${wsPad(d.getMonth()+1)}-${wsPad(d.getDate())}`};
const wsNow=()=>{const d=new Date();return `${wsPad(d.getHours())}:${wsPad(d.getMinutes())}`};
const wsMD=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'—';
const wsJD=s=>s?`${+s.slice(5,7)}月${+s.slice(8,10)}日`:'';
const wsDays=s=>Math.round((new Date(s+'T00:00:00')-new Date(wsToday()+'T00:00:00'))/86400000);
function wsRec(id){ return WS.records[id]||{}; }
function wsStage(r){ return ((r.wash&&r.wash.done)?1:0)+((r.finish&&r.finish.done)?1:0)+((r.check&&r.check.done)?1:0); }
function wsUrg(p,r){ if(wsStage(r)===3)return 'done'; const d=wsDays(p.deadline); if(d<=3)return 'bad'; if(d<=14)return 'warn'; return ''; }
async function washApi(body, ms){
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), ms||30000) : null;
  try{
    const r=await fetch(WASH_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    return await r.json();
  } finally { if(t) clearTimeout(t); }
}
function wsApply(d){ WS.plan=d.plan||[]; WS.records=d.records||{}; if(d.staff&&d.staff.length) WS.staff=d.staff; WS.loadedAt=Date.now(); lsSet('tool.wash',{plan:WS.plan,records:WS.records,staff:WS.staff,at:WS.loadedAt}); }
/* 端末に保存してある前回の内容（あればすぐ表示に使う） */
function wsFromCache(){
  if(WS.plan.length) return;
  const c=lsGet('tool.wash',null);
  if(c&&c.plan){ WS.plan=c.plan; WS.records=c.records||{}; WS.staff=c.staff||[]; WS.loadedAt=c.at||0; }
}
/* サーバーから最新を取る（同時に何回呼ばれても1回だけ通信する） */
let WS_BG=null;
function wsFetch(){
  if(WS_BG) return WS_BG;
  WS_BG=(async()=>{ let ok=false; try{ const j=await washApi({action:'wash_get'},25000); if(j&&j.ok){ wsApply(j.data); ok=true; } }catch(e){} WS_BG=null; return ok; })();
  return WS_BG;
}
async function wsLoad(force){
  wsFromCache();
  if(!force && WS.plan.length && Date.now()-WS.loadedAt<60000) return true;
  return wsFetch();
}
/* ホームを開いたときに裏で取っておく（タンク洗浄を開いた瞬間に出せるように） */
function wsPrefetch(){ try{ wsFromCache(); if(Date.now()-WS.loadedAt>5*60000) wsFetch(); }catch(e){} }
function wsStatus(t,warn){ const s=$('#wsStatus'); if(!s)return; s.textContent=t; s.className='ws-status'+(warn?' warn':''); if(!warn) setTimeout(()=>{ if(s.textContent===t) s.textContent=''; },4000); }

async function washScreen(){
  head('タンク洗浄管理','R8BY 醪タンク（期限＝酛下日）');
  wsFromCache();
  let ok=true, bg=null;
  if(!WS.plan.length){
    app.innerHTML='<p class="muted" style="margin-top:14px">洗浄の予定と記録を読み込んでいます…</p>';
    ok=await wsFetch();
  }else if(Date.now()-WS.loadedAt>60000){
    bg=wsFetch();          // 前回の内容をすぐ表示し、最新は裏で取る
  }
  if(!WS.plan.length){ app.innerHTML=`<div class="tl-warn" style="margin-top:14px">洗浄の予定を読み込めませんでした。電波の届く所でもう一度開いてください。</div>`; return; }
  const draw=()=>{
    const f=WS.filter;
    let over=0,soon=0,todo=0,done=0;
    WS.plan.forEach(p=>{ const s=wsStage(wsRec(p.id)); if(s===3){done++;return;} todo++; const d=wsDays(p.deadline); if(d<0)over++; else if(d<=14)soon++; });
    const vis=p=>{ const s=wsStage(wsRec(p.id)), d=wsDays(p.deadline);
      if(f==='all')return true; if(f==='done')return s===3; if(f==='todo')return s<3; if(f==='soon')return s<3&&d<=14; if(f==='over')return s<3&&d<0; return true; };
    const rows=WS.plan.filter(vis).sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.n-b.n);
    let h=`<div class="ws-sum">
      <button data-f="over"><span class="k">期限超過</span><span class="v ${over?'bad':''}">${over}</span></button>
      <button data-f="soon"><span class="k">14日以内</span><span class="v ${soon?'warn':''}">${soon}</span></button>
      <button data-f="todo"><span class="k">未完了</span><span class="v">${todo}</span></button>
      <button data-f="done"><span class="k">完了</span><span class="v ok">${done}</span></button></div>
    <div class="ws-bar">
      <button class="ws-chip ${f==='todo'?'on':''}" data-f="todo">未完了</button>
      <button class="ws-chip ${f==='soon'?'on':''}" data-f="soon">14日以内</button>
      <button class="ws-chip ${f==='done'?'on':''}" data-f="done">完了</button>
      <button class="ws-chip ${f==='all'?'on':''}" data-f="all">全部</button>
      <span style="flex:1"></span>
      <button class="ws-ghost" id="wsStaff">担当者名</button>
      <button class="ws-ghost" id="wsReload">更新</button></div>
    <div id="wsStaffBox" class="card" style="display:none">
      <div style="font-size:13px;margin-bottom:6px">担当者を1行に1人ずつ。全員の画面の選択肢に反映されます。</div>
      <textarea class="ws-ta" id="wsStaffTa">${esc(WS.staff.join('\n'))}</textarea>
      <div class="ws-actions"><button class="ws-ghost" id="wsStaffNo">閉じる</button><button class="ws-btn" id="wsStaffOk">保存</button></div></div>
    <div class="ws-status${ok?'':' warn'}" id="wsStatus">${bg?'最新の内容を確認しています…':ok?'':'（電波が無いため、端末に保存した内容を表示しています）'}</div>`;
    if(!rows.length) h+=`<p class="muted" style="text-align:center;padding:24px 0">該当するタンクはありません</p>`;
    h+=rows.map(p=>{ const r=wsRec(p.id), s=wsStage(r), u=wsUrg(p,r), d=wsDays(p.deadline);
      const left=s===3?'完了':d<0?`${-d}日超過`:d===0?'今日まで':`あと${d}日`;
      return `<button class="ws-row ${u}" data-id="${p.id}"><span class="st"></span>
        <span class="tk">${p.tank}<small>No.${p.n} ${esc(p.kigo)}</small></span>
        <span class="mid"><span class="b">${esc(p.brand)}</span><br><span class="d">添 ${wsMD(p.soe)}・留 ${wsMD(p.tome)}・上槽 ${p.josouActual?`<b>${wsMD(p.josouActual)}</b>(実)`:wsMD(p.josou)}${p.prev?`　前回上槽 ${wsMD(p.prev)}${p.prevActual?'(実)':''}`:''}</span></span>
        <span class="dl"><span class="date">${wsMD(p.deadline)}まで</span><span class="left ${u==='done'?'':u}">${left}</span>
          <span class="ws-steps"><span class="${r.wash&&r.wash.done?'on':''}">洗</span><span class="${r.finish&&r.finish.done?'on':''}">仕</span><span class="${r.check&&r.check.done?'on':''}">確</span></span></span></button>`; }).join('');
    h+=`<p class="tl-note">記録はスプレッドシート「タンク洗浄記録_R8BY」に保存されます。「仕込み」で上槽日を入れると前回上槽が実績（実）に変わります。印刷用の表は
      <a href="${WASH_URL}" target="_blank" rel="noopener">こちら（印刷ボタン付き）</a>。仕込計画が変わったら予定表を作り直します。</p>`;
    app.innerHTML=h;
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ WS.filter=b.dataset.f; draw(); });
    app.querySelectorAll('.ws-row').forEach(b=>b.onclick=()=>go(()=>washEdit(b.dataset.id)));
    $('#wsReload').onclick=async()=>{ wsStatus('更新中…'); ok=await wsFetch(); bg=null; draw(); };
    $('#wsStaff').onclick=()=>{ const x=$('#wsStaffBox'); x.style.display=x.style.display==='none'?'block':'none'; };
    $('#wsStaffNo').onclick=()=>{ $('#wsStaffBox').style.display='none'; };
    $('#wsStaffOk').onclick=async()=>{ const names=$('#wsStaffTa').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!names.length)return;
      WS.staff=names; $('#wsStaffBox').style.display='none'; wsStatus('担当者名を保存中…');
      try{ const j=await washApi({action:'wash_staff',names}); wsStatus(j&&j.ok?'担当者名を保存しました':'担当者名を保存できませんでした',!(j&&j.ok)); }catch(e){ wsStatus('担当者名を保存できませんでした',true); } };
  };
  draw();
  if(bg){
    ok=await bg; bg=null;
    // まだこの画面を見ていて、担当者名の編集中でなければ描き直す
    const box=$('#wsStaffBox');
    if(document.getElementById('wsStatus') && !(box && box.style.display!=='none')) draw();
    else if(!ok) wsStatus('最新の内容を取れませんでした（前回の内容を表示しています）',true);
  }
}

function washEdit(id){
  const p=WS.plan.find(x=>x.id===id); if(!p){ go(washScreen,false); return; }
  const r=JSON.parse(JSON.stringify(wsRec(id))); r.wash=r.wash||{}; r.finish=r.finish||{}; r.check=r.check||{};
  head(`タンク ${p.tank}`, `${p.brand}　仕込No.${p.n}（記号 ${p.kigo}）`);
  const d=wsDays(p.deadline);
  const opt=(cur)=>`<option value="">—</option>`+WS.staff.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  app.innerHTML=`
    <div class="ws-tl">
      <div>${p.prev?(p.prevActual?'前回上槽（実績）':'前回上槽（予定）'):'今期初使用'}<b>${p.prev?wsJD(p.prev):'—'}</b></div>
      <div class="${d<=3&&wsStage(r)<3?'hot':''}">洗浄期限（酛下日）<b>${wsJD(p.deadline)}</b></div>
      <div>添仕込<b>${wsJD(p.soe)}</b></div></div>
    <fieldset class="ws-fs ${r.wash.done?'on':''}" id="fsWash"><legend><label><input type="checkbox" id="wDone" ${r.wash.done?'checked':''}>洗浄</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="wDate" value="${esc(r.wash.date||'')}"></label>
        <label class="ws-f"><span>時刻</span><input type="time" id="wTime" value="${esc(r.wash.time||'')}"></label>
        <label class="ws-f"><span>測定方法</span><select id="wMethod"><option ${!r.wash.method||r.wash.method==='酸素濃度計'?'selected':''}>酸素濃度計</option><option ${r.wash.method==='その他'?'selected':''}>その他</option></select></label>
        <label class="ws-f"><span>酸素濃度（%）</span><input type="number" id="wO2" inputmode="decimal" step="0.1" min="0" max="25" placeholder="20.9" value="${r.wash.o2??''}"><span class="ws-hint" id="o2hint"></span></label>
        <label class="ws-f"><span>担当</span><select id="wBy">${opt(r.wash.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.finish.done?'on':''}" id="fsFin"><legend><label><input type="checkbox" id="fDone" ${r.finish.done?'checked':''}>仕上げ</label></legend>
      <div class="ws-grid">
        <label class="ws-f"><span>日付</span><input type="date" id="fDate" value="${esc(r.finish.date||'')}"></label>
        <label class="ws-f"><span>担当</span><select id="fBy">${opt(r.finish.by)}</select></label></div></fieldset>
    <fieldset class="ws-fs ${r.check.done?'on':''}" id="fsChk"><legend><label><input type="checkbox" id="cDone" ${r.check.done?'checked':''}>チェック</label></legend>
      <div class="ws-grid">
        <div class="ws-f"><span>臭い</span><div class="ws-seg" id="segSmell"><button type="button" data-v="OK" class="${r.check.smell==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.smell==='NG'?'ng':''}">あり</button></div></div>
        <div class="ws-f"><span>汚れ</span><div class="ws-seg" id="segDirt"><button type="button" data-v="OK" class="${r.check.dirt==='OK'?'ok':''}">なし</button><button type="button" data-v="NG" class="${r.check.dirt==='NG'?'ng':''}">あり</button></div></div>
        <label class="ws-f"><span>確認者</span><select id="cBy">${opt(r.check.by)}</select></label></div></fieldset>
    <label class="ws-f"><span>備考</span><input type="text" id="wsNote" value="${esc(r.note||'')}" placeholder="やり直し・気付きなど"></label>
    <div class="ws-status" id="wsStatus" style="margin-top:8px"></div>
    <div class="ws-actions"><button class="ws-ghost" id="wsCancel">やめる</button><button class="ws-btn" id="wsSave">保存</button></div>`;
  const cur={smell:r.check.smell||'',dirt:r.check.dirt||''};
  const seg=(id,key)=>{ const s=$('#'+id); s.querySelectorAll('button').forEach(b=>b.onclick=()=>{ cur[key]=b.dataset.v; s.querySelectorAll('button').forEach(x=>x.className=''); b.className=b.dataset.v==='OK'?'ok':'ng'; }); };
  seg('segSmell','smell'); seg('segDirt','dirt');
  const o2=()=>{ const v=parseFloat($('#wO2').value), h=$('#o2hint'); if(isNaN(v)){h.textContent='';h.className='ws-hint';return;} if(v<18){h.textContent='18%未満 — 立入不可、再換気';h.className='ws-hint bad';} else {h.textContent='18%以上 OK';h.className='ws-hint';} };
  $('#wO2').oninput=o2; o2();
  $('#wDone').onchange=e=>{ $('#fsWash').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#wDate').value)$('#wDate').value=wsToday(); if(!$('#wTime').value)$('#wTime').value=wsNow(); if(!$('#wBy').value&&ST.name&&WS.staff.includes(ST.name))$('#wBy').value=ST.name; } };
  $('#fDone').onchange=e=>{ $('#fsFin').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!$('#fDate').value)$('#fDate').value=wsToday(); if(!$('#fBy').value&&ST.name&&WS.staff.includes(ST.name))$('#fBy').value=ST.name; } };
  $('#cDone').onchange=e=>{ $('#fsChk').classList.toggle('on',e.target.checked); if(e.target.checked){ if(!cur.smell){cur.smell='OK';$('#segSmell button[data-v=OK]').className='ok';} if(!cur.dirt){cur.dirt='OK';$('#segDirt button[data-v=OK]').className='ok';} if(!$('#cBy').value&&ST.name&&WS.staff.includes(ST.name))$('#cBy').value=ST.name; } };
  $('#wsCancel').onclick=()=>hBack.click();
  $('#wsSave').onclick=async()=>{
    const data={
      wash:{done:$('#wDone').checked,date:$('#wDate').value,time:$('#wTime').value,method:$('#wMethod').value,o2:$('#wO2').value===''?null:parseFloat($('#wO2').value),by:$('#wBy').value},
      finish:{done:$('#fDone').checked,date:$('#fDate').value,by:$('#fBy').value},
      check:{done:$('#cDone').checked,smell:cur.smell,dirt:cur.dirt,by:$('#cBy').value},
      note:$('#wsNote').value };
    const miss=[];
    if(data.wash.done&&!data.wash.by)miss.push('洗浄の担当');
    if(data.wash.done&&data.wash.o2===null)miss.push('酸素濃度');
    if(data.finish.done&&!data.finish.by)miss.push('仕上げの担当');
    if(data.check.done&&!data.check.by)miss.push('確認者');
    if(miss.length){ wsStatus('未入力: '+miss.join('・'),true); return; }
    $('#wsSave').disabled=true; wsStatus('保存中…');
    try{
      const j=await washApi({action:'wash_save',id,data},30000);
      if(j&&j.ok){ wsApply(j.data); wsStatus(`タンク${p.tank} を保存しました`); setTimeout(()=>hBack.click(),400); }
      else { wsStatus('保存できませんでした: '+(j&&j.error||''),true); $('#wsSave').disabled=false; }
    }catch(e){ wsStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#wsSave').disabled=false; }
  };
}

let MAN_LIST = lsGet('man.list', null), MAN_ERR = '', MAN_OPEN = {}, MAN_Q = '';
const MAN_BODY = new Map();          // id → { ext, bytes }（開いている間だけ持つ）
const MAN_SCRIPT = {};
function manLoadLib(k){
  if(MAN_SCRIPT[k]) return MAN_SCRIPT[k];
  MAN_SCRIPT[k] = new Promise((ok, ng)=>{
    const s=document.createElement('script'); s.src=MAN_LIBS[k]; s.onload=()=>ok(); s.onerror=()=>{ MAN_SCRIPT[k]=null; ng(new Error('表示用の部品を読み込めませんでした')); };
    document.head.appendChild(s);
  });
  return MAN_SCRIPT[k];
}
function manKey(t){
  return String(t||'').replace(/[\s　]/g,'').replace(/[fｆFＦ]$/,'')
    .replace(/技能士検定/g,'技能検定').replace(/資料/g,'試料').replace(/作成方法/g,'作り方').toLowerCase();
}
function manKind(ext){
  ext=String(ext||'').toLowerCase();
  if(ext==='docx') return ['w','Word'];
  if(ext==='xlsx') return ['x','Excel'];
  if(['jpg','jpeg','png','gif','heic','webp'].includes(ext)) return ['p','写真'];
  if(ext==='pdf') return ['o','PDF'];
  return ['o',ext.toUpperCase()||'ファイル'];
}
function manDate(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?'':d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
/* 一覧 → ジャンルごとのグループ（同じ内容の版は1つにまとめる） */
function manGroups(files){
  const by={};
  (files||[]).forEach(f=>{ const k=manKey(f.title); (by[k]=by[k]||[]).push(f); });
  const groups=Object.values(by).map(vs=>{
    vs.sort((a,b)=>String(b.mtime).localeCompare(String(a.mtime)));
    return { key:manKey(vs[0].title), title:vs[0].title.replace(/[fｆ]$/,''), genre:vs[0].genre, vers:vs };
  });
  const order=g=>{ const i=MAN_GENRES.indexOf(g); return i<0 ? (g==='その他'?999:500) : i; };
  const gm={};
  groups.forEach(g=>{ (gm[g.genre]=gm[g.genre]||[]).push(g); });
  return Object.keys(gm).sort((a,b)=>order(a)-order(b)||a.localeCompare(b,'ja'))
    .map(n=>({ name:n, items:gm[n].sort((a,b)=>a.title.localeCompare(b.title,'ja',{numeric:true})) }));
}
async function manFetchList(){
  try{
    const j=await apiT({action:'mfg_man_list', token:ST.token}, 30000);
    if(j && j.ok && Array.isArray(j.files)){ MAN_LIST={files:j.files, at:j.at, got:Date.now()}; lsSet('man.list', MAN_LIST); MAN_ERR=''; }
    else if(j && j.err==='bad_token') MAN_ERR='ログイン情報を確認できませんでした。いったんログアウトしてログインし直してください。';
    else if(j && (j.err==='unknown_action' || (j.ok && !j.files))) MAN_ERR='サーバー側のマニュアル機能がまだ動いていません（Apps Script の新バージョンのデプロイが必要）。';
    else MAN_ERR='マニュアルの一覧を読み込めませんでした'+(j&&j.err?'（'+j.err+'）':'')+'。';
  }catch(e){ MAN_ERR='通信できませんでした。'+(MAN_LIST?'前回読み込んだ一覧を表示しています。':''); }
}
async function manualScreen(){
  head('マニュアル','ジャンルごとの作業手順');
  if(!document.getElementById('mnCss')){ const st=document.createElement('style'); st.id='mnCss'; st.textContent=MAN_CSS; document.head.appendChild(st); }
  const draw=()=>{
    let h=`<input class="mn-search" id="mnQ" type="search" placeholder="題名で探す（例：上槽、洗米）" value="${esc(MAN_Q)}">`;
    if(MAN_ERR) h+=`<div class="mf-warn" style="margin-top:8px">${esc(MAN_ERR)}</div>`;
    if(!MAN_LIST){ h+=`<div class="card" style="margin-top:12px;text-align:center;color:var(--sub)">読み込んでいます…</div>`; app.innerHTML=h; return; }
    const q=MAN_Q.replace(/[\s　]/g,'').toLowerCase();
    const gs=manGroups(MAN_LIST.files);
    let shown=0;
    gs.forEach((g,gi)=>{
      const items=q ? g.items.filter(it=>it.vers.some(v=>(v.title+v.rel+g.name).replace(/[\s　]/g,'').toLowerCase().includes(q))) : g.items;
      if(!items.length) return;
      shown+=items.length;
      const open = q || MAN_OPEN[g.name]!==false;
      h+=`<div class="mn-g" data-g="${esc(g.name)}"><span>${open?'▾':'▸'} ${esc(g.name)}</span><span class="n">${items.length}件</span></div>`;
      if(!open) return;
      items.forEach(it=>{

    doc.innerHTML=`<div class="mf-warn">表示できませんでした（${esc(e.message||e)}）。「ファイルを保存」から開いてください。</div>`;
  }
}

async function shuboInput(no, day){
  const m=rcMaster(no)||{};
  head(`酒母 順号 ${no}　${m.shuboSym||m.sym||''}`, `${m.liquid||''}　${m.shuboT?'T'+m.shuboT:'酒母タンク未設定'}　酵母 ${m.yeast||'—'}`);

  try{ const r=await recApi({action:'shubo_get',no},40000); if(r&&r.ok){ s=r; RC.shubo[no]=r; } }catch(e){}
  if(!s){ rcFail(); return; }
  const dToday=rcShuboDay(m,dtoday());
  const has=d=>{ const x=s.days[d-1]; return x&&(x.temp!==''||x.be!==''||x.ta!==''||x.alc!==''||x.biko); };

    <table class="rc-kv"><tr><th>日</th><th>日付</th><th>品温</th><th>Be</th><th>酸度</th><th>alc</th><th>備考</th></tr>
    ${s.days.filter(x=>has(x.day)).map(x=>`<tr class="${x.day===day?'on':''}" data-d="${x.day}"><td>${x.day}</td><td>${rcMD(x.date)}</td><td>${rcN(x.temp)}</td><td>${rcN(x.be)}</td><td>${rcN(x.ta)}</td><td>${rcN(x.alc)}</td><td style="text-align:left">${esc(x.biko||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">まだ入力がありません</td></tr>'}</table>
    <p class="tl-note">項目は R7BY の分析酒母と同じ（日目1〜13の品温・Be・酸度・alc、酛卸日）。乳酸 ${m.nyusan||s.head.nyusan||'—'}ml。</p>`;
  const dv=$('#rcDays'); const on=dv.querySelector('.on'); if(on) dv.scrollLeft=Math.max(0,on.offsetLeft-dv.clientWidth/2+30);
  dv.querySelectorAll('button').forEach(x=>x.onclick=()=>shuboInput(no,Number(x.dataset.d)));
  app.querySelectorAll('tr[data-d]').forEach(x=>x.onclick=()=>shuboInput(no,Number(x.dataset.d)));
  $('#rcSave').onclick=async()=>{
    const values={}; defs.forEach(([f])=>{ const v=$('#rc_'+f).value; if(String(v)!==String(D[f]??'')) values[f]=v; });
    if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    $('#rcSave').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'shubo_save',no,day,values},40000);
      if(res&&res.ok){ Object.assign(D,values); rcStatus(`${day}日目 を保存しました`); RC.shubo[no]=null; setTimeout(()=>shuboInput(no,day),500); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#rcSave').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#rcSave').disabled=false; }
  };
  $('#rcSave2').onclick=async()=>{
    const body={action:'shubo_save',no}; const mo=$('#rc_moto').value, bk=$('#rc_biko2').value;

    rcStatus('保存中…');

    catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); }
  };

/* ========== 🍶 仕込み：一覧 → 仕込カルテ（吸水・麹・酒母・醪・上槽粕・最終分析・原酒評価） ========== */

    ${k.hyoka.length?`<div class="tl-scroll"><table class="rc-kv"><tr><th>日付</th><th>評価者</th><th>総合</th><th>香</th><th>味</th><th>キレ</th><th>後味</th><th>余韻</th><th>クセ</th><th>コメント</th></tr>${k.hyoka.map(x=>`<tr><td>${rcMD(x['評価日'])}</td><td style="text-align:left">${esc(x['評価者'])}</td><td><b>${x['総合']}</b></td><td>${x['香り']}</td><td>${x['味わい']}</td><td>${x['キレ']}</td><td>${x['後味']}</td><td>${x['余韻']}</td><td>${x['クセ']}</td><td style="text-align:left;white-space:normal;min-width:120px">${esc(x['コメント']||'')}</td></tr>`).join('')}</table></div>`:'<p class="muted">まだ評価がありません</p>'}
    <div class="rc-actions"><button class="rc-btn" id="goHyoka">評価する（${esc(rcUser())}）</button></div>`);
  h+=`<p class="tl-note">印刷用（グラフ付き）は <a href="${REC_SS_MOROMI}" target="_blank" rel="noopener">醪管理R8BY › 仕込カルテ</a> で順号 ${no} を選ぶ。</p>`;
  app.innerHTML=h;
  $('#goShubo').onclick=()=>go(()=>shuboInput(no)); $('#goMoromi').onclick=()=>go(()=>moromiInput(no)); $('#goHyoka').onclick=()=>go(()=>hyokaScreen(no));
  const kEl=$('#'+rcId('粕重量kg')); kEl.oninput=()=>{ const v=Number(kEl.value); $('#kasu').textContent=(v&&M.soumai)?(Math.round(v/M.soumai*1000)/10)+'%':'—'; };
  $('#rcSaveJoso').onclick=async()=>{
    const values=rcDiff(jd,j); if(!Object.keys(values).length){ rcStatus('変わったところがありません'); return; }
    $('#rcSaveJoso').disabled=true; rcStatus('保存中…');
    try{ const res=await recApi({action:'joso_save',no,values},40000);
      if(res&&res.ok){ rcStatus('上槽を保存しました'); RC.at=0; setTimeout(()=>karteScreen(no,true),600); }
      else { rcStatus('保存できませんでした: '+(res&&res.err||''),true); $('#rcSaveJoso').disabled=false; }
    }catch(e){ rcStatus('保存できませんでした。電波を確認してもう一度お試しください',true); $('#rcSaveJoso').disabled=false; }
  };
}
function hyokaScreen(no){
  const m=rcMaster(no)||{};
  head(`原酒評価 順号 ${no}`, `${m.sym||''}号　${m.liquid||''}　評価者：${rcUser()}`);
  const keys=['sogo','kaori','aji','kire','atoaji','yoin','kuse']; const sc={};

      <div class="rc-seg" id="seg_${k}" style="margin-top:6px">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div><div class="rc-crit" id="crit_${k}">1＝${RC_CRIT[k][1][0]}　…　5＝${RC_CRIT[k][1][4]}</div></div>`).join('')}

      if(res&&res.ok){ RC.karte[no]=null; rcStatus('記録しました'); setTimeout(()=>hBack.click(),400); }
      else { rcStatus('記録できませんでした: '+(res&&res.err||''),true); $('#rcSave').disabled=false; }
    }catch(e){ rcStatus('記録できませんでした。電波を確認してもう一度お試しください',true); $('#rcSave').disabled=false; }

}
/* ================= 待たせない仕組み（2026-09-24） =================
   ① アプリを開いたら（ホームが出たら）裏で各項目のデータを先読みする。
      よく使う項目から順に。使ったことのある重い項目（ライブラリ・マニュアル本文・
      よく見る仕込の詳細）はその人だけ先読み（人によって先読みの中身が変わる）。
   ② 画面を開くときは、端末に保存してある前回の内容をすぐ出し、最新は裏で取って描き直す
      （入力中は描き直さない）。対象：仕込の一覧・麹・分析・酒母・カルテ・マニュアル本文。
   ③ アプリに戻ってきたとき（5分以上たっていれば）も先読みする。
   ④ サービスワーカー（sw.js）で画面のファイルと表示用の部品（Word/Excel）を端末に持つ。
   使い方の記録（どの項目・どのタンク・どのマニュアルをよく見るか）はこの端末の中だけに保存。
   ================================================================ */
const FAST = { dirty:false, last:0, running:false };

/* ---------- 端末の保存庫（IndexedDB。使えなければ何もしない） ---------- */
const PC = (()=>{
  let dbp=null;
  function db(){
    if(dbp) return dbp;
    dbp=new Promise((ok,ng)=>{ try{
      const r=indexedDB.open('mfgcache',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);
    }catch(e){ ng(e); } });
    dbp.catch(()=>{ dbp=null; });
    return dbp;
  }
  async function get(k){ try{ const d=await db(); return await new Promise(ok=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
  async function set(k,v){ try{ const d=await db(); await new Promise(ok=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); tx.onabort=()=>ok(); }); }catch(e){} }
  async function delPrefix(p){ try{ const d=await db(); await new Promise(ok=>{ const tx=d.transaction('kv','readwrite'); const q=tx.objectStore('kv').openCursor();
    q.onsuccess=()=>{ const c=q.result; if(c){ if(String(c.key).indexOf(p)===0) c.delete(); c.continue(); } }; tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); }); }catch(e){} }
  return { get, set, delPrefix };
})();

/* ---------- 使い方の記録（この端末だけ） ---------- */
function useGet(){ return lsGet('fast.use',{ f:{}, tank:{}, man:{} }); }
function useAdd(kind, key){
  if(!key) return;
  const u=useGet(); u[kind]=u[kind]||{};
  const e=u[kind][key]||{n:0,t:0}; e.n++; e.t=Date.now(); u[kind][key]=e;
  // 古いものは消す（90日）
  Object.keys(u[kind]).forEach(k=>{ if(Date.now()-u[kind][k].t>90*86400000) delete u[kind][k]; });
  lsSet('fast.use',u);
}
/* よく使う順（回数に、最近使ったほど重みを付ける） */
function useRank(kind){
  const u=(useGet()[kind])||{};
  return Object.keys(u).map(k=>{ const e=u[k], days=(Date.now()-e.t)/86400000; return [k, e.n*Math.pow(0.5, days/14)]; })
    .sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

/* ---------- 入力中は描き直さない ---------- */
document.addEventListener('input', ()=>{ FAST.dirty=true; }, true);
(function(){
  const _go=go;
  go=function(fn,push){ FAST.dirty=false; return _go(fn, push===undefined?true:push); };
  hBack.addEventListener('click', ()=>{ FAST.dirty=false; }, true);
})();
/* 裏で取った内容が変わっていたら、同じ画面を見ているときだけ描き直す */
function fastRerender(myTop){
  if(FAST.dirty) return;
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const f=nav[nav.length-1];
  if(!f || f!==myTop) return;
  const y=window.scrollY; f(); window.scrollTo(0,y);
}

/* ---------- 記録系（麹・分析・酒母・カルテ）：保存分をすぐ返し、裏で最新 ---------- */
const REC_READ = { koji_today:1, bunseki_get:1, shubo_get:1, karte:1 };
const REC_BG = {};
const recApiNet = recApi;
function recKey(b){ return 'rec:'+b.action+':'+(b.no!=null?b.no:'')+':'+(b.date||''); }
async function recFetchStore(body, ms){
  const r=await recApiNet(body, ms);
  if(r && r.ok) PC.set(recKey(body), { at:Date.now(), s:JSON.stringify(r) });
  return r;
}
recApi = async function(body, ms){
  const a=body&&body.action;
  if(!REC_READ[a]){
    const r=await recApiNet(body, ms);
    if(r && r.ok && /save/.test(a)){ PC.delPrefix('rec:'); }   // 保存したら保存分は捨てる（古い値を出さない）
    return r;
  }
  if(!body._pf && (a==='bunseki_get'||a==='shubo_get'||a==='karte')) useAdd('tank', String(body.no));
  const k=recKey(body), c=await PC.get(k);
  if(c && c.s){
    const age=Date.now()-c.at;
    if(age>30000 && !REC_BG[k]){
      const myTop=nav[nav.length-1];
      REC_BG[k]=recFetchStore(body, ms).then(r=>{
        if(r && r.ok && JSON.stringify(r)!==c.s){
          // 画面側の手元の控え（RC）も新しくして描き直す
          if(a==='koji_today') RC.koji[body.date]=r;
          if(a==='bunseki_get') RC.bun[body.no]=r;
          if(a==='shubo_get') RC.shubo[body.no]=r;
          if(a==='karte') RC.karte[body.no]=r;
          if(!body._pf) fastRerender(myTop);
        }
      }).catch(()=>{}).finally(()=>{ delete REC_BG[k]; });
    }
    try{ return JSON.parse(c.s); }catch(e){}
  }
  return recFetchStore(body, ms);
};
/* 仕込の一覧（state）：保存分をすぐ返し、1分より古ければ裏で最新 */
let REC_STATE_BG=null;
recState = async function(force){
  if(!RC.state){ const c=lsGet('rec.state',null); if(c&&c.master){ RC.state=c; RC.at=c._at||0; } }
  const net=()=>recApiNet({action:'state'},40000).then(j=>{
    if(j&&j.ok){ const changed=!RC.state || JSON.stringify(j)!==JSON.stringify(Object.assign({},RC.state,{_at:undefined})); j._at=Date.now(); RC.state=j; RC.at=j._at; lsSet('rec.state',j); return changed; }
    return false;
  }).catch(()=>false);
  if(!force && RC.state){
    if(Date.now()-RC.at>60000 && !REC_STATE_BG){
      const myTop=nav[nav.length-1];
      REC_STATE_BG=net().then(ch=>{ REC_STATE_BG=null; if(ch) fastRerender(myTop); });
    }
    return RC.state;
  }
  await net();
  return RC.state;
};

/* ---------- 先読み ---------- */
const HOME_KEYS = { bCal:'cal', bRice:'rice', bKoji:'koji', bBun:'bun', bShk:'shk', bWash:'wash', bCalc:'calc', bLib:'lib', bMan:'man', bQuiz:'quiz' };
document.addEventListener('click', e=>{
  const el=e.target.closest && e.target.closest('#app .hxb, #app .crs, #app a.btn');
  if(!el || !FAST.onHome) return;
  const href=el.getAttribute('href')||'';
  const k=HOME_KEYS[el.id] || (href.indexOf('seishu-jiten')>=0?'jiten':href.indexOf('voice')>=0?'voice':'');
  if(k) useAdd('f', k);
}, true);

function libAt(){ return lsGet('fast.libAt',0); }
const PF_TASKS = {
  // 軽いもの：だれでも先読み
  mfg:  { light:true, ttl:3*60000, run:()=>mfgRefresh(), at:()=>MFG&&MFG._at||0 },
  wash: { light:true, ttl:3*60000, run:()=>{ wsFromCache(); return wsFetch(); }, at:()=>WS.loadedAt||0 },
  rec:  { light:true, ttl:2*60000, run:()=>recState(true), at:()=>RC.at||0 },
  koji: { light:true, ttl:2*60000, run:()=>recFetchStore({action:'koji_today',date:dtoday(),_pf:1},40000), at:()=>0, pcKey:()=>recKey({action:'koji_today',date:dtoday()}) },
  manlist: { light:true, ttl:30*60000, run:()=>manFetchList(), at:()=>MAN_LIST&&MAN_LIST.got||0 },
  // 重いもの：使ったことのある人だけ
  lib:  { ttl:12*3600000, run:()=>libRefresh().then(()=>lsSet('fast.libAt',Date.now())), at:libAt },
  tanks:{ ttl:2*60000, run:pfTanks, at:()=>0 },
  manbody:{ ttl:30*60000, run:pfManuals, at:()=>lsGet('fast.manAt',0) },
  libs: { ttl:7*86400000, run:pfLibs, at:()=>lsGet('fast.libsAt',0) },
  jiten:{ ttl:6*3600000, run:()=>fetch('seishu-jiten.html',{cache:'no-cache'}).then(()=>lsSet('fast.jitenAt',Date.now())), at:()=>lsGet('fast.jitenAt',0) }
};
/* 項目 → 先読みするもの */
const F_NEEDS = {
  cal:['mfg'], rice:['mfg'], koji:['koji'], bun:['rec','tanks'], shk:['rec','tanks'], wash:['wash'],
  lib:['lib'], man:['manlist','manbody','libs'], jiten:['jiten']
};
async function pfTanks(){
  // よく見るタンク（順号）上位3つの分析・酒母・カルテ
  const nos=useRank('tank').slice(0,3);
  for(const no of nos){
    for(const a of ['bunseki_get','shubo_get','karte']){
      const k=recKey({action:a,no}); const c=await PC.get(k);
      if(c && Date.now()-c.at<120000) continue;
      try{ await recFetchStore({action:a,no,_pf:1},50000); }catch(e){}
    }
  }
}
async function pfManuals(){
  // よく開くマニュアル上位3つの本文を端末に保存（内容が変わっていなければ取らない）
  if(!MAN_LIST || !MAN_LIST.files) await manFetchList();
  if(!MAN_LIST || !MAN_LIST.files) return;
  const ids=useRank('man').slice(0,3);
  for(const id of ids){
    const f=MAN_LIST.files.find(x=>x.id===id); if(!f) continue;
    const c=await PC.get('man:'+id); if(c && c.mtime===f.mtime) continue;
    try{
      const j=await apiT({action:'mfg_man_get', token:ST.token, id}, 90000);
      if(j && j.ok) await PC.set('man:'+id, { mtime:f.mtime, ext:String(j.ext||f.ext).toLowerCase(), bytes:manB64ToBytes(j.b64) });
    }catch(e){}
  }
  lsSet('fast.manAt',Date.now());
}
async function pfLibs(){
  // Word・Excelを表示する部品（サービスワーカーが端末に持つ）
  for(const u of Object.values(MAN_LIBS)){ try{ await fetch(u,{mode:'no-cors'}); }catch(e){} }
  lsSet('fast.libsAt',Date.now());
}
async function fastPrefetch(){
  if(!ST.token || FAST.running) return;
  FAST.running=true; FAST.last=Date.now();
  try{
    const saveData = navigator.connection && navigator.connection.saveData;
    // よく使う項目の順に、必要な先読みを並べる（重複は1回）
    const order=[], seen={};
    const push=t=>{ if(!seen[t]){ seen[t]=1; order.push(t); } };
    const used=useRank('f');
    used.forEach(f=>(F_NEEDS[f]||[]).forEach(push));
    // 使ったことがなくても、軽いものはだれでも
    Object.keys(PF_TASKS).forEach(t=>{ if(PF_TASKS[t].light) push(t); });
    const todo=order.filter(t=>{
      const p=PF_TASKS[t]; if(!p) return false;
      if(saveData && !p.light) return false;
      if(!p.light && !used.some(f=>(F_NEEDS[f]||[]).indexOf(t)>=0)) return false;
      return Date.now()-(p.at()||0) > p.ttl;
    });
    // 3本ずつ並べて取る（サーバーが別なので並べても混まない）
    let i=0;
    const worker=async()=>{ while(i<todo.length){ const t=todo[i++]; try{ await PF_TASKS[t].run(); }catch(e){} } };
    await Promise.all([worker(),worker(),worker()]);
  } finally { FAST.running=false; }
}

/* ---------- ホームに割り込む（先読みのきっかけ） ---------- */
(function(){
  const _home=home;
  home=function(){ const r=_home.apply(this, arguments); FAST.onHome=true; setTimeout(fastPrefetch, 800); return r; };
  // 起動時にすでにホームが出ていたら、それも差し替える
  for(let i=0;i<nav.length;i++){ if(nav[i]===_home) nav[i]=home; }
  if(nav[nav.length-1]===home || app.querySelector('#bCal')){ FAST.onHome=true; setTimeout(fastPrefetch, 800); }
  const _go2=go;
  go=function(fn,push){ FAST.onHome=(fn===home); return _go2(fn,push); };
  hBack.addEventListener('click', ()=>{ setTimeout(()=>{ FAST.onHome=(nav[nav.length-1]===home); },0); });
})();
/* アプリに戻ってきたとき（5分以上たっていれば）も先読み */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && Date.now()-FAST.last>5*60000) setTimeout(fastPrefetch, 500);
});
/* ログアウトしたら、この端末に保存した記録系の控えを消す */
(function(){ const _lo=logout; logout=function(){ PC.delPrefix('rec:'); PC.delPrefix('man:'); return _lo.apply(this, arguments); }; })();

/* ---------- サービスワーカー（画面のファイルと表示用の部品を端末に持つ） ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ここまで読み込めたので、米管理・出勤表のデータ（MFG）が使えるようになった。
   ホームを開いたままなら、赤い丸と「きょう」の行を出すために一度だけ描き直す。 */
try{ if(ST && ST.token && nav.length<=1 && typeof app!=='undefined' && app.querySelector('.hx')) go(home,false); }catch(e){}
