/* ---- 一覧 ---- */
async function znScreen(kind,o){
  o=o||{};
  const K=kind==='shubo'?'酒母':'仕込み';
  if(o.no&&!rcMaster(o.no)) await recState(false);
  const m=o.no?rcMaster(o.no):null;
  head(`昨年度の${K}`, m?`今年 順号${o.no} ${m.liquid||''} と同じ時期`:'きょうと同じ時期');
  rcLoading('昨年度のデータを読み込んでいます…（はじめてのときは少し時間がかかります）');
  const D=await znLoad(false);
  if(!D||!D.ok){ rcFail(D&&D.err==='unknown_action'?'昨年度のデータは、Apps Script「醸造記録 R8BY」に <b>昨年度参照.gs</b> を入れると出ます。':'昨年度のデータを読み込めませんでした。電波の届く所でもう一度開いてください。'); return; }
  const sh=znByShift();
  if(o.anc===undefined){ o.anc = m?(kind==='shubo'?m.motodate:(m.soe||m.tome)):dtoday(); if(!o.anc) o.anc=dtoday(); }
  const liq=m?(m.liquid||''):'', sym=m?(kind==='shubo'?(m.shuboSym||''):(m.sym||'')):'';
  let view=o.view||lsGet(kind==='moromi'?'zn.view':'zn.sview','card'); if(kind==='shubo'&&view==='tbl') view='card';
  const win=view==='tbl'?'all':(o.win||lsGet('zn.win',7)), only=!!o.only&&!!liq;
  const list=(kind==='shubo'?D.shubo:D.moromi).map(x=>{ const dd=kind==='shubo'?x.d0:(x.st.soe[0]||x.st.tome[0]); const now=znYear(dd,sh);
      return {x, dd, now, diff:now?rcDays(o.anc,now):9999, same: liq?znSameLiq(x.lq,liq):false}; })
    .filter(r=>r.dd && (win==='all'||Math.abs(r.diff)<=win) && (!only||r.same))
    .sort((a,b)=>a.dd.localeCompare(b.dd)||a.x.no-b.x.no);
  let near=null; list.forEach(r=>{ if(!near||Math.abs(r.diff)<Math.abs(near.diff)||(Math.abs(r.diff)===Math.abs(near.diff)&&r.same&&!near.same)) near=r; });
  const lastY=znYear(o.anc,-sh);
  let h=`<div class="zn-ban">${esc(D.by)}（${esc(String(Number(lastY.slice(0,4))))}年）の分析${kind==='shubo'?'酒母':'醪'}シートから。${kind==='shubo'?'酛立日':'添日'}を1年ずらして並べています。押すと経過表。</div>`;
  h+=`<div class="zn-anc"><button data-mv="-7">‹ 前の週</button><div><small>基準日（今年）</small><b>${djp(o.anc)}</b><small>昨年なら ${rcMD(lastY)}</small></div><button data-mv="7">次の週 ›</button></div>`;
  h+=`<div class="shk-tabs"><button data-vw="card" class="${view==='card'?'on':''}">1本ずつ</button>${kind==='moromi'?`<button data-vw="tbl" class="${view==='tbl'?'on':''}">仕込み時の表</button>`:''}<button data-vw="grid" class="${view==='grid'?'on':''}">経過の表</button></div>`;
  if(view!=='tbl') h+=`<div class="rc-bar">${[[7,'±7日'],[14,'±14日'],['all','全部']].map(([k,l])=>`<button class="rc-chip ${String(win)===String(k)?'on':''}" data-win="${k}">${l}</button>`).join('')}
    ${liq?`<button class="rc-chip ${only?'on':''}" id="znOnly">同じ液種だけ（${esc(liq)}）</button>`:''}${o.anc!==dtoday()&&!m?`<button class="rc-chip" id="znToday">きょうに戻す</button>`:''}</div>`;
  else h+=`<div class="rc-bar">${liq?`<button class="rc-chip ${only?'on':''}" id="znOnly">同じ液種だけ（${esc(liq)}）</button>`:''}<span class="tl-note" style="margin:0">添・仲・留（水麹・氷・品温・尺/ℓ）から 四段・アル添・上槽 まで。シーズンの最初から最後の仕込みまで全部。黄色＝基準日にいちばん近い仕込。</span></div>`;
  if(view==='grid') h+= list.length? `<div id="znKg"></div><p class="sh-note">分析${kind==='shubo'?'酒母':'醪'}シートと同じ並び。右へ送ると${kind==='shubo'?'酛卸':'上槽'}まで。${kind==='moromi'?'最後の列「上槽」＝四アル上槽シートの上槽後（合算）。':''}左の順号を押すとその1本の画面。</p>` : `<p class="muted" style="text-align:center;padding:20px 0">この期間に昨年度の${K}はありません（‹ › や「全部」で探せます）</p>`;
  else if(view==='tbl') h+= list.length? znTblHTML(list,near) : `<p class="muted" style="text-align:center;padding:20px 0">該当する昨年度の仕込みはありません</p>`;
  else h+= list.length? list.map(r=>znRowHTML(kind,r,r===near)).join('') : `<p class="muted" style="text-align:center;padding:20px 0">この期間に昨年度の${K}はありません（‹ › や「全部」で探せます）</p>`;
  h+=`<div class="rc-bar" style="margin-top:8px"><button class="rc-ghost" id="znRe">読み直す</button><span class="tl-note" style="margin:0">緑の帯＝同じ液種、黄色の枠＝いちばん近い日。${esc(D.by)}のデータは変更しません（読むだけ）。</span></div>`;
  app.innerHTML=h;
  if(view==='grid'&&list.length) kgBox($('#znKg'), kind==='shubo'?kgFieldsShubo:kgFieldsMoromi, list.map(r=>znGridRow(kind,r,r===near)), kind==='moromi'?{setKind:'moromi',last:true,lastField:kgHTML._lastMoromi,outLabel:'記録なし',noMiss:true}:{setKind:'shubo',shubo:true,outLabel:'記録なし',noMiss:true}, no=>go(()=>(kind==='shubo'?znShuboSheet:znMoromiSheet)(no,o.no||'')));
  app.querySelectorAll('[data-vw]').forEach(b=>b.onclick=()=>{ lsSet(kind==='moromi'?'zn.view':'zn.sview',b.dataset.vw); znScreen(kind,{...o,view:b.dataset.vw}); });
  app.querySelectorAll('.zn-t tr[data-no]').forEach(b=>b.onclick=()=>go(()=>znMoromiSheet(b.dataset.no,o.no||'')));
  { const g1=app.querySelector('.zn-t tr.g1'); if(g1) app.querySelectorAll('.zn-t tr.g2 th').forEach(t=>t.style.top=g1.offsetHeight+'px'); }
  const tw=$('#znTw'), tn=tw&&tw.querySelector('tr.near'); if(tn) tw.scrollTop=Math.max(0,tn.offsetTop-tw.clientHeight/2);
  app.querySelectorAll('.zn-row[data-no]').forEach(b=>b.onclick=()=>go(()=>(kind==='shubo'?znShuboSheet:znMoromiSheet)(b.dataset.no,o.no||'')));
  app.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{ const w=b.dataset.win==='all'?'all':Number(b.dataset.win); lsSet('zn.win',w); znScreen(kind,{...o,win:w}); });
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>znScreen(kind,{...o,anc:dadd(o.anc,Number(b.dataset.mv))}));
  const on=$('#znOnly'); if(on) on.onclick=()=>znScreen(kind,{...o,only:!only});
  const tb=$('#znToday'); if(tb) tb.onclick=()=>znScreen(kind,{...o,anc:dtoday()});
  $('#znRe').onclick=async()=>{ rcLoading('昨年度のデータを読み直しています…'); await znLoad(true); znScreen(kind,o); };
  const nr=app.querySelector('.zn-row.near'); if(nr&&list.length>6) nr.scrollIntoView({block:'center'});
}
/* 仕込み時の表：添・仲・留 × 水麹・氷・品温（仕込み後）・尺・ℓ（分析醪の 添H・仲M・留P 列。st＝[日付,尺,量,汲水,氷,水麹,蒸米,品温]） */
function znTblHTML(list,near){
  /* 列：[見出し, 単位, 値を出す関数(x)→文字 or [上段,下段], 色のclass] */
  const N=(v,d)=>{ const n=shN(v); return n===null?'':shF(n,d); };
  const S=(k,i,d)=>x=>N((x.st[k]||[])[i],d);
  const TW=(k)=>x=>[N((x.st[k]||[])[1],0),N((x.st[k]||[])[2],0)];
  const stage=(k,ice)=>[['水麹','℃',S(k,5,1),'mz'], ...(ice?[['氷','L',S(k,4,0),'ice']]:[]), ['品温','℃',S(k,7,1),'hin'], ['尺<br>ℓ','mm／L',TW(k),'sr']];
  const J=x=>x.jo||{};
  const sg=v=>v===''?'':(Number(v)>0?'+':'')+v;
  const josoDate=x=>{ const j=J(x), t=x.st.tome[0]; let d=j.date, mark='';
    if(!d||!t||rcDays(t,d)<5||rcDays(t,d)>60){ d=t&&x.v&&x.v.length?dadd(t,x.v.length-1):''; mark=d?'*':''; }
    return {d, mark, n:d&&t?rcDays(t,d)+1:null}; };
  const grp=[
    ['添', stage('soe',false)], ['仲', stage('naka',true)], ['留', stage('tome',true)],
    ['四段・アル添', [['四段','L',x=>N(J(x).yd&&(J(x).yd.outL??J(x).yd.L),0),''], ['アル添','L',x=>N(J(x).alcL,0),'alc']]],
    ['上槽', [['日付<br>日数','',x=>{ const o=josoDate(x); return [o.d?rcMD(o.d)+o.mark:'', o.n?o.n+'日':'']; },'sr'],
              ['尺<br>ℓ','上槽時',x=>[N(J(x).shaku,0),N(J(x).L,0)],'sr'],
              ['前 度<br>alc','',x=>{ const p=J(x).pre||{}; return [sg(N(p.smv,1)),N(p.alc,1)]; },'sr'],

              ['上槽量','L',x=>N(J(x).outL,0),''],

  let h=`<div class="zn-tw" id="znTw"><table class="zn-t"><thead><tr class="g1"><th class="k" rowspan="2">順号・液種<small style="color:var(--sub);font-size:10px;font-weight:400">添日（昨年）</small></th>${grp.map(([g,cols])=>`<th class="g" colspan="${cols.length}">${g}</th>`).join('')}</tr>

  list.forEach(r=>{ const x=r.x;
    h+=`<tr data-no="${x.no}" class="${r.same?'same':''} ${r===near?'near':''}"><td class="k"><b>${x.no} ${esc(x.sym)}</b> ${esc(x.lq)}<small>添 ${rcMD(x.st.soe[0])}・T${esc(x.tk||'—')}</small></td>`;

}

async function znShuboSheet(no,r8){

  head(`${by} 酒母 順号 ${x.no}　${x.sym}`, `${x.lq}　T${x.tk||'—'}　酵母 ${x.ys||'—'}　酛立 ${rcMD(x.d0)}`);
  const m=r8?rcMaster(r8):null, cur=r8?RC.shubo[r8]:null, dT=m?rcShuboDay(m,dtoday()):0;
  const s=znSum('shubo',x);
  let h=`<div class="zn-ban">昨年度（${esc(by)}）の記録です。入力はできません。${m?`緑の線＝今年 順号${r8}（${esc(m.liquid||'')}）、黄色の列＝今年と同じ日目。`:''}</div>`;
  h+=`<div class="sh-tiles"><div><small>酛立（昨年）</small><b>${rcMD(x.d0)}</b></div><div><small>日数</small><b>${s.n}日</b></div>
    <div><small>Be${s.sm?'（'+s.sm.day+'日）':''}</small><b>${s.sm?shF(s.sm.sm):'—'}</b></div><div><small>酸度${s.ta?'（'+s.ta.day+'日）':''}</small><b>${s.ta?shF(s.ta.ta):'—'}</b></div></div>`;
  const st=x.st||[];
  h+=`<div class="sh-setup" style="cursor:default"><span class="t">仕込時</span>${[['仕込尺','mm',0],['仕込量','L',0],['水麹','℃',1],['蒸米','℃',1]].map(([l,u,d],i)=>`<span><small>${l}</small><b>${st[i]!==null&&st[i]!==undefined?shF(st[i],d)+'<i>'+u+'</i>':'—'}</b></span>`).join('')}</div>`;
  const n=Math.max(days.length, cur&&cur.days?Math.min(cur.days.length,13):0);
  const lab=[...Array(n)].map((_,i)=>i+1);
  const ser=[{name:'昨年Be', color:'#1f5fa8', axis:'L', vals:lab.map(d=>{ const y=days[d-1]; return y?shN(y.sm):null; })},
    {name:'昨年品温', color:'#c0392b', axis:'R', vals:lab.map(d=>{ const y=days[d-1]; return y?shN(y.tAM):null; }), pm:lab.map(d=>{ const y=days[d-1]; return y?shN(y.tPM):null; })}];
  if(cur&&cur.days) ser.splice(1,0,{name:'今年Be', color:'#3f9a2f', axis:'L', vals:lab.map(d=>{ const y=cur.days[d-1]; return y?shN(y.be):null; })});
  h+=shChart(n, lab, ser, m&&dT>=1?dT-1:-1);
  h+=shTable(days, d=>d.day, [['Be',d=>shF(d.sm)],['alc',d=>shF(d.alc)],['酸度',d=>shF(d.ta)],['アミノ酸',d=>shF(d.aa)],
    ['品温',d=>{ const a=shF(d.tAM), p=shF(d.tPM); return a||p?`${a||'—'}<span class="pm">${p||'—'}</span>`:''; }]], m&&dT>=1?dT:-1);
  const mr=znFind('moromi',x.no);
  h+=`<p class="sh-note">品温は上段＝午前・下段(小)＝午後。乳酸 ${x.ny!==null?x.ny+'ml':'—'}・酛卸 ${rcMD(x.oro)}${x.bk?'・備考：'+esc(x.bk):''}。</p>`;
  if(mr) h+=`<button class="sh-link" id="znTo">🍶 この酒母で仕込んだ醪（${esc(by)} 順号${mr.no} ${esc(mr.lq)}）<span>›</span></button>`;
  app.innerHTML=h; znScroll();
  const t=$('#znTo'); if(t) t.onclick=()=>go(()=>znMoromiSheet(mr.no,''));
}

function znJoHTML(x){

  const N=(v,d)=>{ const n=shN(v); return n===null?'—':shF(n,d); }, sg=v=>v==='—'?v:(Number(v)>0?'+':'')+v, yd=j.yd||{}, p=j.pre||{}, q=j.post||{};

    <tr><td class="k">量</td><td class="v">${N(yd.outL??yd.L,0)}</td><td class="v">${N(j.alcL,0)}</td><td class="v">${N(j.L,0)}</td></tr>
    <tr><td class="k">尺</td><td></td><td></td><td class="v">${N(j.shaku,0)}</td></tr>

    <div class="sh-tw" style="margin-top:6px"><table class="sh-t"><tr><th class="k"></th><th>日本酒度</th><th>alc</th><th>酸度</th><th>ｱﾐﾉ</th></tr>
    <tr><td class="k">上槽前</td><td class="v">${sg(N(p.smv,1))}</td><td class="v">${N(p.alc,1)}</td><td class="v">${N(p.ta,1)}</td><td class="v">${N(p.aa,1)}</td></tr>
    <tr><td class="k">上槽後</td><td class="v">${sg(N(q.smv,1))}</td><td class="v">${N(q.alc,1)}</td><td class="v">${N(q.ta,1)}</td><td class="v">${N(q.aa,1)}</td></tr></table></div>
    <p class="sh-note">上槽量 ${N(j.outL,0)}L・粕歩合 ${N(j.kasuP,1)}%・粕 ${N(j.kasuKg,0)}kg。—＝シートに記録なし。</p></div>`;

/* ---- 1本：醪 ---- */
async function znMoromiSheet(no,r8){
  const D=await znLoad(false); const x=D&&D.ok&&znFind('moromi',no);
  if(!x){ rcFail('昨年度の仕込みが見つかりません'); return; }
  const by=D.by, days=x._days||(x._days=znDays('moromi',x)), S=x.st;
  head(`${by} 順号 ${x.no}　${x.sym}号`, `${x.lq}　T${x.tk||'—'}　酵母 ${x.ys||'—'}　総米 ${x.sou!==null?x.sou+'t':'—'}`);
  const m=r8?rcMaster(r8):null, cur=r8?RC.bun[r8]:null, dT=m?rcMoromiDay(m,dtoday()):0;
  const s=znSum('moromi',x), dl=d=>d===1?'留':d;
  let h=`<div class="zn-ban">昨年度（${esc(by)}）の記録です。入力はできません。${m?`緑の線＝今年 順号${r8}（${esc(m.liquid||'')}）、黄色の列＝今年と同じ日目。`:''}</div>`;
  h+=`<div class="sh-tiles"><div><small>添／留（昨年）</small><b style="font-size:14px">${rcMD(S.soe[0])}／${rcMD(S.tome[0])}</b></div><div><small>醪日数</small><b>${s.n}日</b></div>
    <div><small>最後の${s.sm&&s.sm.kind==='度'?'日本酒度':'Be'}</small><b>${s.sm?shF(s.sm.sm):'—'}</b></div><div><small>最後のalc</small><b>${s.alc?shF(s.alc.alc):'—'}</b></div></div>`;
  // 仕込み時（添・踊・仲・留）
  const stg=[['soe','添'],['odori','踊'],['naka','仲'],['tome','留']];
  const rowsS=[['尺',1,0],['量',2,0],['汲水',3,0],['氷',4,0],['水麹',5,1],['蒸米',6,1],['品温',7,1]], rowsO={'Be':1,'酸度':2,'ｱﾐﾉ':3,'品温':4};
  let t=`<div class="rc-h" style="margin-top:4px">仕込み時<small>分析醪シートの 添・踊・仲・留（昨年）</small></div><div class="sh-st"><div class="sh-tw"><table class="sh-t"><tr><th class="k"></th>${stg.map(([k,l])=>`<th>${l}<br><span style="font-weight:400">${rcMD((S[k]||[])[0])}</span></th>`).join('')}</tr>`;
  [...rowsS.map(r=>r[0]),'Be','酸度','ｱﾐﾉ'].filter((v,i,a)=>a.indexOf(v)===i).forEach(lb=>{
    t+=`<tr><td class="k">${lb}</td>${stg.map(([k])=>{ const a=S[k]||[];
      if(k==='odori'){ const i=rowsO[lb]; return i?`<td class="v">${shF(a[i],1)}</td>`:`<td style="background:#f6f3ea"></td>`; }
      const rr=rowsS.find(r=>r[0]===lb); return rr?`<td class="v">${shF(a[rr[1]],rr[2])}</td>`:`<td style="background:#f6f3ea"></td>`; }).join('')}</tr>`; });
  h+=t+`</table></div></div>`;
  h+=znJoHTML(x);
  if(x.zai&&x.zai.length) h+=`<div class="zn-zai">${x.zai.map(([nm,q])=>`<span>${esc(nm)}${q!==null?` <b>${shF(q,0)}</b>`:''}</span>`).join('')}</div>`;
  const n=Math.max(days.length, cur&&cur.days?Math.min(cur.days.length, Math.max(dT||0,1)+2):0);
  const lab=[...Array(n)].map((_,i)=>dl(i+1));
  const yv=(k)=>[...Array(n)].map((_,i)=>{ const y=days[i]; return y&&y[k]!==undefined?shN(y[k]):null; });
  const ser1=[{name:'昨年BMD', color:'#1f5fa8', axis:'L', vals:yv('bmd')},{name:'昨年品温', color:'#c0392b', axis:'R', dash:true, vals:yv('tAM')}];
  const ser2=[{name:'昨年Be/度', color:'#1f5fa8', axis:'L', vals:[...Array(n)].map((_,i)=>{ const y=days[i]; return y&&y.beq!==undefined?y.beq:null; })},{name:'昨年alc', color:'#8a6cc8', axis:'R', vals:yv('alc')}];
  if(cur&&cur.days){
    const cb=[...Array(n)].map((_,i)=>shN(((cur.calc||{})[i+1]||{}).bmd));
    ser1.splice(1,0,{name:'今年BMD', color:'#3f9a2f', axis:'L', vals:cb});
    let meter=false; const ce=[...Array(n)].map((_,i)=>{ const y=cur.days[i]; const v=y?shN(y.be):null; if(v===null) return null; if(v<0) meter=true; return meter?Math.round(-v*10)/100:v; });
    ser2.splice(1,0,{name:'今年Be', color:'#3f9a2f', axis:'L', vals:ce});
  }
  h+=shChart(n, lab, ser1, m&&dT>=1?dT-1:-1);
  h+=shChart(n, lab, ser2, m&&dT>=1?dT-1:-1);
  h+=shTable(days, d=>dl(d.day), [['Be/度',d=>shF(d.sm)],['alc',d=>shF(d.alc)],['酸',d=>shF(d.ta)],['ｱﾐﾉ',d=>shF(d.aa)],['追水',d=>shF(d.oimizu,0)],
    ['品温',d=>{ const a=shF(d.tAM), p=shF(d.tPM); return a||p?`${a||'—'}${p?`<span class="pm">${p}</span>`:''}`:''; }],['BMD',d=>d.bmd!==undefined?shF(d.bmd):'']], m&&dT>=1?dT:-1);
  h+=`<p class="sh-note">2つめのグラフの Be/度 は、日本酒度を Be に直して（−日本酒度÷10）つないでいます。BMD＝Be×日数（Be がプラスの間）。追水 計 ${shF(days.reduce((a,d)=>a+(d.oimizu||0),0),0)}L（予定 ${x.oiP!==null?x.oiP:'—'}L）・最高品温 ${s.tMax!==null?shF(s.tMax)+'℃':'—'}${s.bmd?`・BMD最大 ${shF(s.bmd.v)}（${s.bmd.day}日目）`:''}。</p>`;
  const sb=znFind('shubo',x.no);
  if(sb) h+=`<button class="sh-link" id="znTo">🧫 この醪の酒母（${esc(by)} 順号${sb.no} 酛立 ${rcMD(sb.d0)}）<span>›</span></button>`;
  app.innerHTML=h; znScroll();
  const tt=$('#znTo'); if(tt) tt.onclick=()=>go(()=>znShuboSheet(sb.no,''));
}

function znWrap(name, place){

      place(b); znBindBtn(); }catch(e){}
    return r;
  };
}

/* ================= 🧫 酒母：一覧の表にそのまま入力・グラフを表の背景に（2026-10-05） =================
   泰広さん指示：酒母のページに入ったら、そのページで入力をそのままできるように。タンク番号は順号の下に表示、

   ・表のマス（Be・alc・酸度・アミノ酸・品温AM・品温PM・備考）を、1日目〜きょうの列まで直接入力（1・2日目は分析しないので Be・alc・酸度・アミノ酸は出さない）。

   ・入れたマスは黄色の枠＝未保存。下に出る「保存」でまとめて保存（shubo_save を 酒母×日 ごとに送る）
   ・Enter で同じ日の下のマスへ。数字でないものは赤、ありえない値は橙（保存のとき確認）
   ・仕込時の値（仕込尺・仕込量・水麹・蒸米）が未入力の酒母は、日々のマスを止める（今までの決まり）
   ・左の順号（タンク番号）を押すと、仕込時の値・酛卸日・酒母の備考の小さな入力窓（kgeDialog）
   ・背景のグラフ：酒母ごとに Be（青）・品温AM（赤点線）・PM（橙点線）を、その日の列の位置に半透明で描く（kgBg）
   ・表の描き直し（データが届いたとき）でも、未保存の値とカーソルの位置は残す（KGE.dirty） */
const KGE={ dirty:{}, draw:null, bg:null, msg:'' };
const kgFieldsShuboNow=[['日付',d=>d.date?rcMD(d.date):'','dt'],['Be',d=>kgN(d.sm,1),'','be'],['alc',d=>kgN(d.alc,1),'','alc'],['酸度',d=>kgN(d.ta,1),'','ta'],['アミノ酸',d=>kgN(d.aa,1),'','aa'],['品温AM',d=>kgN(d.tAM,1),'','temp'],['品温PM',d=>kgN(d.tPM,1),'','tPM'],['備考',d=>d.biko?`<span style="font-weight:400;font-size:10px">${esc(String(d.biko).slice(0,6))}</span>`:'','bk','biko']];
const KGE_RANGE={be:[-5,25,'Be'],alc:[0,22,'alc'],ta:[0,30,'酸度'],aa:[0,10,'アミノ酸'],temp:[0,40,'品温AM'],tPM:[0,40,'品温PM']};
const kgeKey=el=>`${el.dataset.no}|${el.dataset.day}|${el.dataset.k}`;

/* 備考（日ごと）：暖器／冷器／その他（自由に入力）を選ぶ（2026-10-05 泰広さん指示） */
const KGE_BIKO=['暖器','冷器'];
function kgeBikoSel(r, i, val, fl){

/* 「その他…」を選んだら、そのマスを文字の入力欄に切り替える */
function kgeToText(box, sel, val){

function kgeWire(box, el){

  if(el.tagName==='INPUT') el.addEventListener('focus',()=>{ try{ el.select(); }catch(e){} });

function kgeBind(box, opt, keep){
  let ins=[...box.querySelectorAll('.kg-i')];

    const key=kgeKey(el);

async function kgeSave(box){
  const ins=[...box.querySelectorAll('.kg-i')].filter(el=>!el.disabled&&kgeChanged(el));

  const G={}, lock=new Set();
  ins.forEach(el=>{ const no=el.dataset.no, day=Number(el.dataset.day), k=el.dataset.k, s=RC.shubo[no];

    const v=el.value.trim(), val=(k==='biko'||k==='shuboT')?v:(v===''?'':String(pnum(v)));
    const g=(G[no+'|'+day]=G[no+'|'+day]||{no,day,values:{},els:[]}); if(day===0) g.shuboT=val; else g.values[k]=val; g.els.push(el); });

  list.forEach(g=>{ const body=g.day===0?{action:'shubo_save',no:g.no,shuboT:g.shuboT}:{action:'shubo_save',no:g.no,day:g.day,values:g.values};
    if(g.day===0){ const m=rcMaster(g.no); if(m) m.shuboT=g.shuboT; try{ if(RC.state) lsSet('rec.state',RC.state); }catch(e){} }
    else { const s=RC.shubo[g.no], D=s&&s.days&&s.days[g.day-1]; if(D) Object.assign(D,g.values); }

  kgeSay(box,`保存を受け付けました（${list.map(nm).join('、')}）。裏で送っています${lock.size?`。順号${[...lock].join('・')} は仕込時の値が未入力のため保存していません`:''}`, lock.size>0);

    kgeSay(box,`保存中… ${i+1}/${list.length}（${nm(g)}）`);
    try{ const body=g.day===0?{action:'shubo_save',no:g.no,shuboT:g.shuboT}:{action:'shubo_save',no:g.no,day:g.day,values:g.values};

      else ng.push(g); }
    catch(e){ ng.push(g); } }
  const nos=[...new Set(ok.filter(g=>g.day>0).map(g=>String(g.no)))];
  nos.forEach(no=>RC.shubo[no]=null);
  if(ng.length) kgeSay(box,`保存できなかった所があります：${ng.map(nm).join('、')}。電波を確認してもう一度「保存」を押してください${lock.size?`（順号${[...lock].join('・')} は仕込時の値が未入力）`:''}`,true);
  else kgeSay(box,`保存しました（${ok.map(nm).join('、')}）${lock.size?`。順号${[...lock].join('・')} は仕込時の値が未入力のため保存していません`:''}`, lock.size>0);
  if(btn) btn.disabled=false;

/* 左の順号を押したとき：仕込時の値・酛卸日・酒母の備考 */
async function kgeDialog(no){

/* 背景のグラフ（酒母ごとに、その酒母の Be〜品温PM の行の高さに、日の列の位置で描く） */
function kgBg(box, rows, fields){
  const wrap=box.querySelector('.kg-wrap'); if(!wrap) return;
  const old=wrap.querySelector('svg.kg-bg'); if(old) old.remove();
  const W=wrap.getBoundingClientRect(); if(!W.width) return;
  const fB=fields.findIndex(f=>f[0]==='Be'), fP=fields.findIndex(f=>f[0]==='品温PM'); if(fB<0||fP<0) return;
  const P=(x,y)=>x.toFixed(1)+','+y.toFixed(1);
  let g='';
  rows.forEach(r=>{
    const trs=[...wrap.querySelectorAll('tr[data-kg]')].filter(t=>t.dataset.kg===String(r.no)); if(trs.length<=fP) return;
    const a=trs[fB].getBoundingClientRect(), b=trs[fP].getBoundingClientRect();
    const y0=a.top-W.top+5, y1=b.bottom-W.top-5; if(y1-y0<24) return;
    const X={}, CW={}; trs[fB].querySelectorAll('td[data-i]').forEach(c=>{ const q=c.getBoundingClientRect(); X[c.dataset.i]=q.left-W.left+q.width/2; CW[c.dataset.i]=q.width; });
    const D=(r.days||[]).filter(d=>X[d.day]!==undefined);
    const pts=k=>D.map(d=>{ const v=d._r?shN(d._r[k]):null; return v===null?null:[X[d.day],v]; }).filter(Boolean);
    const draw=(p,lo,hi,color,w,dash,op)=>{ if(!p.length) return ''; const q=p.map(([x,v])=>[x, y1-(v-lo)/(hi-lo)*(y1-y0)]);
      return (q.length>1?`<polyline points="${q.map(([x,y])=>P(x,y)).join(' ')}" fill="none" stroke="${color}" stroke-width="${w}"${dash?' stroke-dasharray="6 4"':''} stroke-linejoin="round" stroke-linecap="round" opacity="${op}"/>`:'')
        + q.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dash?2.6:3.4}" fill="${color}" opacity="${op}"/>`).join(''); };
    const be=pts('be'), tA=pts('temp'), tP=pts('tPM');
    if(be.length){ const vs=be.map(p=>p[1]); g+=draw(be, Math.min(0,...vs), Math.max(10,...vs)*1.1, '#1f5fa8', 3.2, false, .30); }
    const tv=[...tA,...tP].map(p=>p[1]);
    if(tv.length){ const lo0=Math.min(...tv), hi0=Math.max(...tv), mid=(lo0+hi0)/2, half=Math.max(4,(hi0-lo0)/2+1);
      /* 2026-10-05 AM→PM を時間の順に1本の線（AM＝列の左寄り、PM＝右寄り） */
      const tt=[]; D.forEach(d=>{ const w=(CW[d.day]||0)/4, a=d._r?shN(d._r.temp):null, p=d._r?shN(d._r.tPM):null;
        if(a!==null) tt.push([X[d.day]-w,a]); if(p!==null) tt.push([X[d.day]+w,p]); });
      g+=draw(tt, mid-half, mid+half, '#c0392b', 2.4, true, .45); }
  });

<script>
/* ================= 🛡 誤入力対策（麹・酒母・仕込み）2026-10-04 =================
   泰広さん指示：担当者外が誤操作で入力間違いしないように、入力を変えたときに確認し、保存するときにも確認する。
   対象は 麹・酒母・仕込み（分析のまとめ入力も酒母・醪なので対象）。担当者と、確認なしの端末（伊藤・会社PC・会社PC2・Pad）は今までどおり確認なし。
   ・担当者・確認なしの端末は 醪管理R8BY の「入力担当」シート（区分＝麹／酒母／仕込み／確認なし、氏名＝名簿の名前 か ID）
     → Apps Script「醸造記録 R8BY」の 入力担当.gs が state に inputStaff として付ける。シートを直せば次の読み込みから効く
   ・inputStaff がまだ届いていない（入力担当.gs を入れる前）ときは、だれにも確認を出さない（今までどおり）
   ・確認：①入力欄の値を変えて欄を離れたとき「〇〇を A → B に変えますか？」（やめる→元の値に戻す）
           ②「保存」「まとめて保存」「消す」を押したとき、変えた項目の一覧を出して「保存しますか？」
   控え：seishu-workbook_github\_src_guard.js（index.html の guard の目印の間）

const IG={ kind:'', top:null };
const igNorm=s=>String(s==null?'':s).replace(/[\s　]/g,'');
function igStaff(){ const st=RC.state||lsGet('rec.state',null); return st&&st.inputStaff||null; }
/* この端末（ログインした人）が、その工程で確認を出す相手（担当者外）か */
function igOutsider(kind){
  const L=igStaff(); if(!L||!kind) return false;
  const me=[igNorm(ST&&ST.name), igNorm(ST&&ST.id)].filter(Boolean); if(!me.length) return false;
  const has=a=>(a||[]).some(n=>me.includes(igNorm(n)));
  if(has(L.free)) return false;

  return !has(L[kind]);
}
const IG_KIND_NAME={koji:'麹',shubo:'酒母',moromi:'仕込み',bun:'分析（酒母・醪）'};
function igActive(){ return IG.kind && IG.top===nav[nav.length-1] && igOutsider(IG.kind); }
function igBanner(){

  d.innerHTML=`🛡 <b>${esc(IG_KIND_NAME[IG.kind]||'')}の担当者以外の入力です</b><small>値を変えたとき・保存するときに確認が出ます（${esc((ST&&ST.name)||'')}）</small>`;

(function(){ const s=document.createElement('style'); s.textContent=`
.ig-ban{background:#fff1e0;border:1px solid #e9a25a;color:#7a3d00;border-radius:10px;padding:8px 10px;margin:8px 0 10px;font-size:13px}
.ig-ban small{display:block;font-size:11px;color:#8a5a2a;margin-top:2px}`; document.head.appendChild(s); })();
/* 画面ごとの工程 */
[['kojiScreen','koji'],['kojiEdit','koji'],['kyusuiEdit','koji'],['taneScreen','koji'],['shuboInput','shubo'],['shuboHome','shubo'],['moromiInput','moromi'],['moromiSetup','moromi'],['bunHome','bun']].forEach(([name,kind])=>{

    const r=orig.apply(this,a);
    if(r&&typeof r.then==='function') r.then(()=>{ if(IG.top===nav[nav.length-1]) igBanner(); });
    else igBanner();
    return r; };
});
/* 欄の名前 */
function igLabel(el){
  const f=el.closest('.rc-f'); if(f){ const sp=f.querySelector('span'); if(sp) return (sp.childNodes[0]&&sp.childNodes[0].textContent||sp.textContent).trim(); }
  if(el.dataset&&el.dataset.f){ const F={be:'Be',alc:'alc',ta:'酸度',aa:'ｱﾐﾉ'}; const tr=el.closest('tr'); const no=tr&&tr.querySelector('.bn-no,.id,b'); return `${no?no.textContent.trim()+' ':''}${F[el.dataset.f]||el.dataset.f}`; }

}
const igShow=v=>(v===''||v==null)?'（空）':v;
/* ① 値を変えたとき */
document.addEventListener('focusin',e=>{ const el=e.target; if(!(el instanceof HTMLInputElement||el instanceof HTMLSelectElement||el instanceof HTMLTextAreaElement)) return; if(!app.contains(el)) return; el.dataset.igPrev=el.value; },true);
document.addEventListener('change',e=>{
  const el=e.target; if(!(el instanceof HTMLInputElement||el instanceof HTMLSelectElement||el instanceof HTMLTextAreaElement)) return;
  if(!app.contains(el)||el.type==='hidden'||el.dataset.igSkip||!igActive()) return;
  const prev=el.dataset.igPrev!==undefined?el.dataset.igPrev:el.defaultValue;
  if(String(prev)===String(el.value)) return;
  const ok=window.confirm(`【確認】${igLabel(el)} を\n${igShow(prev)} → ${igShow(el.value)}\nに${prev===''?'入れ':'変え'}ます。よろしいですか？\n（${IG_KIND_NAME[IG.kind]||''}の担当者以外の入力）`);

/* ② 保存するとき（押した瞬間、元の処理より先に確認する） */
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest&&e.target.closest('button'); if(!b||!app.contains(b)||b.disabled) return;
  const t=(b.textContent||'').trim(); if(!/保存|消す/.test(t)||!igActive()) return;
  const ch=[]; app.querySelectorAll('input,select,textarea').forEach(el=>{ if(el.type==='hidden'||el.disabled||el.dataset.igSkip) return;
    const dv=el.tagName==='SELECT'?([...el.options].find(o=>o.defaultSelected)||{}).value||'':el.defaultValue;
    if(String(dv)!==String(el.value)) ch.push(`・${igLabel(el)}：${igShow(dv)} → ${igShow(el.value)}`); });

  if(!window.confirm(msg)){ e.preventDefault(); e.stopImmediatePropagation(); }
},true);

/* ================= 🧪 分析者（だれが分析したか）2026-10-04 =================
   泰広さん指示：分析の入力で、だれが分析したか分かるように。スマホ（本人のID）は本人確認できているので選ばなくてよい。
   PC・Pad（共用端末：会社PC・会社PC2・Pad）は名前を選ぶ選択リストを置く。
   ・対象の画面：🧪分析（まとめ入力 bunHome）／醪の入力（moromiInput）／酒母の入力（shuboInput）
   ・本人の端末：上に「分析者：〇〇（ログインしている人）」と出すだけ
   ・共用端末：上に選択リスト（今日の出勤者 → そのほか）。選ぶまで「保存」は止める。選んだ人はその日のあいだ端末に覚える
   ・保存のとき user を「選んだ人（端末名）」にして送る → 醸造記録の「入力ログ」に分析した人が残る */
const IA_SHARED=['会社PC','会社PC2','Pad'];
function igShared(){ const n=igNorm(ST&&ST.name); return IA_SHARED.some(x=>igNorm(x)===n) || /^(会社PC\d*|Pad\d*|共用.*)$/i.test(n); }
function iaGet(){ const v=lsGet('ia.analyst',null); return v&&v.date===dtoday()?v.name:''; }
function iaSet(n){ lsSet('ia.analyst',{date:dtoday(),name:n}); }
function iaNames(){
  let work=[], all=[];
  try{ if(typeof o2Staff==='function'){ const S=o2Staff(); work=S.work||[]; all=S.all||[]; } }catch(e){}
  const L=igStaff()||{}; ['koji','shubo','moromi','free'].forEach(k=>(L[k]||[]).forEach(n=>{ if(!all.includes(n)) all.push(n); }));
  const bad=n=>IA_SHARED.some(x=>igNorm(x)===igNorm(n));
  work=work.filter(n=>!bad(n)); const rest=all.filter(n=>!bad(n)&&!work.includes(n));
  return {work, rest};
}
const IA_SCREENS={bunHome:1, moromiInput:1, shuboInput:1, shuboHome:1};   // shuboHome：2026-10-05 酒母の表に直接入力
let IA_ON=false;
function iaBar(){
  if(!IA_ON||app.querySelector('.ia-bar')) return;
  const d=document.createElement('div');
  if(!igShared()){
    return;   // 2026-10-05 泰広さん指示：スマホ（本人のID）では分析者の帯は出さない（ログインしている人が分析者として記録される）
  } else {
    const cur=iaGet(), N=iaNames();
    const opt=a=>a.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
    d.className='ia-bar sh'+(cur?'':' ng');
    d.innerHTML=`🧪 分析者 <select id="iaSel"><option value="">— だれが分析しましたか —</option>${N.work.length?`<optgroup label="今日の出勤者">${opt(N.work)}</optgroup>`:''}${N.rest.length?`<optgroup label="そのほか">${opt(N.rest)}</optgroup>`:''}</select><small>${esc(ST.name||'')}（共用端末）で入力・保存は選んでから</small>`;
    const s=d.querySelector('select'); s.dataset.igSkip='1';
    s.onchange=()=>{ iaSet(s.value); d.classList.toggle('ng',!s.value); };
  }
  const ban=app.querySelector('.ig-ban'); ban?ban.after(d):app.prepend(d);

(function(){ const s=document.createElement('style'); s.textContent=`
.ia-bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;background:#eef3fb;border:1px solid #9fb3cf;color:#1f3f72;border-radius:10px;padding:8px 10px;margin:8px 0 10px;font-size:14px;font-weight:700}

.ia-bar select{flex:1;min-width:150px;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid #9fb3cf;font-family:inherit}
.ia-bar.ng{background:#fff1e0;border-color:#e9a25a;color:#7a3d00}.ia-bar.ng select{border:2px solid #e9a25a}`; document.head.appendChild(s); })();
Object.keys(IA_SCREENS).forEach(name=>{

document.addEventListener('click',e=>{

<script>
/* ================= 🌡 酒母室の室温（🧫酒母の画面の上）2026-10-05 =================
   泰広さん指示：基本は製造ツールを使う。酒母室の室温もツールから入力。記録器（おんどとり）が届くまでは週1回でも測ればよい。
   ・🧫酒母を開くと一番上に「酒母室の室温」。最新の値・何日前、外気温（津川・参考）
   ・「室温を入れる」→ 室温・メモ → 保存（湿度・除湿機の設定は 2026-10-05 泰広さん指示で入れない）（醸造記録 R8BY の room_save → 醪管理R8BY「酒母室温度」シート）
   ・最後に測ってから7日以上たつとオレンジの帯
   ・判断の主役は酒母室の室温（除湿機で調整）。外気温は参考
   サーバー：醸造記録 R8BY の 気温.gs（room_get／room_save）。控え：seishu-workbook_github\_src_shuboroom.js
   ================================================================================== */
const SR={data:null, open:false};
function srAgo(d){ if(!d) return null; return rcDays(d, dtoday()); }
function srCardHTML(){
  const j=SR.data;
  if(j&&j.err==='unknown_action') return `<div class="card sr-card"><b>🌡 酒母室の室温</b><p class="tl-note" style="margin:6px 0 0">サーバー側（醸造記録 R8BY の 気温.gs）を入れると、ここから入力できます。</p></div>`;
  const last=(j&&j.last&&j.last[0])||null, ago=last?srAgo(last.date):null;
  const sensor=j&&j.sensor, out=j&&j.outdoor;
  let main;
  if(sensor) main=`<b class="sr-v">${sensor.temp}<small>℃</small></b><span class="sr-s">記録器 ${esc(sensor.at||'')}</span>`;
  else if(last) main=`<b class="sr-v">${last.temp}<small>℃</small></b><span class="sr-s">${rcMD(last.date)} ${esc(last.time||'')}・${ago===0?'きょう':ago+'日前'}${last.who?'・'+esc(last.who):''}</span>`;
  else main=`<b class="sr-v">—</b><span class="sr-s">${j?'まだ入力がありません':'読み込み中…'}</span>`;
  const warn=!sensor&&j&&(!last||ago>=7);
  return `<div class="card sr-card${warn?' sr-warn':''}">
    <div class="sr-top"><span class="sr-h">🌡 酒母室の室温</span>${main}
      <button class="rc-ghost" id="srOpen">${SR.open?'閉じる':'室温を入れる'}</button></div>
    ${out?`<div class="sr-out">外気温（津川・参考）${out.t}℃　${esc(out.at||'')}</div>`:''}
    ${warn?`<div class="sr-w">${last?'最後に測ってから'+ago+'日たちました。':'まだ測っていません。'}週1回は測って入れてください（記録器が届くまで）。</div>`:''}
    ${SR.open?`<div class="rc-grid" style="margin-top:10px">
        ${rcField('sr_temp','室温 ℃','',{step:'0.1'})}${rcField('sr_memo','メモ','',{type:'text'})}</div>
      <div class="rc-status" id="srStatus"></div>
      <div class="rc-actions"><button class="rc-btn" id="srSave">室温を保存</button></div>`:''}
  </div>`;
}
function srPaint(){
  const old=app.querySelector('.sr-card'); if(!old) return;
  const d=document.createElement('div'); d.innerHTML=srCardHTML(); const n=d.firstElementChild; old.replaceWith(n); srBind();
}
function srBind(){
  const o=$('#srOpen'); if(o) o.onclick=()=>{ SR.open=!SR.open; srPaint(); if(SR.open){ const t=$('#sr_temp'); if(t) t.focus(); } };
  const s=$('#srSave'); if(s) s.onclick=async()=>{
    const st=$('#srStatus'), t=$('#sr_temp').value.trim();
    const n=Number(String(t).replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
    if(t===''||isNaN(n)||n<-5||n>40){ if(st){ st.textContent='室温を -5〜40 の数字で入れてください'; st.className='rc-status warn'; } return; }
    s.disabled=true; if(st){ st.textContent='保存しています…'; st.className='rc-status'; }
    try{
      const j=await recApi({action:'room_save', temp:n, memo:$('#sr_memo').value.trim()},30000);
      if(j&&j.ok){ SR.data=j; lsSet('rec.room',j); SR.open=false; srPaint(); if(typeof rcStatus==='function') rcStatus('酒母室の室温を保存しました'); }
      else { s.disabled=false; if(st){ st.textContent='保存できませんでした：'+((j&&j.err)||''); st.className='rc-status warn'; } }
    }catch(e){ s.disabled=false; if(st){ st.textContent='通信できませんでした。電波の届く所でもう一度。'; st.className='rc-status warn'; } }
  };
}
async function srLoad(){
  try{ const j=await recApi({action:'room_get'},30000);
    if(j&&j.ok){ SR.data=j; lsSet('rec.room',j); } else if(j&&j.err==='unknown_action'){ SR.data={err:'unknown_action'}; }
  }catch(e){}
  if(!SR.open) srPaint();
}
(function(){
  const orig=window.shuboHome; if(typeof orig!=='function') return;
  window.shuboHome=async function(...a){
    const top=nav[nav.length-1]; const r=await orig.apply(this,a);
    try{ if(nav[nav.length-1]!==top || app.querySelector('.sr-card')) return r;

<script>
/* ================= 🫁 酒母・仕込み：作業日に酸素濃度を測っていなければ知らせる（2026-10-12） =================
   泰広さん指示：タンク洗浄以外、作業があるときは酸素濃度測定されていないとアラート（麹は 9/30 から。酒母・仕込みを足す）。
   作業日（元は仕込マスタ＝本日の予定と同じ dpState().master）：
     酒母＝育成中の酒母がある日（酛立〜酛卸＝添の前日）
     仕込み＝添・仲・留 のどれかがある日
   測定済み＝酸素濃度測定記録の「酒母室」「仕込み」シートに今日の行がある（端末に預かり中の分も含む）。
   知らせ方は麹と同じ：ホームのアイコンに赤い帯「O₂未測定」（O2_ALERT_H 時をすぎてから）／
   🧫酒母・🍶仕込みの上段の青丸O₂が赤く点滅（時刻に関係なく）／測定画面の上に赤い注意書き。
   控え：seishu-workbook_github\_src_o2alert.js（index.html の o2alert の目印の間） */
const O2_WORK_LBL={shubo:'酒母', shikomi:'仕込み'};
function o2AreaWork(area,date){
  if(area==='koji') return o2KojiWork(date);
  const st=(typeof dpState==='function')?dpState():null; if(!st) return null;   // まだ分からない
  const M=st.master||[];
  if(area==='shubo') return M.some(m=>m.motodate && m.motodate<=date && (!m.soe || date<=dadd(m.soe,-1)));
  if(area==='shikomi') return M.some(m=>m.soe===date || m.naka===date || m.tome===date);
  return null;
}
function o2AreaMissing(area){ const d=dtoday(); if(area==='koji') return o2KojiMissing(); return o2AreaWork(area,d)===true && !o2Measured(area,d); }
function o2AreaAlert(area){ return new Date().getHours()>=O2_ALERT_H && o2AreaMissing(area); }
/* 上段の青丸O₂を赤く（酒母＝data-sti="o2"、仕込み＝data-o2="shikomi"） */
function o2MarkIcons(){
  try{
    document.querySelectorAll('.st-ic.st-o2[data-sti="o2"]').forEach(b=>b.classList.toggle('ng',o2AreaMissing('shubo')));
    document.querySelectorAll('.st-ic.st-o2[data-o2="shikomi"]').forEach(b=>b.classList.toggle('ng',o2AreaMissing('shikomi')));
    document.querySelectorAll('.st-ic.st-o2.ng').forEach(b=>b.title='酸素濃度測定（今日はまだ測定していません）');
  }catch(e){}
}
/* 裏で「酒母室」「仕込み」の記録を取り直し、変わったら表示を直す */
const O2_ACHK={};
function o2AreaRefresh(area){
  if(O2_ACHK[area]) return O2_ACHK[area];
  O2_ACHK[area]=(async()=>{
    const before=o2AreaMissing(area), d=dtoday();
    try{
      if(O2_URL && o2AreaWork(area,d) && Date.now()-(O2.at[area]||0)>3*60000){
        if(o2Queue().length) await o2Flush();
        try{ const j=await o2Api({action:'o2_get',area},25000); if(j&&j.ok) o2Store(area,j); }catch(e){}
      }
    }catch(e){}
    O2_ACHK[area]=null;
    o2MarkIcons();
    if(o2AreaMissing(area)!==before && nav[nav.length-1]===home && document.getElementById('dpBox')) go(home,false);
  })();
  return O2_ACHK[area];
}
/* 酒母・仕込みの上段アイコンを描くとき、未測定なら最初から赤 */
(function(){
  if(typeof stiHTML==='function'){ const _s=stiHTML;
    stiHTML=function(){ const h=_s.apply(this,arguments); setTimeout(()=>o2AreaRefresh('shubo'),300); return o2AreaMissing('shubo')?h.replace('class="st-ic st-o2"','class="st-ic st-o2 ng"'):h; }; }
  if(typeof shkTopHTML==='function'){ const _k=shkTopHTML;
    shkTopHTML=function(){ const h=_k.apply(this,arguments); setTimeout(()=>o2AreaRefresh('shikomi'),300); return o2AreaMissing('shikomi')?h.replace('class="st-ic st-o2"','class="st-ic st-o2 ng"'):h; }; }
  const _h=home;
  home=function(){ const r=_h.apply(this,arguments); setTimeout(()=>{ try{ o2AreaRefresh('shubo'); o2AreaRefresh('shikomi'); }catch(e){} },1600); return r; };
  for(let i=0;i<nav.length;i++){ if(nav[i]===_h) nav[i]=home; }

.st-ic.st-o2.ng .o2c{background:#d62b22;box-shadow:0 0 0 3px #f6b3ae;animation:o2Blink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.st-ic.st-o2.ng .o2c{animation:none}}`; document.head.appendChild(s);
})();

<script>
/* ================= 🧬 酵母：植菌のタイミング（🧫酒母の上段アイコン）2026-10-07 =================
   泰広さん指示：酵母の植菌のタイミングがわかるもの。案B（仕込番号ごとの帯グラフ）。植菌だけでよい。
   ・自社培養：植菌日＝酒母仕込日（酛立 motodate）の7日前 → 培養7日 → 酒母仕込（酵母準備表_作成指示書 第2章）
   ・発注の酵母は植菌しない。帯の代わりに「発注締切」を出す
       H13BY（広島）＝酒母仕込日の14日前（2週間前には発注）
       K1801＝酒母仕込日の21日前。3週間以上前なので要注意（赤）
   ・もと：醪管理R8BY 仕込マスタ（recState().master の motodate・yeast）。酵母が空なら酵母割当（yeastOf）
   ・🧫酒母の上段アイコン（🌡室温・O₂・📅昨年度）の右に「🧬酵母」。次の植菌まで何日かを表示
   2026-10-07 追加の指示：
   ・グラフだけを出す（上の一覧・凡例・説明は出さない）。左の見出しは No｜液種｜酵母 の3列（グラフと同じ線で区切る。2026-10-07 泰広さん指示で 液種→酵母 の順に）
   ・過去のは出さない。予定がある分だけ（酵母未定の行は出さない）
   ・行を押すと変更できる：植菌日（発注締切日）・酵母名・個数（リストから）・済
     済にしても、その日（植菌日・締切日）が過ぎるまでは消さない
   ・発注の酵母は「着日」も入れられる → 部署カレンダー「生産本部製造担当」に終日予定で入る（サーバー側で作る・直す・消す）
     着日が入っている発注は、着日が過ぎるまで出す。グラフには紫の「着」
   ・変更の記録先：Apps Script「製造ツール 共有データ」（SHARED_URL）の表「酵母予定」（みんなのスマホで共有）
       id＝R◯_仕込番号_もとの酵母／name＝酵母名／date＝日付（空＝自動）／qty＝個数／kind＝「済」／arrive＝着日／memo＝もとの酵母
       仕込番号・液種・酒母仕込日（no・liquid・motodate）はカレンダーの説明用に一緒に送る
   控え：seishu-workbook_github\_src_yeastplan.js（index.html の yeastplan の目印の間。shubotop の後ろ）
   ================================================================================== */
const YP_CULT=7;                                   // 植菌 → 酒母仕込 の日数（培養7日）
const YP_ORDER={
  H13BY:{lead:14, who:'広島県酒造協同組合', note:'2週間前には発注', care:false, unit:'本'},
  K1801:{lead:21, who:'',                 note:'3週間以上前・要注意', care:true,  unit:'個'}
};
const YP_YEASTS=['K7','K1801','H13BY','S9arg','TR8arg','G9NFarg','まほろば芳'];   // 酵母名のリスト（仕込マスタにある名前も足す）
const YP_QTY_MAX=20;                               // 個数のリスト 1〜20
const YP_LBW=158;                                  // 左の見出し（No｜液種｜酵母）の幅
const YP_TABLE='酵母予定';
const YP={open:'', ov:lsGet('yp.ov',{}), err:'', busy:false};

function ypNorm(s){ const t=String(s||'').replace(/[\s　]/g,'').toUpperCase();
  if(/13BY/.test(t)) return 'H13BY';
  if(/1801/.test(t)) return 'K1801';
  return String(s||'').trim(); }
function ypYeasts(m){
  let y=m.yeast||''; if(!y && typeof yeastOf==='function'){ try{ y=yeastOf(m.liquid,m.no); }catch(e){} }
  return String(y||'').split(/[+＋・\/／、,，]+/).map(x=>x.trim()).filter(Boolean).map(ypNorm);
}
function ypBY(d){ const y=+d.slice(0,4), mo=+d.slice(5,7); return 'R'+((mo>=7?y:y-1)-2018); }
function ypDefKey(name, motodate){ const o=YP_ORDER[name]; return dadd(motodate, -(o?o.lead:YP_CULT)); }
/* 仕込マスタ＋変更（酵母予定）から1行ずつ作る */
function ypItems(st){
  const out=[];
  ((st&&st.master)||[]).filter(m=>m.motodate).forEach(m=>{
    ypYeasts(m).forEach(orig=>{
      const id=`${ypBY(m.motodate)}_${m.no}_${orig}`, ov=YP.ov[id]||null;
      const name=ypNorm((ov&&ov.name)||orig), o=YP_ORDER[name]||null;
      const auto=ypDefKey(name, m.motodate), key=(ov&&ov.date)||auto;
      const arrive=o?((ov&&ov.arrive)||''):'';
      out.push({id, m, orig, name, kind:o?'order':'cult', o, key, auto, moved:key!==auto, arrive,
        last:arrive&&arrive>key?arrive:key,     // この日が過ぎたら出さない
        qty:(ov&&ov.qty)||'', done:!!(ov&&ov.kind==='済'), by:(ov&&(ov.updBy||ov.by))||''});
    });
  });
  return out.sort((a,b)=>a.key.localeCompare(b.key)||(+a.m.no)-(+b.m.no));
}
const ypW=d=>'日月火水木金土'[dparse(d).getDay()];
const ypMDW=d=>`${rcMD(d)}（${ypW(d)}）`;
const ypUnit=n=>(YP_ORDER[n]&&YP_ORDER[n].unit)||'個';

/* ---- 記録先（製造ツール 共有データ／表「酵母予定」） ---- */
async function ypApi(body, ms){
  if(typeof SHARED_URL==='undefined'||!SHARED_URL) throw new Error('記録先の設定がまだ済んでいません');
  const ctl=typeof AbortController!=='undefined'?new AbortController():null, t=ctl?setTimeout(()=>ctl.abort(), ms||25000):null;
  try{
    body.table=YP_TABLE; body.who={ id:String((typeof ST!=='undefined'&&ST&&ST.id)||''), name:String((typeof ST!=='undefined'&&ST&&ST.name)||'') };
    const r=await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined});
    const j=await r.json(); if(!j||!j.ok) throw new Error((j&&j.error)||'保存できませんでした'); return j;
  }catch(e){ if(e&&e.name==='AbortError') throw new Error('時間がかかりすぎました。電波のよい所でもう一度'); throw e; }
  finally{ if(t) clearTimeout(t); }
}
function ypKeep(j){ const ov={}; (j.items||[]).forEach(x=>{ if(x.id) ov[x.id]=x; }); YP.ov=ov; lsSet('yp.ov',ov); }
async function ypFetch(){ try{ ypKeep(await ypApi({action:'list'},20000)); YP.err=''; return true; }
  catch(e){ YP.err=/その表はありません/.test(String(e.message||e))?'変更の記録先（表「酵母予定」）がまだできていません。表示だけできます。':String(e.message||e); return false; } }

/* ---- 上段アイコンの中身：次の植菌まで何日か／締切の近い発注 ---- */
function ypIconInfo(){
  const st=(typeof RC!=='undefined'&&RC.state)||null; if(!st||!st.master) return {v:'—',warn:false};
  const t=dtoday(), it=ypItems(st).filter(x=>!x.done && x.key>=t);
  const cult=it.filter(x=>x.kind==='cult')[0];
  const ord=it.filter(x=>x.kind==='order' && rcDays(t,x.key)<=7);
  const n=cult?rcDays(t,cult.key):null;
  if(ord.length && (n===null||n>1)){ const k=rcDays(t,ord[0].key); return {v:k===0?'発注 今日':'発注 '+k+'日',warn:true}; }
  if(n===null) return {v:'—',warn:false};
  return {v:n===0?'植菌 今日':n===1?'植菌 明日':`あと${n}日`, warn:n<=1};
}
function ypIconHTML(){ const r=ypIconInfo();
  return `<button class="st-ic${r.warn?' wn':''}" data-sti="yeast" type="button"><span class="e">🧬</span><b>${esc(r.v)}</b><small>酵母</small></button>`; }

/* ---- 画面（グラフだけ） ---- */
async function yeastPlanScreen(){
  head('酵母','植菌のタイミング（酒母仕込日の7日前）');
  rcLoading('仕込の予定を読み込んでいます…');
  const st=await recState(false); if(!st||!st.master){ rcFail(); return; }
  YP.open=''; ypPaint(st);
  const top=nav[nav.length-1];
  ypFetch().then(()=>{ if(nav[nav.length-1]===top && !YP.open) ypPaint(st); });
}
function ypPaint(st){
  const t=dtoday();
  /* 過去は出さない。済でも当日（着日があれば着日）までは出す */
  const items=ypItems(st).filter(x=>x.last>=t);
  let h=YP.err?`<div class="yp-msg">${esc(YP.err)}</div>`:'';
  if(!items.length){ app.innerHTML=h+`<p class="muted" style="text-align:center;padding:20px 0">これからの植菌・発注はありません</p>`; return; }
  const a=t, z=dadd(items.reduce((s,x)=>x.m.motodate>s?x.m.motodate:s, items[0].m.motodate),1);
  const N=rcDays(a,z)+1, W=22, X=d=>rcDays(a,d)*W;
  let days='', mon='';
  for(let i=0;i<N;i++){ const d=dadd(a,i), w=dparse(d).getDay(), dd=+d.slice(8,10);
    days+=`<span class="yp-dc ${w===0?'su':w===6?'sa':''} ${d===t?'td':''}" style="left:${i*W}px">${dd}<small>${'日月火水木金土'[w]}</small></span>`;
    if(i>0&&dd===1) mon+=`<span class="yp-mo" style="left:${i*W}px">${+d.slice(5,7)}月</span>`; }
  const tl=`<span class="yp-today" style="left:${YP_LBW+X(t)+W/2}px"></span>`;
  let rows='';
  items.forEach(x=>{
    const m=x.m, sh=X(m.motodate), p=X(x.key), dn=x.done?' dn':'';
    let bars='';
    if(x.kind==='cult'){
      bars=`<span class="yp-cul" style="left:${p+W/2}px;width:${Math.max(0,sh-p)}px"></span>`+(x.key>=t?`<span class="yp-dot in${dn}" style="left:${p}px">${x.done?'✓':'植'}</span>`:'');
    } else {
      bars=`<span class="yp-ln" style="left:${Math.max(0,p)+W/2}px;width:${Math.max(0,sh-Math.max(0,p))}px"></span>`+(x.key>=t?`<span class="yp-dot ${x.o.care?'care':'ord'}${dn}" style="left:${p}px">${x.done?'✓':'発'}</span>`:'');
      if(x.arrive && x.arrive>=t) bars+=`<span class="yp-dot ar" style="left:${X(x.arrive)}px">着</span>`;
    }
    bars+=`<span class="yp-dot sk" style="left:${sh}px">仕</span>`;
    if(x.qty) bars+=`<span class="yp-qty" style="left:${Math.max(0,p)+W+4}px">${esc(x.qty)}${ypUnit(x.name)}</span>`;
    const cls=x.kind==='order'?(x.o.care?'care':'ord'):'';
    rows+=`<div class="yp-row${YP.open===x.id?' on':''}" data-yp-id="${esc(x.id)}"><div class="yp-lb"><span class="c1"><b>${m.no}</b></span><span class="c3">${esc(m.liquid||'')}</span><span class="c2 ${cls}">${esc(x.name)}${x.done?'<i>済</i>':''}</span></div><div class="yp-tr" style="width:${N*W}px">${bars}</div></div>`;
    if(YP.open===x.id) rows+=ypEditHTML(x);
  });
  h+=`<div class="yp-wrap"><div class="yp-sc" id="ypSc"><div class="yp-in" style="width:${YP_LBW+N*W}px"><div class="yp-row yp-h"><div class="yp-lb yp-lbh"><span class="c1">No</span><span class="c3">液種</span><span class="c2">酵母</span><em class="yp-mon" id="ypMon"></em></div><div class="yp-hd" style="width:${N*W}px">${mon}${days}</div></div><div class="yp-body">${tl}${rows}</div></div></div></div>`;
  const sc0=$('#ypSc'), x0=sc0?sc0.scrollLeft:0;
  app.innerHTML=h;
  const sc=$('#ypSc');
  if(sc){ app.querySelectorAll('.yp-ed').forEach(d=>d.style.width=sc.clientWidth+'px'); sc.scrollLeft=x0;
    const monF=()=>{ const i=Math.max(0,Math.min(N-1,Math.round(sc.scrollLeft/W))); const e=$('#ypMon'); if(e) e.textContent=(+dadd(a,i).slice(5,7))+'月'; };
    monF(); sc.addEventListener('scroll',monF,{passive:true}); }
  ypBind(st, items);
}

function ypBind(st, items){
  app.querySelectorAll('.yp-row[data-yp-id]').forEach(r=>r.onclick=()=>{ const k=r.dataset.ypId; YP.open=YP.open===k?'':k; ypPaint(st); });
  const ed=app.querySelector('.yp-ed'); if(!ed) return;
  const x=items.find(i=>i.id===ed.dataset.ed); if(!x) return;
  let dateTouched=false, done=x.done;
  const nm=$('#ypName'), dt=$('#ypDate'), au=$('#ypAuto'), qt=$('#ypQty');
  dt.oninput=()=>{ dateTouched=true; };
  nm.onchange=()=>{ const n=ypNorm(nm.value), o=YP_ORDER[n], auto=ypDefKey(n,x.m.motodate), q=qt.value;
    $('#ypDateLb').textContent=o?'発注締切日':'植菌日'; $('#ypDoneLb').textContent=o?'発注':'植菌';
    $('#ypQtyLb').textContent=n==='H13BY'?'本数':'個数'; qt.innerHTML=ypQtyOpts(n,q);
    $('#ypArrBox').style.display=o?'':'none';
    if(!dateTouched && !x.moved){ dt.value=auto; }
    au.textContent='自動なら '+ypMDW(auto); };
  $('#ypDone').onclick=e=>{ e.stopPropagation(); done=!done; const b=$('#ypDone'); b.classList.toggle('on',done); b.textContent=done?'✓ 済':'まだ'; };
  $('#ypClose').onclick=()=>{ YP.open=''; ypPaint(st); };
  const save=async(reset)=>{
    const n=ypNorm(nm.value), auto=ypDefKey(n,x.m.motodate);
    const date=reset?'':(dt.value && dt.value!==auto ? dt.value : '');
    const arrive=YP_ORDER[n]?($('#ypArr').value||''):'';
    const item={id:x.id, name:n, kind:done?'済':'', qty:qt.value, unit:ypUnit(n), date, arrive, memo:x.orig,
      no:String(x.m.no), liquid:String(x.m.liquid||''), motodate:x.m.motodate};
    const prev=YP.ov[x.id];
    YP.ov[x.id]=Object.assign({}, prev||{}, item, {updBy:String((typeof ST!=='undefined'&&ST&&ST.name)||'')}); lsSet('yp.ov',YP.ov);
    const s=$('#ypSt'); if(s){ s.textContent=arrive||(prev&&prev.arrive)?'保存しています…（カレンダーも直します）':'保存しています…'; s.className='yp-st'; }
    $('#ypSave').disabled=true;
    try{ const j=await ypApi({action:'save', item},30000); ypKeep(j); YP.err=''; YP.open=''; ypPaint(st);
      if(typeof rcStatus==='function') rcStatus(j.calErr?'保存しました（カレンダーには入りませんでした：'+j.calErr+'）':'酵母の予定を保存しました'); }
    catch(e){ if(prev) YP.ov[x.id]=prev; else delete YP.ov[x.id]; lsSet('yp.ov',YP.ov);
      const s2=$('#ypSt'); if(s2){ s2.textContent='保存できませんでした：'+(e.message||e); s2.className='yp-st w'; } const b=$('#ypSave'); if(b) b.disabled=false; }
  };
  $('#ypSave').onclick=()=>save(false);
  const rs=$('#ypReset'); if(rs) rs.onclick=()=>save(true);
}

<script>
/* ================= 💾 裏で保存：読み込みに送信待ちを重ねる（2026-10-06） =================
   酒母・仕込みの「保存」は画面を閉じて裏で送る（recSaveBg／recFlush）。送り終わる前に同じ酒母・醪を開いたとき、
   保存前の値に戻って見えないよう、shubo_get／bunseki_get の結果（端末の控えから出す分も含む）に送信待ちの値を重ねる。
   recApi はいくつかのブロックで包み直されているので、いちばん外側（このブロック）で包む。
   控え：seishu-workbook_github\_src_bgsave.js　差し込み：_裏で保存を足す.py（bgsave の目印のブロック、upd の前）
   ======================================================================================= */
(function(){
  const base=recApi;
  recApi=async function(body, ms){
    const r=await base(body, ms);
    try{ if(body && (body.action==='shubo_get'||body.action==='bunseki_get') && r && r.ok && typeof recOverlay==='function' && recQ().length) recOverlay(body.action, body.no, r); }catch(e){}
    return r;
  };
})();

</script>

  ['2026-10-13-6','🔢','酒母・仕込み','分析値（Be/度・alc・酸度・ｱﾐﾉ・品温・水麹・蒸米）を、表の入力欄や1本ずつの入力画面でも 12 → 12.0 のように小数1桁で表示するようにしました（入れて欄を離れると自動で整います）。'],
  ['2026-10-13-5','🍶','仕込み・分析','🧪分析に「踊」（添の翌日：Be・酸度・ｱﾐﾉ）の入力を足しました。🍶仕込みの📋表で「仕込み時」を表示すると、添・踊・仲・留の仕込み時（尺・量・汲水・氷・水麹・品温・蒸米）もマスにそのまま入力できます。尺を入れると量が容量早見表から自動で入ります。尺だけ入っていて量が空だった仕込（1号の添など）は、表を開いたときに自動で入れます。「きょうの仕込み・資材」は上のアイコン「🍶 今日の仕込み」にしまいました（押すと開きます）。'],
  ['2026-10-13-4','🧰','資材','添加アルコール：入荷予定を便ごとのボタンにし、押すとその便から次の便までの添加予定の表と発注ができます（📋で全部の表も）。発注済の便の入荷も在庫に足して判定するので、発注済なら「足りなくなります」は出ません。A重油：「点検」「発注」「地下タンク点検」をボタンにし、押すとその欄が開きます。'],
  ['2026-10-13-3','🛢','資材 › A重油','点検の入力は「📝 点検」ボタンを押すと開くようにしました。発注の欄は文字を減らし、くわしい計算は「計算のもと」の中にまとめました。点検のアラートが出ているときは、A重油の一番上に法令（消防法：在庫の点検は週1回以上・地下タンクの定期点検）が出ます。'],
  ['2026-10-13-2','🛢','資材 › A重油','法令の点検を知らせるようにしました。地下タンクの定期点検（3年に1回。前回 2026/6/12）は期限の年の3月1日から、在庫の点検（週1回以上）は前回から7日たつと、ホームの予定の枠と資材アイコン・A重油の箱に出ます。A重油の箱の点検は「◯日前」でなく日付で表示します。'],
  ['2026-10-13-1','🧰','資材 › A重油','A重油の発注の計算を直しました。点検が少ないうちに「蒸米1tあたり」が大きくなりすぎ、早すぎるアラートが出ていました。今は直近の点検区間の1日平均で先を読み、点検がたまれば蒸米の量で計算します。「計算のもと」で区間ごとの日数・蒸米・使用量が見られます。'],
  ['2026-10-12-9','🍶','仕込み・本日の予定','踊り返しを本日の予定に出すようにしました（伝辛・超辛・純米辛口 以外は、添の翌日 13:00〜 1人）。人が少なく酛卸と踊り返しを1人で行う日は、オレンジの注意の帯が出ます。添の仕込み時の「添のタンク」は、伝辛・超辛・純米辛口は醪タンク、それ以外は T284・T285・酒母タンク から選べます。'],
  ['2026-10-12-8','🧰','資材 › A重油','点検と受入を1つの表「点検・受入の記録」にまとめました（日付の新しい順、受入は緑の行で＋L）。日付が「NaN/7」と出ていたのも直しました。'],
  ['2026-10-12-7','🍶','仕込み・配合表','仕込み時（添・仲・留）の尺を入れると、量（L）が自動で入るようにしました（酒母と同じく容量早見表から）。仲・留は醪タンク、添は「添のタンク」に容器の番号を入れたときに入ります。配合表：スマホで見やすく（「酒母中」を消し、予定は数字だけ。仕込みの表はアルコールの文字を小さくし、40%を削除）。'],
  ['2026-10-12-6','🧾','配合表','🧫酒母・🍶仕込みの上のアイコンに「🧾 配合表」を足しました。記号ごとの仕込み配合（酒母・初添・仲添・留添・追水・四段の 総米・掛米・麹米・汲水・酵素剤・アルコール）が見られます。右上に「◯月◯日改定」。配合が変わると、前回から変わった数字が黄色になります（押すと前の値）。'],

  ['2026-10-12-4','🧰','資材','A重油と添加アルコールの「発注」を足しました。添加アルコールは入荷（例年 10/27ごろ・12/24ごろ・1月・3月）の1か月前から、A重油は点検の残量と洗米予定表の蒸米の量から減り方を計算して3,000Lを切る前に、ホームの予定の枠に赤い帯と資材アイコンの札が出ます。資材 › A重油／アルコール で「発注した」を押すと消え、入荷予定日が部署カレンダー（ホームの予定）に入ります。入荷したら「入荷を記録」で在庫にも入ります。'],

<script>
/* ================= ⚠ 麹の苦味注意（2026-10-07 泰広さん指示） =================
   鍋倉氏（2026-10-06 メール）の2条件を、麹の温度経過と昨年度（R7BY）の実績に照らして自動で判定し、注意を出す。
   ① 前半の品温が高い（種切・盛前が必要以上に高い→バカ破精→酵素力価が低く苦い麹）
      → 引込〜盛後の品温を KSTD（R7BY：一般297麹／輝20麹）で判定。高い側の △=1点・✕=2点。合計2点で「注意」、3点以上で「強」
   ② 仲仕事を省いて中間温度帯を飛ばす（ペプチダーゼ不足→苦味ペプチド）
      → 盛と留仕事があり仲仕事が空欄。昨年度の同じ銘柄で仲仕事をしていた率（KGM_R7_NAKA）が半分以上なら「強」、
        昨年度もしていない銘柄（伝辛など）は「参考」。盛のあと留仕事前なら「これから仲仕事」を注意
   ほか参考：仲→留仕事が2時間未満（須藤顧問：6時間かけて上げる）／出麹42℃超（同：最高後は42℃以下）
   出す場所：麹の画面（上に赤い帯＋各麹に「⚠ 苦味」）／各麹の画面（温度グラフの下に理由）
   根拠ノート：保管庫 醸造ナレッジベース/ノート/製麹_酒質に合わせた麹造り_透明感と苦味.md
   控え：seishu-workbook_github\_src_nigami.js　差し込み：_苦味注意を足す.py */
const KGM_R7_NAKA={   // R7BY 統合データ「麹記録」：留仕事の記録がある麹のうち仲仕事の記録がある本数 [あり, 全体]（輝は製麹/R7BY）
  '伝辛':[0,96],'ながれぼし':[30,40],'超辛':[0,24],'やわらか':[1,22],'ぽたりぽたり越淡麗':[12,16],'ユキノシタ':[7,16],'輝':[20,20],
  '金雲母':[6,8],'なごり雪':[0,8],'紅葉純米':[6,8],'とろりとろり':[4,8],'普通純米':[0,7],'ぽたりぽたり五百万石':[3,5],
  '一片氷心':[4,4],'遠雷':[3,4],'純米大吟醸':[4,4],'低アル純米':[1,4],'火鉢':[2,3]};
function kgmR7(r){
  if(kIsKaga(r)) return {nm:'輝',v:KGM_R7_NAKA['輝']};
  const n=String(r['液種']||'').replace(/[\s　]/g,''); if(!n) return null;
  const ks=Object.keys(KGM_R7_NAKA);
  const k=ks.find(x=>x===n)||ks.filter(x=>n.includes(x)).sort((a,b)=>b.length-a.length)[0]||ks.find(x=>n.length>=2&&x.includes(n));
  return k?{nm:k,v:KGM_R7_NAKA[k]}:null; }
function kgmCheck(r){
  const out=[]; if(typeof kJudge!=='function'||typeof cmpStages!=='function') return {lv:0,items:out};
  const sk=kIsKaga(r)?'kaga':'ippan', P={}; cmpStages(r).forEach(p=>{ P[p.nm]=p; });
  // ① 前半の品温
  let sc=0; const hi=[];
  ['引込','種切','切返し','盛前','盛後'].forEach(nm=>{ const p=P[nm]; if(!p) return; const j=kJudge(sk,nm,p.v); if(!j||!j.lv||!j.hi) return; sc+=j.lv; hi.push(`${nm} <b>${cmpF(p.v)}℃</b>${j.mk}<span style="font-size:11px;color:#7a5a50">（昨年度 ${j.ref}）</span>`); });
  if(hi.length) out.push({lv:sc>=3?2:(sc>=2?1:0),k:'前半の品温が高い（バカ破精の方向）',t:hi.join('・'),
    why:'種切・盛前の品温が必要以上に高く、米が柔らかい段階でハゼが回りすぎた麹は、白くフワフワした見た目のわりに酵素力価が低く、苦くなりやすい（鍋倉氏）。出麹の味見で苦味を確かめる。'});

  const mo=P['盛後']||P['盛前'], na=P['仲仕事'], to=P['留仕事'];
  if(mo&&!na&&to){ const lv=rate==null?1:(rate>=0.5?2:0);
    out.push({lv,k:'仲仕事なし（中間温度帯を飛ばしている）',t:`盛 ${cmpF(mo.v)}℃ → 留仕事 ${cmpF(to.v)}℃ を <b>${cmpF(to.h-mo.h)}時間</b>で。${r7t}${lv===0?'（この銘柄は昨年度も仲仕事なしが標準）':''}`,
      why:'仲仕事を省いて中間温度帯をすっ飛ばすと、タンパク分解酵素・ペプチダーゼが極端に不足し、苦味をもつペプチドが増えると考えられる（鍋倉氏）。仲仕事をしたのに空欄なら記録漏れなので入力を。'}); }
  else if(mo&&!na&&!to&&rate!=null&&rate>=0.5){
    out.push({lv:1,k:'これから仲仕事',t:`${r7t}。仲仕事を入れて中間温度帯（36〜37℃）を通す`,why:'中間温度帯を飛ばすとペプチダーゼが不足し、苦味ペプチドが増える（鍋倉氏）。'}); }
  if(na&&to){ const hh=to.h-na.h; if(hh>0&&hh<2) out.push({lv:1,k:'仲→留仕事が短い',t:`仲仕事 ${cmpF(na.v)}℃ → 留仕事 ${cmpF(to.v)}℃ を <b>${cmpF(hh)}時間</b>`,
    why:'苦味を抑える製麹経過：仲仕事から仕舞仕事まで6時間かけてゆっくり上げる。早く上がるなら二仲（R4技術講習会 須藤顧問）。'}); }
  // 参考：出麹
  const de=P['出麹']; if(de&&de.v>42) out.push({lv:0,k:'出麹 42℃超',t:`出麹 ${cmpF(de.v)}℃`,
    why:'苦味を抑える製麹経過では、最高をとった後の品温を42℃以下に抑える（須藤顧問）。昨年度の一般麹の平均は41.98℃なので参考。'});
  return {lv:out.length?Math.max(...out.map(x=>x.lv)):0,items:out};
}
const kgmChip=lv=>lv>=2?'<small class="kgm-chip s">⚠ 苦味 強</small>':(lv===1?'<small class="kgm-chip">⚠ 苦味 注意</small>':'');
function kgmInject(){
  const date=RC.kday, j=RC.koji&&RC.koji[date]; if(!j||!$('#kDate')||app.querySelector('.kgm-ban')) return;
  const hits=[];
  (j.koji||[]).filter(r=>r['出麹日']===date||r['盛日']===date).forEach(r=>{
    const c=kgmCheck(r); if(c.lv<1) return; hits.push([r,c]);

  const line=([r,c])=>{ const st=r['出麹日']===date?'出麹':'盛';
    return `<button type="button" class="kgm-ic${c.lv>=2?' s':''}" data-id="${esc(r['麹ID'])}" data-st="${st}" title="${esc(c.items.filter(x=>x.lv>=1).map(x=>x.k).join('／'))}">⚠ 苦み注意。${esc(r['麹ID'])}</button>`; };
  const d=document.createElement('div'); d.className='kgm-ban';
  d.innerHTML=hits.map(line).join('');

function kgmCardHTML(r){

  const ic=lv=>lv>=2?'<span class="kgm-chip s">強</span>':(lv===1?'<span class="kgm-chip">注意</span>':'<span class="kgm-chip i">参考</span>');
  return `<div class="card kgm-card"><b style="font-size:14px">⚠ 苦味の注意</b><small class="muted" style="font-size:11px">　鍋倉氏の条件×昨年度（R7BY）</small>
    ${c.items.map(x=>`<div class="kgm-i">${ic(x.lv)} <b>${esc(x.k)}</b><div>${x.t}</div><small>${esc(x.why)}</small></div>`).join('')}
    <p class="tl-note" style="margin:4px 0 0">根拠：保管庫「製麹_酒質に合わせた麹造り_透明感と苦味」</p></div>`; }
(function(){
  const s=document.createElement('style'); s.textContent=`
.kgm-chip{display:inline-block;margin-top:2px;font-size:10px;font-weight:700;color:#fff;background:#e08a00;border-radius:8px;padding:0 6px;line-height:1.6}

<script>
/* ================= 🧰 資材の在庫（仕込みの中）2026-10-06 泰広さん指示 =================

  const today=dtoday(), Z=(st&&st.shizai)||{}, map={};
  const get=(n,u)=>map[n]||(map[n]={ name:n, unit:u||'', plan:[], log:[] });
  Object.keys(Z).forEach(no=>(Z[no]||[]).forEach(z=>{ if(!z||!z.name) return; const q=shN(z.qty); if(q===null) return;
    const r=get(z.name, z.unit); if(!r.unit && z.unit) r.unit=z.unit; r.plan.push({ no, date:z.date||'', qty:q, timing:z.timing||'' }); }));
  ZAI.items.forEach(x=>{ if(!x.name) return; const r=get(x.name, x.unit); if(!r.unit && x.unit) r.unit=x.unit; r.log.push(x); });
  Object.values(map).forEach(r=>{
    const tana=r.log.filter(x=>x.kind==='棚卸' && x.date).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.at||'').localeCompare(String(a.at||'')))[0];
    const from=tana?tana.date:'';
    let st=tana?(Number(tana.qty)||0):0;
    r.log.forEach(x=>{ if(x.kind==='入荷' && (!from || String(x.date)>=from)) st+=Number(x.qty)||0; });
    r.plan.forEach(p=>{ if(p.date && p.date<today && (!from || p.date>=from)) st-=p.qty; });
    r.has=!!tana || r.log.some(x=>x.kind==='入荷');
    r.stock=Math.round(st*1000)/1000;
    r.need=Math.round(r.plan.filter(p=>!p.date || p.date>=today).reduce((a,p)=>a+p.qty,0)*1000)/1000;
    r.short=r.has?Math.max(0, Math.round((r.need-r.stock)*1000)/1000):null;
    r.tana=tana||null;
  });

<script>
/* ================= 🍚 米の増減（米管理→在庫管理）2026-10-06 泰広さん指示 =================

const RZ = { items: lsGet('rz.items', []), pending:false };
async function rzApi(body){

  body.table='米増減'; body.who={ id:String(ST.id||''), name:String(ST.name||'') };
  const r=await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  const j=await r.json();
  if(!j||!j.ok) throw new Error((j&&/その表はありません/.test(j.error||''))?'サーバー側の更新（Apps Script「製造ツール 共有データ」の新バージョン）がまだです':((j&&j.error)||'受け取れませんでした'));
  return j;
}
function rzKeep(j){ const a=JSON.stringify(RZ.items); RZ.items=(j.items||[]); lsSet('rz.items', RZ.items); return a!==JSON.stringify(RZ.items); }
async function rzFetch(){ return rzKeep(await rzApi({action:'list'})); }
function rzNum(x){ const n=Number(x&&x.qty); return isFinite(n)?n:0; }
function rzVal(v,d){ const x=RZ.items.find(x=>x.name===v && x.date===d); return x?rzNum(x):0; }

function rzParse(t){ return pnum(String(t).replace(/[＋+\s]/g,'')); }   // ＋は外す。－・全角は pnum が読む

<script>
(function(){
  const MQ = window.matchMedia('(min-width:900px) and (hover:hover) and (pointer:fine)');
  const B = document.body;
  // 横スクロールになっている「表」を探す（タブやチップの横並びは数えない）
  function hasWideTable(){
    const els = app.querySelectorAll('*');
    for(const el of els){
      if(el.scrollWidth <= el.clientWidth + 8) continue;
      const cs = getComputedStyle(el);
      if(!/(auto|scroll)/.test(cs.overflowX)) continue;
      if(el.closest('[style*="position:fixed"]')) continue;
      if(el.querySelector('table') || el.tagName==='TABLE' || /(^|\s)([\w-]*-tw|tl-scroll|kn-wrap|yp-sc)(\s|$)/.test(el.className)) return true;
    }
    // 表そのものが .wrap の幅より広い（はみ出している）
    const w = app.clientWidth;
    for(const t of app.querySelectorAll('table')){ if(t.offsetParent && t.offsetWidth > w + 8) return true; }
    return false;
  }
  let tm = 0;
  function check(){
    clearTimeout(tm);
    tm = setTimeout(()=>{
      if(!MQ.matches){ B.classList.remove('pc-wide'); return; }
      if(B.classList.contains('pc-wide')) return;     // 一度広げたら、その画面のあいだは広げたまま（行ったり来たりしない）

function szoAlcLedger(alc){

/* ---- A重油：蒸米kg（洗米の翌日に蒸す）と使用量のモデル ---- */
function szoSteam(){
  const S=MFG&&MFG.senmai, m={}; if(!S||!S.days) return m;
  Object.keys(S.days).forEach(d=>{ const e=(S.days[d]||{}).e||[]; const kg=e.reduce((a,x)=>a+(Number(x[6])||0),0); if(kg>0){ const s=dadd(d,1); m[s]=(m[s]||0)+kg; } });
  return m;
}
function szoKg(m,a,b){ let s=0; for(const d in m) if(d>=a && d<b) s+=m[d]; return s; }   /* a の日から b の前日まで（点検は朝・蒸す前と見る） */
/* 2026-10-13 直し：区間が少ないと「その間に使った重油を全部、少しの蒸米のせい」にしてしまい（9/15〜10/7 の1区間で、
   季節前の22日分の使用を 10月初めの少ない蒸米で割った）、蒸米1tあたりが大きくなりすぎて、蒸米の多い先の日に大量に減る計算になっていた。
   → ①2区間以上で「蒸米1tあたり a ＋ 1日 b」を解く（a・b が0以上、a が SZO_OIL_AMAX 以下のときだけ）
     ②だめなら、蒸米の無い区間で1日分 b、蒸米のある区間の残りを蒸米で割る（同じく上限つき）
     ③それもだめなら、蒸米で分けずに「1日平均」で先を読む（区間が増えれば自動で①②に変わる） */
const SZO_OIL_AMAX=150;   /* 蒸米1tあたりの上限（L）。これを超える答えは区間が足りずに出た見かけの値として使わない */
function szoOilModel(rowsDesc){
  const R=(rowsDesc||[]).slice().reverse(), m=szoSteam(), iv=[];
  for(let i=1;i<R.length;i++){ const p=R[i-1], c=R[i]; if(c.used===null||c.used<0||!(c.days>0)) continue; iv.push({ from:p.date, to:c.date, days:c.days, t:szoKg(m,p.date,c.date)/1000, u:c.used }); }
  const L=iv.slice(-8); if(!L.length) return null;
  const D=L.reduce((s,x)=>s+x.days,0), U=L.reduce((s,x)=>s+x.u,0);
  let a=null, b=null, how='';
  if(L.length>=2){ let tt=0,td=0,dd=0,tu=0,du=0; L.forEach(x=>{ tt+=x.t*x.t; td+=x.t*x.days; dd+=x.days*x.days; tu+=x.t*x.u; du+=x.days*x.u; });
    const det=tt*dd-td*td; if(tt>0 && det>1e-6*tt*dd){ const A=(tu*dd-du*td)/det, B=(tt*du-td*tu)/det; if(A>=0&&B>=0&&A<=SZO_OIL_AMAX){ a=A; b=B; how='fit'; } } }
  if(a===null){ const z=L.filter(x=>x.t===0), k=L.filter(x=>x.t>0);
    if(z.length && k.length){ const B=z.reduce((s,x)=>s+x.u,0)/z.reduce((s,x)=>s+x.days,0), T=k.reduce((s,x)=>s+x.t,0), A=Math.max(0,k.reduce((s,x)=>s+x.u-B*x.days,0)/T);
      if(A<=SZO_OIL_AMAX){ a=A; b=B; how='ratio'; } } }
  /* ③ 2026-10-13：全体の平均だと季節前（9月）の少ない使い方に引っぱられるので、いちばん新しい区間（3日未満ならその前も足す）の1日平均にする */
  let recent=null;
  if(a===null){ let dd=0, uu=0, k=L.length; while(k>0 && dd<3){ k--; dd+=L[k].days; uu+=L[k].u; }
    a=0; b=dd>0?uu/dd:(D>0?U/D:0); how='day'; recent={ from:L[k].from, to:L[L.length-1].to, days:dd }; }

/* 今の残量の見込みと、この先の残量（発注済の入荷も足す）。3,000Lを切る日・発注目安 */
function szoOilFc(oil){
  const o=oil||sziOil(); if(!o.last) return null;
  const M=szoOilModel(o.rows); if(!M) return null;
  const today=dtoday(), use=d=>M.a*(M.steam[d]||0)/1000+M.b;
  let est=o.last.qty;
  for(let d=o.last.date; d<today; d=dadd(d,1)) est-=use(d);
  est+=o.rec.filter(x=>x.date>o.last.date && x.date<=today).reduce((a,x)=>a+(Number(x.qty)||0),0);
  est=Math.max(0,est);
  const pend=szoOilPending(), add={}; pend.forEach(p=>{ if(p.plan>=today) add[p.plan]=(add[p.plan]||0)+(Number(p.qty)||0); });
  let s=est, cross=null, empty=null;
  for(let i=0;i<240;i++){ const d=dadd(today,i); s+=add[d]||0; s-=use(d); if(!cross&&s<SZO_OIL_MIN) cross=d; if(!empty&&s<=0){ empty=d; break; } }
  const order=cross?dadd(cross,-SZO_OIL_LEAD):null;
  const steamAhead=Object.keys(M.steam).some(d=>d>=today);
  return { M, est, cross, empty, order, left:empty?rcDays(today,empty):null, steamAhead, pend };
}

    return dtoday()>=dadd(f.order,-SZO_OIL_PRE)?f:null; }catch(e){ return null; }
}

<script>
/* ================= 🧴 濾過・火入（2026-10-11 泰広さん指示） =================
   ・ホームに「濾過・火入」アイコン。中で 濾過予定日・火入予定日と、済んだ日（実施日）を入れる
   ・予定は全体の予定にも出す：ホーム「本日の予定」の段（濾過・火入）＋ 部署カレンダー「生産本部製造担当」（終日予定。サーバーが作る）
   ・注意：上槽日から5日以内に濾過の予定が無い／濾過日から7日以内に火入の予定が無い → ホームのアイコンに赤い札
       対象＝上槽日（または濾過日）が「きょう＋5日（火入は＋7日）」までに来るもの。済が入れば消える
   ・データ：Apps Script「製造ツール 共有データ」の表「濾過火入」（1工程×1順号で1行。同じ順号をもう一度保存すると上書き）
   控え：seishu-workbook_github\_src_roka.js（差し込み _解析と濾過火入を足す.py） */
const RK = { items: lsGet('rk.items', []), at: 0, err: '' };
const RK_DAYS = { 濾過: 5, 火入: 7 };           // 上槽→濾過 5日以内／濾過→火入 7日以内
const RK_T = { 濾過: ['13:00','15:00'], 火入: ['09:00','12:00'] };   // 本日の予定の段の目安の時刻（並び順にだけ使う）
async function rkApi(body){
  if(typeof SHARED_URL==='undefined' || !SHARED_URL) throw new Error('記録先の設定がまだです');
  body.table='濾過火入'; body.who={ id:String(ST.id||''), name:String(ST.name||'') };
  const r=await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  const j=await r.json();
  if(!j||!j.ok) throw new Error((j&&/その表はありません/.test(j.error||''))?'サーバー側の更新（Apps Script「製造ツール 共有データ」の新バージョン）がまだです':((j&&j.error)||'受け取れませんでした'));
  return j;
}
function rkKeep(j){ RK.items=(j.items||[]); RK.at=Date.now(); lsSet('rk.items', RK.items); RK.err=''; }
async function rkLoad(force){
  if(!force && RK.at && Date.now()-RK.at<60000) return RK.items;
  try{ rkKeep(await rkApi({action:'list'})); }catch(e){ RK.err=String(e.message||e); }
  return RK.items;
}
/* 出勤表（MFG.shukkin）：氏名の一覧と、その人・その日のマスの中身（月のシートが無ければ null） */
const nrmS=s=>String(s==null?'':s).replace(/[\s　]/g,'');
function rkStaffList(){ const K=typeof MFG!=='undefined'&&MFG&&MFG.shukkin; if(!K||!K.months) return []; const ys=Object.keys(K.months).sort(); const M=K.months[dtoday().slice(0,7)]||K.months[ys[ys.length-1]]; return M?(M.staff||[]).filter(x=>!/研\s*修/.test(x)):[]; }
function rkShCell(staff,d){ const K=typeof MFG!=='undefined'&&MFG&&MFG.shukkin; const M=K&&K.months&&K.months[d.slice(0,7)]; if(!M) return null; const k=(M.staff||[]).findIndex(x=>nrmS(x)===nrmS(staff)); const dd=(M.days||[]).find(z=>z.d===d); if(k<0||!dd) return null; return String((dd.c||[])[k]||''); }
const rkRow=(name,no)=>RK.items.find(x=>x.name===name && String(x.no)===String(no))||null;
/* 上槽日：上槽を入れていれば（仕込カルテ）その日、無ければ予定上槽日 */
function rkJoso(m){ const k=RC.karte&&RC.karte[m.no]; const a=k&&k.joso&&k.joso['上槽日']; return (a&&/^\d{4}-\d\d-\d\d/.test(String(a)))?String(a).slice(0,10):(m.joso||''); }
/* 1本ずつの状態 */
function rkOf(m, today){
  today=today||dtoday();
  const J=rkJoso(m), ro=rkRow('濾過',m.no), hi=rkRow('火入',m.no);
  const roD=ro&&ro.date||'', roP=ro&&ro.plan||'', hiD=hi&&hi.date||'', hiP=hi&&hi.plan||'';
  const R=roD||roP;   // 火入の基準＝濾過の日（済が無ければ予定）
  const o={ m, J, ro, hi, roD, roP, hiD, hiP, R, warn:[] };
  if(J && !roD && J<=dadd(today,RK_DAYS.濾過)){
    if(!roP) o.warn.push({k:'濾過', t:`濾過の予定なし（上槽 ${rcMD(J)}）`, lim:dadd(J,RK_DAYS.濾過)});
    else if(roP>dadd(J,RK_DAYS.濾過)) o.warn.push({k:'濾過', t:`濾過予定 ${rcMD(roP)} が上槽から${RK_DAYS.濾過}日を超える`, lim:dadd(J,RK_DAYS.濾過)});
  }
  if(R && !hiD && R<=dadd(today,RK_DAYS.火入)){
    if(!hiP) o.warn.push({k:'火入', t:`火入の予定なし（濾過 ${rcMD(R)}）`, lim:dadd(R,RK_DAYS.火入)});
    else if(hiP>dadd(R,RK_DAYS.火入)) o.warn.push({k:'火入', t:`火入予定 ${rcMD(hiP)} が濾過から${RK_DAYS.火入}日を超える`, lim:dadd(R,RK_DAYS.火入)});
  }
  return o;
}
function rkAll(){ const st=dpState(); if(!st) return []; const today=dtoday(); return (st.master||[]).filter(m=>m.joso||rkRow('濾過',m.no)||rkRow('火入',m.no)).map(m=>rkOf(m,today)); }
function rkWarnN(){ try{ return rkAll().reduce((a,o)=>a+o.warn.length,0); }catch(e){ return 0; } }
function rkHomeTag(){ const n=rkWarnN(); return n?`予定なし${n}`:''; }

/* ---- 画面 ---- */
let RK_TAB=lsGet('rk.tab','濾過');
async function rokaScreen(){
  head('濾過・火入','予定日と済んだ日');
  if(!RK.items.length || !dpState()) rcLoading('読み込んでいます…');
  await Promise.all([recState(false), rkLoad(false)]);
  rkDraw();
  rkLoad(true).then(()=>{ if(nav[nav.length-1] && document.getElementById('rkBox')) rkDraw(); });
}
function rkDraw(){
  const st=dpState(); if(!st){ rcFail(); return; }
  const today=dtoday(), K=RK_TAB, all=rkAll();
  const isR=K==='濾過';
  const warn=all.filter(o=>o.warn.some(w=>w.k===K)).sort((a,b)=>String(isR?a.J:a.R).localeCompare(String(isR?b.J:b.R)));
  const plan=all.filter(o=>isR?(o.roP&&!o.roD):(o.hiP&&!o.hiD)).filter(o=>!warn.includes(o)).sort((a,b)=>String(isR?a.roP:a.hiP).localeCompare(String(isR?b.roP:b.hiP)));
  const done=all.filter(o=>isR?o.roD:o.hiD).sort((a,b)=>String(isR?b.roD:b.hiD).localeCompare(String(isR?a.roD:a.hiD))).slice(0,30);
  const soon=all.filter(o=>!warn.includes(o)&&!plan.includes(o)&&!done.includes(o)&&(isR?(o.J&&o.J<=dadd(today,14)):(o.R))).sort((a,b)=>String(isR?a.J:a.R).localeCompare(String(isR?b.J:b.R)));
  const row=(o,cls)=>{ const m=o.m, x=isR?o.ro:o.hi, base=isR?o.J:o.R, P=isR?o.roP:o.hiP, D=isR?o.roD:o.hiD;
    const lim=dadd(base||today,RK_DAYS[K]);
    const w=o.warn.filter(v=>v.k===K).map(v=>`<div class="rk-w">⚠ ${esc(v.t)}（${rcMD(v.lim)}までに）</div>`).join('');
    return `<button class="rk-row ${cls}" data-no="${m.no}">
      <span class="id">${m.no}<small>${esc(m.sym||'')} T${esc(m.tank||'')}</small></span>
      <span class="mid"><b>${esc(m.liquid||'')}</b><br><span class="d">${isR?`上槽 ${rcMD(o.J)}`:`濾過 ${rcMD(o.R)}${o.roD?'':'（予定）'}`}・期限 ${rcMD(lim)}</span>${w}${x&&x.staff?`<br><span class="d">担当 ${esc(x.staff)}</span>`:''}${x&&x.tank?`<br><span class="d">タンク ${esc(x.tank)}${x.qty?'・'+esc(x.qty)+'L':''}${x.memo?'・'+esc(x.memo):''}</span>`:''}</span>
      <span class="r">${D?`<b class="ok">済 ${rcMD(D)}</b>`:P?`<b>予定 ${rcMD(P)}</b>`:`<b class="ng">未定</b>`}<span>${D?'':'押して入力 ›'}</span></span></button>`; };
  let h=`<div class="rk-tabs">${['濾過','火入'].map(k=>`<button data-rk="${k}" class="${K===k?'on':''}">${k==='濾過'?'🧴':'🔥'} ${k}${all.some(o=>o.warn.some(w=>w.k===k))?`<i>${all.reduce((a,o)=>a+o.warn.filter(w=>w.k===k).length,0)}</i>`:''}</button>`).join('')}</div>
    <div id="rkBox">${RK.err?`<div class="tl-warn">${esc(RK.err)}</div>`:''}
    <p class="tl-note" style="margin:2px 2px 8px">${isR?`上槽日から <b>${RK_DAYS.濾過}日以内</b> に濾過の予定を入れます。`:`濾過日から <b>${RK_DAYS.火入}日以内</b> に火入の予定を入れます。`}予定は本日の予定と部署カレンダーにも出ます。</p>
    <button class="rc-btn" id="rkNew" style="width:100%;margin-bottom:10px">＋ ${K}の予定・記録を入れる</button>`;
  h+=`<div class="shk-sec">要注意<small>${warn.length}本</small></div>`+(warn.length?warn.map(o=>row(o,'warn')).join(''):`<div class="shk-none">ありません</div>`);
  h+=`<div class="shk-sec">予定<small>${plan.length}本</small></div>`+(plan.length?plan.map(o=>row(o,'plan')).join(''):`<div class="shk-none">ありません</div>`);
  if(soon.length) h+=`<div class="shk-sec">${isR?'もうすぐ上槽（2週間以内）':'濾過の後・火入まだ'}<small>${soon.length}本</small></div>`+soon.map(o=>row(o,'')).join('');
  h+=`<div class="shk-sec">済（新しい順）<small>${done.length}本</small></div>`+(done.length?done.map(o=>row(o,'done')).join(''):`<div class="shk-none">ありません</div>`);
  h+=`<div class="rc-bar" style="margin-top:8px"><button class="rc-ghost" id="rkReload">更新</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{ RK_TAB=b.dataset.rk; lsSet('rk.tab',RK_TAB); rkDraw(); });
  app.querySelectorAll('.rk-row[data-no]').forEach(b=>b.onclick=()=>rkDialog(K,[b.dataset.no]));
  $('#rkNew').onclick=()=>rkDialog(K,[]);
  $('#rkReload').onclick=async()=>{ await Promise.all([recState(true), rkLoad(true)]); rkDraw(); };
}
/* 入力の窓：順号は複数選べる（同じタンクにまとめて濾過するとき） */
function rkDialog(K, nos){
  const st=dpState(); if(!st) return;
  const today=dtoday(), isR=K==='濾過';
  const cand=rkAll().filter(o=>isR?(o.J&&o.J<=dadd(today,21)&&o.J>=dadd(today,-60)):(o.R&&o.R>=dadd(today,-60))).sort((a,b)=>Number(a.m.no)-Number(b.m.no));
  nos.forEach(n=>{ if(!cand.some(o=>String(o.m.no)===String(n))){ const m=(st.master||[]).find(x=>String(x.no)===String(n)); if(m) cand.push(rkOf(m,today)); } });

  const d=document.createElement('div'); d.className='rk-dlg';

<script>

   泰広さん指示：仕込みの分析値の表で上槽日を選べるように（案B：表の「日付」の行のマスを押す →「この日を上槽日にしますか」）。

   ・選んだ日は Apps Script「製造ツール 共有データ」の表「濾過火入」に 工程＝上槽 で1順号1行（予定日＝選んだ上槽日、メモ＝「計画 yyyy-mm-dd」）
       → 部署カレンダー「生産本部製造担当」に終日予定「上槽 1号 伝辛」（サーバーの rkCal_ が作る・直す）
       → 本日の予定（上槽・前日のヤブタ準備・分析本数・濾過の期限）は 仕込マスタの joso を選んだ日に置き換えて計算（jsApply）
       → 出勤表Excelの「上槽」欄と翌日の「粕」欄は、会社PCの同期スクリプト（製造ツール同期.ps1 の 1.6）が書き換える
   ・計画日は m.josoPlan に残す。選んでいるかは m.josoSel
   控え：seishu-workbook_github\_src_joso.js（index.html の joso の目印の間。roka の後ろ） */

    <div class="js-bt">${same?'':'<button type="button" class="js-ok">上槽日にする</button>'}${cur!==p?`<button type="button" class="js-back">計画に戻す（${md(p)}）</button>`:''}<button type="button" class="js-no">やめる</button></div>

}

<script>
/* ================= 📊 解析（2026-10-11 泰広さん指示） =================
   ・仕込順に上から下へスクロールして、各仕込を比べられるようにする（1本＝1枚のカード）
   ・カード：吸水・麹・酒母・醪・上槽（粕歩合）・きき酒・濾過・火入 の要点 ＋ 醪のグラフ（表・予測・追水のタイミング入り）
       グラフ：Be換算（今年）／昨年度の同じ液種の 平均±σ の帯（ゴールデンバッチ）／似た仕込み3本の細い線／追水（今年＝青い棒・昨年度＝灰色の目盛り）／次の追水の目安
       予測：似た仕込み3本（昨年度・同じ液種、3日目〜いまの Be・品温が近い順）から 醪日数・上槽前の日本酒度/alc・粕歩合
   ・🍶仕込み の画面にも「📈 グラフ／📋 表」の切り替えで同じカード（醪の部分）を出す
   ・データ：醸造記録 R8BY の karte（解析）・bunseki_get（仕込み）、昨年度は zennen_get（ZN）。サーバーの変更なし
   控え：seishu-workbook_github\_src_kaiseki.js（差し込み _解析と濾過火入を足す.py） */
const KS = { filter: lsGet('ks.filter','all'), obs:null };
const ksNum=v=>(v===''||v===null||v===undefined||isNaN(Number(v)))?null:Number(v);
/* 今年の醪：bunseki_get の days → 昨年度（znDays）と同じ形 */
function ksDays(b){
  if(!b||!b.days) return [];
  let meter=false; const out=[];
  b.days.forEach(d=>{
    const sm=d.day===1?null:ksNum(d.be);   // 1日目（留）の Be の行は 尺
    const x={ day:d.day, date:d.date, sm, alc:d.day===1?null:ksNum(d.alc), ta:ksNum(d.ta), aa:ksNum(d.aa), oimizu:ksNum(d.oimizu), tAM:ksNum(d.tAM), tPM:ksNum(d.tPM) };
    if(sm!==null){ if(sm<0) meter=true; x.kind=meter?'度':'Be'; x.beq=meter?Math.round(-sm*10)/100:sm; }
    const c=b.calc&&b.calc[d.day]; if(c){ x.bmd=ksNum(c.bmd); x.rec=ksNum(c.rec); x.warn=c.warn||''; x.miss=c.miss||''; x.tStd=ksNum(c.tStd); }
    out.push(x);
  });
  let last=0; out.forEach((x,i)=>{ if(x.sm!==null||x.alc!==null||x.tAM!==null||x.tPM!==null||x.oimizu!==null) last=i+1; });
  return out.slice(0,last);
}
const ksT=x=>{ const ok=v=>v!==null&&v!==undefined&&v>0&&v<40; return ok(x.tAM)?x.tAM:(ok(x.tPM)?x.tPM:null); };
/* 昨年度の同じ液種 */
function ksPrev(liq){
  const D=ZN.data; if(!D||!D.moromi) return [];
  return D.moromi.filter(x=>znSameLiq(x.lq,liq)).map(x=>({x, d:x._days||(x._days=znDays('moromi',x))}));
}
function ksBand(P,f,N){
  const m=[],s=[];
  for(let i=0;i<N;i++){ const v=P.map(p=>p.d[i]?f(p.d[i]):null).filter(v=>v!==null&&v!==undefined&&!isNaN(v));
    if(v.length<3){ m.push(null); s.push(null); continue; }

function ksStrip(m,k){

function ksList(box, list, kind){
  box.innerHTML=list.length?list.map(ksCardSkel).join(''):`<div class="shk-none">ありません</div>`;
  const top=nav[nav.length-1];
  const store=kind==='full'?RC.karte:RC.bun, act=kind==='full'?'karte':'bunseki_get';
  const draw=no=>{ if(nav[nav.length-1]!==top) return; const el=box.querySelector(`.ks-card[data-ks="${no}"]`); const m=list.find(x=>String(x.no)===String(no)); const r=store[no]; if(!el||!m||!r) return;

  list.forEach(m=>{ if(store[m.no]) draw(m.no); });
  const q=[]; let busy=0;
  const pump=()=>{ while(busy<3&&q.length){ const no=q.shift(); busy++; recApi({action:act,no},50000).then(r=>{ if(r&&r.ok){ store[no]=r; draw(no); } }).catch(()=>{}).finally(()=>{ busy--; pump(); }); } };
  if(KS.obs) KS.obs.disconnect();

  box.querySelectorAll('.ks-card').forEach((el,i)=>{ if(KS.obs&&i>=3) KS.obs.observe(el); else if(!store[el.dataset.ks]){ q.push(el.dataset.ks); } }); pump();   // 上の3本はすぐ読む
  ksBind(box);
  if(!ZN.data) znLoad(false).then(()=>{ if(nav[nav.length-1]===top) list.forEach(m=>{ if(store[m.no]) draw(m.no); }); });
}

<script>
/* 2026-10-12 泰広さん指示：麹の配置図の各麹をタップすると詳細を出す。
   配置図（kojiScreen の map1／rcMap2）の <em data-kid data-kst> を押すと、下から詳細の窓（o2-mask の形）。
   「記録を開く」でその工程（1号室＝引込／2号室の上段＝出麹／下段＝盛）の入力画面 kojiEdit へ。 */
function kMapInfo(date,id,stage){
  const j=(RC.koji||{})[date]; const r=j&&(j.koji||[]).find(x=>x['麹ID']===id); if(!r) return;
  const tg=j.targets||{}, v=x=>(x===''||x==null)?'':x;
  const sh=x=>String(x||'').replace(/麹棚/g,'棚').replace(/天幕/g,'');
  const pbs=Object.entries(j.probes||{}).filter(([n,x])=>x&&x.id===id);
  const tgT=k=>tg[k]&&tg[k].time?tg[k].time:'', tgV=k=>tg[k]&&tg[k].temp!=null&&tg[k].temp!==''?tg[k].temp+'℃':'';
  const tr=(lb,tc,pc,tk)=>`<tr><td>${lb}</td><td class="v">${tc&&v(r[tc])!==''?esc(r[tc]):'—'}</td><td class="v">${pc&&v(r[pc])!==''?rcN(r[pc])+'℃':'—'}</td><td class="g">${tk?[tgT(tk),tgV(tk)].filter(Boolean).join(' '):''}</td></tr>`;
  const stg=t=>`<tr class="st"><td colspan="4">${t}</td></tr>`;
  const dd=(lb,c,on)=>`<div class="${on?'now':''}">${lb}<b>${v(r[c])!==''?rcMD(r[c]):'—'}</b></div>`;
  const plc=(n,p,dflt)=>(v(r[n])!==''||v(r[p])!=='')?`${v(r[n])!==''?esc(r[n])+'番 ':''}${esc(sh(r[p]))||dflt||'場所未定'}`:'—';
  const tane=[r['種麹']?esc(r['種麹'])+(v(r['種麹g'])!==''?' '+r['種麹g']+'g':'')+(v(r['割合%'])!==''?'（'+r['割合%']+'%）':''):'',
              r['種麹2']?esc(r['種麹2'])+(v(r['種麹2g'])!==''?' '+r['種麹2g']+'g':'')+(v(r['割合2%'])!==''?'（'+r['割合2%']+'%）':''):''].filter(Boolean).join(' ＋ ');
  let chart=''; try{ chart=kTempChart(r,kPbNow(j,id,(RC.pser||{})[id]))||''; }catch(e){ chart=''; }
  const m=document.createElement('div'); m.className='o2-mask';
  m.innerHTML=`<div class="o2-sheet kmi" role="dialog" aria-label="${esc(id)} の詳細">
    <div class="hd"><div><b>${esc(id)}</b> <span style="font-size:13px;color:var(--sub)">${esc(r['記号']||'')}</span>
      <small>${esc(r['液種']||'')}　${esc(r['品種']||'')} ${v(r['精米歩合'])!==''?r['精米歩合']+'%':''}　麹米 ${v(r['麹米kg'])!==''?r['麹米kg']+'kg':'—'}</small></div>
      <button type="button" class="x" aria-label="閉じる">×</button></div>
    <div class="bd">
      <div class="rc-calc" style="grid-template-columns:repeat(5,1fr)">${dd('洗米','洗米日')}${dd('引込','引込日',stage==='引込')}${dd('盛','盛日',stage==='盛')}${dd('出麹','出麹日',stage==='出麹')}${dd('使用','使用日')}</div>
      <p class="ln"><span>種麹</span>${tane||'—'}　<span>吸水</span>${v(r['吸水%'])!==''?rcN(r['吸水%'])+'%':'—'}</p>
      <p class="ln"><span>場所</span>1号室 ${plc('引込 順番','引込 場所')}　／　盛 ${plc('盛 順番','盛 場所')}${v(r['出麹 場所'])!==''||v(r['出麹 順番'])!==''?`　／　出麹 ${plc('出麹 順番','出麹 場所','盛と同じ箱')}`:''}</p>
      ${pbs.length?`<p class="ln"><span>品温計</span>${pbs.map(([n,x])=>`<i class="pbn">No${n}</i>${(x.temp!=null&&!x.stale)?x.temp+'℃':'—'}${x.place?'（'+esc(sh(x.place))+'）':''}`).join('　')}</p>`:''}
      ${chart?`<div class="card" id="kmiChart" style="padding:6px 8px;margin:6px 0">${chart}</div>`:''}
      <table><tr><th>工程</th><th>時刻</th><th>品温</th><th>標準・目標</th></tr>
        ${stg('引込み（1号室）')}${tr('引込','引込 時刻','引込 品温','引込')}${tr('種切','種切 時刻','種切 品温','種切')}${v(r['種切 水分%'])!==''?`<tr><td>種切 水分</td><td></td><td class="v">${rcN(r['種切 水分%'])}%</td><td></td></tr>`:''}${v(r['ねせ h'])!==''||v(r['ねせ 品温'])!==''?`<tr><td>ねせ</td><td class="v">${v(r['ねせ h'])!==''?r['ねせ h']+'h':'—'}</td><td class="v">${v(r['ねせ 品温'])!==''?rcN(r['ねせ 品温'])+'℃':'—'}</td><td></td></tr>`:''}${tr('切返し','切返し 時刻','切返し 品温','切返し')}
        ${stg('盛（2号室）')}${tr('盛前','','盛前 品温','盛前')}${tr('盛後','盛 時刻','盛後 品温','盛後')}${tr('仲仕事','仲仕事 時刻','仲仕事 品温','仲仕事')}${tr('留仕事','留仕事 時刻','留仕事 品温','留仕事')}
        ${stg('出麹')}${tr('出麹','出麹 時刻','出麹 品温','出麹')}${v(r['出麹重量kg'])!==''?`<tr><td>出麹重量</td><td></td><td class="v">${r['出麹重量kg']}kg</td><td></td></tr>`:''}
      </table>
      ${r['注意']?`<p class="ln" style="color:var(--ng)"><span>注意</span>${esc(r['注意'])}</p>`:''}
      ${r['備考']?`<p class="ln"><span>備考</span>${esc(r['備考'])}</p>`:''}
    </div>
    <div class="ft"><button type="button" class="x">閉じる</button><button type="button" class="go">${esc(stage)}の記録を開く</button></div></div>`;
  const close=()=>{ m.remove(); document.removeEventListener('keydown',esck); };
  const esck=e=>{ if(e.key==='Escape') close(); };
  m.addEventListener('click',e=>{ if(e.target===m) close(); });
  m.querySelectorAll('.x').forEach(b=>b.onclick=close);
  m.querySelector('.go').onclick=()=>{ close(); go(()=>kojiEdit(date,id,stage)); };
  document.addEventListener('keydown',esck);
  document.body.appendChild(m);
  /* 2026-10-14 品温計が付いている麹は、経過（10分ごと）を取ってグラフを描き直す */
  if(pbs.length) recApi({action:'probe_series',id},30000).then(s=>{ if(!(s&&s.ok&&s.points&&s.points.length)) return;
    RC.pser=RC.pser||{}; RC.pser[id]=s.points; const c=m.querySelector('#kmiChart'); if(c&&m.isConnected) c.innerHTML=kTempChart(r,kPbNow(j,id,s.points)); }).catch(()=>{});
}
/* 2026-10-14 品温計（おんどとり）の今の温度を、温度グラフの点として足す（経過の最後より新しいときだけ） */
function kPbMs(x){ if(x.ms!=null&&isFinite(Number(x.ms))) return Number(x.ms); const t=String(x.time||x.t||''), now=Date.now(); let q;
  if((q=t.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\D+(\d{1,2}):(\d{2})/))) return new Date(+q[1],q[2]-1,+q[3],+q[4],+q[5]).getTime();
  if((q=t.match(/(\d{1,2})\/(\d{1,2})\D+(\d{1,2}):(\d{2})/))) return new Date(new Date().getFullYear(),q[1]-1,+q[2],+q[3],+q[4]).getTime();
  if((q=t.match(/(\d{1,2}):(\d{2})/))){ const d=new Date(); d.setHours(+q[1],+q[2],0,0); if(d.getTime()>now+600000) d.setDate(d.getDate()-1); return d.getTime(); }
  return now; }
function kPbNow(j,id,ser){ const out=(ser||[]).map(p=>Object.assign({},p,{no:Number(p.no)}));
  Object.entries((j&&j.probes)||{}).forEach(([n,x])=>{ if(!x||x.id!==id||x.stale||x.temp==null||x.temp==='') return; const no=Number(n), ms=kPbMs(x);
    const last=out.filter(p=>Number(p.no)===no).reduce((a,p)=>Math.max(a,Number(p.ms)||0),0);
    if(ms>last) out.push({ms,v:Number(x.temp),no,now:1}); });
  return out; }
document.addEventListener('click',e=>{
  const em=e.target&&e.target.closest&&e.target.closest('.k-mapc em[data-kid]'); if(!em) return;
  e.preventDefault(); e.stopPropagation();
  kMapInfo(RC.kday||dtoday(),em.dataset.kid,em.dataset.kst||'盛');
},true);
</script>
