<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>製造ツール 逆引き検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC;
  --ink:#141E1C; --muted:#5D6D69; --faint:#8A9894;
  --line:#D3DBD8; --line-strong:#B6C2BE;
  --accent:#1E5A51; --accent-soft:#DDEBE7; --accent-ink:#134039;
  --warn:#A8501B; --warn-soft:#F6E7DC;
  --gold:#8E7222; --gold-soft:#F2EBD6;
  --shadow:0 1px 2px rgba(20,30,28,.06), 0 8px 24px -16px rgba(20,30,28,.35);
  --mincho:"Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic:"Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#19201E; --surface-2:#222A27;
    --ink:#E7EDEB; --muted:#9AAAA6; --faint:#77857F;
    --line:#2B3532; --line-strong:#3C4844;
    --accent:#63BFB0; --accent-soft:#1B322E; --accent-ink:#9EDDD1;
    --warn:#E0925E; --warn-soft:#33241A;
    --gold:#D0B25E; --gold-soft:#2E2818;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#19201E; --surface-2:#222A27;
  --ink:#E7EDEB; --muted:#9AAAA6; --faint:#77857F;
  --line:#2B3532; --line-strong:#3C4844;
  --accent:#63BFB0; --accent-soft:#1B322E; --accent-ink:#9EDDD1;
  --warn:#E0925E; --warn-soft:#33241A;
  --gold:#D0B25E; --gold-soft:#2E2818;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--gothic); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.bar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.bar-inner{max-width:860px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--mincho);font-weight:700;font-size:19px;margin:0;letter-spacing:.04em}
.brand .sub{font-size:11px;color:var(--faint);letter-spacing:.14em}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8}
.search input{width:100%;padding:10px 34px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.clear{position:absolute;right:6px;padding:4px 8px;color:var(--faint);font-size:16px;line-height:1}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.tabs button{flex:1;padding:7px 2px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}

main{max-width:860px;margin:0 auto;padding:18px 16px 64px}
.lede{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.7}

.step-label{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;color:var(--faint);margin:0 0 9px}
.step-label::after{content:"";flex:1;height:1px;background:var(--line)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px;font-size:12.5px}
.crumbs button{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.crumbs span{color:var(--faint)}
.choices{display:grid;gap:8px;margin-bottom:26px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:scale(.995)}
.choice .txt{flex:1;min-width:0}
.choice .t{display:block;font-weight:700;font-size:14.5px;line-height:1.5}
.choice .d{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.choice .arrow{color:var(--faint);font-size:15px;flex-shrink:0}
.choice .kanji{font-family:var(--mincho);font-size:17px;font-weight:700;width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink)}

.cards{display:grid;gap:9px}
.card{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .ct{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .cc{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.chip{font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.draft{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink)}
.chip.empty{background:var(--gold-soft);color:var(--gold)}

/* 絞り込みチップ */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:12px;scrollbar-width:thin}
.fchip{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
:root:not([data-theme="light"]) .fchip[aria-pressed="true"]{color:#0E1614}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fchip[aria-pressed="true"]{color:#fff}}

/* 特徴で絞り込む（ファセット） */
.ycond{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.ychip{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:700}
.ylink{background:none;border:0;color:var(--accent);font-size:13px;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.yaxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.yax,.yopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface);color:inherit;box-shadow:var(--shadow);min-height:64px}
.yax .yl,.yopt .yl{font-size:16px;font-weight:700}
.yax .ys,.yopt .ys{font-size:12px;color:var(--muted)}
.yopt .yn{font-size:12px;color:var(--accent);font-weight:700}
.yax.on,.yopt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.yopt[disabled]{opacity:.45}
.yopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.ymore{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.ystep{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0 0 10px}
.ystep h3{margin:4px 0 0;font-size:17px}
.facets{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 13px;margin-bottom:16px;box-shadow:var(--shadow)}
.fgrp{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.fgrp:first-child{border-top:none;padding-top:0}
.fgrp > .fl{font-size:11px;letter-spacing:.1em;color:var(--faint);white-space:nowrap;width:52px;flex-shrink:0;padding-top:5px}
.fgrp > .fv{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.fgrp .fchip{font-size:12px;padding:4px 11px}
.fbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.fbar .hit{font-family:var(--mono);font-weight:700;color:var(--ink)}
.fbar button{margin-left:auto;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}

/* 酵母・炭カード */
.spec{padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);margin-bottom:9px}
.spec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.spec-h .sn{font-family:var(--mincho);font-size:16.5px;font-weight:700}
.spec-d{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:9px}
.spec-t{display:flex;flex-wrap:wrap;gap:5px}
.stag{font-size:11.5px;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.stag.aroma{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.stag.acid{background:var(--warn-soft);color:var(--warn);font-weight:500}
.stag.aim{background:var(--gold-soft);color:var(--gold);font-weight:500}
.spec-link{margin-top:9px;font-size:12.5px}
.spec-link button{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* 工程グループ */
.proc{margin-bottom:22px}
.proc-h{display:flex;align-items:baseline;gap:9px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line-strong);flex-wrap:wrap}
.proc-h .pn{font-family:var(--mincho);font-size:15.5px;font-weight:700}
.proc-h .pt{font-size:11px;color:var(--accent);letter-spacing:.08em}
.proc-h .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* 製品カード */
.prod{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);margin-bottom:9px}
.prod-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.prod-h .pname{font-family:var(--mincho);font-size:16px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;align-items:baseline}
.kv dt{font-size:11px;color:var(--faint);letter-spacing:.1em;white-space:nowrap;padding-top:2px}
.kv dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:3px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.tag.k{background:var(--gold-soft);color:var(--gold)}
.tag.none{background:transparent;border:1px dashed var(--line-strong);color:var(--faint);font-weight:400}
button.tag{cursor:pointer}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;margin-bottom:14px}
.detail h2{font-family:var(--mincho);font-size:22px;font-weight:700;margin:0 0 8px;line-height:1.45;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.verdict{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 9px 9px 0;margin-bottom:22px}
.verdict .lbl{font-size:10.5px;letter-spacing:.16em;color:var(--accent-ink);opacity:.8}
.verdict p{margin:3px 0 0;font-weight:700;font-size:15px;line-height:1.7;color:var(--accent-ink)}
.sec{margin-bottom:24px}
.sec > h3{font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.mat{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mat > div{padding:11px 13px;border-top:1px solid var(--line)}
.mat > div:first-child{border-top:none}
.mat .mh{font-weight:700;font-size:13.5px}
.mat .mb{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.65}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:30px;margin-bottom:9px;font-size:13.5px;line-height:1.75}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:none;font-size:10.5px;letter-spacing:.1em;color:var(--faint);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
td.note{color:var(--muted);font-size:12px}
ul.cau{margin:0;padding:0;list-style:none}
ul.cau li{position:relative;padding-left:20px;margin-bottom:8px;font-size:13.5px;line-height:1.75}
ul.cau li::before{content:"";position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.srcbox{font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:9px;padding:11px 13px;line-height:1.7}
.srcbox code{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-all}
.seealso{display:flex;flex-wrap:wrap;gap:6px}
.seealso button{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent)}

.termlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.term{padding:13px 14px;border-top:1px solid var(--line)}
.term:first-child{border-top:none}
.term .th{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.term .tn{font-family:var(--mincho);font-weight:700;font-size:16px}
.term .tr{font-size:11px;color:var(--faint);letter-spacing:.08em}
.term .td{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.7}
.term .tl{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.term .tl button{font-size:11.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

.group{margin-bottom:26px}
.group > h3{font-family:var(--mincho);font-size:15px;font-weight:700;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line-strong)}
.count{font-size:11px;color:var(--faint);font-weight:400;font-family:var(--mono);margin-left:6px}
.empty-msg{text-align:center;padding:40px 16px;color:var(--faint);font-size:13px}
.notice{
  display:flex;gap:10px;font-size:12.5px;line-height:1.7;color:var(--gold);
  background:var(--gold-soft);border-radius:9px;padding:11px 13px;margin-bottom:16px;
}
.notice b{color:var(--gold)}
.stale{max-width:860px;margin:10px auto 0;padding:9px 14px;border:1px solid var(--warn);border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500;line-height:1.6}
.stale[hidden]{display:none}
.stale small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.loading{padding:40px 0;text-align:center;color:var(--faint);font-size:13px}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.8}
</style>
</head><body>

<div class="bar">
  <div class="bar-inner">
    <div class="brand">
      <h1>製造ツール　逆引き検索</h1>
      <span class="sub">KIRINZAN / 生産本部製造</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="臭い、脱色炭、カプエチ、酸 … で引く" autocomplete="off">
      <button class="clear" id="clear" hidden aria-label="検索を消す">×</button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-flow" role="tab" aria-selected="true">症状</button>
      <button id="tab-mat" role="tab" aria-selected="false">資材</button>
      <button id="tab-yeast" role="tab" aria-selected="false">酵母</button>
      <button id="tab-carbon" role="tab" aria-selected="false">炭</button>
      <button id="tab-prod" role="tab" aria-selected="false">製品</button>
      <button id="tab-terms" role="tab" aria-selected="false">用語</button>
    </div>
  </div>
</div>

<div id="stale" class="stale" role="status" hidden></div>
<main id="app"><p class="loading">辞書データを読み込んでいます…</p></main>

<script>
/* =====================================================================
   辞書データ — 製造ツールのサーバーから、ログインした人にだけ届く。
   元データは保管庫のノート → build_dictionary.py で dictionary.json を生成
   → Googleドライブの受け渡しフォルダ → Apps Script「辞書配信.gs」が問題データに取り込む
   （醸造ナレッジベース/辞書データ更新_作業指示書.md）。ここは直さない。
   受け取れなかったとき：この端末で前回受け取った版を表示し、画面上部に通知を出す。
   下の FALLBACK_DICT は画面の組み立て用の見本（2026-09-20 版）で、利用者には表示しない。
   status: "ok"    = ナレッジベース準拠（確認済み）
           "draft" = 一般文献・メーカー資料ベースの暫定値
           "empty" = 枠だけ。実データ未投入（会社PCで流し込む）
   ===================== */
const FALLBACK_DICT = {
  meta:{ version:"2026-09-20", source:"内蔵データ（画面作成時の暫定版）" },

  /* ---- 工程と係 ---- */
  teams:["釜場","麹屋","酛屋","醪","上槽・濾過","火入れ・貯蔵","製品部","共通"],
  processes:[
    {id:"p-seimai", n:"精米",         team:"釜場"},
    {id:"p-senmai", n:"洗米・浸漬",   team:"釜場"},
    {id:"p-mushi",  n:"蒸米",         team:"釜場"},
    {id:"p-koji",   n:"製麹",         team:"麹屋"},
    {id:"p-moto",   n:"酒母",         team:"酛屋"},
    {id:"p-moromi", n:"醪",           team:"醪"},
    {id:"p-joso",   n:"上槽",         team:"上槽・濾過"},
    {id:"p-roka",   n:"濾過・調合",   team:"上槽・濾過"},
    {id:"p-hiire",  n:"火入れ・貯蔵", team:"火入れ・貯蔵"},
    {id:"p-bin",    n:"瓶詰",         team:"製品部"},
    {id:"p-kyotsu", n:"洗浄・衛生・分析", team:"共通"}
  ],

  /* ---- 資材マスタ（区分の枠。品名・メーカーは会社PCで流し込む） ---- */
  materials:[
    {id:"m-rice",   n:"原料米（麹米・掛米）", cat:"原材料", proc:["p-seimai","p-senmai"], use:"品種・産地・精米歩合ごとに、どの製品に充てるかが決まる。", status:"empty"},

  entries:[
    { id:"e-tan-select", title:"活性炭の選び方（総論）", cat:"資材の使い分け", status:"draft",
      tags:["活性炭","炭","選定","賦活","粉末炭","粒状炭"],
      verdict:"「色を取るのか、匂いを取るのか」で炭を分ける。色＝塩化亜鉛賦活の脱色炭、匂い・味＝水蒸気賦活の脱臭（香味調整）炭。清酒に使うのは粉末炭で、粒状炭は液相の清酒向けではない。",
      materials:[
        {h:"塩化亜鉛賦活炭（薬品賦活・脱色用）", b:"細孔が比較的大きく、分子径の大きい着色成分を吸着しやすい。香味への当たりが穏やかで、香りを残したい酒の脱色に向く。"},
        {h:"水蒸気賦活炭（脱臭・香味調整用）", b:"ミクロ孔が発達し、分子径の小さい成分（着色前駆物質・香気成分・異臭成分）を捉える。老香や雑味を落とす目的はこちら。"},
        {h:"木質系", b:"脱色に適した細孔分布を持つものが多く、清酒用として一般的。"},
        {h:"ヤシ殻系・石炭系", b:"ミクロ孔寄り。脱臭・精製用途で使われる。"},
        {h:"粉末炭 / 粒状炭", b:"粉末炭は液相用で清酒・精糖などの脱色精製に使う。粒状炭は気相や浄水用途が中心で、清酒の仕上げには通常使わない。"}
      ],
      steps:["目的を1つに決める（色／匂い／味）。複数あるときは主目的を先に決め、副目的は少量の別炭で足す。","小仕込み（500mL〜1L）で3水準の添加量を振って官能・色度を確認する。","接触時間・温度を揃えて比較する（条件が違うと炭の差が見えない）。","決めた条件を製造記録に残し、次年度の起点にする。"],
      numbers:[{l:"試験水準の振り幅",v:"0.5倍 / 1倍 / 2倍",n:"前回実績を1倍として振ると判断しやすい"},{l:"接触時間",v:"30〜60分",n:"撹拌の有無で実効時間が変わる"}],
      cautions:["炭は狙った成分だけを選んで吸着しない。カプロン酸エチル・酢酸イソアミルなどの吟醸香も同時に落ちる。","メーカー・ロットで効きが変わる。銘柄を替えたら必ず小試験からやり直す。","「前回と同じ量」で通すと、原酒の状態が違うぶん結果がぶれる。色度・官能で毎回決める。"],
      terms:["活性炭","賦活","細孔"], source:"醸造ナレッジベース／濾過・調合ハブ（未リンク）" },

    { id:"e-tan-deodor", title:"匂いを取る炭の使い方（老香・異臭）", cat:"資材の使い分け", status:"draft",
      tags:["脱臭","老香","ひね香","臭い","炭","DMTS","水蒸気賦活"],
      verdict:"匂いを落とすなら水蒸気賦活の脱臭用粉末炭。少量から当てて官能で止める。老香は炭で「薄める」ことはできても、発生源（貯蔵温度・前駆物質）を直さないと再発する。",
      materials:[
        {h:"水蒸気賦活の脱臭用粉末炭", b:"ミクロ孔主体。老香・生老香・含硫化合物など分子径の小さい成分に当たる。第一選択。"},
        {h:"脱色炭との併用", b:"着色も進んでいる酒では、脱色炭を主に、脱臭炭を少量足す。逆順にすると香味が落ちすぎることがある。"},
        {h:"濾過助剤（珪藻土）", b:"炭を確実に濾別するために併用。炭が抜けると酒が黒く濁る。"}

let DICT = FALLBACK_DICT;
/* 辞書データは製造ツールのサーバーから、ログインした人にだけ届く（問題データと同じ仕組み）。
   学習帳と同じ場所（同じURLのフォルダ）に置くことで、学習帳のログイン情報をそのまま使う。 */
const API_URL = "https://script.google.com/macros/s/AKfycbwVyR-kBMHw8V2Co258MK6u9XCTWb4vQMGF20an9BXNGeH-H_4Fe_5JD_2JG8cmiXNX/exec";
const WB_KEY = 'sakeWB2';                       // 学習帳が端末に保存している内容
const CACHE_KEY = 'seishu-jiten:dictionary';
const verLabel = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || ''); return m ? `${+m[2]}月${+m[3]}日版` : '日付不明の版'; };
function normalizeDict(d){
  const arr = k => Array.isArray(d[k]) ? d[k] : (Array.isArray(FALLBACK_DICT[k]) ? FALLBACK_DICT[k] : []);
  const out = { ...d, meta: d.meta || { version:'', source:'' } };
  ['teams','processes','materials','products','yeastFacets','yeasts','carbonFacets','carbons','flow','entries','terms']
    .forEach(k => out[k] = (k === 'teams' || k === 'processes' || k.endsWith('Facets')) ? arr(k) : (Array.isArray(d[k]) ? d[k] : []));
  out.materials.forEach(m => { m.proc = m.proc || []; });
  out.products.forEach(p => { p.rice = p.rice || []; p.yeast = p.yeast || []; p.koji = p.koji || []; });
  out.yeasts.forEach(y => { y.use = y.use || []; });
  out.carbons.forEach(c => { c.aim = c.aim || []; });
  out.entries.forEach(e => { e.tags = e.tags || []; });
  out.terms.forEach(t => { t.see = t.see || []; });
  return out;
}
function showStale(reason){
  const el = document.getElementById('stale');
  el.innerHTML = `辞書データを更新できませんでした（表示中：${verLabel(DICT.meta.version)}）<small>${esc(reason)}</small>`;
  el.hidden = false;
}
function hideStale(){ const el = document.getElementById('stale'); el.hidden = true; el.innerHTML = ''; }
const validDict = d => !!(d && d.meta && Array.isArray(d.materials));
function readWB(){ try { return JSON.parse(localStorage.getItem(WB_KEY) || 'null'); } catch (_) { return null; } }
function writeWB(st){ try { localStorage.setItem(WB_KEY, JSON.stringify(st)); } catch (_) {} }
function loginWall(msg){
  document.getElementById('app').innerHTML = `<div class="notice" style="margin-top:18px"><span>🔒</span><span><b>${esc(msg)}</b><br>
    逆引き検索は、製造ツールにログインした人だけが見られます。<br>
    <a href="./" style="display:inline-block;margin-top:10px;font-weight:700">製造ツールを開いてログインする →</a></span></div>`;
}
let firstDone = false;
function firstView(){ if (firstDone) return; firstDone = true; if (!DICT.entries.length && S.view === 'flow') S.view = 'mat'; }
async function loadDict(){
  const wb = readWB();
  let shown = false;
  // ① 端末にある最新版をすぐ表示（学習帳が受け取ったもの → 辞典が前回保存したもの の順）
  let local = wb && wb.data && validDict(wb.data.dictionary) ? wb.data.dictionary : null;
  if (!local) { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (validDict(c)) local = c; } catch (_) {} }
  if (local && wb && wb.token) { DICT = normalizeDict(local); firstView(); render(); shown = true; }
  if (!wb || !wb.token) { loginWall('まだログインしていません'); return; }
  // ② サーバーから最新を取り直す（学習帳と同じ「ログイン」を使い、受け取った内容は学習帳にも渡す）
  try {
    const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'login', token: wb.token }) });
    const j = await r.json();
    if (j && j.err === 'bad_token') { loginWall('ログインの有効期限が切れました'); return; }
    if (!j || !j.ok) throw new Error((j && j.err) || '応答がありませんでした');
    const cur = readWB() || wb;                      // 取りに行っている間に学習帳が保存した内容を消さない
    cur.token = j.token || cur.token;
    if (j.data && j.data.questions && j.data.questions.length) cur.data = j.data;
    writeWB(cur);
    const d = j.data && j.data.dictionary;
    if (!validDict(d)) {
      if (!shown) { DICT = normalizeDict({ meta:{ version:'', source:'' } }); render(); }
      showStale('サーバーにまだ辞書データが入っていません。');
      return;
    }
    DICT = normalizeDict(d);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (_) {}
    hideStale(); firstView(); render();
  } catch (e) {
    if (!shown) { loginWall('電波の届く場所で開き直してください'); return; }
    showStale('この端末で前回受け取った辞書データを表示しています。');
  }
}

const matById = id => DICT.materials.find(m => m.id === id);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = st => st === 'ok' ? '<span class="chip ok">ナレッジベース準拠</span>'
  : st === 'empty' ? '<span class="chip empty">データ未投入</span>'
  : '<span class="chip draft">暫定・要確認</span>';
const teamsOf = m => [...new Set(m.proc.map(p => procById(p)?.team).filter(Boolean))];

for (const [v, id] of Object.entries(TABS)) document.getElementById(id).addEventListener('click', () => setView(v));

function renderSearch(){
  const q = S.q.toLowerCase();
  const hitE = DICT.entries.filter(e => (e.title+e.verdict+e.cat+e.tags.join(' ')).toLowerCase().includes(q));
  const hitM = DICT.materials.filter(m => [m.n,m.cat,m.use,m.name,m.maker,m.vendor,teamsOf(m).join(' '),m.proc.map(p=>procById(p)?.n).join(' ')].filter(Boolean).join(' ').toLowerCase().includes(q));
  const hitP = DICT.products.filter(p => (p.n+p.grade+[...p.yeast,...p.koji,...p.rice].join(' ')).toLowerCase().includes(q));
  const hitT = DICT.terms.filter(t => (t.n+t.r+t.d).toLowerCase().includes(q));
  const hitY = DICT.yeasts.filter(y => [y.n,y.d,y.own,...(DICT.yeastFacets||[]).map(g => [].concat(y[g.k]||[]).join(' '))].filter(Boolean).join(' ').toLowerCase().includes(q));
  const hitC = DICT.carbons.filter(c => [c.n,c.d,c.own,c.maker,c.aim.join(' '),c.act,c.raw,c.form].filter(Boolean).join(' ').toLowerCase().includes(q));
  if (!hitE.length && !hitM.length && !hitP.length && !hitT.length && !hitY.length && !hitC.length)
    return `<p class="empty-msg">「${esc(S.q)}」に当たるものはまだ収録されていません。<br>保管庫にノートを足してから、辞書データを更新してください。</p>`;
  let h = '';
  if (hitM.length) h += `<div class="group"><h3>資材<span class="count">${hitM.length}</span></h3><div class="cards">${hitM.map(matCard).join('')}</div></div>`;
  if (hitY.length) h += `<div class="group"><h3>酵母<span class="count">${hitY.length}</span></h3>${hitY.map(yeastCard).join('')}</div>`;
  if (hitC.length) h += `<div class="group"><h3>炭<span class="count">${hitC.length}</span></h3>${hitC.map(carbonCard).join('')}</div>`;
  if (hitE.length) h += `<div class="group"><h3>項目<span class="count">${hitE.length}</span></h3><div class="cards">${hitE.map(entryCard).join('')}</div></div>`;
  if (hitP.length) h += `<div class="group"><h3>製品<span class="count">${hitP.length}</span></h3>${hitP.map(prodCard).join('')}</div>`;
  if (hitT.length) h += `<div class="group"><h3>用語<span class="count">${hitT.length}</span></h3>${termList(hitT)}</div>`;
  return h;
}

function renderFlow(){
  if (!S.node) {
    return `<p class="lede">いま起きていることを選んでいくと、対処と使う資材にたどり着きます。検索窓にそのまま症状を打ち込んでも引けます。</p>
      <p class="step-label">STEP 1 ／ どこの話か</p>
      <div class="choices">${DICT.flow.map(f => `
        <button class="choice" data-node="${f.id}"><span class="kanji">${esc(f.kanji)}</span>
        <span class="txt"><span class="t">${esc(f.label)}</span><span class="d">${esc(f.desc)}</span></span>
        <span class="arrow">›</span></button>`).join('')}</div>`;
  }
  const top = DICT.flow.find(f => f.id === S.node);
  return `<div class="crumbs"><button data-node="">症状から</button><span>›</span><span>${esc(top.label)}</span></div>
    <p class="step-label">STEP 2 ／ どの症状か</p>
    <div class="choices">${top.children.map(c => `
      <button class="choice" data-entry="${c.entries[0]}">
      <span class="txt"><span class="t">${esc(c.label)}</span><span class="d">${esc(c.desc)}</span></span>
      <span class="arrow">›</span></button>`).join('')}</div>
    <p class="step-label">この区分の項目</p>
    <div class="cards">${[...new Set(top.children.flatMap(c => c.entries))].map(id => entryCard(byId(id))).join('')}</div>`;
}
function renderFlowTab(){
  if (!DICT.flow.length && !DICT.entries.length)
    return `<p class="empty-msg">「症状から引く」は準備中です。<br>いまは上の「資材」「酵母」「炭」「製品」から引けます。</p>`;
  if (S.node) return renderFlow();
  return renderFlow() + `<p class="step-label">収録項目 ${DICT.entries.length} 件</p>` + renderIndex();
}

/* ---- 資材：係で絞り、工程ごとに並べる ---- */
function renderMaterials(){
  if (S.mat) return renderMatDetail();
  const list = S.team ? DICT.materials.filter(m => teamsOf(m).includes(S.team)) : DICT.materials;
  const chips = ['すべて', ...DICT.teams].map(t => {
    const on = (t === 'すべて') ? !S.team : S.team === t;
    return `<button class="fchip" data-team="${t === 'すべて' ? '' : esc(t)}" aria-pressed="${on}">${esc(t)}</button>`;
  }).join('');
  const body = DICT.processes.map(p => {
    const ms = list.filter(m => m.proc.includes(p.id));
    if (!ms.length) return '';
    return `<section class="proc">
      <h3 class="proc-h"><span class="pn">${esc(p.n)}</span><span class="pt">${esc(p.team)}</span><span class="count">${ms.length}</span></h3>
      <div class="cards">${ms.map(matCard).join('')}</div></section>`;
  }).join('') || `<p class="empty-msg">この係に紐づく資材はまだありません。</p>`;

  return `<p class="lede">係で絞り込み、工程の順に並べています。1つの資材が複数の工程に出るものは、それぞれの工程に出ます。</p>
    ${stNotice(DICT.materials, '資材')}
    <div class="filters">${chips}</div>${body}`;
}

function renderMatDetail(){
  const m = matById(S.mat);
  if (!m) return `<p class="empty-msg">資材が見つかりません。</p>`;
  const rel = m.entry ? (byId(m.entry) || null) : null;
  const prods = m.link === 'prod' ? DICT.products.filter(p => (m.id === 'm-yeast' ? p.yeast : p.koji).length) : [];
  const sec = (t, inner) => inner ? `<section class="sec"><h3>${t}</h3>${inner}</section>` : '';
  return `<button class="back" id="back">‹ 戻る</button>
    <article class="detail">
      <h2>${esc(m.n)}</h2>
      <div class="meta"><span class="chip">${esc(m.cat)}</span>${badge(m.status)}${teamsOf(m).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      <div class="verdict"><div class="lbl">用途</div><p>${esc(m.use)}</p></div>
      ${sec('使う工程', `<div class="mat">${m.proc.map(p=>{const pr=procById(p);return `<div><div class="mh">${esc(pr.n)}</div><div class="mb">担当：${esc(pr.team)}</div></div>`;}).join('')}</div>`)}
      ${sec('品名・メーカー・規格書', (m.name || m.maker || m.spec || m.vendor || m.place)
        ? `<div class="mat">${[['品名',m.name],['メーカー',m.maker],['発注先',m.vendor],['規格書',m.spec],['保管場所',m.place]].filter(x=>x[1]).map(x=>`<div><div class="mh">${x[0]}</div><div class="mb">${x[0]==='規格書' ? `<code>${esc(x[1])}</code>` : esc(x[1])}</div></div>`).join('')}</div>${m.note ? `<div class="srcbox">${esc(m.note)}</div>` : ''}`
        : `<div class="srcbox">未投入。保管庫の資材マスタノートから流し込むと、ここに品名・メーカー・規格書（<code>AI参照データ／製品規格書／&lt;企業名&gt;</code>）へのリンクが入ります。</div>${m.note ? `<div class="srcbox">${esc(m.note)}</div>` : ''}`)}
      ${prods.length ? sec('使っている製品', `<div class="seealso">${prods.map(p=>`<button data-prod="${p.id}">${esc(p.n)}</button>`).join('')}</div>`) : ''}
      ${rel ? sec('関連する辞典項目', `<div class="seealso"><button data-entry="${rel.id}">${esc(rel.title)}</button></div>`) : ''}
      ${m.id.startsWith('m-tan') ? sec('特徴から探す', `<div class="seealso"><button data-tab="carbon">炭を特徴で絞り込む</button></div>`) : ''}
      ${m.link === 'prod' ? sec('特徴から探す', `<div class="seealso"><button data-tab="${m.id === 'm-yeast' ? 'yeast' : 'prod'}">${m.id === 'm-yeast' ? '酵母を特徴で絞り込む' : '製品ごとの種麹を見る'}</button></div>`) : ''}
    </article>`;
}

/* ---- 製品：酵母×種麹 ---- */
function prodCard(p){
  const chipList = (arr, cls, key) => arr.length
    ? arr.map(v => `<button class="tag ${cls}" data-${key}="${esc(v)}">${esc(v)}</button>`).join('')
    : `<span class="tag none">未入力</span>`;
  return `<article class="prod">
    <div class="prod-h"><span class="pname">${esc(p.n)}</span><span class="chip">${esc(p.grade)}</span>${badge(p.status)}</div>
    <dl class="kv">
      <dt>酵母</dt><dd>${chipList(p.yeast,'','yeast')}</dd>
      <dt>種麹</dt><dd>${chipList(p.koji,'k','koji')}</dd>
      <dt>原料米</dt><dd>${p.rice.length ? p.rice.map(r=>`<span class="tag none">${esc(r)}</span>`).join('') : '<span class="tag none">未入力</span>'}</dd>
      ${p.runs && p.runs.length ? `<dt>使用仕込</dt><dd>${p.runs.map(r=>`<span class="tag none">${esc(r)}</span>`).join('')}</dd>` : ''}
    </dl>${p.note ? `<p class="spec-d">${esc(p.note)}</p>` : ''}</article>`;
}

function renderProducts(){
  const list = S.yeast ? DICT.products.filter(p => p.yeast.includes(S.yeast) || p.koji.includes(S.yeast)) : DICT.products;
  const filt = S.yeast ? `<div class="filters"><button class="fchip" data-yeast="" aria-pressed="false">すべて</button><button class="fchip" data-yeast="${esc(S.yeast)}" aria-pressed="true">${esc(S.yeast)}</button></div>` : '';
  return `<p class="lede">銘柄・規格ごとに、使っている酵母と種麹の組み合わせを並べます。酵母名や種麹名を押すと、同じものを使っている製品だけに絞れます。</p>
    ${stNotice(DICT.products, '製品')}
    ${filt}${list.map(prodCard).join('')}`;
}

function renderIndex(){
  const cats = [...new Set(DICT.entries.map(e => e.cat))];
  return cats.map(c => { const es = DICT.entries.filter(e => e.cat === c);
      return `<div class="group"><h3>${esc(c)}<span class="count">${es.length}</span></h3><div class="cards">${es.map(entryCard).join('')}</div></div>`;
    }).join('');
}

/* ---- 特徴で絞り込む（酵母・炭で共用） ---- */
function facetPanel(defs, sel, key){
  return `<div class="facets">${defs.map(g => `
    <div class="fgrp"><span class="fl">${esc(g.l)}</span><span class="fv">
      <button class="fchip" data-f="${key}" data-k="${g.k}" data-v="" aria-pressed="${!sel[g.k]}">すべて</button>
      ${g.v.map(v => `<button class="fchip" data-f="${key}" data-k="${g.k}" data-v="${esc(v)}" aria-pressed="${sel[g.k]===v}">${esc(v)}</button>`).join('')}
    </span></div>`).join('')}</div>`;
}
const matchFacets = (item, sel) => Object.entries(sel).every(([k, v]) => {
  if (!v) return true;
  const got = item[k];
  return Array.isArray(got) ? got.includes(v) : got === v;
});
function facetBar(hit, total, key){
  const any = Object.values(key === 'fy' ? S.fy : S.fc).some(Boolean);
  return `<div class="fbar"><span><span class="hit">${hit}</span> / ${total} 件</span>${any ? `<button data-reset="${key}">絞り込みを解除</button>` : ''}</div>`;
}

function yeastCard(y){
  const facets = DICT.yeastFacets || [];
  const tags = facets.map(g => {
    const v = y[g.k];
    const vals = Array.isArray(v) ? v : (v ? [v] : []);
    return vals.map(x => `<span class="stag${g.k === 'aroma' ? ' aroma' : g.k === 'acid' ? ' acid' : ''}">${esc(g.l)}：${esc(x)}</span>`).join('');
  }).join('');
  const used = DICT.products.filter(p => p.yeast.includes(y.n));
  return `<article class="spec">
    <div class="spec-h"><span class="sn">${esc(y.n)}</span>${badge(y.status)}</div>
    ${y.d ? `<p class="spec-d">${esc(y.d)}</p>` : ''}
    ${y.own ? `<p class="spec-d"><b>自蔵での傾向：</b>${esc(y.own)}</p>` : ''}
    <div class="spec-t">${tags || '<span class="stag">特徴 未入力</span>'}</div>
    ${used.length ? `<div class="spec-link"><button data-yeast="${esc(y.n)}">この酵母を使う製品（${used.length}）</button></div>` : ''}
  </article>`;
}

/* ---- 酵母：香り・味・キレ・余韻から選んで候補を絞っていく ---- */
const yHas = (y, k, v) => { const got = y[k]; return Array.isArray(got) ? got.includes(v) : got === v; };
function yCandidates(except){
  return DICT.yeasts.filter(y => Object.entries(S.fy).every(([k, v]) => !v || k === except || yHas(y, k, v)));
}
function renderYeasts(){
  const facets = DICT.yeastFacets || [];
  const main = facets.slice(0, 4), more = facets.slice(4);
  const list = yCandidates(null);
  const chosen = facets.filter(g => S.fy[g.k]);
  let h = `<p class="lede">何で選ぶかを押して、候補を絞っていきます。条件はいくつでも重ねられます。</p>`;
  // 選んだ条件
  if (chosen.length) {
    h += `<div class="ycond">${chosen.map(g => `<button class="ychip" data-yclr="${g.k}">${esc(g.l)}：${esc(S.fy[g.k])} <span aria-hidden="true">×</span></button>`).join('')}
      <button class="ylink" data-reset="fy">すべて解除</button></div>`;
  }
  if (!S.yax) {
    // 何で選ぶか
    h += `<div class="yaxes">${main.map(g => {
      const cur = S.fy[g.k];
      const filled = yCandidates(g.k).filter(y => g.v.some(v => yHas(y, g.k, v))).length;
      return `<button class="yax${cur ? ' on' : ''}" data-yax="${g.k}">
        <span class="yl">${esc(g.l)}</span>
        <span class="ys">${cur ? esc(cur) : (filled ? `記入あり ${filled}株` : 'まだ記入なし')}</span></button>`;
    }).join('')}</div>`;
    if (more.length) {
      h += `<div class="ymore"><span>そのほかの条件：</span>${more.map(g => `<button class="ylink" data-yax="${g.k}">${esc(g.l)}${S.fy[g.k] ? '（' + esc(S.fy[g.k]) + '）' : ''}</button>`).join('')}</div>`;
    }
  } else {
    // 選んだ項目の中身を選ぶ
    const g = facets.find(x => x.k === S.yax);
    const base = yCandidates(g.k);
    const hint = g.h || {};
    const opts = g.v.map(v => {
      const n = base.filter(y => yHas(y, g.k, v)).length;
      return `<button class="yopt${S.fy[g.k] === v ? ' on' : ''}" data-yopt="${esc(v)}" ${n ? '' : 'disabled'}>
        <span class="yl">${esc(v)}</span>${hint[v] ? `<span class="ys">${esc(hint[v])}</span>` : ''}<span class="yn">${n}株</span></button>`;
    }).join('');
    const none = g.v.every(v => !base.some(y => yHas(y, g.k, v)));
    h += `<div class="ystep"><button class="ylink" data-yax="">‹ 何で選ぶかに戻る</button><h3>${esc(g.l)}を選ぶ</h3></div>
      <div class="yopts">${opts}</div>
      ${none ? `<p class="empty-msg">「${esc(g.l)}」はまだどの酵母にも記入がありません。保管庫の酵母マスタに書くと、ここで選べるようになります。</p>` : ''}`;
  }
  h += `<div class="fbar"><span>候補 <span class="hit">${list.length}</span> / ${DICT.yeasts.length} 株</span></div>`;
  h += list.length ? list.map(yeastCard).join('') : '<p class="empty-msg">条件に当たる酵母がありません。条件を1つ外してください。</p>';
  h += stNotice(DICT.yeasts, '酵母');
  return h;
}

function carbonCard(c){
  const tags = [
    ...c.aim.map(a => `<span class="stag aim">${esc(a)}</span>`),
    c.act  ? `<span class="stag">賦活：${esc(c.act)}</span>` : '',
    c.raw  ? `<span class="stag">原料：${esc(c.raw)}</span>` : '',
    c.form ? `<span class="stag">${esc(c.form)}</span>` : '',
    c.hit  ? `<span class="stag">当たり：${esc(c.hit)}</span>` : ''
  ].join('');
  const ce = c.entry ? byId(c.entry) : null;
  return `<article class="spec">
    <div class="spec-h"><span class="sn">${esc(c.n)}</span>${badge(c.status)}</div>
    ${c.d ? `<p class="spec-d">${esc(c.d)}</p>` : ''}
    ${c.own ? `<p class="spec-d"><b>自蔵での実績：</b>${esc(c.own)}</p>` : ''}
    ${c.maker ? `<p class="spec-d">メーカー：${esc(c.maker)}</p>` : ''}
    ${c.note ? `<p class="spec-d">${esc(c.note)}</p>` : ''}
    <div class="spec-t">${tags || '<span class="stag">特徴 未入力</span>'}</div>
    ${ce ? `<div class="spec-link"><button data-entry="${ce.id}">→ ${esc(ce.title)}</button></div>` : ''}
  </article>`;
}

function renderCarbons(){
  const list = DICT.carbons.filter(c => matchFacets(c, S.fc));
  return `<p class="lede">何を落としたいかで選びます。色なら塩化亜鉛賦活の脱色炭、匂い・味なら水蒸気賦活の脱臭炭。「当たり」は香味の削れ方の強さです。</p>
    ${stNotice(DICT.carbons, '炭')}
    ${facetPanel(DICT.carbonFacets, S.fc, 'fc')}
    ${facetBar(list.length, DICT.carbons.length, 'fc')}
    ${list.length ? list.map(carbonCard).join('') : '<p class="empty-msg">条件に当たる炭がありません。絞り込みを緩めてください。</p>'}`;
}

function termList(list){
  return `<div class="termlist">${list.map(t => `<div class="term">
    <div class="th"><span class="tn">${esc(t.n)}</span><span class="tr">${esc(t.r)}</span></div>
    <div class="td">${esc(t.d)}</div>
    <div class="tl">${t.see.map(id => byId(id) ? `<button data-entry="${id}">→ ${esc(byId(id).title)}</button>` : '').join('')}</div>
  </div>`).join('')}</div>`;
}
function renderTerms(){
  return `<p class="lede">清酒学校・社内研修で出てくる語を、現場の対処とつないで並べています。</p>` + (DICT.terms.length ? termList(DICT.terms) : `<p class="empty-msg">「用語」は準備中です。</p>`);
}

function renderDetail(){
  const e = byId(S.entry);
  if (!e) return `<p class="empty-msg">項目が見つかりません。</p>`;
  const sec = (t, inner) => inner ? `<section class="sec"><h3>${t}</h3>${inner}</section>` : '';
  const rel = DICT.entries.filter(x => x.id !== e.id && x.tags.some(t => e.tags.includes(t))).slice(0,4);
  const mats = DICT.materials.filter(m => m.entry === e.id);
  return `<button class="back" id="back">‹ 戻る</button>
    <article class="detail">
      <h2>${esc(e.title)}</h2>
      <div class="meta"><span class="chip">${esc(e.cat)}</span>${badge(e.status)}${e.tags.slice(0,4).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      <div class="verdict"><div class="lbl">結論</div><p>${esc(e.verdict)}</p></div>
      ${sec('使う資材・選定基準', e.materials ? `<div class="mat">${e.materials.map(m=>`<div><div class="mh">${esc(m.h)}</div><div class="mb">${esc(m.b)}</div></div>`).join('')}</div>` : '')}
      ${sec('手順', e.steps ? `<ol class="steps">${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : '')}
      ${sec('数値の目安', e.numbers ? `<div class="tblwrap"><table><thead><tr><th>項目</th><th>目安</th><th>備考</th></tr></thead><tbody>${e.numbers.map(n=>`<tr><td>${esc(n.l)}</td><td class="num">${esc(n.v)}</td><td class="note">${esc(n.n)}</td></tr>`).join('')}</tbody></table></div>` : '')}
      ${sec('注意', e.cautions ? `<ul class="cau">${e.cautions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>` : '')}
      ${mats.length ? sec('資材台帳', `<div class="seealso">${mats.map(m=>`<button data-mat="${m.id}">${esc(m.n)}</button>`).join('')}</div>`) : ''}
      ${sec('関連項目', rel.length ? `<div class="seealso">${rel.map(r=>`<button data-entry="${r.id}">${esc(r.title)}</button>`).join('')}</div>` : '')}
      ${sec('出典', `<div class="srcbox">${esc(e.source)}<br><code>醸造ナレッジベース → 該当ハブ → このノート</code></div>`)}
    </article>`;
}

function render(){
  for (const [v, id] of Object.entries(TABS))
    document.getElementById(id).setAttribute('aria-selected', String(S.view === v && !S.q));

  if (S.entry)                   app.innerHTML = renderDetail();
  else if (S.q)                  app.innerHTML = renderSearch();
  else if (S.view === 'flow')    app.innerHTML = renderFlowTab();
  else if (S.view === 'mat')     app.innerHTML = renderMaterials();
  else if (S.view === 'yeast')   app.innerHTML = renderYeasts();
  else if (S.view === 'carbon')  app.innerHTML = renderCarbons();
  else if (S.view === 'prod')    app.innerHTML = renderProducts();
  else                           app.innerHTML = renderTerms();

  app.insertAdjacentHTML('beforeend', `<p class="foot">
    データ版：${DICT.meta.version}　／　出典：${esc(DICT.meta.source)}<br>
    「データ未投入」は枠だけの行、「暫定・要確認」は一般文献・メーカー資料に基づく仮の記述です。保管庫から辞書データを更新すると「ナレッジベース準拠」に変わります。</p>`);

  app.querySelectorAll('[data-entry]').forEach(b => b.addEventListener('click', () => { S.entry=b.dataset.entry; S.mat=null; window.scrollTo({top:0}); render(); }));
  app.querySelectorAll('[data-mat]').forEach(b => b.addEventListener('click', () => { S.view='mat'; S.mat=b.dataset.mat; S.entry=null; window.scrollTo({top:0}); render(); }));
  app.querySelectorAll('[data-prod]').forEach(b => b.addEventListener('click', () => { S.view='prod'; S.mat=S.entry=null; window.scrollTo({top:0}); render(); }));
  app.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => { S.node=b.dataset.node||null; window.scrollTo({top:0}); render(); }));
  app.querySelectorAll('[data-team]').forEach(b => b.addEventListener('click', () => { S.team=b.dataset.team||null; render(); }));
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setView(b.dataset.tab)));
  app.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    const sel = b.dataset.f === 'fy' ? S.fy : S.fc;
    sel[b.dataset.k] = b.dataset.v || null; render(); }));
  app.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.reset === 'fy') { S.fy = {}; S.yax = null; } else S.fc = {}; render(); }));
  app.querySelectorAll('[data-yax]').forEach(b => b.addEventListener('click', () => { S.yax = b.dataset.yax || null; render(); }));
  app.querySelectorAll('[data-yopt]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.yopt; S.fy[S.yax] = (S.fy[S.yax] === v) ? null : v; S.yax = null; window.scrollTo({top:0}); render(); }));
  app.querySelectorAll('[data-yclr]').forEach(b => b.addEventListener('click', () => { S.fy[b.dataset.yclr] = null; render(); }));
  app.querySelectorAll('[data-yeast],[data-koji]').forEach(b => b.addEventListener('click', () => {
    S.view='prod'; S.yeast = b.dataset.yeast || b.dataset.koji || null; S.mat=S.entry=null; window.scrollTo({top:0}); render(); }));
  const back = document.getElementById('back');
  if (back) back.addEventListener('click', () => { S.entry=null; S.mat=null; render(); });
}

loadDict();
</script>
</body></html>
